<rect x="40" y="1403.0" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1425.0" font-size="14.5" font-weight="600" fill="#185FA5">8-24 · 民法 讲71~75</text>
<text x="52" y="1445.0" font-size="12" fill="#344054">人格权 + 婚姻01-02 + 收养 + 继承01</text>
<text x="52" y="1462.0" font-size="12" fill="#344054">p088-p097</text>
<rect x="436" y="583.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="605.5" font-size="14.5" font-weight="600" fill="#854F0B">讲71 人格权</text>
<text x="448" y="625.5" font-size="12" fill="#344054">来源 p088-p090</text>
<rect x="832" y="20" width="300" height="255" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">基本原理+一般人格权</text>
<text x="844" y="62" font-size="12" fill="#344054">1.性质：人格权不得放弃、转让、继承</text>
<text x="844" y="79" font-size="12" fill="#344054">2.许可使用：民事主体可以将自己的姓名、名称、肖像等许可他人使用</text>
<text x="844" y="96" font-size="12" fill="#344054">3.行权期间：人格权受到侵害的，受害者的停止侵害、排除妨碍、消除危险、消除影响、恢复名誉、赔礼道歉请求权，不适用诉讼时效的规定</text>
<text x="844" y="113" font-size="12" fill="#344054">4.侵权预先保护：民事主体有证据证明他人正在实施或即将实施侵权其人格权的违法行为，不及时制止将使其合法权益受到难以弥补的损害的，有权依法向法院申请采取责令其停止有关行为的措施</text>
<text x="844" y="130" font-size="12" fill="#344054">5.侵权救济的裁量：认定行为人承担侵权责任除法律另有规定外，应当考虑行为人和受害人的职业、影响范围、过错程度，以及行为的目的、方式、情节、后果等</text>
<text x="844" y="147" font-size="12" fill="#344054">6.合理使用：①为公共利益实施新闻报道、舆论监督等行为的，可以合理使用民事主体的姓名、名称、肖像、个人信息等；</text>
<text x="844" y="164" font-size="12" fill="#344054">  ②使用不合理应承担民事责任的</text>
<text x="844" y="181" font-size="12" fill="#344054">7.责任承担：①行为人因侵害人格权承担消除影响、恢复名誉、赔礼道歉等民事责任的，应当与行为的具体方式及其影响范围相当；</text>
<text x="844" y="198" font-size="12" fill="#344054">  ②行为人拒不履行的，应当采取刊登公告等方式执行，由此产生的费用由行为人负担</text>
<text x="844" y="215" font-size="12" fill="#344054">一般人格权：①性质=一种框架性权利，对具体人格权以外的其他应受保护的人格利益提供兜底性保护</text>
<text x="844" y="232" font-size="12" fill="#344054">  ②人身自由权：以非法拘禁等方式剥夺、限制他人的行动自由的，受害人有权依法请求行为人承担民事责任</text>
<text x="844" y="249" font-size="12" fill="#344054">  ③人格尊严权：①非法搜查他人身体的，受害人有权依法请求行为人承担民事责任</text>
<text x="844" y="266" font-size="12" fill="#344054">    ②妻子擅自终止妊娠的，不侵犯丈夫的人格尊严权</text>
<rect x="832" y="289" width="300" height="204" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="311" font-size="14.5" font-weight="600" fill="#854F0B">具体人格权·物质性人格权</text>
<text x="844" y="331" font-size="12" fill="#344054">1.生命权：①内容系生命安全和生命维持</text>
<text x="844" y="348" font-size="12" fill="#344054">  ②侵害生命权的损害赔偿：①常规的人工制作的残缺身体部分的代替物，构成身体不可缺少的一部分的，应属于身体；如人工心脏膜</text>
<text x="844" y="365" font-size="12" fill="#344054">    ②装配物可以拆卸的，则不属于身体，如假牙</text>
<text x="844" y="382" font-size="12" fill="#344054">  ⚠️ 自由装卸是指社会一般人能够装卸的，</text>
<text x="844" y="399" font-size="12" fill="#344054">  如必须由专业医护人员按照严格的医学操作规程进行的，应视为身体的组成部分</text>
<text x="844" y="416" font-size="12" fill="#344054">2.身体权：①内容系身体完整性和行动自由</text>
<text x="844" y="433" font-size="12" fill="#344054">  ②侵权形态：①内容系身体完整性和行动自由</text>
<text x="844" y="450" font-size="12" fill="#344054">    ②侵害形态：实施加害行为致使受害人人身的完整性遭到破坏或行动自由受到限制</text>
<text x="844" y="467" font-size="12" fill="#344054">3.健康权：①内容系生理、心理机能的正常运转和发挥</text>
<text x="844" y="484" font-size="12" fill="#344054">  ②侵权形态：实施加害行为致使受害人生理、心理机能无法正常运转和发挥</text>
<rect x="832" y="507" width="300" height="221" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="529" font-size="14.5" font-weight="600" fill="#854F0B">具体人格权·精神性人格权（姓名权+肖像权）</text>
<text x="844" y="549" font-size="12" fill="#344054">姓名权（5次）：①主体=①主体系自然人；②游戏/动漫中的虚拟角色形象享有肖像权，但属于美术作品，受《著作权法》的保护</text>
<text x="844" y="566" font-size="12" fill="#344054">  ②内容=①制作、使用、公开和许可他人使用</text>
<text x="844" y="583" font-size="12" fill="#344054">    ②②明星代言的解除规则=①不利于肖像素人；②定期许可使用合同，肖像权人基于正当理由可解除</text>
<text x="844" y="600" font-size="12" fill="#344054">  ③对姓名许可使用，参照适用肖像许可的有关规定</text>
<text x="844" y="617" font-size="12" fill="#344054">  ④对自然人声音的保护，参照适用肖像权保护的有关规定</text>
<text x="844" y="634" font-size="12" fill="#344054">  ⑤外部形象并不局限于面部形象。只要能够呈现出自然人的外部形象，并且可以使人清晰识别该外部形象属于某个特定的自然人，这种外部形象就属于肖像（中国乔丹）</text>
<text x="844" y="651" font-size="12" fill="#344054">肖像权（5次）：①侵权形态=①丑化、污损或利用信息技术伪造他人肖像构成侵权；②擅自制作、使用、公开肖像人的肖像；</text>
<text x="844" y="668" font-size="12" fill="#344054">  ③未经肖像权人同意，肖像作品权利人不得以发表、复制、发行、出租、展览等方式使用或公开肖像人的肖像</text>
<text x="844" y="685" font-size="12" fill="#344054">  ④合理使用=①个人学习、艺术欣赏、教学或科学研究中必要范围内使用肖像人已经公开的肖像；②为实施新闻报道，不可避免地制作、使用、公开肖像人的肖像；</text>
<text x="844" y="702" font-size="12" fill="#344054">  ③为依法履行职责，国家机关在必要范围内制作、使用、公开肖像人的肖像；④为展示特定公共环境，不可避免地制作、使用、公开肖像人的肖像（旅游拍照）；</text>
<text x="844" y="719" font-size="12" fill="#344054">  ⑤为维护公共利益或肖像人合法权益，制作、使用、公开肖像人的其他行为</text>
<rect x="832" y="742" width="300" height="289" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="764" font-size="14.5" font-weight="600" fill="#854F0B">具体人格权·精神性人格权（名誉权+荣誉权+隐私权）</text>
<text x="844" y="784" font-size="12" fill="#344054">名誉权（6次）：①主体=自然人、法人和非法人组织，即民事主体均享有名誉权</text>
<text x="844" y="801" font-size="12" fill="#344054">  ②内容=名誉（光荣称号）</text>
<text x="844" y="818" font-size="12" fill="#344054">  ③侵权形态=侮辱/诽谤</text>
<text x="844" y="835" font-size="12" fill="#344054">  ④①侮辱=以暴力或者其他方式贬损他人人格，毁损他人名誉（暴力侮辱、言语侮辱、文字侮辱）</text>
<text x="844" y="852" font-size="12" fill="#344054">    ②诽谤=捏造、散布虚假事实诋毁他人社会评价降低</text>
<text x="844" y="869" font-size="12" fill="#344054">  ⑤⚠️ 侵害名誉权的行为必须有特定指向对象</text>
<text x="844" y="886" font-size="12" fill="#344054">  ⑤渠导=①新闻媒体报道严重失实，损害他人名誉等人格权；②文学、艺术作品以真人真事为描写对象，或以特定人为描述对象；③报刑、网络媒体报道内容失实</text>
<text x="844" y="903" font-size="12" fill="#344054">荣誉权（5次）：①主体=主体是自然人、法人和非法人组织，即民事主体均享有荣誉权</text>
<text x="844" y="920" font-size="12" fill="#344054">  ②客体=荣誉称号（光荣称号）</text>
<text x="844" y="937" font-size="12" fill="#344054">  ③内容=①荣誉称号不受非法剥夺、诋毁、贬损；②权利人对自己的荣誉享有请求记载以及记载错误时更正的权利</text>
<text x="844" y="954" font-size="12" fill="#344054">  ④侵权形态=①当众撕毁他人荣誉证书、摘取他人牌匾，公开散布言论诋毁他人荣誉称号</text>
<text x="844" y="971" font-size="12" fill="#344054">隐私权（5次）：①主体=主体是自然人</text>
<text x="844" y="988" font-size="12" fill="#344054">  ②客体=私密空间/私密活动/私密信息和私人生活安宁</text>
<text x="844" y="1005" font-size="12" fill="#344054">  ③侵权形态=①刺探；②侵扰；③泄露；④公开</text>
<text x="844" y="1022" font-size="12" fill="#344054">总表：生命权/身体权/健康权/姓名权/肖像权/名誉权/荣誉权/隐私权（主体/死亡/侵权形态）</text>
<rect x="832" y="1045" width="300" height="153" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="1067" font-size="14.5" font-weight="600" fill="#854F0B">个人信息保护</text>
<text x="844" y="1087" font-size="12" fill="#344054">1.含义：是指以电子或其他方式记录的与已识别或可识别的自然人有关的各种信息，但不包括匿名化处理后的信息</text>
<text x="844" y="1104" font-size="12" fill="#344054">2.特征：①个人信息是一种重要的人格利益；②个人信息是与已识别或可识别的自然人有关的各种信息；③个人信息范围十分广泛；④个人信息同时包括精神利益和财产利益</text>
<text x="844" y="1121" font-size="12" fill="#344054">3.合理使用：①合法、正当、必要原则，不得过度处理</text>
<text x="844" y="1138" font-size="12" fill="#344054">4.免责事由：①在自然人或者其监护人同意的范围内实施；②合理处理自然人自行公开的或者其他已经合法公开的信息，但是该自然人明确拒绝或者处理该信息侵害其重大利益的除外；③为维护公共利益或者该自然人合法权益，合理实施的其他行为</text>
<text x="844" y="1155" font-size="12" fill="#344054">5.处理者义务：①不得泄露、篡改其收集、存储的个人信息；未经自然人同意，不得向他人非法提供个人信息，但是经过加工无法识别特定个人且不能复原的除外；</text>
<text x="844" y="1172" font-size="12" fill="#344054">  ②应当采取技术措施和其他必要措施，确保其收集、存储的个人信息安全，防止信息泄露、篡改、丢失；发生或者可能发生个人信息泄露、篡改、丢失的，应当及时采取补救措施</text>
<text x="844" y="1189" font-size="12" fill="#344054">6.保密义务：国家机关、承担行政职能的法定机构及其工作人员对于在履行职责过程中知悉的自然人的隐私和个人信息，应当予以保密</text>
<rect x="436" y="1380.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1402.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲72 婚姻家庭（01）·结婚+无效+可撤销</text>
<text x="448" y="1422.5" font-size="12" fill="#344054">来源 p091-p092</text>
<rect x="832" y="1212" width="300" height="136" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1234" font-size="14.5" font-weight="600" fill="#B83A4A">结婚</text>
<text x="844" y="1254" font-size="12" fill="#344054">1.实质要件（2次）：①积极要件：①男女双方完全自愿；②双方均达到法定婚龄，男不得早于22周岁，女不得早于20周岁；③双方均无配偶，符合一夫一妻制（包括未婚、丧偶、离婚）</text>
<text x="844" y="1271" font-size="12" fill="#344054">  ②消极要件：直系血亲或三代以内的旁系血亲禁止结婚</text>
<text x="844" y="1288" font-size="12" fill="#344054">2.形式要件（2次）：①结婚登记手续：①完成结婚登记，即确立婚姻关系；②未办理结婚登记的，应当补办登记</text>
<text x="844" y="1305" font-size="12" fill="#344054">  ②男女双方补办结婚登记的，婚姻关系的效力从双方均符合婚姻法所规定的结婚的实质要件时起算</text>
<text x="844" y="1322" font-size="12" fill="#344054">  ②结婚登记程序瑕疵的处理：当事人以结婚登记程序存在瑕疵为由提起民事诉讼，主张撤销结婚登记的，告知其可以依法申请行政复议或者提起行政诉讼</text>
<text x="844" y="1339" font-size="12" fill="#344054">结婚登记纠纷具体行政行为而提起民事诉讼】，第五十一条规定</text>
<rect x="832" y="1362" width="300" height="238" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1384" font-size="14.5" font-weight="600" fill="#B83A4A">无效婚姻（7次）</text>
<text x="844" y="1404" font-size="12" fill="#344054">1.法定情形：①重婚（绝对无效）：当事人、近亲属及基层组织（居委会、村委会）</text>
<text x="844" y="1421" font-size="12" fill="#344054">  ②未达法定婚龄（相对无效）：当事人、近亲属</text>
<text x="844" y="1438" font-size="12" fill="#344054">  ③有禁止结婚的亲属关系（绝对无效）：当事人、近亲属</text>
<text x="844" y="1455" font-size="12" fill="#344054">2.诉讼程序：①当事人、利害关系人可以提起婚姻无效的确认之诉</text>
<text x="844" y="1472" font-size="12" fill="#344054">  ②无效婚姻在提起诉讼时消灭的，法院不予支持</text>
<text x="844" y="1489" font-size="12" fill="#344054">  ③三种情形之外的起诉，法院应当判决驳回诉讼请求</text>
<text x="844" y="1506" font-size="12" fill="#344054">  ⚠️ 无时间限制，即使在夫妻一方或双方死亡后的1年内，生存一方或利害关系人仍可以提出申请</text>
<text x="844" y="1523" font-size="12" fill="#344054">2.可撤销婚姻：①法定情形：①婚前患有重大疾病未如实告知，严重传染病、严重遗传性疾病、有关精神病</text>
<text x="844" y="1540" font-size="12" fill="#344054">    同性恋骗婚不可撤销；②胁迫</text>
<text x="844" y="1557" font-size="12" fill="#344054">  ②撤销权人：当事人本人向法院申请撤销</text>
<text x="844" y="1574" font-size="12" fill="#344054">  ③撤销时间：除斥期间为1年，不适用《民法典》第152条的规定</text>
<text x="844" y="1591" font-size="12" fill="#344054">  ④起算：①重大疾病未告知=自知道或应当知道撤销事由之日起1年内；②胁迫=自胁迫行为终止之日起1年内；③被非法限制人身自由=自恢复人身自由之日起1年内</text>
<rect x="436" y="1941.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1963.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲73 婚姻家庭（02）·夫妻财产+离婚</text>
<text x="448" y="1983.0" font-size="12" fill="#344054">来源 p092-p095</text>
<rect x="832" y="1614" width="300" height="187" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1636" font-size="14.5" font-weight="600" fill="#6F3A91">夫妻财产关系（2次）</text>
<text x="844" y="1656" font-size="12" fill="#344054">1.约定财产制（2次）：①内容=①可以约定婚姻关系存续期间所得的财产以及婚前财产归各自所有、共同所有或部分各自所有、部分共同所有</text>
<text x="844" y="1673" font-size="12" fill="#344054">  ②形式=约定应当采用书面形式；没有约定或约定不明确的，适用法定夫妻财产制</text>
<text x="844" y="1690" font-size="12" fill="#344054">  ③法律效力：①约定夫妻财产制优先于法定夫妻财产制；②夫妻对婚姻关系存续期间所得的财产约定归各自所有，无或无一方对外负债的，相对人知道该约定的，以夫或妻一方的个人财产清偿（&quot;相对人知道该约定的&quot;，夫妻一方对此负举证责任）</text>
<text x="844" y="1707" font-size="12" fill="#344054">2.法定共同财产（6次）：①工资、奖金、劳务报酬（通过非固定工作获得的其他劳务报酬包括：咨询费/讲课费等）</text>
<text x="844" y="1724" font-size="12" fill="#344054">  ②生产、经营、投资的收益（如夫妻商店、投资的收益、投资的收益包括股票、证券、期货等投资收益）</text>
<text x="844" y="1741" font-size="12" fill="#344054">  ③知识产权的收益</text>
<text x="844" y="1758" font-size="12" fill="#344054">  ④继承或受赠的财产：①原则=婚姻关系存续期间，夫妻一方为继承人或受赠人的情况下依法继承或受赠所得的财产，归夫妻共同所有；②例外=遗嘱或赠与合同中确定只归夫或妻一方所有的，归夫或妻一方个人财产</text>
<text x="844" y="1775" font-size="12" fill="#344054">  ⑤男女双方实际取得或应当取得的住房补贴、住房公积金、基本养老金、破产安置补偿费</text>
<text x="844" y="1792" font-size="12" fill="#344054">  ⑥夫妻一方个人财产在婚后产生的收益，除孳息和自然增值外，应认定为夫妻共同财产【民法典第1062条】</text>
<rect x="832" y="1815" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1837" font-size="14.5" font-weight="600" fill="#6F3A91">夫妻财产关系·特殊规则（2次）</text>
<text x="844" y="1857" font-size="12" fill="#344054">1.法定共同财产中房屋特殊规则：①父母婚前为双方购置房屋出资的，该出资应当认定为对自己子女的个人赠与（明确表示赠与双方除外）</text>
<text x="844" y="1874" font-size="12" fill="#344054">  离婚时该房屋应当认定为对自己子女的个人财产（民法典婚姻家庭编解释（二）第27、29条）</text>
<text x="844" y="1891" font-size="12" fill="#344054">  ②父母婚后为双方购置房屋出资的，按约定处理；没有约定的按共同出资处理（民法典婚姻家庭编解释（一）第29条）</text>
<text x="844" y="1908" font-size="12" fill="#344054">2.个人财产（3次）：（1）一方的婚前财产；（2）一方因受到人身损害获得的赔偿或补偿（人身专属性）</text>
<text x="844" y="1925" font-size="12" fill="#344054">  （3）遗嘱或赠与合同中确定只归一方的财产；（4）一方专用的生活用品</text>
<text x="844" y="1942" font-size="12" fill="#344054">  （5）军人的伤亡保险金、伤残补助金、医药生活补助费；（6）婚前或婚姻关系存续期间约定的财产归另一方所有（赠与方在变更登记前可撤销）</text>
<rect x="832" y="1965" width="300" height="85" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1987" font-size="14.5" font-weight="600" fill="#6F3A91">夫妻债务（1次）</text>
<text x="844" y="2007" font-size="12" fill="#344054">夫妻债务（1次）：①双方共同签字或一方事后追认等共同意思表示所负的债务；②为家庭日常生活需要所负的债务；</text>
<text x="844" y="2024" font-size="12" fill="#344054">  ③夫妻一方在婚姻关系存续期间以个人名义为家庭日常生活需要所负的债务，债权人能够证明该债务用于夫妻共同生活、共同生产经营或者基于夫妻双方共同意思表示的除外</text>
<text x="844" y="2041" font-size="12" fill="#344054">  ④（判断非夫妻共同债务的证据）</text>
<rect x="832" y="2064" width="300" height="255" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2086" font-size="14.5" font-weight="600" fill="#6F3A91">离婚（6次）</text>
<text x="844" y="2106" font-size="12" fill="#344054">1.协议离婚（4次）：①条件=①离婚协议应当载明双方自愿离婚的意思表示和对子女抚养、财产以及债务处理等事项协商一致的意见</text>
<text x="844" y="2123" font-size="12" fill="#344054">  ②程序：①离婚登记申请30日冷静期（可撤回）；②冷静期届满之日起30日内申请发给离婚证（不申请，视为撤回）</text>
<text x="844" y="2140" font-size="12" fill="#344054">  ③法院审理离婚案件，应当先行调解</text>
<text x="844" y="2157" font-size="12" fill="#344054">  ④法律情形：①重婚或与他人同居；②实施家庭暴力或虐待、遗弃家庭成员；③有赌博、吸毒等恶习屡教不改；④因感情不和分居满2年；⑤一方被宣告失踪，另一方提起离婚诉讼的，应当准予离婚；</text>
<text x="844" y="2174" font-size="12" fill="#344054">    ⑥夫妻双方因是否生育发生纠纷，致使感情确已破裂，一方请求离婚的，法院经调解无效，依照前述规定处理</text>
<text x="844" y="2191" font-size="12" fill="#344054">    ⑦经法院判决不准离婚后，双方又分居满1年，一方再次提起离婚诉讼的，应当准予离婚</text>
<text x="844" y="2208" font-size="12" fill="#344054">2.诉讼离婚（6次）：①特殊保护：①现役军人的配偶要求离婚的，应当征得军人同意，但是军人一方有重大过错的除外</text>
<text x="844" y="2225" font-size="12" fill="#344054">  ②女方在怀孕期间、分娩后1年内或终止妊娠后6个月内，男方不得提出离婚；但是，女方提出离婚的或者人民法院认为确有必要受理男方离婚请求的除外</text>
<text x="844" y="2242" font-size="12" fill="#344054">3.离婚过错损害赔偿（5次）：①法定情形=①重婚；②与他人同居；③实施家庭暴力或虐待、遗弃家庭成员和其他重大过错等；</text>
<text x="844" y="2259" font-size="12" fill="#344054">  ②请求权人=无过错方</text>
<text x="844" y="2276" font-size="12" fill="#344054">  ③责任性质=物质损害赔偿和精神损害赔偿</text>
<text x="844" y="2293" font-size="12" fill="#344054">  ④限制=必须仅一方有过错，双方均有过错不予支持</text>
<text x="844" y="2310" font-size="12" fill="#344054">  ⑤诉讼程序=①判决不准离婚的，不予支持；不起诉离婚而单独请求损害赔偿的，不予受理</text>
<rect x="436" y="2426.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="2448.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲73 离婚后的人身安全保护令+抢藏未成年子女</text>
<text x="448" y="2468.5" font-size="12" fill="#344054">来源 p095</text>
<rect x="832" y="2333" width="300" height="238" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2355" font-size="14.5" font-weight="600" fill="#0F7E80">人身安全保护令+抢藏子女（2次）</text>
<text x="844" y="2375" font-size="12" fill="#344054">1.人身安全保护令：①人身安全保护令的申请主体包括申请人本人、当事人近亲属、居委会/村委会等</text>
<text x="844" y="2392" font-size="12" fill="#344054">  ②抢夺、藏匿未满1周岁子女的一方不存在本条第1项的或第2项严重侵害未成年子女合法权益情形，法院应当告知其依法通过监护人资格撤销、变更程序寻求救济</text>
<text x="844" y="2409" font-size="12" fill="#344054">    ⚠️ 但是该情形下仍应当参照《民法典婚姻家庭编解释（二）》第12条的规定处理</text>
<text x="844" y="2426" font-size="12" fill="#344054">  ③夫妻一方对子女的探望权利不因离婚受影响</text>
<text x="844" y="2443" font-size="12" fill="#344054">    父母离婚后，不直接抚养子女的一方享有探望子女的权利，另一方有协助的义务</text>
<text x="844" y="2460" font-size="12" fill="#344054">    行使探望权的方式、时间由双方协议；协议不成的，由法院判决</text>
<text x="844" y="2477" font-size="12" fill="#344054">    父或母探望子女，不利于子女身心健康的，由法院依法中止探望；</text>
<text x="844" y="2494" font-size="12" fill="#344054">    中止的事由消失后，应当恢复探望</text>
<text x="844" y="2511" font-size="12" fill="#344054">2.临时处理措施：①夫妻一方有证据证明对方存在有抢藏转移未成年子女、严重不利于未成年人身心健康的行为或持续实施家庭暴力、其他不利于未成年人身心健康或者有严重不利于未成年子女身心健康情形的，</text>
<text x="844" y="2528" font-size="12" fill="#344054">  ②另一方可以请求人民法院采取财产保全、责令接受另一方及其子女的探望等措施保护未成年子女合法权益</text>
<text x="844" y="2545" font-size="12" fill="#344054">  ③紧急情况下，法院可参照《民法典》第1084条的规定，及时裁定要求直接抚养子女的一方在一定时间内带另一方探望子女（《民法典婚姻家庭编解释（二）》第13条）</text>
<text x="844" y="2562" font-size="12" fill="#344054">3.优先考虑由另一方直接抚养：①实施家庭暴力或虐待、遗弃家庭成员；②有赌博、吸毒等恶习；③重婚或与他人同居或其他严重违背夫妻忠实义务情形；④抢夺、藏匿未成年子女且一方不存在本条第1项或第2项严重侵害未成年子女合法权益情形；⑤其他不利于未成年子女身心健康的情形</text>
<rect x="436" y="2694.0" width="300" height="51" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="448" y="2716.0" font-size="14.5" font-weight="600" fill="#5B6B7C">讲74 收养+讲75 继承（01）（讲75待PDF p097补）</text>
<text x="448" y="2736.0" font-size="12" fill="#344054">来源 p096-p097</text>
<rect x="832" y="2585" width="300" height="102" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="2607" font-size="14.5" font-weight="600" fill="#5B6B7C">讲74 收养</text>
<text x="844" y="2627" font-size="12" fill="#344054">⚠️ 讲74 收养待PDF p096补全</text>
<text x="844" y="2644" font-size="12" fill="#344054">（收养的基本原则：①应当有利于被收养的未成年人的抚养、成长；②保障被收养人和收养人的合法权益；③遵循平等自愿的原则；④不得违背社会公德；⑤不得违背计划生育法律、法规</text>
<text x="844" y="2661" font-size="12" fill="#344054">收养条件：①收养人无子女或只有一名子女；②有抚养教育被收养人的能力；③未患有医学上认为不应当收养子女的疾病；④年满30周岁；⑤无配偶的收养异性子女的，收养人与被收养人的年龄应当相差40周岁以上；</text>
<text x="844" y="2678" font-size="12" fill="#344054">  ⑥被收养人条件：①丧失父母的孤儿；②查找不到生父母的未成年人；③生父母有特殊困难无力抚养的子女</text>
<rect x="832" y="2701" width="300" height="153" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="2723" font-size="14.5" font-weight="600" fill="#5B6B7C">讲75 继承（01）</text>
<text x="844" y="2743" font-size="12" fill="#344054">⚠️ 讲75 继承01待PDF p097补全</text>
<text x="844" y="2760" font-size="12" fill="#344054">继承基本原则：①继承权男女平等 ②养老育幼照顾病残 ③权利义务相一致 ④互谅互让和睦团结 ⑤遗嘱继承优先于法定继承</text>
<text x="844" y="2777" font-size="12" fill="#344054">法定继承顺序：①第一顺序=配偶/子女/父母；②第二顺序=兄弟姐妹/祖父母/外祖父母</text>
<text x="844" y="2794" font-size="12" fill="#344054">继承种类：①法定继承 ②遗嘱继承 ③遗赠扶养协议继承</text>
<text x="844" y="2811" font-size="12" fill="#344054">效力排序：遗赠扶养协议 &gt; 遗嘱继承/法定继承；遗嘱继承 &gt; 法定继承</text>
<text x="844" y="2828" font-size="12" fill="#344054">继承开始时间：被继承人死亡时（含自然死亡/宣告死亡）</text>
<text x="844" y="2845" font-size="12" fill="#344054">遗产保管：①由继承人/受遗赠人共有 ②遗产管理人管理</text>

<text x="52" y="1078.5" font-size="14.5" font-weight="600" fill="#185FA5">8-25 · 民法 讲76~79</text>
<text x="52" y="1098.5" font-size="12" fill="#344054">继承02-03+侵权原理01-02</text>
<text x="52" y="1115.5" font-size="12" fill="#344054">p100-p104</text>
<rect x="436" y="197.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="219.0" font-size="14.5" font-weight="600" fill="#854F0B">讲76 继承（02）·遗嘱继承+分配原则</text>
<text x="448" y="239.0" font-size="12" fill="#344054">来源 p100</text>
<rect x="832" y="20" width="300" height="255" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">遗嘱继承（10次）</text>
<text x="844" y="62" font-size="12" fill="#344054">适用条件：①没有遗赠扶养协议 ②立有遗嘱且合法有效</text>
<text x="844" y="79" font-size="12" fill="#344054">③遗嘱继承人没有放弃、丧失继承权，也未先于被继承人死亡</text>
<text x="844" y="96" font-size="12" fill="#344054">见证人制度：①无民事行为能力人/限制民事行为能力人不能担任见证人</text>
<text x="844" y="113" font-size="12" fill="#344054">②继承人、受遗赠人、与继承人/受遗赠人有利害关系的人均不能担任</text>
<text x="844" y="130" font-size="12" fill="#344054">形式（6种）：①公证遗嘱=由遗嘱人经公证机构办理</text>
<text x="844" y="147" font-size="12" fill="#344054">②自书遗嘱=由遗嘱人亲笔书写、签名，注明年月日</text>
<text x="844" y="164" font-size="12" fill="#344054">③录音录像遗嘱=由两个以上见证人在场见证并录音录像</text>
<text x="844" y="181" font-size="12" fill="#344054">④口头遗嘱=危急情况下，两个以上见证人在场见证</text>
<text x="844" y="198" font-size="12" fill="#344054">⑤打印遗嘱=遗嘱人和见证人在每一页签名、注明年月日</text>
<text x="844" y="215" font-size="12" fill="#344054">⑥代书遗嘱=由代书人代书+两个以上见证人见证</text>
<text x="844" y="232" font-size="12" fill="#344054">基本规定：①遗嘱人可以撤回/变更自己立的遗嘱，立有数份遗嘱内容相抵触的，以最后的为准</text>
<text x="844" y="249" font-size="12" fill="#344054">②遗嘱内容撤销后，所涉及的财产按法定继承处理</text>
<text x="844" y="266" font-size="12" fill="#344054">效力：合法遗嘱优先于法定继承；不得违反强制性规定；不得违反公序良俗</text>
<rect x="832" y="289" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="311" font-size="14.5" font-weight="600" fill="#854F0B">法定继承分配原则</text>
<text x="844" y="331" font-size="12" fill="#344054">原则：①同一顺序继承人继承遗产的份额，一般应当均等；②继承人协商同意的，也可以不均等</text>
<text x="844" y="348" font-size="12" fill="#344054">法律例外：①对生活有特殊困难又缺乏劳动能力的继承人，分配遗产时，应当予以照顾</text>
<text x="844" y="365" font-size="12" fill="#344054">②对被继承人尽了主要扶养义务或者与被继承人共同生活的继承人，分配遗产时，可以多分</text>
<text x="844" y="382" font-size="12" fill="#344054">③有扶养能力和有扶养条件的继承人，不尽扶养义务的，分配遗产时，应当不分或者少分</text>
<text x="844" y="399" font-size="12" fill="#344054">④继承人协商同意保留胎儿遗产份额的，依约保留</text>
<text x="844" y="416" font-size="12" fill="#344054">⑤被继承人对继承人以外的依靠被继承人扶养的人，可以分给他们适当的遗产</text>
<rect x="436" y="699.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="721.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲77 继承（03）·代位+遗赠+限定继承</text>
<text x="448" y="741.5" font-size="12" fill="#344054">来源 p101-p102</text>
<rect x="832" y="439" width="300" height="204" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="461" font-size="14.5" font-weight="600" fill="#B83A4A">代位继承和转继承（7次）</text>
<text x="844" y="481" font-size="12" fill="#344054">1.代位继承：①传统型（第一次继承）：①本质=继承权的转移（一次继承）</text>
<text x="844" y="498" font-size="12" fill="#344054">  ②被继承人子女先于被继承人死亡的，由被继承人子女的直系晚辈血亲（无辈数限制）代位继承</text>
<text x="844" y="515" font-size="12" fill="#344054">  ③有抚养关系的继子女不属于血亲（自然血亲和拟制血亲），无代位继承权</text>
<text x="844" y="532" font-size="12" fill="#344054">  ④典型情形=爸爸妈妈先于爷爷奶奶，姥姥姥爷先于外孙子、孙女、外孙子女代位继承</text>
<text x="844" y="549" font-size="12" fill="#344054">  ⑤被继承人的兄弟姐妹先于被继承人死亡，由被继承人的兄弟姐妹的子女代位继承</text>
<text x="844" y="566" font-size="12" fill="#344054">  ⑥典型情形=侄子、侄女、外甥、外甥女有权代位继承伯伯、叔叔、姑姑、舅舅、姨姨的遗产</text>
<text x="844" y="583" font-size="12" fill="#344054">  ②新型代位继承=丧偶儿媳/女婿对公婆/岳父母的继承</text>
<text x="844" y="600" font-size="12" fill="#344054">2.转继承：①本质=份额的继承权（两次继承）</text>
<text x="844" y="617" font-size="12" fill="#344054">  ②含义=继承开始后，继承人于遗产分割前死亡，并没有放弃继承的，该继承人应当继承的遗产转给其继承人，但是遗嘱另有安排的除外</text>
<text x="844" y="634" font-size="12" fill="#344054">  ③继承人于遗产分割前死亡，并不丧失继承权，其晚辈直系血亲仍可代位继承</text>
<rect x="832" y="657" width="300" height="204" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="679" font-size="14.5" font-weight="600" fill="#B83A4A">遗赠扶养协议（5次）</text>
<text x="844" y="699" font-size="12" fill="#344054">【民法典第1158条】</text>
<text x="844" y="716" font-size="12" fill="#344054">1.含义：自然人可以与继承人以外的组织或个人签订遗赠扶养协议，按照协议，该组织或个人承担该自然人生养死葬的义务，享有受遗赠的权利</text>
<text x="844" y="733" font-size="12" fill="#344054">2.性质：①双方民事法律行为，受继承编调整，不受合同编调整</text>
<text x="844" y="750" font-size="12" fill="#344054">  ②扶养人负有对遗赠人的生养死葬义务，有取得遗赠财产的权利；如死亡前，遗赠人即将财产转移给扶养人，则将被认定为&quot;附义务的赠与&quot;</text>
<text x="844" y="767" font-size="12" fill="#344054">  ③扶养人的义务自生效，遗赠人的赠与在遗赠人死亡后生效</text>
<text x="844" y="784" font-size="12" fill="#344054">3.主体：①遗赠人只能是自然人</text>
<text x="844" y="801" font-size="12" fill="#344054">  ②扶养人既可以是自然人，也可以是集体所有制组织；当扶养人为自然人时，遗赠人与扶养人之间不能存在法定的扶养义务关系</text>
<text x="844" y="818" font-size="12" fill="#344054">4.解除：①继承人以外的组织或个人与自然人签订遗赠扶养协议后，无正当理由不履行，导致协议解除的，支付的供养费用一般不予补偿</text>
<text x="844" y="835" font-size="12" fill="#344054">  ②遗赠人无正当理由不履行，导致协议解除的，则应当返还继承人以外的组织和个人支付的供养费用</text>
<text x="844" y="852" font-size="12" fill="#344054">5.效力：遗赠扶养协议&gt;遗赠（遗嘱）法定继承</text>
<rect x="832" y="875" width="300" height="136" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="897" font-size="14.5" font-weight="600" fill="#B83A4A">限定继承（3次）</text>
<text x="844" y="917" font-size="12" fill="#344054">1.限定继承：①继承人以所得遗产实际价值为限清偿被继承人依法应当缴纳的税款和债务</text>
<text x="844" y="934" font-size="12" fill="#344054">  超过遗产实际价值部分，继承人自愿偿还的不在此限</text>
<text x="844" y="951" font-size="12" fill="#344054">  ②继承人放弃继承的，对被继承人依法应当缴纳的税款和债务可以不负清偿责任</text>
<text x="844" y="968" font-size="12" fill="#344054">2.遗产已分割尚未清偿债务的处理：①遗赠扶养协议中的扶养人不承担债务清偿责任</text>
<text x="844" y="985" font-size="12" fill="#344054">  ②有法定继承的，应当先由法定继承人用所得遗产清偿；剩余债务由遗嘱继承人和受遗赠人按比例清偿，但以遗产价值为限</text>
<text x="844" y="1002" font-size="12" fill="#344054">  ③无无遗嘱继承的，由遗嘱继承人和受遗赠人按比例清偿，但以遗产价值为限</text>
<rect x="436" y="1356.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1378.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲78 侵权责任的基本原理（01）</text>
<text x="448" y="1398.5" font-size="12" fill="#344054">来源 p103</text>
<rect x="832" y="1025" width="300" height="714" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1047" font-size="14.5" font-weight="600" fill="#6F3A91">调整范围+归责原则（4次）</text>
<text x="844" y="1067" font-size="12" fill="#344054">1.调整范围：①民事权利：①对世权=物权、人身权、知识产权；②相对权=债权是典型的相对权，在考范围内，债权受到侵害不适用侵权责任的救济途径</text>
<text x="844" y="1084" font-size="12" fill="#344054">  ②民事利益：①胎儿利益；②死者人格利益；③其他民事利益</text>
<text x="844" y="1101" font-size="12" fill="#344054">2.归责原则：①过错责任原则=①含义=有过错才承担侵权责任</text>
<text x="844" y="1118" font-size="12" fill="#344054">  ②构成要件=①侵权行为、②损害后果、③因果关系、④主观过错</text>
<text x="844" y="1135" font-size="12" fill="#344054">  ③举证责任=①一般过错：受害人举证（谁主张，谁举证）</text>
<text x="844" y="1152" font-size="12" fill="#344054">    ②推定过错：①教育机构责任、医疗损害责任、动物致害责任、不动产脱落/坠落/倒塌/堆放物倒塌/滚落、妨害通行物致害责任、林木折断、地面施工侵权、地下设施侵权</text>
<text x="844" y="1169" font-size="12" fill="#344054">2.无过错责任原则=①含义=严格责任原则，没有过错也要承担侵权责任</text>
<text x="844" y="1186" font-size="12" fill="#344054">  ②构成要件=①侵权行为 ②损害后果 ③因果关系</text>
<text x="844" y="1203" font-size="12" fill="#344054">  ③典型=监护人责任、用人单位责任（外部）、用工责任（外部）、产品责任（外部）、机动车交通事故责任（车外人）、环境污染责任、高度危险责任、饲养动物损害责任（动物园除外）、建筑物倒塌/塌陷责任</text>
<text x="844" y="1220" font-size="12" fill="#344054">3.公平补偿原则：①性质=公平分担损失的规则，而非归责原则</text>
<text x="844" y="1237" font-size="12" fill="#344054">  ②适用条件：①受害人和行为人对损害的发生都没有过错；②②完全由哪一方承担都不公平的情形</text>
<text x="844" y="1254" font-size="12" fill="#344054">    A. 完全无民事行为能力人暂时丧失心智的情形</text>
<text x="844" y="1271" font-size="12" fill="#344054">    B. 高空抛物坠物的情形</text>
<text x="844" y="1288" font-size="12" fill="#344054">    C. 紧急避险的情形</text>
<text x="844" y="1305" font-size="12" fill="#344054">    D. 见义勇为的情形</text>
<text x="844" y="1322" font-size="12" fill="#344054">  ③双方当事人的行为与损害后果的发生具有一定的因果关系</text>
<text x="844" y="1339" font-size="12" fill="#344054">4.共同侵权（5次）：①教唆帮助侵权=①完全民事行为能力人教唆、帮助完全民事行为能力人实施侵权行为，构成共同侵权，承担连带责任</text>
<text x="844" y="1356" font-size="12" fill="#344054">  ②教唆、帮助无民事行为能力人/限制民事行为能力人实施侵权行为的，由监护人承担侵权责任；教唆人、帮助人承担连带责任，费用超出部分可向教唆人、帮助人追偿</text>
<text x="844" y="1373" font-size="12" fill="#344054">  ③监护人先行支付赔偿费用后，超过其应负担的部分，可向教唆人、帮助人追偿（民法典第1169条第1款、第12条）</text>
<text x="844" y="1390" font-size="12" fill="#344054">  ④共同危险行为=①含义=准共同侵权行为，是指数人共同实施危及他人人身、财产的行为并造成损害后果，实际侵权人又无法确定的侵权行为</text>
<text x="844" y="1407" font-size="12" fill="#344054">  ⑤责任承担=①能够确定具体侵权人的，由侵权人承担责任；②不能确定具体侵权人的，行为人承担连带责任</text>
<text x="844" y="1424" font-size="12" fill="#344054">  ⑥无意思联络的数人侵权行为=①原因力竞合：①二人以上分别实施侵权行为造成同一损害，能够确定责任大小的，各自承担相应的责任；难以确定责任大小的，平均承担责任</text>
<text x="844" y="1441" font-size="12" fill="#344054">  ②原因力结合：A+B=C（A、B均承担按份责任，由法院根据两原因力大小在共同原因力范围各自确定相应的责任，难以确定责任大小的，平均承担责任）</text>
<text x="844" y="1458" font-size="12" fill="#344054">  ⑤意外事件=非因当事人的故意或过失，由于当事人意志以外的原因而偶然发生的事故</text>
<text x="844" y="1475" font-size="12" fill="#344054">  ⑥意外事件构成要件=①意外事件是不可预见的（运用&quot;主观标准&quot;） ②意外事件是归因于行为人自身以外的原因 ③意外事件是偶然事件</text>
<text x="844" y="1492" font-size="12" fill="#344054">  ⑦正当防卫=①构成要件=①防卫目的=为了使国家利益、社会公共利益、本人或他人的人身权利、财产权利及其他合法权益免受正在进行的不法侵害</text>
<text x="844" y="1509" font-size="12" fill="#344054">    ②防卫起因=存在现实的（正在实施）的非法侵害</text>
<text x="844" y="1526" font-size="12" fill="#344054">    ③防卫时间=正在进行的不法侵害</text>
<text x="844" y="1543" font-size="12" fill="#344054">    ④防卫对象=只能是不法侵害人本人</text>
<text x="844" y="1560" font-size="12" fill="#344054">  ②责任承担=①因正当防卫造成损害的，不承担民事责任</text>
<text x="844" y="1577" font-size="12" fill="#344054">    ②超过必要的限度（防卫过当/比例原则），在造成不应有的损害范围内承担部分责任</text>
<text x="844" y="1594" font-size="12" fill="#344054">    ③举证责任=防卫人对其认为的正当防卫造成不应有的损害承担举证责任（民法典总则编解释）第31条第3款</text>
<text x="844" y="1611" font-size="12" fill="#344054">  ⑧紧急避险=①构成要件=①避险目的=为了使国家利益、社会公共利益、本人或他人的人身权利、财产权利及其他合法权益免受正在发生的急迫危险</text>
<text x="844" y="1628" font-size="12" fill="#344054">    ②避险起因=合法权益面临客观存在的急迫危险</text>
<text x="844" y="1645" font-size="12" fill="#344054">    ③避险时间=正在发生的急迫危险</text>
<text x="844" y="1662" font-size="12" fill="#344054">    ④避险必要=不得已而采取</text>
<text x="844" y="1679" font-size="12" fill="#344054">  ②责任承担=①人为原因=避险措施由人为原因引起的，由引起险情发生的人承担民事责任</text>
<text x="844" y="1696" font-size="12" fill="#344054">    ②自然原因=①原则上不承担民事责任，但受害人要求补偿的，可以责令受益人适当补偿</text>
<text x="844" y="1713" font-size="12" fill="#344054">    ③避险过当=若紧急避险人采取措施不当或超过必要的限度，造成不应有的损害的，应当承担适当的民事责任（民法典总则编解释）第33条第1款</text>
<text x="844" y="1730" font-size="12" fill="#344054">  ⑨与有过失=①含义=又称为过失相抵，是指侵权人对同一损害的发生或扩大有过错，可以减轻侵权人的责任（民法典第1173条）</text>
<rect x="436" y="1931.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="1953.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲79 侵权责任的基本原理（02）</text>
<text x="448" y="1973.5" font-size="12" fill="#344054">来源 p103-p104</text>
<rect x="832" y="1753" width="300" height="408" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1775" font-size="14.5" font-weight="600" fill="#0F7E80">共同危险+意外事件+正当防卫+紧急避险</text>
<text x="844" y="1795" font-size="12" fill="#344054">1.共同危险行为=①含义=是指数人共同实施危及他人人身、财产的行为并造成损害后果，实际侵权人又无法确定的侵权行为</text>
<text x="844" y="1812" font-size="12" fill="#344054">  ②责任承担=①能够确定具体侵权人的，由侵权人承担责任；②不能确定具体侵权人的，行为人承担连带责任</text>
<text x="844" y="1829" font-size="12" fill="#344054">  ③无意思联络的数人侵权=①原因力竞合：①二人以上分别实施侵权行为造成同一损害，能够确定责任大小的，各自承担相应的责任；难以确定责任大小的，平均承担责任</text>
<text x="844" y="1846" font-size="12" fill="#344054">    ②原因力结合=A+B=C（A、B均承担按份责任，由法院根据两原因力大小在共同原因力范围各自确定相应的责任，难以确定责任大小的，平均承担责任）</text>
<text x="844" y="1863" font-size="12" fill="#344054">2.意外事件=①非因当事人的故意或过失，由于当事人意志以外的原因而偶然发生的事故</text>
<text x="844" y="1880" font-size="12" fill="#344054">  ②构成要件=①意外事件是不可预见的（运用&quot;主观标准&quot;）</text>
<text x="844" y="1897" font-size="12" fill="#344054">    ②意外事件是归因于行为人自身以外的原因</text>
<text x="844" y="1914" font-size="12" fill="#344054">    ③意外事件是偶然事件</text>
<text x="844" y="1931" font-size="12" fill="#344054">3.正当防卫=①构成要件=①防卫目的=为了使国家利益、社会公共利益、本人或他人的人身权利、财产权利及其他合法权益免受正在进行的不法侵害</text>
<text x="844" y="1948" font-size="12" fill="#344054">    ②防卫起因=存在现实的（正在实施）的非法侵害</text>
<text x="844" y="1965" font-size="12" fill="#344054">    ③防卫时间=正在进行的不法侵害</text>
<text x="844" y="1982" font-size="12" fill="#344054">    ④防卫对象=只能是不法侵害人本人</text>
<text x="844" y="1999" font-size="12" fill="#344054">  ②责任承担=①因正当防卫造成损害的，不承担民事责任</text>
<text x="844" y="2016" font-size="12" fill="#344054">    ②超过必要的限度（防卫过当/比例原则），在造成不应有的损害范围内承担部分责任</text>
<text x="844" y="2033" font-size="12" fill="#344054">    ③举证责任=防卫人对其认为的正当防卫造成不应有的损害承担举证责任（民法典总则编解释）第31条第3款</text>
<text x="844" y="2050" font-size="12" fill="#344054">4.紧急避险=①构成要件=①避险目的=为了使国家利益、社会公共利益、本人或他人的人身权利、财产权利及其他合法权益免受正在发生的急迫危险</text>
<text x="844" y="2067" font-size="12" fill="#344054">    ②避险起因=合法权益面临客观存在的急迫危险</text>
<text x="844" y="2084" font-size="12" fill="#344054">    ③避险时间=正在发生的急迫危险</text>
<text x="844" y="2101" font-size="12" fill="#344054">    ④避险必要=不得已而采取</text>
<text x="844" y="2118" font-size="12" fill="#344054">  ②责任承担=①人为原因=避险措施由人为原因引起的，由引起险情发生的人承担民事责任</text>
<text x="844" y="2135" font-size="12" fill="#344054">    ②自然原因=①原则上不承担民事责任，但受害人要求补偿的，可以责令受益人适当补偿</text>
<text x="844" y="2152" font-size="12" fill="#344054">    ③避险过当=若紧急避险人采取措施不当或超过必要的限度，造成不应有的损害的，应当承担适当的民事责任（民法典总则编解释）第33条第1款</text>

<rect x="40" y="832.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="854.5" font-size="14.5" font-weight="600" fill="#185FA5">8-26 · 民法 讲80~84</text>
<text x="52" y="874.5" font-size="12" fill="#344054">损害赔偿+特殊主体+典型侵权</text>
<text x="52" y="891.5" font-size="12" fill="#344054">p105-p113</text>
<rect x="436" y="54.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="76.0" font-size="14.5" font-weight="600" fill="#854F0B">讲80 损害赔偿</text>
<text x="448" y="96.0" font-size="12" fill="#344054">来源 p105</text>
<rect x="832" y="20" width="300" height="119" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">人身损害赔偿</text>
<text x="844" y="62" font-size="12" fill="#344054">1.内容：①医疗费+护理费+交通费+营养费+住院伙食补助费等为治疗和康复支出的合理费用，以及因误工减少的收入</text>
<text x="844" y="79" font-size="12" fill="#344054">  ②造成残疾的，还应当赔偿辅助器具费和残疾赔偿金</text>
<text x="844" y="96" font-size="12" fill="#344054">  ③造成死亡的，还应当赔偿丧葬费和死亡赔偿金</text>
<text x="844" y="113" font-size="12" fill="#344054">2.同命同价：①因同一侵权行为造成多人死亡的，可以以相同数额确定死亡赔偿金</text>
<text x="844" y="130" font-size="12" fill="#344054">  ②可以不考虑被害人年龄、收入、居住或户籍地等农村或个体差异因素</text>
<rect x="436" y="432.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="454.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲81 七类特殊主体责任(01)·监护+用工</text>
<text x="448" y="474.0" font-size="12" fill="#344054">来源 p105-p106</text>
<rect x="832" y="153" width="300" height="340" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="175" font-size="14.5" font-weight="600" fill="#B83A4A">监护人责任（4次）</text>
<text x="844" y="195" font-size="12" fill="#344054">1.责任主体=有财产的无民事行为能力人、限制民事行为能力人造成他人损害的，从本人财产中支付赔偿费用，不足部分由监护人赔偿（替代责任）</text>
<text x="844" y="212" font-size="12" fill="#344054">2.归责原则=适用无过错责任原则</text>
<text x="844" y="229" font-size="12" fill="#344054">3.免责事由和特殊情形：</text>
<text x="844" y="246" font-size="12" fill="#344054">  (1)监护人尽到监护职责的，可以减轻其侵权责任</text>
<text x="844" y="263" font-size="12" fill="#344054">  (2)监护人/受托监护的委托人承担补充赔偿责任：</text>
<text x="844" y="280" font-size="12" fill="#344054">    ①无民事行为能力人/限制民事行为能力人应当列为共同被告【侵权责任编解释（一）第4条】</text>
<text x="844" y="297" font-size="12" fill="#344054">    ②判决写明=赔偿费用可以先从被监护人财产中支付，不足部分由监护人支付</text>
<text x="844" y="314" font-size="12" fill="#344054">    ③应当保留被监护人必要的生活费和完成义务教育所必需的费用【侵权责任编解释（一）第5条】</text>
<text x="844" y="331" font-size="12" fill="#344054">  (3)侵权行为发生时不满18周岁，起诉时已满18周岁的：</text>
<text x="844" y="348" font-size="12" fill="#344054">    ①原监护人承担全部责任</text>
<text x="844" y="365" font-size="12" fill="#344054">    ②判决写明=赔偿费用可以先从被监护人财产中支付，不足部分由监护人支付</text>
<text x="844" y="382" font-size="12" fill="#344054">    ③被侵权人仅起诉行为人的，法院应当向原告释明追加行为人原监护人为共同被告（侵权责任编解释（一）第6条）</text>
<text x="844" y="399" font-size="12" fill="#344054">  (4)父母离异：①夫妻离婚后，未成年子女造成他人损害的，被侵权人有权请求其父母共同承担侵权责任</text>
<text x="844" y="416" font-size="12" fill="#344054">    一方未与该子女共同生活，但有抚养能力、负有抚养义务的，可以不承担侵权责任</text>
<text x="844" y="433" font-size="12" fill="#344054">    离婚后对方不承担赔偿责任的，可以责令未与该子女共同生活的一方适当承担赔偿责任（民法典第1068条）</text>
<text x="844" y="450" font-size="12" fill="#344054">  (5)未成年子女造成他人损害的，未与该子女形成抚养教育关系的继父母或继祖父母不承担监护人责任（民法典侵权责任编解释（一）第9条）</text>
<text x="844" y="467" font-size="12" fill="#344054">  (6)受托监护：①监护人有非侵权职责的，受托人在过错范围内与监护人共同承担监护责任</text>
<text x="844" y="484" font-size="12" fill="#344054">    ②仅一般的过失的无偿受托人承担监护责任后可以向监护人追偿</text>
<rect x="832" y="507" width="300" height="255" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="529" font-size="14.5" font-weight="600" fill="#B83A4A">用工责任（8次）</text>
<text x="844" y="549" font-size="12" fill="#344054">1.单位用工：①内部关系=适用《劳动法》《劳动合同法》以及《工伤保险条例》的相关规定</text>
<text x="844" y="566" font-size="12" fill="#344054">  ②外部关系=</text>
<text x="844" y="583" font-size="12" fill="#344054">    A. ①用人单位承担侵权责任，可以向有故意或重大过错的劳务派遣者追偿</text>
<text x="844" y="600" font-size="12" fill="#344054">      ②工作人员构成犯罪的，不影响用人单位依法承担民事责任</text>
<text x="844" y="617" font-size="12" fill="#344054">    B. ①非职务行为=工作人员自己承担</text>
<text x="844" y="634" font-size="12" fill="#344054">    C. ①劳务派遣：①用工单位承担无过错的侵权责任（不当选派工作人员，未依规对工作人员进行培训或分派任务的行为），在过错范围内与劳务派遣单位承担连带责任（按份责任）</text>
<text x="844" y="651" font-size="12" fill="#344054">      ②第三人侵权=①第三人承担侵权赔偿责任</text>
<text x="844" y="668" font-size="12" fill="#344054">        ②用人单位应当按无过错责任原则承担工伤赔偿责任</text>
<text x="844" y="685" font-size="12" fill="#344054">2.个人用工：①性质=劳务关系（包括家庭雇佣保姆、小时工、家庭教师等家庭用工）</text>
<text x="844" y="702" font-size="12" fill="#344054">  ②内部关系=提供劳务者自己受报，按各自过错承担责任（过错责任原则）</text>
<text x="844" y="719" font-size="12" fill="#344054">  ③外部关系=①致人损害=接受劳务一方承担侵权责任，可以向有故意或重大过失的提供劳务一方追偿（无过错责任原则）</text>
<text x="844" y="736" font-size="12" fill="#344054">    ②被第三人侵权=①择一选择：提供劳务一方有权请求第三人承担侵权责任，也有权请求被侵权人补偿（民法典第1192条第2款）</text>
<text x="844" y="753" font-size="12" fill="#344054">      ②接受劳务一方补偿后，可以向第三人追偿（不真正连带责任）</text>
<rect x="436" y="1219.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1241.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲82 七类特殊主体责任(02)·帮工+定作+网络+安保+教育</text>
<text x="448" y="1261.0" font-size="12" fill="#344054">来源 p107-p108</text>
<rect x="832" y="776" width="300" height="85" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="798" font-size="14.5" font-weight="600" fill="#6F3A91">帮工责任（2次）</text>
<text x="844" y="818" font-size="12" fill="#344054">1.责任主体=①被帮工人承担赔偿责任，可以向有故意或重大过失的帮工人追偿</text>
<text x="844" y="835" font-size="12" fill="#344054">  ②帮工人拒绝帮工的，被帮工人不赔偿但补偿</text>
<text x="844" y="852" font-size="12" fill="#344054">2.归责原则=①内部关系=过错责任原则 ②外部关系=无过错责任原则</text>
<rect x="832" y="875" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="897" font-size="14.5" font-weight="600" fill="#6F3A91">定作人责任（2次）</text>
<text x="844" y="917" font-size="12" fill="#344054">1.责任主体=定作人</text>
<text x="844" y="934" font-size="12" fill="#344054">2.归责原则=一般过错责任原则，即仅对定作、指示或选任有过错才承担相应的责任</text>
<text x="844" y="951" font-size="12" fill="#344054">3.免责事由：</text>
<text x="844" y="968" font-size="12" fill="#344054">  (1)定作人在定作、指示或选任过失范围内与承揽人共同承担赔偿责任，</text>
<text x="844" y="985" font-size="12" fill="#344054">  但责任主体实际支付的赔偿费用总和不超过被侵权人应受偿的损失数额</text>
<text x="844" y="1002" font-size="12" fill="#344054">  (2)定作人先行支付赔偿费用后，就超过自己责任的部分可以向承揽人追偿（民法典侵权责任编解释（一）第18条）</text>
<rect x="832" y="1025" width="300" height="119" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1047" font-size="14.5" font-weight="600" fill="#6F3A91">网络服务提供者责任（3次）</text>
<text x="844" y="1067" font-size="12" fill="#344054">1.责任主体=网络用户（自然人和法人）、网络服务提供者</text>
<text x="844" y="1084" font-size="12" fill="#344054">2.归责原则=过错责任原则</text>
<text x="844" y="1101" font-size="12" fill="#344054">3.免责事由：</text>
<text x="844" y="1118" font-size="12" fill="#344054">  (1)网络服务提供者应及时采取删除、屏蔽、断开链接等必要措施，未及时采取措施的，对损害的扩大部分与侵权行为的网络用户承担连带责任</text>
<text x="844" y="1135" font-size="12" fill="#344054">  (2)网络服务提供者知道或应当知道网络用户利用其网络服务侵权的，除采取必要措施外，不承担侵权责任</text>
<rect x="832" y="1158" width="300" height="187" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1180" font-size="14.5" font-weight="600" fill="#6F3A91">安保义务人责任（7次）</text>
<text x="844" y="1200" font-size="12" fill="#344054">1.责任主体=经营场所、公共场所的经营者、管理者或群众性活动的组织者</text>
<text x="844" y="1217" font-size="12" fill="#344054">  (1)经营场所、公共场所：宾馆、商场、银行、车站、机场、体育场馆、娱乐场所</text>
<text x="844" y="1234" font-size="12" fill="#344054">  (2)群众性活动：包括演出、体育活动、比赛等</text>
<text x="844" y="1251" font-size="12" fill="#344054">  (3)责任主体只要对该场所具有事实上的控制力即可，不以双方有交易关系为必要</text>
<text x="844" y="1268" font-size="12" fill="#344054">2.归责原则=过错责任原则</text>
<text x="844" y="1285" font-size="12" fill="#344054">3.第三人侵权时=①第三人承担侵权责任</text>
<text x="844" y="1302" font-size="12" fill="#344054">  ②安保义务人未尽到安全保障义务（有过错）的，承担相应的补充赔偿责任（承担责任的第二顺位）</text>
<text x="844" y="1319" font-size="12" fill="#344054">  ③经营者、管理者或组织者承担补充责任后，可以向第三人追偿</text>
<text x="844" y="1336" font-size="12" fill="#344054">4.免责事由=安保义务人证明自己没有过错</text>
<rect x="832" y="1359" width="300" height="238" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1381" font-size="14.5" font-weight="600" fill="#6F3A91">教育机构责任（4次）</text>
<text x="844" y="1401" font-size="12" fill="#344054">1.责任主体：学校、幼儿园及其他教育机构</text>
<text x="844" y="1418" font-size="12" fill="#344054">  (1)责任期间：在校期间，学校组织的校外活动视为在校期间</text>
<text x="844" y="1435" font-size="12" fill="#344054">  (2)责任区域：校园内和特定区域（校门、校车、校外活动相应区域）</text>
<text x="844" y="1452" font-size="12" fill="#344054">2.归责原则：①工作人员侵权=无过错替代责任（用工责任）</text>
<text x="844" y="1469" font-size="12" fill="#344054">  ②非工作人员侵权：①无民事行为能力人的，过错推定责任原则</text>
<text x="844" y="1486" font-size="12" fill="#344054">    ②限制民事行为能力人的，一般过错责任原则</text>
<text x="844" y="1503" font-size="12" fill="#344054">3.免责事由=教育机构证明自己没有过错</text>
<text x="844" y="1520" font-size="12" fill="#344054">4.第三人侵权时=①第三人承担侵权责任，教育机构未尽到管理职责的，承担相应的补充责任</text>
<text x="844" y="1537" font-size="12" fill="#344054">  ②教育机构作为共同被告且依法应承担侵权责任的，法院应当判决明确：</text>
<text x="844" y="1554" font-size="12" fill="#344054">    教育机构在第三人的财产执行不能或未全部执行时承担补充赔偿责任</text>
<text x="844" y="1571" font-size="12" fill="#344054">  ③被侵权人仅起诉教育机构的，法院应当向原告释明通知应追加实施侵权行为的第三人为共同被告</text>
<text x="844" y="1588" font-size="12" fill="#344054">  ④第三人确定后，未尽到管理职责的教育机构承担与其过错相应的责任</text>
<rect x="832" y="1611" width="300" height="102" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1633" font-size="14.5" font-weight="600" fill="#6F3A91">七类特殊主体责任总结表</text>
<text x="844" y="1653" font-size="12" fill="#344054">见p108底部总结表（监护人/用工/帮工/定作人/网络/安保义务/教育机构）</text>
<text x="844" y="1670" font-size="12" fill="#344054">七类对比：责任主体/归责原则/免责事由/赔偿范围</text>
<text x="844" y="1687" font-size="12" fill="#344054">总结：①无过错责任类=监护人/用工/帮工/产品责任等</text>
<text x="844" y="1704" font-size="12" fill="#344054">②过错责任类=定作人/网络服务/教育机构（部分过错推定）/安保义务人/继承</text>

<text x="52" y="503.5" font-size="14.5" font-weight="600" fill="#185FA5">8-27 · 民法 讲85~86</text>
<text x="52" y="523.5" font-size="12" fill="#344054">民法的基本原则 + 民事权利</text>
<text x="52" y="540.5" font-size="12" fill="#344054">p114-p118 · 民法收官</text>
<rect x="436" y="180.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="202.0" font-size="14.5" font-weight="600" fill="#854F0B">讲85 民法的基本原则</text>
<text x="448" y="222.0" font-size="12" fill="#344054">来源 p114-p115</text>
<rect x="832" y="20" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">概念+体系</text>
<text x="844" y="62" font-size="12" fill="#344054">概念：对民事立法、民事司法和民事活动具有普遍意义的基本准则</text>
<text x="844" y="79" font-size="12" fill="#344054">体系：①平等原则 ②自愿原则 ③公平原则 ④诚实信用原则 ⑤公序良俗原则 ⑥绿色原则（节约资源、保护生态环境） ⑦民事权益受法律保护原则</text>
<text x="844" y="96" font-size="12" fill="#344054">⚠️ 最高原则=诚信原则（帝王条款）；平等是前提；自愿是核心；公平是基本要求；诚信是补充</text>
<rect x="832" y="119" width="300" height="272" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="141" font-size="14.5" font-weight="600" fill="#854F0B">各原则要点</text>
<text x="844" y="161" font-size="12" fill="#344054">1.平等原则：①民事主体资格（权利能力）一律平等</text>
<text x="844" y="178" font-size="12" fill="#344054">  ②民事主体地位平等，适用同一规则调整，受法律平等保护</text>
<text x="844" y="195" font-size="12" fill="#344054">  ③在民事法律行为中，任何一方不得把自己的意志强加给另一方</text>
<text x="844" y="212" font-size="12" fill="#344054">2.自愿原则：①设立、变更、终止民事法律关系的自由</text>
<text x="844" y="229" font-size="12" fill="#344054">  ②选择相对人、行为内容、行为方式的自由</text>
<text x="844" y="246" font-size="12" fill="#344054">3.公平原则：①内容上的公平（权利义务配置合理）</text>
<text x="844" y="263" font-size="12" fill="#344054">  ②形式上的公平（当事人法律地位平等）</text>
<text x="844" y="280" font-size="12" fill="#344054">  ③兼顾程序公平和实质公平</text>
<text x="844" y="297" font-size="12" fill="#344054">4.诚实信用原则：①善意行使权利、履行义务</text>
<text x="844" y="314" font-size="12" fill="#344054">  ②禁止权利滥用；③信赖利益保护</text>
<text x="844" y="331" font-size="12" fill="#344054">5.公序良俗原则：①维护国家利益和社会公共利益</text>
<text x="844" y="348" font-size="12" fill="#344054">  ②禁止违反社会公德的行为</text>
<text x="844" y="365" font-size="12" fill="#344054">6.绿色原则：①节约资源、保护生态环境</text>
<text x="844" y="382" font-size="12" fill="#344054">  ②民事主体从事民事活动应当有利于节约资源、保护生态环境</text>
<rect x="436" y="682.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="704.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲86 民事权利</text>
<text x="448" y="724.5" font-size="12" fill="#344054">来源 p116-p118</text>
<rect x="832" y="405" width="300" height="289" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="427" font-size="14.5" font-weight="600" fill="#B83A4A">民事权利的概念与分类</text>
<text x="844" y="447" font-size="12" fill="#344054">概念：民事主体为实现某种利益而依法为一定行为或请求他人为一定行为的可能性</text>
<text x="844" y="464" font-size="12" fill="#344054">1.法定分类：</text>
<text x="844" y="481" font-size="12" fill="#344054">  (1)财产权：①物权（所有权/用益物权/担保物权）②债权③知识产权（财产权部分）</text>
<text x="844" y="498" font-size="12" fill="#344054">  (2)人身权：①人格权（生命权/健康权/姓名权/肖像权/名誉权/荣誉权/隐私权等）②身份权（配偶权/亲权/亲属权）</text>
<text x="844" y="515" font-size="12" fill="#344054">  (3)综合性权利：①继承权（财产权+身份权）②股权（社员权）③知识产权（人身权+财产权）</text>
<text x="844" y="532" font-size="12" fill="#344054">  (4)支配权：权利人直接支配客体并排除他人干涉（物权）</text>
<text x="844" y="549" font-size="12" fill="#344054">  (5)请求权：请求他人为或不为一定行为的权利（债权）</text>
<text x="844" y="566" font-size="12" fill="#344054">  (6)形成权：权利人单方意思表示使法律关系发生、变更、消灭（解除权/撤销权/追认权/抵销权）</text>
<text x="844" y="583" font-size="12" fill="#344054">  (7)抗辩权：对抗请求权的权利（诉讼时效抗辩/先诉抗辩权）</text>
<text x="844" y="600" font-size="12" fill="#344054">2.学理分类：</text>
<text x="844" y="617" font-size="12" fill="#344054">  (1)根据权利的作用：①支配权（物权）②请求权（债权）③形成权（撤销权/解除权/抵销权/追认权）④抗辩权（先诉抗辩权/同时履行抗辩权）</text>
<text x="844" y="634" font-size="12" fill="#344054">  (2)根据义务主体：①绝对权（对世权）：物权/人身权/知识产权</text>
<text x="844" y="651" font-size="12" fill="#344054">    ②相对权（对人权）：债权</text>
<text x="844" y="668" font-size="12" fill="#344054">  (3)根据相互关联：①主权利和从权利（抵押权等从属于主债权）</text>
<text x="844" y="685" font-size="12" fill="#344054">    ②原权利和救济权（请求损害赔偿的权利）</text>
<rect x="832" y="708" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="730" font-size="14.5" font-weight="600" fill="#B83A4A">民事权利的行使与保护</text>
<text x="844" y="750" font-size="12" fill="#344054">1.行使原则：①遵守法律和社会公德</text>
<text x="844" y="767" font-size="12" fill="#344054">  ②不得滥用权利（禁止权利滥用原则）</text>
<text x="844" y="784" font-size="12" fill="#344054">  ③不得损害国家利益、社会公共利益和他人合法权益</text>
<text x="844" y="801" font-size="12" fill="#344054">2.保护方式：①自我保护（自力救济）：正当防卫/紧急避险</text>
<text x="844" y="818" font-size="12" fill="#344054">  ②国家保护（公力救济）：①民事诉讼/仲裁 ②行政复议/行政诉讼</text>
<text x="844" y="835" font-size="12" fill="#344054">3.权利冲突的处理：①价值衡量原则（生命健康权优先）</text>
<text x="844" y="852" font-size="12" fill="#344054">  ②比例原则（最小侵害）</text>
<text x="844" y="869" font-size="12" fill="#344054">  ③诚信原则（善意第三人保护）</text>
<rect x="832" y="892" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="914" font-size="14.5" font-weight="600" fill="#B83A4A">★ 民法收官总表</text>
<text x="844" y="934" font-size="12" fill="#344054">2026民法·孟献贵版思维导图 120页 全部处理完毕</text>

      let mindmaps = fakaoPlan;
      if (!Array.isArray(mindmaps) || !mindmaps.length) mindmaps = [];

      // 今日日期（模块级，列表与导图共用）
      const todayStr = fmtDate(new Date());

      // ---- 思维导图：基于真实排期数据生成 SVG ----
      function statusOf(dateArr) {
        const allPast = dateArr.every(d => d < todayStr);
        const allFut = dateArr.every(d => d > todayStr);
        if (allPast) return 'past';
        if (allFut) return 'future';
        return 'current';
      }

      // 展开状态：科目 / 阶段 key -> true
      let expanded = {};

      function buildMindmapSVG() {
        // ---- 构建树 ----
        const roundMap = {}, roundOrder = [];
        mindmaps.forEach(n => {
          const p = n.phase || '未分类';
          if (!roundMap[p]) { roundMap[p] = []; roundOrder.push(p); }
          roundMap[p].push(n);
        });
        const rounds = [];
        roundOrder.forEach(p => {
          const arr = roundMap[p];
          const isR1 = p.indexOf('R1') >= 0;
          const roundNode = { name: p, status: statusOf(arr.map(x => x.date)), depth: 0, children: [], toggle: isR1 ? null : 'round-' + p };
          if (isR1) {
            const subjMap = {}, subjOrder = [];
            arr.forEach(n => {
              const s = n.subject || '其他';
              if (!subjMap[s]) { subjMap[s] = []; subjOrder.push(s); }
              subjMap[s].push(n);
            });
            subjOrder.forEach(s => {
              const days = subjMap[s];
              const subjNode = { name: s, status: statusOf(days.map(x => x.date)), depth: 1, children: [], toggle: 'subj-' + s, dayCount: days.length };
              if (expanded[subjNode.toggle]) {
                days.forEach(d => {
                  subjNode.children.push({ name: d.date.slice(5) + ' ' + (d.lessons || ''), status: statusOf([d.date]), depth: 2, date: d.date, node: d });
                });
              }
              roundNode.children.push(subjNode);
            });
          } else if (expanded[roundNode.toggle]) {
            arr.forEach(d => {
              roundNode.children.push({ name: d.date.slice(5) + (d.lessons ? ' ' + d.lessons : ''), status: statusOf([d.date]), depth: 1, date: d.date, node: d });
            });
          }
          rounds.push(roundNode);
        });

        // ---- 布局 ----
        const slotH = 28, top = 20, xRoot = 20, xRound = 250, xSubj = 480;
        const xByDepth = { 0: xRoot, 1: xRound, 2: xSubj };
        const wByDepth = { 0: 140, 1: 210, 2: 220 };
        const hByDepth = { 0: 46, 1: 26, 2: 24 };
        let leafIdx = 0;
        function assignY(node) {
          if (!node.children || !node.children.length) {
            node.y = top + leafIdx * slotH + slotH / 2;
            leafIdx++;
          } else {
            node.children.forEach(assignY);
            node.y = node.children.reduce((a, c) => a + c.y, 0) / node.children.length;
          }
        }
        rounds.forEach(assignY);
        const H = top + leafIdx * slotH + 10;
        const W = 740;
        const rootY = (rounds[0].y + rounds[rounds.length - 1].y) / 2;

        const colors = { past: '#3ec46d', current: '#00aaff', future: '#7a8aa0' };
        const soft = { past: 'rgba(62,196,109,0.15)', current: 'rgba(0,170,255,0.18)', future: 'rgba(122,138,160,0.12)' };

        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">';

        // 根 -> 阶段 连线
        rounds.forEach(r => {
          const c = colors[r.status];
          svg += '<path d="M ' + (xRoot + wByDepth[0]) + ' ' + rootY + ' C ' + ((xRoot + wByDepth[0] + xRound) / 2) + ' ' + rootY + ', ' + ((xRoot + wByDepth[0] + xRound) / 2) + ' ' + r.y + ', ' + xRound + ' ' + r.y + '" stroke="' + c + '" stroke-width="2" fill="none" opacity="0.7"/>';
        });

        // 子节点连线
        function drawEdges(node) {
          const x1 = xByDepth[node.depth] + wByDepth[node.depth];
          (node.children || []).forEach(ch => {
            const x2 = xByDepth[ch.depth];
            svg += '<path d="M ' + x1 + ' ' + node.y + ' C ' + ((x1 + x2) / 2) + ' ' + node.y + ', ' + ((x1 + x2) / 2) + ' ' + ch.y + ', ' + x2 + ' ' + ch.y + '" stroke="' + colors[ch.status] + '" stroke-width="2" fill="none" opacity="0.6"/>';
            drawEdges(ch);
          });
        }
        rounds.forEach(drawEdges);

        // 节点
        function drawNodes(node) {
          const x = xByDepth[node.depth];
          const w = wByDepth[node.depth];
          const h = hByDepth[node.depth];
          const toggleAttr = node.toggle ? ' data-toggle="' + node.toggle + '"' : (node.date ? ' data-date="' + node.date + '"' : '');
          const clickable = (node.toggle || node.date) ? ' style="cursor:pointer;"' : '';
          const badge = node.toggle ? (expanded[node.toggle] ? ' ▾' : ' ▸' + (node.dayCount || node.children.length)) : '';
          const raw = node.name + badge;
          const label = raw.length > 16 ? raw.slice(0, 16) + '…' : raw;
          svg += '<g' + toggleAttr + clickable + '><rect x="' + x + '" y="' + (node.y - h / 2) + '" width="' + w + '" height="' + h + '" rx="8" fill="' + soft[node.status] + '" stroke="' + colors[node.status] + '"/>' +
                 '<text x="' + (x + w / 2) + '" y="' + (node.y + 4) + '" text-anchor="middle" fill="currentColor" font-size="' + (node.depth === 0 ? 12 : 11) + '" font-weight="' + (node.depth === 0 ? 700 : 600) + '">' + escapeHtml(label) + '</text></g>';
          (node.children || []).forEach(drawNodes);
        }
        // 根节点
        svg += '<g><rect x="' + xRoot + '" y="' + (rootY - 23) + '" width="140" height="46" rx="12" fill="' + soft.current + '" stroke="' + colors.current + '"/><text x="' + (xRoot + 70) + '" y="' + (rootY - 2) + '" text-anchor="middle" fill="currentColor" font-size="13" font-weight="700">法考2027</text><text x="' + (xRoot + 70) + '" y="' + (rootY + 14) + '" text-anchor="middle" fill="currentColor" font-size="10" fill-opacity="0.6">备考路线</text></g>';
        rounds.forEach(drawNodes);

        svg += '</svg>';
        return svg;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function fmtDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function renderMindmaps(filter = 'all') {

        });

        const todayNode = mindmaps.find(m => m.date === todayStr);
        if (todayNode) {

        } else {
          fakaoMeta.textContent = `共 ${mindmaps.length} 节点 · 今日 ${today.toLocaleDateString('zh-CN')}（无排期）`;

        filtered.forEach(m => {

      function openModal(item) {

        const img = mindmapImages[item.date];

        modalBody.innerHTML = imgHtml + `

      // 思维导图拖拽 + 缩放
      function initPanZoom(container) {
        if (!container) return;
        const inner = container.querySelector('.mm-panzoom-inner');
        const hint = container.querySelector('.mm-panzoom-hint');
        if (!inner) return;
        let scale = 1, tx = 0, ty = 0;
        let dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;

        function apply() {
          inner.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
          if (hint) hint.textContent = Math.round(scale * 100) + '% · 拖拽平移';
        }
        function fit() {
          const cw = container.clientWidth, ch = container.clientHeight || 520;
          // measure natural svg size
          const svg = inner.querySelector('svg');
          if (svg) {
            const vb = svg.getAttribute('viewBox');
            if (vb) {
              const parts = vb.split(/\s/).map(Number);
              const nw = parts[2], nh = parts[3];
              if (nw && nh) {
                scale = Math.min(cw / nw, ch / nh, 1);
                tx = (cw - nw * scale) / 2;
                ty = (ch - nh * scale) / 2;
                apply(); return;
              }
            }
            // fallback: use rendered size
            const rect = svg.getBoundingClientRect();
            if (rect.width > 0) {
              scale = Math.min(cw / rect.width, ch / rect.height, 1);
              tx = (cw - rect.width * scale) / 2;
              ty = (ch - rect.height * scale) / 2;
              apply(); return;
            }
          }
          scale = 1; tx = 0; ty = 0; apply();
        }

        container.__reset = function () { fit(); };

        // mouse drag
        container.addEventListener('mousedown', (e) => {
          if (e.target.closest('.mm-panzoom-reset')) return;
          dragging = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
          inner.classList.add('dragging');
          e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
          if (!dragging) return;
          tx = stx + (e.clientX - sx);
          ty = sty + (e.clientY - sy);
          apply();
        });
        document.addEventListener('mouseup', () => { dragging = false; inner.classList.remove('dragging'); });

        // wheel zoom
        container.addEventListener('wheel', (e) => {
          e.preventDefault();
          const rect = container.getBoundingClientRect();
          const mx = e.clientX - rect.left, my = e.clientY - rect.top;
          const delta = e.deltaY > 0 ? 0.9 : 1.1;
          const ns = Math.max(0.15, Math.min(6, scale * delta));
          // zoom toward mouse position
          tx = mx - (mx - tx) * (ns / scale);
          ty = my - (my - ty) * (ns / scale);
          scale = ns;
          apply();
        }, { passive: false });

        // touch support
        let lastDist = 0, lastTx = 0, lastTy = 0, lastScale = 1;
        container.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            dragging = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY; stx = tx; sty = ty;
          } else if (e.touches.length === 2) {
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            lastDist = Math.sqrt(dx*dx + dy*dy); lastTx = tx; lastTy = ty; lastScale = scale;
          }
          e.preventDefault();
        }, { passive: false });
        container.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1 && dragging) {
            tx = stx + (e.touches[0].clientX - sx);
            ty = sty + (e.touches[0].clientY - sy);
            apply();
          } else if (e.touches.length === 2) {
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            scale = Math.max(0.15, Math.min(6, lastScale * (dist / lastDist)));
            apply();
          }
          e.preventDefault();
        }, { passive: false });
        container.addEventListener('touchend', () => { dragging = false; });

        // auto-fit on open (after layout)
        requestAnimationFrame(() => requestAnimationFrame(fit));
      }

      LS.set(mindmapsKey, mindmaps);

      // ===== 数据导出 / 导入（跨设备同步）=====
      const exportBtn = document.getElementById('export-btn');
      const importBtn = document.getElementById('import-btn');
      const importFile = document.getElementById('import-file');

      function exportData() {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          data[k] = localStorage.getItem(k);
        }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = url;
        a.download = 'digital-desktop-backup-' + ts + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function importData(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (!confirm('导入将用备份文件覆盖当前设备的全部数据，确定继续？')) return;
            localStorage.clear();
            for (const k in data) {
              if (Object.prototype.hasOwnProperty.call(data, k)) localStorage.setItem(k, data[k]);
            }
            location.reload();
          } catch (err) {
            alert('导入失败：文件不是有效的备份 JSON。');
          }
        };
        reader.readAsText(file);
      }

      if (exportBtn) exportBtn.addEventListener('click', exportData);
      if (importBtn) importBtn.addEventListener('click', () => { if (importFile) importFile.click(); });
      if (importFile) importFile.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
        e.target.value = '';
      });
    })();
