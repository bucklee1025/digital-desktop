<rect x="40" y="1560.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1582.5" font-size="14.5" font-weight="600" fill="#185FA5">8-13 · 民法 讲36~39</text>
<text x="52" y="1602.5" font-size="12" fill="#344054">债的分类 + 合同基本原理 + 缔约过失</text>
<text x="52" y="1619.5" font-size="12" fill="#344054">p042-p046</text>
<rect x="436" y="627.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="649.5" font-size="14.5" font-weight="600" fill="#854F0B">讲36 债的法定分类</text>
<text x="448" y="669.5" font-size="12" fill="#344054">来源 p042-p043</text>
<rect x="832" y="20" width="300" height="255" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">1.自然之债（2次）</text>
<text x="844" y="62" font-size="12" fill="#344054">(1)含义：缺乏法定之债的，不产生法定义务</text>
<text x="844" y="79" font-size="12" fill="#344054">  不能径由诉讼获得满足</text>
<text x="844" y="96" font-size="12" fill="#344054">  但债务人自愿履行的，不得请求不当得利返还</text>
<text x="844" y="113" font-size="12" fill="#344054">(2)特征：①债权本身存在</text>
<text x="844" y="130" font-size="12" fill="#344054">  ②不得请求法院强制执行</text>
<text x="844" y="147" font-size="12" fill="#344054">  ③债务人给付后原则上不得请求不当得利返还</text>
<text x="844" y="164" font-size="12" fill="#344054">(3)典型情形：</text>
<text x="844" y="181" font-size="12" fill="#344054">  ①已过诉讼时效之债（赠偿/毒资/赌债等违法之债）</text>
<text x="844" y="198" font-size="12" fill="#344054">  ②彩礼【彩礼纠纷规定第3条】：</text>
<text x="844" y="215" font-size="12" fill="#344054">    A. 不属于彩礼的情形：①节日/生日等有特殊纪念意义时点给付的价值不大的礼物/礼金</text>
<text x="844" y="232" font-size="12" fill="#344054">      ②一方为表达或增进感情的日常消费型支出</text>
<text x="844" y="249" font-size="12" fill="#344054">      ③其他价值不大的财物</text>
<text x="844" y="266" font-size="12" fill="#344054">    B. 彩礼返还（阶段/原则/例外条件/计算公式）</text>
<rect x="832" y="289" width="300" height="153" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="311" font-size="14.5" font-weight="600" fill="#854F0B">2.意定之债</text>
<text x="844" y="331" font-size="12" fill="#344054">(1)合同之债</text>
<text x="844" y="348" font-size="12" fill="#344054">(2)单方允诺之债：①含义=表意人向相对人作出的为自己设定某种义务、使相对人取得某种权利的意思表示</text>
<text x="844" y="365" font-size="12" fill="#344054">  ②典型情形：①悬赏广告②假一罚十的承诺③自然之债的合意履行</text>
<text x="844" y="382" font-size="12" fill="#344054">  ③特征：①表意人单方意思表示，无需相对人作出承诺即可成立</text>
<text x="844" y="399" font-size="12" fill="#344054">    即使相对人不知道单方允诺的存在也不影响单方允诺之债的成立</text>
<text x="844" y="416" font-size="12" fill="#344054">    ②不需要相对人付出代价，也不负实施特定行为的义务</text>
<text x="844" y="433" font-size="12" fill="#344054">    ③一般向社会公众作出，一般附特定条件</text>
<rect x="832" y="456" width="300" height="493" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="478" font-size="14.5" font-weight="600" fill="#854F0B">3.法定之债（9次）</text>
<text x="844" y="498" font-size="12" fill="#344054">(1)缔约过失之债：①侵权责任；②缔约责任</text>
<text x="844" y="515" font-size="12" fill="#344054">(2)无因管理之债：①含义=没有法定的或约定的义务，为避免他人利益受损失，</text>
<text x="844" y="532" font-size="12" fill="#344054">  自愿管理他人事务或者为他人提供服务的行为（学雷锋做好事、见义勇为、英雄救美）</text>
<text x="844" y="549" font-size="12" fill="#344054">  ②无、限制民事行为能力人的身份不影响无因管理的构成</text>
<text x="844" y="566" font-size="12" fill="#344054">  ②构成要件：①没有法定的义务</text>
<text x="844" y="583" font-size="12" fill="#344054">    ②主观上具有为避免他人利益损失而管理他人事务的意思：</text>
<text x="844" y="600" font-size="12" fill="#344054">      A. 主观上纯粹为自己→不构成无因管理（误信管理、有利可图或图谋私利）</text>
<text x="844" y="617" font-size="12" fill="#344054">      B. 主观上适当兼顾自己的利益→不影响成立</text>
<text x="844" y="634" font-size="12" fill="#344054">    ③客观上实施了管理他人事务的行为：</text>
<text x="844" y="651" font-size="12" fill="#344054">      A. 只要行为不要结果，无需有有效管理行为</text>
<text x="844" y="668" font-size="12" fill="#344054">      B. 经道德推崇行为（道德绑架）不构成无因管理</text>
<text x="844" y="685" font-size="12" fill="#344054">    ④不违反本人明示的或可推知的意思或推知的意愿</text>
<text x="844" y="702" font-size="12" fill="#344054">      例外：本人真实意思违反法律或违背公序良俗的除外</text>
<text x="844" y="719" font-size="12" fill="#344054">      （如将困难自身不愿就医院患者的患者强行的医院救治的行为、抢救原因自身的人，</text>
<text x="844" y="736" font-size="12" fill="#344054">      虽违反本人意思，仍构成无因管理）</text>
<text x="844" y="753" font-size="12" fill="#344054">  ③管理人权利：①必要费用请求权（管理人没有报酬请求权）</text>
<text x="844" y="770" font-size="12" fill="#344054">    ②所负债务请求权</text>
<text x="844" y="787" font-size="12" fill="#344054">    ③所受损害请求权（管理人所需损害可以向受益人主张赔偿，</text>
<text x="844" y="804" font-size="12" fill="#344054">      但受益人所受损害不得向管理人主张赔偿）</text>
<text x="844" y="821" font-size="12" fill="#344054">  ④管理人义务：①方法有利，不得擅自中断；②及时通知，等待指示；③及时交交和报告</text>
<text x="844" y="838" font-size="12" fill="#344054">  ⑤诉讼时效：①给付必要管理费用/赔偿损失请求权的诉讼时效期间，</text>
<text x="844" y="855" font-size="12" fill="#344054">    从无因管理行为结束并且管理人知道或者应当知道本人之日起计算</text>
<text x="844" y="872" font-size="12" fill="#344054">    ②本人因不当无因管理（侵权效力）行为产生的赔偿损失请求权的诉讼时效期间，</text>
<text x="844" y="889" font-size="12" fill="#344054">    从其知道或应当知道管理人及损害事实之日起计算</text>
<text x="844" y="906" font-size="12" fill="#344054">  ⑥见义勇为：①一种特殊的无因管理【民法典总则编解释第34条】</text>
<text x="844" y="923" font-size="12" fill="#344054">    A. 权益保障路径：A. 基于无因管理，由受益人支付见义勇为者必要费用和实际损失</text>
<text x="844" y="940" font-size="12" fill="#344054">      B. 在侵权人逃逸或无赔偿能力的情况下，由受益人给予适当补偿</text>
<rect x="832" y="963" width="300" height="323" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="985" font-size="14.5" font-weight="600" fill="#854F0B">4.不当得利之债（9次）</text>
<text x="844" y="1005" font-size="12" fill="#344054">(1)含义：无法律上之原因而受利益，致他人受损害者，应返还其利益给受损害人</text>
<text x="844" y="1022" font-size="12" fill="#344054">  （本质是天大的天掉馅饼，无缘无故获得财产利益）</text>
<text x="844" y="1039" font-size="12" fill="#344054">(2)构成要件：①没有法定或约定的原因</text>
<text x="844" y="1056" font-size="12" fill="#344054">  ②一方获益：A. 为履行道德义务进行的给付→不构成不当得利</text>
<text x="844" y="1073" font-size="12" fill="#344054">    B. 明知无给付义务而进行的债务清偿（明知的债务清偿）→仍构成不当得利</text>
<text x="844" y="1090" font-size="12" fill="#344054">    ⚠️ 误认的非债清偿→仍构成不当得利</text>
<text x="844" y="1107" font-size="12" fill="#344054">  ③一方获益必须财产权益的增加而不包括人身权益和精神权益</text>
<text x="844" y="1124" font-size="12" fill="#344054">  ④一方受损：A. 提前清偿未到期债务及利息不构成不当得利</text>
<text x="844" y="1141" font-size="12" fill="#344054">    B. 自然之债的自愿履行不构成不当得利</text>
<text x="844" y="1158" font-size="12" fill="#344054">    C. 强迫得利，不构成不当得利（强迫擦车、擦皮鞋）</text>
<text x="844" y="1175" font-size="12" fill="#344054">  ⑤获益与受损之间存在直接因果关系</text>
<text x="844" y="1192" font-size="12" fill="#344054">(3)法律效力：①返还原物和孳息（包括自然孳息和法定孳息）为原则</text>
<text x="844" y="1209" font-size="12" fill="#344054">  ②善意得利人，负有返还现存利益的义务（现存利益不存在的，无需返还【986条】）</text>
<text x="844" y="1226" font-size="12" fill="#344054">  ③恶意得利人，负有返还&quot;所受利益&quot;的义务，所受利益不存在的，依法赔偿损失【987条】</text>
<text x="844" y="1243" font-size="12" fill="#344054">  ④恶意得利人，已经将取得的利益无偿转让给第三人的，</text>
<text x="844" y="1260" font-size="12" fill="#344054">    受损失的人可以直接请求第三人在相应范围内承担返还义务【988条】</text>
<text x="844" y="1277" font-size="12" fill="#344054">(4)诉讼时效：从当事人一方知道或应当知道不当得利事实及对方当事人之日起计算</text>
<rect x="436" y="1654.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1676.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲37 债的学理分类</text>
<text x="448" y="1696.0" font-size="12" fill="#344054">来源 p043-p044</text>
<rect x="832" y="1300" width="300" height="408" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1322" font-size="14.5" font-weight="600" fill="#B83A4A">按主体多少（2次）</text>
<text x="844" y="1342" font-size="12" fill="#344054">(1)单一之债：债权人和债务人均为一人的债</text>
<text x="844" y="1359" font-size="12" fill="#344054">(2)多数人之债：</text>
<text x="844" y="1376" font-size="12" fill="#344054">  ①按份之债：①含义=指数个债权人或数个债务人按照一定的份额享有债权或负担债务（标的物可分）</text>
<text x="844" y="1393" font-size="12" fill="#344054">    ②内部效力：债的一般形态，可约定可法定，份额难以确定的，视份额相同</text>
<text x="844" y="1410" font-size="12" fill="#344054">    ③外部效力：A. 按份债权人只能按照自己享有的债权份额请求债务人清偿，无权请求债务人向自己履行全部债务的清偿</text>
<text x="844" y="1427" font-size="12" fill="#344054">      B. 按份债务人仅自己所负担的债务份额向债权人履行债务，对其他债务人所应负担的债务份额，不承担义务</text>
<text x="844" y="1444" font-size="12" fill="#344054">      C. 按份之债的本质系对外按份，有约从约，无内部追偿问题</text>
<text x="844" y="1461" font-size="12" fill="#344054">  ②连带之债（2次）：</text>
<text x="844" y="1478" font-size="12" fill="#344054">    A. 含义：①债权人为二人以上，部分或全部债权均可以请求债务人履行债务的，为连带债权</text>
<text x="844" y="1495" font-size="12" fill="#344054">      ②债务人为二人以上，债权人可以请求部分或全部债务人履行全部债务的，为连带债务</text>
<text x="844" y="1512" font-size="12" fill="#344054">      ③连带债权或连带债务，由法律规定或当事人的约定</text>
<text x="844" y="1529" font-size="12" fill="#344054">    B. 内部关系：①连带债务人之间的份额难以确定的，视为份额相同</text>
<text x="844" y="1546" font-size="12" fill="#344054">      ②实际承担债务超过自己份额的连带债务人，有权就超出部分在其他连带债务人未履行的份额范围内向其追偿，</text>
<text x="844" y="1563" font-size="12" fill="#344054">        并相应地享有债权人的权利，但不得损害债权人的利益</text>
<text x="844" y="1580" font-size="12" fill="#344054">      ③其他连带债务人对债权人抗辩，可以向该债务人主张</text>
<text x="844" y="1597" font-size="12" fill="#344054">    C. 履行规则：</text>
<text x="844" y="1614" font-size="12" fill="#344054">      ①部分连带债务人履行/抵销债务或提存标的物的，其他债务人对债权人的债务在相应范围内消灭；该债务人可以根据规定向其他债务人追偿</text>
<text x="844" y="1631" font-size="12" fill="#344054">      ②部分连带债务人的债务与债权人的债权归于一人时，在扣除该债务人应当承担的份额后，债权人对其他债务人的债权继续存在</text>
<text x="844" y="1648" font-size="12" fill="#344054">      ③部分连带债务人对债权人享有抵销权或撤销权的，其他连带债务人对债权人的债务在相应范围内消灭</text>
<text x="844" y="1665" font-size="12" fill="#344054">    D. 行权原则：①债权人对部分连带债务人的给付受领迟延的，对其他连带债务人发生效力</text>
<text x="844" y="1682" font-size="12" fill="#344054">      ②连带债权之间的份额难以确定的，视为份额相同。实际受领超过自己份额的连带债权人，应当按比例向其他连带债务人返还</text>
<text x="844" y="1699" font-size="12" fill="#344054">      ③连带债权参照适用连带债务的有关约定，但是，部分连带债权人免除债务人债务的，在扣除该连带债权人的份额后，不影响其他连带债权人向债务人的债权</text>
<rect x="832" y="1722" width="300" height="153" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1744" font-size="14.5" font-weight="600" fill="#B83A4A">按标的物（1次）</text>
<text x="844" y="1764" font-size="12" fill="#344054">(1)财物之债：①特定之债=财物本身不具有可替代性，在交付前财物灭失的，可以免除继续履行的义务</text>
<text x="844" y="1781" font-size="12" fill="#344054">  （关键词&quot;自己的&quot;，盖菜价值27500元的欧米伽手表）</text>
<text x="844" y="1798" font-size="12" fill="#344054">  ②种类之债=财物本身具有可替代性，在交付前财物灭失的，不免除继续履行的义务</text>
<text x="844" y="1815" font-size="12" fill="#344054">  （在日常生活中，大部分财物之债均属于种类之债，在市场上均可寻找到替代物）</text>
<text x="844" y="1832" font-size="12" fill="#344054">(2)劳务之债：①含义=劳务之债，有体无标的物，一般不能由他人代替履行，不得强制履行</text>
<text x="844" y="1849" font-size="12" fill="#344054">  ②典型之债=演出合同/绘画合同/授课合同</text>
<text x="844" y="1866" font-size="12" fill="#344054">(3)货币之债：对于货币之债，不存在履行不能的问题（金钱之债不灭矢），如到期不能还款，权利人可以请求继续履行</text>
<rect x="832" y="1889" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1911" font-size="14.5" font-weight="600" fill="#B83A4A">按标的有无选择（1次）</text>
<text x="844" y="1931" font-size="12" fill="#344054">(1)简单之债：债的履行标的只有一种，当事人只能按照该种标的履行的债</text>
<text x="844" y="1948" font-size="12" fill="#344054">(2)选择之债：①含义=债的履行标的有数种，当事人可以从中选择其一履行的债</text>
<text x="844" y="1965" font-size="12" fill="#344054">  ②履行规则：①债务标的有数项而债务人只需履行其中一项的，债务人享有选择权（简单形成权）</text>
<text x="844" y="1982" font-size="12" fill="#344054">    但是，法律另有规定、当事人另有约定或者交易习惯的除外</text>
<text x="844" y="1999" font-size="12" fill="#344054">    ②享有选择权的当事人在约定期限内或履行期限届满未作选择的，经催告后在合理期限内仍未选择的，选择权转移至对方</text>
<text x="844" y="2016" font-size="12" fill="#344054">    ③当事人行使选择权应当及时通知（简单形成权）对方，对方对当事人主张的债的标的明知或者应当知道</text>
<text x="844" y="2033" font-size="12" fill="#344054">    ④确定的债务标的不得变更，但是经对方同意的除外</text>
<text x="844" y="2050" font-size="12" fill="#344054">    ⑤可选择的债务标的之中发生不能履行情形的，享有选择权的当事人不得选择不能履行的情形，但是该不能履行的情形是由对方造成的除外</text>
<rect x="436" y="2301.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="2323.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲38 合同基本原理</text>
<text x="448" y="2343.0" font-size="12" fill="#344054">来源 p045</text>
<rect x="832" y="2073" width="300" height="85" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2095" font-size="14.5" font-weight="600" fill="#6F3A91">适用范围</text>
<text x="844" y="2115" font-size="12" fill="#344054">(1)适用：财产关系（例如买卖合同）【民法典·合同编通则及典型合同】</text>
<text x="844" y="2132" font-size="12" fill="#344054">(2)不适用：身份关系（婚姻关系/收养关系）【民法典·婚姻家庭编】</text>
<text x="844" y="2149" font-size="12" fill="#344054">  监护关系（临时委托监护协议）【民法典·总则编】</text>
<rect x="832" y="2172" width="300" height="408" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2194" font-size="14.5" font-weight="600" fill="#6F3A91">8种分类</text>
<text x="844" y="2214" font-size="12" fill="#344054">1.单务合同/双务合同：①单务合同=仅一方负担债务，对方不负负担债务的合同（典型：赠与合同）</text>
<text x="844" y="2231" font-size="12" fill="#344054">  ②双务合同=指双方互负债务的合同（买卖合同）</text>
<text x="844" y="2248" font-size="12" fill="#344054">2.有名合同/无名合同：①有名合同=典型合同【民法典·合同编第二分编规定的19类合同以及其他民商事单行法律规定的有名合同（旅游合同/保险合同/劳动合同等）】</text>
<text x="844" y="2265" font-size="12" fill="#344054">  ②无名合同=非典型合同，法律上尚未确定一定的名称和具体规则的合同</text>
<text x="844" y="2282" font-size="12" fill="#344054">    适用合同编通则的规定，并可以参照适用（类推适用）合同编分则或者其他法律最相类似合同的规定，即类推适用【民法典第467条】</text>
<text x="844" y="2299" font-size="12" fill="#344054">3.有偿合同/无偿合同（5次）：①有偿合同=双方互为给付而取得对待价的合同（典型如买卖合同）</text>
<text x="844" y="2316" font-size="12" fill="#344054">  ②无偿合同=一方只为给付而无对价的合同：①无综合同=赠与合同/担保合同/借用合同</text>
<text x="844" y="2333" font-size="12" fill="#344054">    ②可有偿可无偿=委托合同/保管合同/自然人之间的借款合同</text>
<text x="844" y="2350" font-size="12" fill="#344054">4.诺成合同/实践合同：①诺成合同=不要物合同，当事人意思表示一致即告成立的合同</text>
<text x="844" y="2367" font-size="12" fill="#344054">  （区别于实践合同=诺成合同；动产质押合同/赠与合同）</text>
<text x="844" y="2384" font-size="12" fill="#344054">  ②实践合同=指除当事人意思表示一致外，还需以物的交付为成立要件的合同（典型：定金合同/自然人的借款合同/保管合同/借用合同）</text>
<text x="844" y="2401" font-size="12" fill="#344054">5.要式合同/不要式合同：①要式合同=法律要求必须具备一定形式的合同（典型合同：抵押合同/质押合同/保证合同/定金合同）</text>
<text x="844" y="2418" font-size="12" fill="#344054">  ②不要式合同=法律不要求必须具备一定形式的合同（典型：买卖合同）</text>
<text x="844" y="2435" font-size="12" fill="#344054">6.本合同/预约合同（2次）【民法典第495条、民法典合同编通则解释第6-8条】</text>
<text x="844" y="2452" font-size="12" fill="#344054">  ①本合同=为履行预约而订立的合同</text>
<text x="844" y="2469" font-size="12" fill="#344054">  ②预约合同：①约定将来订立本约/为担保将来订立本约的合同</text>
<text x="844" y="2486" font-size="12" fill="#344054">    ②当事人一方不履行预约合同约定的订立合同义务的，对方可以请求其承担预约合同的违约责任</text>
<text x="844" y="2503" font-size="12" fill="#344054">    ③预约合同不履行时，不可要求违约方继续履行本约合同以订立本约</text>
<text x="844" y="2520" font-size="12" fill="#344054">7.射幸合同/确定合同：①射幸合同=给付的内容和范围在合同成立时尚不确定，其确定取决于合同成立后是否发生偶然事件（典型：保险合同/彩票合同/抽奖式有奖销售合同）</text>
<text x="844" y="2537" font-size="12" fill="#344054">  ②确定合同=给付的内容和范围在合同成立时已经确定</text>
<text x="844" y="2554" font-size="12" fill="#344054">8.一时合同/继续合同：①一时合同=时间因素对给付的内容和范围无影响，合同目的因一次性给付即可实现的合同（典型：买卖合同）</text>
<text x="844" y="2571" font-size="12" fill="#344054">  ②继续合同=给付的内容和范围因时间的延续而有变化，使得合同目的须持续的给付才能实现的合同（典型：借用合同/供电、水、气、热力合同/租赁合同/仓储合同/雇佣合同/物业服务合同）</text>
<rect x="436" y="2856.0" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="2878.0" font-size="14.5" font-weight="600" fill="#0F7E80">讲39 缔约过失责任</text>
<text x="448" y="2898.0" font-size="12" fill="#344054">来源 p046</text>
<rect x="832" y="2594" width="300" height="170" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2616" font-size="14.5" font-weight="600" fill="#0F7E80">基本原理</text>
<text x="844" y="2636" font-size="12" fill="#344054">1.含义：（法定之债）是指在缔约过程中，一方违反诚信原则导致对方信赖利益的损失，依法应当承担赔偿责任</text>
<text x="844" y="2653" font-size="12" fill="#344054">2.归责原则：典型的过错责任</text>
<text x="844" y="2670" font-size="12" fill="#344054">3.构成要件（7次）：①行为发生在缔约过程中（关键词：商谈、谈判、洽谈、接洽等）</text>
<text x="844" y="2687" font-size="12" fill="#344054">  ②一方违反基于诚信原则的先合同义务</text>
<text x="844" y="2704" font-size="12" fill="#344054">  ③导致对方信赖利益的损失：①订约费用（邮电费用、赴订约地或查看合同标的所支出的费用）</text>
<text x="844" y="2721" font-size="12" fill="#344054">    ②准备履行所需费用（为运送标的物或受领对方给付所支出的费用）</text>
<text x="844" y="2738" font-size="12" fill="#344054">    ③订约机会（另行订立合同所产生的差价损失）</text>
<text x="844" y="2755" font-size="12" fill="#344054">  ④一方违反先合同义务与他方所受损失之间存在因果关系</text>
<rect x="832" y="2778" width="300" height="391" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2800" font-size="14.5" font-weight="600" fill="#0F7E80">类型</text>
<text x="844" y="2820" font-size="12" fill="#344054">1.合同未成立型：①假借订立合同，恶意进行磋商（恶意磋商）</text>
<text x="844" y="2837" font-size="12" fill="#344054">  ②故意隐瞒与订立合同有关的重要事实或提供虚假情况（欺诈）</text>
<text x="844" y="2854" font-size="12" fill="#344054">  ③泄露或不正当使用对方商业秘密或其他应当保密的信息（侵犯商业秘密或保密信息）</text>
<text x="844" y="2871" font-size="12" fill="#344054">2.合同成立型：</text>
<text x="844" y="2888" font-size="12" fill="#344054">  (1)合同被撤销：自始无效，只能请求对方承担缔约过失责任，而不能请求承担违约责任</text>
<text x="844" y="2905" font-size="12" fill="#344054">  (2)合同被宣告无效（担保合同）：同上</text>
<text x="844" y="2922" font-size="12" fill="#344054">  (3)恶意串通型：</text>
<text x="844" y="2939" font-size="12" fill="#344054">    ①不办批准范围【《九民纪要》第37-40条、《民法典》第502条第2款、《民法典合同编通则解释》第12条】：</text>
<text x="844" y="2956" font-size="12" fill="#344054">      A. 以划拨方式取得的土地使用权转让（《城市房地产管理法》第40条）</text>
<text x="844" y="2973" font-size="12" fill="#344054">      B. 金融企业超过法定比例（5%以上）的股权转让（《商业银行法》第28条）</text>
<text x="844" y="2990" font-size="12" fill="#344054">      C. 外商投资企业股权转让（《外商投资企业纠纷案件规定（一）》第5条）</text>
<text x="844" y="3007" font-size="12" fill="#344054">      D. 国有股权转让（《企业国有资产监督管理暂行条例》第23条）</text>
<text x="844" y="3024" font-size="12" fill="#344054">    ②合同效力：未经批准的合同成立有效但未生效（生效条件的合同）</text>
<text x="844" y="3041" font-size="12" fill="#344054">    ③处理：报批义务及相关条款独立生效规则：</text>
<text x="844" y="3058" font-size="12" fill="#344054">      A. 恶意不办理批准或登记手续的，报批方义务条款独立生效，追究违约责任</text>
<text x="844" y="3075" font-size="12" fill="#344054">      B. 非报批义务条款未生效，追究缔约过失责任</text>
<text x="844" y="3092" font-size="12" fill="#344054">3.第三人型：①第三人实施欺诈、胁迫行为的，使当事人在违背真实意思的情况下订立合同</text>
<text x="844" y="3109" font-size="12" fill="#344054">    （合同相对人知道或应当知道的，合同可撤销）</text>
<text x="844" y="3126" font-size="12" fill="#344054">    当事人有理由信赖原则的行为的（混合过错），应承担相应的责任，</text>
<text x="844" y="3143" font-size="12" fill="#344054">    但是，司法解释对当事人和第三人的民事责任另有规定的，依照其规定</text>
<text x="844" y="3160" font-size="12" fill="#344054">    【《民法典合同编通则解释》第5条】</text>
</svg>`,

<rect x="40" y="832.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="854.5" font-size="14.5" font-weight="600" fill="#185FA5">8-14 · 民法 讲40~42</text>
<text x="52" y="874.5" font-size="12" fill="#344054">合同订立02 + 合同成立 + 合同履行01</text>
<text x="52" y="891.5" font-size="12" fill="#344054">p047-p049</text>
<rect x="436" y="314.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="336.5" font-size="14.5" font-weight="600" fill="#854F0B">讲40 合同的订立(01)-承诺</text>
<text x="448" y="356.5" font-size="12" fill="#344054">来源 p047</text>
<rect x="832" y="20" width="300" height="323" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">2.承诺（1次）</text>
<text x="844" y="62" font-size="12" fill="#344054">(1)承诺方式：①明示（口头对话=自要约人了解承诺内容生效；书面通知=到达要约人时承诺生效）</text>
<text x="844" y="79" font-size="12" fill="#344054">  ②默示：①根据交易习惯或要约的要求不需要通知的，受要约人可以作出特定行为来表示承诺，</text>
<text x="844" y="96" font-size="12" fill="#344054">    A. 原则上不产生法律效果</text>
<text x="844" y="113" font-size="12" fill="#344054">    B. 例外：法律规定/当事人约定/交易习惯；⚠️ 缔约当事人就主要事项以沉默方式作出的，</text>
<text x="844" y="130" font-size="12" fill="#344054">      承诺期间届满，受要约人未作出任何表示的，视为未作出承诺</text>
<text x="844" y="147" font-size="12" fill="#344054">  (2)承诺期限：①要约明确了承诺期限的，依照该期限</text>
<text x="844" y="164" font-size="12" fill="#344054">    ②要约未明确承诺期限的，要约以对话方式作出的，应当即时作出承诺</text>
<text x="844" y="181" font-size="12" fill="#344054">      要约以非对话方式作出的，承诺应当在合理期限内到达</text>
<text x="844" y="198" font-size="12" fill="#344054">  ③承诺迟延：①超过承诺期限发出承诺（受要约人本能控制的原因）：</text>
<text x="844" y="215" font-size="12" fill="#344054">      A. 承诺不生效，合同不成立（反要约）</text>
<text x="844" y="232" font-size="12" fill="#344054">      B. 例外：受要约人及时通知受要约人该承诺有效（权利）</text>
<text x="844" y="249" font-size="12" fill="#344054">    ②承诺人在承诺期限内发出承诺，按照通常情形能够及时到达要约人，</text>
<text x="844" y="266" font-size="12" fill="#344054">      但是因其他原因（受要约人本能控制的原因）承诺到达要约人时超过承诺期限：</text>
<text x="844" y="283" font-size="12" fill="#344054">      A. 承诺有效，合同成立</text>
<text x="844" y="300" font-size="12" fill="#344054">      B. 例外：要约人及时通知受要约人因承诺超期限不接受该承诺（权利）</text>
<text x="844" y="317" font-size="12" fill="#344054">  (3)承诺撤回：撤回的通知先于承诺或与承诺同时到达要约人</text>
<text x="844" y="334" font-size="12" fill="#344054">  (4)承诺撤销：承诺一经到达要约人，合同即成立，无法撤销</text>
<rect x="832" y="357" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="379" font-size="14.5" font-weight="600" fill="#854F0B">合同订立的时间（1次）</text>
<text x="844" y="399" font-size="12" fill="#344054">1.成立时间：①要式合同=当事人采用书面形式订立合同的，自当事人均签字、盖章或按指印时合同成立</text>
<text x="844" y="416" font-size="12" fill="#344054">  ②实践合同=自当事人交付标的物时，合同成立</text>
<text x="844" y="433" font-size="12" fill="#344054">  ③非要式非要物合同=自承诺到达时合同成立</text>
<text x="844" y="450" font-size="12" fill="#344054">2.成立地点：①承诺生效的地点为合同成立的地点</text>
<text x="844" y="467" font-size="12" fill="#344054">  ②采用数据电文形式订立合同的：①收件人的主营业地为合同成立的地点；②没有主营业地的，其住所地为合同成立的地点</text>
<text x="844" y="484" font-size="12" fill="#344054">  ③采用合同书形式订立合同的，最后签字、盖章或按指印的地点，为合同成立的地点（合同另有约定的除外）</text>
<rect x="832" y="507" width="300" height="153" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="529" font-size="14.5" font-weight="600" fill="#854F0B">合同的内容（1次）</text>
<text x="844" y="549" font-size="12" fill="#344054">1.必备条款：当事人名称或姓名、标的和数量【民法典合同编通则解释第3条】</text>
<text x="844" y="566" font-size="12" fill="#344054">2.主要条款：①当事人的姓名或名称和住所；②标的；③数量；④质量；⑤价款或报酬；⑥履行期限、地点和方式；⑦违约责任；⑧解决争议的方法。当事人可以参照各类合同的示范文本订立合同【民法典第470条】</text>
<text x="844" y="583" font-size="12" fill="#344054">3.争议解决条款：①含义=合同当事人事先就合同争议的方式、程序和法律适用等事项安排的约定</text>
<text x="844" y="600" font-size="12" fill="#344054">  ②分类：①仲裁条款（包括以仲裁方式解决纠纷的选择和对仲裁机构的选择）</text>
<text x="844" y="617" font-size="12" fill="#344054">    ②选择受诉法院条款（协议管辖条款）</text>
<text x="844" y="634" font-size="12" fill="#344054">    ③法律适用条款</text>
<text x="844" y="651" font-size="12" fill="#344054">  ③效力：合同无效、无效、被撤销或终止的，不影响合同中有关解决争议方法的条款的效力</text>
<rect x="436" y="924.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="946.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲41 合同的订立(02)-格式条款</text>
<text x="448" y="966.5" font-size="12" fill="#344054">来源 p048</text>
<rect x="832" y="674" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="696" font-size="14.5" font-weight="600" fill="#B83A4A">4.格式条款（3次）【民法典第497-498条、民法典合同编通则解释第9-10条】</text>
<text x="844" y="716" font-size="12" fill="#344054">(1)含义：当事人为了重复使用预先拟定，并在订立合同时未与对方协商的条款</text>
<text x="844" y="733" font-size="12" fill="#344054">  ①重复使用：①从事经营活动的当事人一方仅以未实际使用预先拟定且未与对方协商的合同条款不是格式条款的，法院不予支持</text>
<text x="844" y="750" font-size="12" fill="#344054">    ②有证据证明该条款不是为了重复使用而预先拟定的除外</text>
<text x="844" y="767" font-size="12" fill="#344054">  ②预先拟定：当事人以合同示范文本或行业协会推荐的合同文本作为格式条款的，法院不予支持</text>
<text x="844" y="784" font-size="12" fill="#344054">  ③明确的定排除：当事人仅以双方已经明确的定合同条款不属于格式条款为由主张该条款不是格式条款的，法院不予支持</text>
<rect x="832" y="807" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="829" font-size="14.5" font-weight="600" fill="#B83A4A">(2)提供方义务（3次）</text>
<text x="844" y="849" font-size="12" fill="#344054">内容：</text>
<text x="844" y="866" font-size="12" fill="#344054">  对象（主动规劝提示义务）：免除或减轻其责任/排除限制对方权利等条款/与对方有重大利害关系的异常条款/内容及其法律后果的专业术语通常理解易的词句</text>
<text x="844" y="883" font-size="12" fill="#344054">  方式（明示）：文字、符号、字体等明显标识</text>
<text x="844" y="900" font-size="12" fill="#344054">  程度：实务中，提供格式条款的一方在合同文本中异常条款位置以凸显手注解释条款的内容、符号，且相关条款常置于合同所在主文显著位置，也未达到通常标准的程度。法院不予支持</text>
<text x="844" y="917" font-size="12" fill="#344054">    通常标准：否则将导致对方特别危险程度的合同要素为目的的真实意思表示</text>
<text x="844" y="934" font-size="12" fill="#344054">  说明义务：</text>
<text x="844" y="951" font-size="12" fill="#344054">  ①提供格式条款的一方已经尽到提示义务或说明义务承担举证责任</text>
<text x="844" y="968" font-size="12" fill="#344054">  ②对于通过互联网等信息网络订立的电子合同，提供格式条款的一方可以采取设置勾选、弹窗等方式为由主张其已经履行提示义务或说明义务的，不予支持，但是举证可以提示或说明并设定特别费用的除外</text>
<rect x="832" y="991" width="300" height="102" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1013" font-size="14.5" font-weight="600" fill="#B83A4A">(3)无效情形</text>
<text x="844" y="1033" font-size="12" fill="#344054">①预先免除造成对方人身损害的</text>
<text x="844" y="1050" font-size="12" fill="#344054">②预先免除因故意或重大过失造成对方财产损失的责任</text>
<text x="844" y="1067" font-size="12" fill="#344054">③提供格式条款的一方不合理地免除或减轻其责任、加重对方责任、限制对方依法享有的权利</text>
<text x="844" y="1084" font-size="12" fill="#344054">④提供格式条款一方排除对方主要权利（法律规定、交易习惯或合同性质应享有的权利）</text>
<rect x="832" y="1107" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1129" font-size="14.5" font-weight="600" fill="#B83A4A">(4)解释</text>
<text x="844" y="1149" font-size="12" fill="#344054">①第一步：非格式条款优先规则</text>
<text x="844" y="1166" font-size="12" fill="#344054">  在非格式条款有效的情况下，应当优先适用非格式条款规定确定双方的权利和义务</text>
<text x="844" y="1183" font-size="12" fill="#344054">②第二步：如果按照通常理解只有唯一的解释，那么这就是格式条款的通常解释规则，没有必要也不应当再适用不利解释规则进行解释</text>
<text x="844" y="1200" font-size="12" fill="#344054">③第三步：不利解释规则</text>
<text x="844" y="1217" font-size="12" fill="#344054">  对格式条款有两种以上解释的，应当作出不利于提供格式条款一方的解释</text>
<rect x="436" y="1451.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1473.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲42 合同（债）的履行(01)</text>
<text x="448" y="1493.0" font-size="12" fill="#344054">来源 p049</text>
<rect x="832" y="1240" width="300" height="187" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1262" font-size="14.5" font-weight="600" fill="#6F3A91">电子合同的履行</text>
<text x="844" y="1282" font-size="12" fill="#344054">1.含义：通过互联网订立的合同</text>
<text x="844" y="1299" font-size="12" fill="#344054">2.成立时间：当事人一方通过互联网等信息网络发布的商品或服务信息符合要约条件的，对方选择该商品或服务并提交订单成功时合同成立，但是当事人另有约定的除外</text>
<text x="844" y="1316" font-size="12" fill="#344054">3.形式：书面形式（以电子数据交换、电子邮件等方式能够有形地表现所载内容，并可以随时调取查用的数据电文，视为书面形式）</text>
<text x="844" y="1333" font-size="12" fill="#344054">4.履行：</text>
<text x="844" y="1350" font-size="12" fill="#344054">  (1)原则：有约从约</text>
<text x="844" y="1367" font-size="12" fill="#344054">  (2)例外：①商品：收货人的签收时间为交付时间</text>
<text x="844" y="1384" font-size="12" fill="#344054">    ②服务：①生成的电子凭证或实物凭证中载明的时间为交付时间</text>
<text x="844" y="1401" font-size="12" fill="#344054">      ②前述凭证没有载明履行时间或载明时间与实际提供服务时间不一致的，实际提供服务的时间为交付时间</text>
<text x="844" y="1418" font-size="12" fill="#344054">      ③在线传输：合同标的物进入对方当事人指定的特定系统且能够检索识别的时间为交付时间</text>
<rect x="832" y="1441" width="300" height="272" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1463" font-size="14.5" font-weight="600" fill="#6F3A91">涉他合同的履行(1)·向第三人履行的合同（6次）</text>
<text x="844" y="1483" font-size="12" fill="#344054">1.含义：合同当事人在合同中为第三人设定了权利或约定了义务的，涉他合同广泛适用于保险业、运输业和金融业等行业中【民法典第522、523条】</text>
<text x="844" y="1500" font-size="12" fill="#344054">(1)含义：当事人约定由债务人向第三人履行债务，以及法律规定或当事人约定第三人可以直接请求债务人向其履行债务的合同</text>
<text x="844" y="1517" font-size="12" fill="#344054">(2)类型【民法典第522条】：</text>
<text x="844" y="1534" font-size="12" fill="#344054">  ①不真正利他合同：①第三人不等于受领辅助人</text>
<text x="844" y="1551" font-size="12" fill="#344054">    受领辅助人是由债权人指定的代其接受领受的人，</text>
<text x="844" y="1568" font-size="12" fill="#344054">    而此处的第三人则由双方当事人在合同中约定</text>
<text x="844" y="1585" font-size="12" fill="#344054">    ②第三人不享有合同中的请求权，只能单纯接受债务人的给付，而不能直接请求债务人进行给付</text>
<text x="844" y="1602" font-size="12" fill="#344054">    ③如果债务人不履行债务或履行债务不适当的，第三人不能向债务人主张违约责任，</text>
<text x="844" y="1619" font-size="12" fill="#344054">    但能够主张违约责任的主体仍然是合同的不同当事人</text>
<text x="844" y="1636" font-size="12" fill="#344054">  ②真正利他合同：①法律规定或当事人约定第三人可以直接请求债务人向其履行债务，</text>
<text x="844" y="1653" font-size="12" fill="#344054">    第三人未在合理期限内明确拒绝（第三人享有拒绝权），债务人未向第三人履行债务或履行债务不适当的，</text>
<text x="844" y="1670" font-size="12" fill="#344054">    第三人可以请求债务人承担违约责任和违约责任请求权</text>
<text x="844" y="1687" font-size="12" fill="#344054">    ②债务人对债权人的抗辩，可以向第三人主张（基于债的同一性原理，抗辩权的延伸）</text>
<text x="844" y="1704" font-size="12" fill="#344054">(3)总结表：不真正利他合同第三人 vs 真正利他合同第三人（项目：法律依据/履行/给付受领权/拒绝受领权/独立的履行请求权/独立的违约责任请求权/合同相对性/第三人是否为合同当事人/债务人的抗辩/撤销权（形成权）/解除权（形成权））</text>

<rect x="40" y="995.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1017.5" font-size="14.5" font-weight="600" fill="#185FA5">8-15 · 民法 讲43~45</text>
<text x="52" y="1037.5" font-size="12" fill="#344054">履行02 + 保全01 + 保全02</text>
<text x="52" y="1054.5" font-size="12" fill="#344054">p050-p054</text>
<rect x="436" y="389.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="411.5" font-size="14.5" font-weight="600" fill="#854F0B">讲43 合同履行(02)·涉他合同</text>
<text x="448" y="431.5" font-size="12" fill="#344054">来源 p050-p051</text>
<rect x="832" y="20" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">1.向第三人履行的合同(4)·特殊情况</text>
<text x="844" y="62" font-size="12" fill="#344054">①离婚协议约定将部分或全部夫妻共同财产给予子女，离婚后，一方在财产权利转移之前请求撤销该约定的，法院不予支持，但另一方同意的除外</text>
<text x="844" y="79" font-size="12" fill="#344054">②双方在离婚协议中明确约定子女可继承本某第一顺序法定继承权直接主张权利</text>
<text x="844" y="96" font-size="12" fill="#344054">  （第三人独立的履行请求权和违约责任请求权）</text>
<text x="844" y="113" font-size="12" fill="#344054">  一方不履行离婚协议约定的义务，子女请求参照适用《民法典》第522条第2款规定的，由该方承担继续履行或因无法履行而赔偿损失等违约责任，法院依法予以支持</text>
<text x="844" y="130" font-size="12" fill="#344054">③离婚协议约定将部分或全部夫妻共同财产给予子女，离婚后，一方有证据证明签订离婚协议时存在欺诈、胁迫等情形，请求撤销该约定的，法院依法予以支持</text>
<text x="844" y="147" font-size="12" fill="#344054">  当事人同时请求多分或共同财产的，法院依照《民法典婚姻家庭编解释（一）》第20条处理</text>
<rect x="832" y="170" width="300" height="119" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="192" font-size="14.5" font-weight="600" fill="#854F0B">2.由第三人履行的合同(2)</text>
<text x="844" y="212" font-size="12" fill="#344054">(1)含义：合同当事人约定，在不变更合同当事人的情况下，合同中的义务由第三人履行</text>
<text x="844" y="229" font-size="12" fill="#344054">  ⚠️ 减交易环节，提高交易效率（连环买卖合同）</text>
<text x="844" y="246" font-size="12" fill="#344054">(2)基本规则：①由合同当事人约定，且得到第三人的同意</text>
<text x="844" y="263" font-size="12" fill="#344054">  ②第三人不是合同当事人，不受合同约束（享有履行与否的自由）</text>
<text x="844" y="280" font-size="12" fill="#344054">  ③债权人对第三人不享有独立的履行请求权和独立的违约责任请求权</text>
<rect x="832" y="303" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="325" font-size="14.5" font-weight="600" fill="#854F0B">3.涉他合同+指示交付</text>
<text x="844" y="345" font-size="12" fill="#344054">动产标的物的所有人和占有人是否发生了分离</text>
<text x="844" y="362" font-size="12" fill="#344054">  (1)未发生分离→属于涉他合同（债权效力）</text>
<text x="844" y="379" font-size="12" fill="#344054">  (2)发生了分离→属于指示交付（物权效力）</text>
<rect x="832" y="402" width="300" height="408" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="424" font-size="14.5" font-weight="600" fill="#854F0B">第三人代为履行(2)·基本体系</text>
<text x="844" y="444" font-size="12" fill="#344054">1.含义：第三人在无合同约定的情况下自愿代债务人履行合同义务</text>
<text x="844" y="461" font-size="12" fill="#344054">  ⚠️ 本质：无约定+主动履行+法律利益+原则上法定义务承担（追偿权）</text>
<text x="844" y="478" font-size="12" fill="#344054">2.构成要件：</text>
<text x="844" y="495" font-size="12" fill="#344054">  (1)合同未约定第三人具有履行义务</text>
<text x="844" y="512" font-size="12" fill="#344054">  (2)债务人履行义务：①债务人已明确拒绝履行债务的意思表示</text>
<text x="844" y="529" font-size="12" fill="#344054">    ②债务人虽未明确表示拒绝，但在约定的债务履行期限内未实际履行</text>
<text x="844" y="546" font-size="12" fill="#344054">    ③债务人明确丧失履行能力，如经营状况严重恶化等</text>
<text x="844" y="563" font-size="12" fill="#344054">    ④债务人亲自履行或委托他人履行已不具有可能性</text>
<text x="844" y="580" font-size="12" fill="#344054">  (3)第三人对履行该债务具有合法利益：①转租中次承租人代支付租金，以免自身承担的侵权责任遭受损害【719条】</text>
<text x="844" y="597" font-size="12" fill="#344054">    ②母公司为子公司代偿还债务</text>
<text x="844" y="614" font-size="12" fill="#344054">    ③在抵押权人与抵押人的约定转让抵押物并办登手续时，抵押权人应当受让抵押物，从而消灭抵押权，</text>
<text x="844" y="631" font-size="12" fill="#344054">      进而取得抵押物的所有权【担保制度解释第43条】</text>
<text x="844" y="648" font-size="12" fill="#344054">  (4)根据债务性质、合同约定或法律规定，未明为第三人代为履行排除在外（清偿的情形）：①专属债务（表演/授课/创作合同等）</text>
<text x="844" y="665" font-size="12" fill="#344054">    ②当事人约定（承揽合同）</text>
<text x="844" y="682" font-size="12" fill="#344054">    ③法律规定（建设工程施工合同）</text>
<text x="844" y="699" font-size="12" fill="#344054">3.法律效力：</text>
<text x="844" y="716" font-size="12" fill="#344054">  (1)对内效力：①第三人代为履行后，债务人对债权人所负债务应作相应扣减</text>
<text x="844" y="733" font-size="12" fill="#344054">    ②第三人不因其代为履行而成为合同当事人</text>
<text x="844" y="750" font-size="12" fill="#344054">    ③第三人瑕疵履行产生的违约责任由债权人直接向债务人主张，第三人对债权人不承担瑕疵担保责任（违约责任）</text>
<text x="844" y="767" font-size="12" fill="#344054">  (2)对外效力：①第三人代为履行后，债权人对债务人的相应债权转让给第三人，但债务人和第三人有约定的除外，</text>
<text x="844" y="784" font-size="12" fill="#344054">    第三人代为履行后无需通知债务人即自然取得该债权</text>
<text x="844" y="801" font-size="12" fill="#344054">    ②债权人对原债务人的抗辩可以向新的债权人即第三人主张</text>
<rect x="436" y="1018.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1040.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲44 合同保全(01)·抗辩权+情势变更</text>
<text x="448" y="1060.0" font-size="12" fill="#344054">来源 p052</text>
<rect x="832" y="824" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="846" font-size="14.5" font-weight="600" fill="#B83A4A">双务合同履行抗辩权(4次)</text>
<text x="844" y="866" font-size="12" fill="#344054">1.履行没有顺序（一手交钱一手交货）=双方均有同时履行抗辩权=中止履行</text>
<text x="844" y="883" font-size="12" fill="#344054">2.履行有顺序：</text>
<text x="844" y="900" font-size="12" fill="#344054">  (1)先履行一方未不安抗辩权：①事由：有确切证据证明对方在经营状况严重化、丧失商业信誉、逃债等不能为对待给付的危险【527、528条】</text>
<text x="844" y="917" font-size="12" fill="#344054">    ②方式：①中止履行后及时通知对方；对方提供适当担保的，应当恢复履行</text>
<text x="844" y="934" font-size="12" fill="#344054">      ②中止履行后，对方在合理期限内未恢复履行能力且未提供适当担保的，视为以自己的行为表明不履行主要债务，</text>
<text x="844" y="951" font-size="12" fill="#344054">        中止履行的一方可以解除合同并可以请求对方承担违约责任</text>
<text x="844" y="968" font-size="12" fill="#344054">  (2)后履行一方无先履行抗辩权：①事由=先履行一方未履行合同义务【526条】</text>
<text x="844" y="985" font-size="12" fill="#344054">    ②方式=中止履行</text>
<rect x="832" y="1008" width="300" height="255" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1030" font-size="14.5" font-weight="600" fill="#B83A4A">情势变更(2次)</text>
<text x="844" y="1050" font-size="12" fill="#344054">1.含义：合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；</text>
<text x="844" y="1067" font-size="12" fill="#344054">  在合理期限内协商不成的，当事人可以请求法院或仲裁机构变更或解除合同。</text>
<text x="844" y="1084" font-size="12" fill="#344054">  法院或仲裁机构应当结合案件的实际情况，根据公平原则变更或解除合同【民法典第533条】</text>
<text x="844" y="1101" font-size="12" fill="#344054">  ⚠️ 合同订立时，明显不公平，受损害方可以行使撤销权（显失公平）</text>
<text x="844" y="1118" font-size="12" fill="#344054">2.认定：国家政策/新冠疫情/市场价格异常波动或涨跌/金融危机的正常的价格变动是商业风险</text>
<text x="844" y="1135" font-size="12" fill="#344054">3.处理：①基于鼓励交易原则和合同自由原则，一方不主张变更或解除合同的，法院不得解除合同</text>
<text x="844" y="1152" font-size="12" fill="#344054">  ②双方意见不一致的，法院根据公平原则决定变更或解除合同</text>
<text x="844" y="1169" font-size="12" fill="#344054">4.约定排除：当事人事先约定排除情势变更无效</text>
<text x="844" y="1186" font-size="12" fill="#344054">对比表：不可抗力 vs 情势变更（项目：法律依据/当事人主观避免义务的程度和结果/免责情况/解决问题路径/适用程序）</text>
<text x="844" y="1203" font-size="12" fill="#344054">  不可抗力：当事人只要举证证明不可抗力导致合同履行不能的，即可获得全部或部分免责，</text>
<text x="844" y="1220" font-size="12" fill="#344054">  ①未经法定免责事由不需要法院裁量；②解决问题路径为违约责任问题（合同责任问题）</text>
<text x="844" y="1237" font-size="12" fill="#344054">  情势变更：当事人主张变更或解除合同需要经过法院裁量，</text>
<text x="844" y="1254" font-size="12" fill="#344054">  解决合同履行是否变更的问题（合同履行是否变更问题）</text>
<rect x="436" y="1632.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1654.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲45 合同保全(02)·代位权+撤销权</text>
<text x="448" y="1674.5" font-size="12" fill="#344054">来源 p053-p054</text>
<rect x="832" y="1277" width="300" height="340" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1299" font-size="14.5" font-weight="600" fill="#6F3A91">债权人代位权诉讼(6次)</text>
<text x="844" y="1319" font-size="12" fill="#344054">1.含义：当债务人怠于行使其对相对人的权利而害及债权人的债权时，债权人为保全其债权，可以自己的名义代为行使债务人对相对人的权利</text>
<text x="844" y="1336" font-size="12" fill="#344054">  【民法典第535-542条、民法典合同编通则解释第33-46条】</text>
<text x="844" y="1353" font-size="12" fill="#344054">2.成立条件：</text>
<text x="844" y="1370" font-size="12" fill="#344054">  (1)原则上，债权人对债务人、债务人对相对人的权利均合法且到期</text>
<text x="844" y="1387" font-size="12" fill="#344054">  (2)特殊情形：①特殊情形：①相对人对债务人享有抗辩权，债务人对相对人享有权利的诉时效期间即将届满的情形，影响债权人代位权实现的，</text>
<text x="844" y="1404" font-size="12" fill="#344054">    债务人可以代位权行使</text>
<text x="844" y="1421" font-size="12" fill="#344054">  (3)债务人怠于行使权利对相对人有直接因果关系：只要债务人未采用诉讼或仲裁的方式均构成&quot;怠于行使&quot;（客观证明标准）</text>
<text x="844" y="1438" font-size="12" fill="#344054">  (4)债务人的权利非专属于债务人本人：①抚养费/赡养费/扶养费请求权</text>
<text x="844" y="1455" font-size="12" fill="#344054">    ②人身损害赔偿请求权</text>
<text x="844" y="1472" font-size="12" fill="#344054">    ③劳动报酬请求权，但是超过必要劳动报酬的部分除外</text>
<text x="844" y="1489" font-size="12" fill="#344054">    ④请求支付基本养老保险金/失业保险金/最低生活保障金等非基本生活的权利</text>
<text x="844" y="1506" font-size="12" fill="#344054">3.诉讼当事人：①原告=债权人（行使范围以债权人的债权为限）；②被告=债务人的相对人（包括担保人）；③第三人=债务人（法院应当追加为无独立请求权的第三人）</text>
<text x="844" y="1523" font-size="12" fill="#344054">4.管辖：由被告住所地法院管辖，依法应当适用专属管辖规定的除外</text>
<text x="844" y="1540" font-size="12" fill="#344054">5.法律效果：</text>
<text x="844" y="1557" font-size="12" fill="#344054">  (1)抗辩权转移：相对人对债务人的抗辩，可以向债权人主张（但不得以双方之间的仲裁条款进行抗辩）</text>
<text x="844" y="1574" font-size="12" fill="#344054">  (2)债权消灭：债权人与债务人之间的债权相应的消灭，债务人与相对人之间的债权相应的消灭</text>
<text x="844" y="1591" font-size="12" fill="#344054">  (3)直接履行：债务人的相对人直接向债权人履行义务；债权人行使代位权的必要费用（财产评估费用、财产保全费用、调查取证费用等），由债务人负担</text>
<text x="844" y="1608" font-size="12" fill="#344054">  (4)诉讼时效中断：债权人的债权和债务人的债权均发生诉讼时效中断的效力（诉讼时效的规定）【第16条】</text>
<rect x="832" y="1631" width="300" height="408" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1653" font-size="14.5" font-weight="600" fill="#6F3A91">债权人撤销权诉讼(1)（9次）</text>
<text x="844" y="1673" font-size="12" fill="#344054">1.含义：债权人对于债务人所为的危害债权的行为，可以请求法院予以撤销的权利</text>
<text x="844" y="1690" font-size="12" fill="#344054">2.无需债务人行为（1次）：</text>
<text x="844" y="1707" font-size="12" fill="#344054">  (1)债权人对债务人有合法有效的债权（无需到期）</text>
<text x="844" y="1724" font-size="12" fill="#344054">  (2)主观上，债务人具有危害债权的恶意（无偿行为不要求）</text>
<text x="844" y="1741" font-size="12" fill="#344054">  (3)客观上，债务人实施了危害债权的下列行为之一：</text>
<text x="844" y="1758" font-size="12" fill="#344054">    ①放弃债权（②放弃债务担保）③无偿转让财产（赠与合同）④恶意延长到期债权的履行期限</text>
<text x="844" y="1775" font-size="12" fill="#344054">    ⚠️ 被撤销行为标的的可分的，在受影响的债权范围内主张撤销；不可分的，可以主张全部撤销</text>
<text x="844" y="1792" font-size="12" fill="#344054">    【民法典合同编通则解释第45条第1款】</text>
<text x="844" y="1809" font-size="12" fill="#344054">  (4)债务人的行为已危害到债权人的债权（导致自己陷入无资力而无法清偿其债务）</text>
<text x="844" y="1826" font-size="12" fill="#344054">  ⚠️ 夫妻一方的债权人，证据证明离婚协议中财产分割条款影响其债权实现，请求参照适用《民法典》第538条或第539条规定撤销相关条款的，</text>
<text x="844" y="1843" font-size="12" fill="#344054">    法院应当综合考虑夫妻共同财产分割、离婚是否对等分享债务等意思表示真实等因素，</text>
<text x="844" y="1860" font-size="12" fill="#344054">    【民法典婚姻家庭编解释（二）第3条】</text>
<text x="844" y="1877" font-size="12" fill="#344054">3.诉讼当事人：①原告=债权人（行使范围以债权人的债权为限）；②被告=债务人和债务人的相对人为共同被告</text>
<text x="844" y="1894" font-size="12" fill="#344054">4.管辖：由被告住所地法院管辖，依法应当适用专属管辖规定的除外</text>
<text x="844" y="1911" font-size="12" fill="#344054">5.法律效果：①一经撤销，债务人与相对人的行为自始无效</text>
<text x="844" y="1928" font-size="12" fill="#344054">  ②相对人尚未向债务人返还财产/借款的，而非直接返还给债权人，</text>
<text x="844" y="1945" font-size="12" fill="#344054">    而向债权人主张或代位行使必要费用（合理的律师代理费、差旅费、财产保全费用等），第三人有过错的应当分担</text>
<text x="844" y="1962" font-size="12" fill="#344054">  ③债权人行使撤销权的必要费用（合理的律师代理费、差旅费、财产保全费用等），由债务人负担，</text>
<text x="844" y="1979" font-size="12" fill="#344054">    第三人有过错的应当分担（合理必要费用＋法定必要费用）</text>
<text x="844" y="1996" font-size="12" fill="#344054">6.除斥期间：债权人知道或应当知道撤销事由之日起1年内；自债务人的行为发生之日起5年内没有行使撤销权的，该撤销权消灭（双重除斥期间限制）</text>
<text x="844" y="2013" font-size="12" fill="#344054">对比表：债权人代位权诉讼 vs 债权人撤销权诉讼</text>
<text x="844" y="2030" font-size="12" fill="#344054">  法律依据/相同点/类型/本质/主观恶性/行使范围/必要费用/债权到期/法律效果/总结</text>

<rect x="40" y="1147.0" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1169.0" font-size="14.5" font-weight="600" fill="#185FA5">8-17 · 民法 讲46~49</text>
<text x="52" y="1189.0" font-size="12" fill="#344054">合同变更 + 转让01-02 + 终止01-02</text>
<text x="52" y="1206.0" font-size="12" fill="#344054">p055-p058</text>
<rect x="436" y="248.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="270.0" font-size="14.5" font-weight="600" fill="#854F0B">讲46 合同变更+债权转让</text>
<text x="448" y="290.0" font-size="12" fill="#344054">来源 p055</text>
<rect x="832" y="20" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">合同变更</text>
<text x="844" y="62" font-size="12" fill="#344054">1.含义：合同主体不变，合同内容进行修改或补充【民法典第543条】</text>
<text x="844" y="79" font-size="12" fill="#344054">2.条件：一方当事人请求变更合同，另一方未表示反对，但没有明确表示同意，</text>
<text x="844" y="96" font-size="12" fill="#344054">  或没有行为表明同意的，推定为未变更【民法典第544条】</text>
<rect x="832" y="119" width="300" height="408" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="141" font-size="14.5" font-weight="600" fill="#854F0B">债权转让(5次)</text>
<text x="844" y="161" font-size="12" fill="#344054">1.含义：不改变债权的内容，由债权人将债权的全部或部分转让给第三人的制度</text>
<text x="844" y="178" font-size="12" fill="#344054">  ⚠️ 广泛应用于银行和金融资产管理公司对不良债权的处理以及保理等领域</text>
<text x="844" y="195" font-size="12" fill="#344054">  ⚠️ 债权转让的核心是如何平衡债务人利益保护和债权流通性之间的冲突</text>
<text x="844" y="212" font-size="12" fill="#344054">2.生效要件：</text>
<text x="844" y="229" font-size="12" fill="#344054">  (1)存在合法有效的债权（扩大解释：包括未到期的债权、已过诉讼时效的债权、可撤销的债权、享有选择权的合同债权）</text>
<text x="844" y="246" font-size="12" fill="#344054">  (2)被转让的债权具有可转让性，例外：①根据债权性质不得转让的债权（特殊的人身债权）</text>
<text x="844" y="263" font-size="12" fill="#344054">    ②依当事人约定不得转让的债权（不得对抗善意第三人；但约定金钱债权不得转让的，不得对抗第三人）</text>
<text x="844" y="280" font-size="12" fill="#344054">    ③依法律规定不得转让的债权（特殊法定债权）</text>
<text x="844" y="297" font-size="12" fill="#344054">  (3)让与人与受让人达成转让协议：①协议一经达成，即产生内部效力（原债权人与受让人之间的法律关系）</text>
<text x="844" y="314" font-size="12" fill="#344054">    ②原债权人/受让人/第三人可均通知；受让人/第三人通知的，必须提供取得债权的证据，否则不发生效力</text>
<text x="844" y="331" font-size="12" fill="#344054">    ③债权转让的通知可撤销的，但已经承诺为善意第三人取得利益而负债务的人，对该第三人不得主张其撤销</text>
<text x="844" y="348" font-size="12" fill="#344054">    ④证券化债权：无记名证券（如记名证券、月饼券等）；特殊债权移转必须办理登记手续（如电话使用权的过户）</text>
<text x="844" y="365" font-size="12" fill="#344054">    ⑤当事人约定债权不得转让的，债权人违反约定转让债权的，受让人就该债权成立有效的债【民法典第1161条】</text>
<text x="844" y="382" font-size="12" fill="#344054">3.效力：</text>
<text x="844" y="399" font-size="12" fill="#344054">  (1)内部效力：①原债权人/让与人脱离合同关系，受让人取代其法律地位，成为新债权人</text>
<text x="844" y="416" font-size="12" fill="#344054">    ②从属于债权的从权利随之转移（如担保物权和其他从权利，但是专属于债权人自身的除外）</text>
<text x="844" y="433" font-size="12" fill="#344054">    ③让与人对其让与的债权负瑕疵担保责任</text>
<text x="844" y="450" font-size="12" fill="#344054">  (2)外部效力：①债权转让成立并一经通知债务人，债务人只能向受让人履行义务</text>
<text x="844" y="467" font-size="12" fill="#344054">    ②抗辩援用：债务人对让与人的抗辩，可以向受让人主张</text>
<text x="844" y="484" font-size="12" fill="#344054">    ③抵销权援用：债务人接到债权转让通知时，债务人对让与人享有债权的，可以向受让人主张抵销</text>
<text x="844" y="501" font-size="12" fill="#344054">  (3)费用负担：因债权转让增加的履行费用，由原债权人负担【民法典第550条】</text>
<text x="844" y="518" font-size="12" fill="#344054">4.区别：债权让与人/债务人接受（履行清偿）该区别（清偿）=债权人与受让人进行债权转让，不合格的债权人进行接受新合同</text>
<rect x="436" y="786.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="808.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲47 合同变更+转让02·债务承担+概括承受</text>
<text x="448" y="828.0" font-size="12" fill="#344054">来源 p056</text>
<rect x="832" y="541" width="300" height="323" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="563" font-size="14.5" font-weight="600" fill="#B83A4A">债务承担(6次)</text>
<text x="844" y="583" font-size="12" fill="#344054">1.含义：又称债务转移，是指在债权债务关系不共同性的基础上，债权人或债务人通过与第三人订立债务承担合同，将债务全部或部分转移于第三人承担的法律现象</text>
<text x="844" y="600" font-size="12" fill="#344054">  【民法典第551-554条、民法典合同编通则解释第51条】</text>
<text x="844" y="617" font-size="12" fill="#344054">2.生效要件：①存在合法有效的债务</text>
<text x="844" y="634" font-size="12" fill="#344054">  ②被转让的债务具有可转让性</text>
<text x="844" y="651" font-size="12" fill="#344054">  ③存在合法有效的债务承担协议</text>
<text x="844" y="668" font-size="12" fill="#344054">3.免责的债务承担：</text>
<text x="844" y="685" font-size="12" fill="#344054">  (1)含义：第三人取代原债务人的地位而承担全部或部分债务，使原债务人全部或部分脱离债的关系的债务承担方式</text>
<text x="844" y="702" font-size="12" fill="#344054">  (2)协议方式：①债务人和第三人签订债务承担协议+债权人以书面形式表示同意【民法典第551条】</text>
<text x="844" y="719" font-size="12" fill="#344054">    ②债权人和第三人签订债务承担协议（视为同意，债权人未表示同意的，视不同意）</text>
<text x="844" y="736" font-size="12" fill="#344054">    ③债权人/债务人和第三人三方合意签订债务承担协议</text>
<text x="844" y="753" font-size="12" fill="#344054">4.并存的债务承担：</text>
<text x="844" y="770" font-size="12" fill="#344054">  (1)含义：又称&quot;附加的债务承担&quot;或&quot;重叠的债务承担&quot;或&quot;债务加入&quot;，是指债务人不脱离债的关系，第三人加入债的关系，与原债务人一起向债权人承担债务的债务承担方式</text>
<text x="844" y="787" font-size="12" fill="#344054">  (2)责任：第三人与债务人约定加入债务并通知债权人，或第三人向债权人表示愿意加入债务，</text>
<text x="844" y="804" font-size="12" fill="#344054">  债权人未在合理期限内明确拒绝的，债权人可以请求第三人在其愿意承担的债务范围内和债务人承担连带债务【民法典第551条】</text>
<text x="844" y="821" font-size="12" fill="#344054">5.债务承担与第三人代为履行(清偿)的区别：</text>
<text x="844" y="838" font-size="12" fill="#344054">  (1)债务承担，第三人成为合同当事人，履行不符合时，向债权人承担责任的责任</text>
<text x="844" y="855" font-size="12" fill="#344054">  (2)第三人代为履行(清偿)，第三人始终不是合同当事人，履行不符合时，债务人仍应向债权人承担违约责任</text>
<rect x="832" y="878" width="300" height="204" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="900" font-size="14.5" font-weight="600" fill="#B83A4A">债权债务的概括承受(1次)</text>
<text x="844" y="920" font-size="12" fill="#344054">1.含义：债的一方当事人将其债权债务一并转移给第三人，由第三人概括地承受权利义务的法律现象</text>
<text x="844" y="937" font-size="12" fill="#344054">2.种类：①意定概括承受：双务合同的一方将其债权债务一并通过协议一并转移于第三人，并经对方同意</text>
<text x="844" y="954" font-size="12" fill="#344054">  (2)法定概括承受：是指依法律规定债权债务由原债务人转移给新债务人承担的法律现象</text>
<text x="844" y="971" font-size="12" fill="#344054">  ①企业的分立合并【民法典第67条】：①法人合并的，其权利和义务由合并后的法人享有和承担</text>
<text x="844" y="988" font-size="12" fill="#344054">      ②法人分立的，其权利和义务由分立后的法人享有连带债权，承担连带债务，但是债权人和债务人另有约定的除外</text>
<text x="844" y="1005" font-size="12" fill="#344054">    ②所有权转移不破租赁【民法典第725条】：租赁物在承租人按照租赁合同占有期限内发生所有权变动的，</text>
<text x="844" y="1022" font-size="12" fill="#344054">      不影响租赁合同的效力</text>
<text x="844" y="1039" font-size="12" fill="#344054">    ③限定继承规则【民法典第1161条】：①继承人以所得遗产实际价值为限清偿被继承人依法应当缴纳的税款和债务</text>
<text x="844" y="1056" font-size="12" fill="#344054">      ②超过遗产实际价值部分，继承人自愿偿还的不在此限</text>
<text x="844" y="1073" font-size="12" fill="#344054">      ③继承人放弃继承的，对被继承人依法应当缴纳的税款和债务可以不负清偿责任</text>
<rect x="436" y="1397.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1419.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲48 合同的权利义务终止(01)·清偿</text>
<text x="448" y="1439.5" font-size="12" fill="#344054">来源 p057</text>
<rect x="832" y="1096" width="300" height="238" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1118" font-size="14.5" font-weight="600" fill="#6F3A91">1.清偿（2次）</text>
<text x="844" y="1138" font-size="12" fill="#344054">(1)含义：债务人依照法律规定或合同约定完成义务的行为【民法典第557-576条、民法典合同编通则解释第19、27、28、52-58条】</text>
<text x="844" y="1155" font-size="12" fill="#344054">  又称代物清偿，是指在履行合同过程中，债权人受领他种给付代替原定给付的关系消灭</text>
<text x="844" y="1172" font-size="12" fill="#344054">  (2)构成要件：①有原债务存在；②经双方当事人约定，他种给付代替原定给付；③债权人或其他有履行受领权的人现实地受领给付</text>
<text x="844" y="1189" font-size="12" fill="#344054">  (3)分类：①清偿型以物抵债协议（债务履行期限届满后）=①诺成性合同，合法有效</text>
<text x="844" y="1206" font-size="12" fill="#344054">    ②原则上新订旧无债，债权人享有催告后的选择权</text>
<text x="844" y="1223" font-size="12" fill="#344054">    ③司法文书不发生物权效力</text>
<text x="844" y="1240" font-size="12" fill="#344054">    ④以他人财产抵债适用善意取得</text>
<text x="844" y="1257" font-size="12" fill="#344054">    ②担保型以物抵债协议（债务履行期限届满前）=①期间届满前，债务人处于优势地位，法律对&quot;以物抵债&quot;持肯定评价，认定有效</text>
<text x="844" y="1274" font-size="12" fill="#344054">    ②债权人或担保人通过低价财产抵债的方式挤压担保人利益、谋取巨额暴利损害了债权人、</text>
<text x="844" y="1291" font-size="12" fill="#344054">      担保人等利益的情况下，债务人与债权人此类约定损害了债权人的权益且缺乏市场对价的，</text>
<text x="844" y="1308" font-size="12" fill="#344054">      该种约定剥夺了债务人的市场定价权，属于流押流质条款，认定无效</text>
<text x="844" y="1325" font-size="12" fill="#344054">    ③承担适法与担保（流押流质条款无效，仅享有优先受偿权）</text>
<rect x="832" y="1348" width="300" height="153" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1370" font-size="14.5" font-weight="600" fill="#6F3A91">3.清偿抵充(1次)</text>
<text x="844" y="1390" font-size="12" fill="#344054">(1)含义：在债务人对于同一债权人负担数项债务而其给付不足以清偿全部债务时，确定其给付应抵充何项债务的规则</text>
<text x="844" y="1407" font-size="12" fill="#344054">  (2)构成要件：①须债务人对同一债权人负担数项债务；②须数项债务内容相同；③须债务人提供之给付不足以清偿全部债务</text>
<text x="844" y="1424" font-size="12" fill="#344054">  (3)抵充方法（3步）：①第一步=约定抵充（原则上清偿前达成约定）</text>
<text x="844" y="1441" font-size="12" fill="#344054">    ②第二步=指定抵充（债务人在清偿时享有优先指定权）</text>
<text x="844" y="1458" font-size="12" fill="#344054">    ③第三步=法定抵充：①优先清偿已到期的债务；几项债务均到期的，优先清偿无担保或担保最少的债务</text>
<text x="844" y="1475" font-size="12" fill="#344054">      ②负担均相同的，优先清偿债务人负担较重的债务；负担相同的，按照债务到期的先后顺序清偿</text>
<text x="844" y="1492" font-size="12" fill="#344054">      ③到期时间相同的，按照债务比例清偿</text>
<rect x="832" y="1515" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1537" font-size="14.5" font-weight="600" fill="#6F3A91">4.费用、利息和本金的清偿抵充</text>
<text x="844" y="1557" font-size="12" fill="#344054">有约定从约定&gt;实现债权的有关费用&gt;利息&gt;本金</text>
<rect x="832" y="1580" width="300" height="170" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1602" font-size="14.5" font-weight="600" fill="#6F3A91">核心考点：解除（1）</text>
<text x="844" y="1622" font-size="12" fill="#344054">【民法典第562-567条、民法典合同编通则解释第52-54条】</text>
<text x="844" y="1639" font-size="12" fill="#344054">(1)对象法定：尚未履行或尚未履行完毕的全部债务的合同</text>
<text x="844" y="1656" font-size="12" fill="#344054">(2)程度法定：根据违约（合同目的不能实现）的无合同，依的（仅）程度轻微的或显著轻微不解除合同</text>
<text x="844" y="1673" font-size="12" fill="#344054">(3)情形法定：双方解除或单方解除（4）行使法定：或诉或通知（简单形成权）</text>
<text x="844" y="1690" font-size="12" fill="#344054">(5)效力法定：不影响合同效力、不影响违约责任、不影响担保责任</text>
<text x="844" y="1707" font-size="12" fill="#344054">1.双方解除权：①协商解除、协商一致；②约定解除条件</text>
<text x="844" y="1724" font-size="12" fill="#344054">2.特别法定解除权：①不定期合同双方均可随时解除（无期限）</text>
<text x="844" y="1741" font-size="12" fill="#344054">  ②单方解除权（法律规定）=承揽合同的托运人、旅游合同的旅客者</text>
<rect x="436" y="2027.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="2049.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲49 合同的权利义务终止(02)·解除</text>
<text x="448" y="2069.5" font-size="12" fill="#344054">来源 p058</text>
<rect x="832" y="1764" width="300" height="578" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1786" font-size="14.5" font-weight="600" fill="#0F7E80">合同解除(6次)</text>
<text x="844" y="1806" font-size="12" fill="#344054">1.含义：是指根据双方或一方当事人的意思表示使合同关系归于终了的制度</text>
<text x="844" y="1823" font-size="12" fill="#344054">2.双方解除：协议解除、协调解除、协商是在合同当事人之间成立一个新的合同，</text>
<text x="844" y="1840" font-size="12" fill="#344054">  其目的在于解除原合同，不是在原合同当事人之间产生新的合同义务</text>
<text x="844" y="1857" font-size="12" fill="#344054">  （实际上是在当事人之间成立一个新的合同）</text>
<text x="844" y="1874" font-size="12" fill="#344054">3.单方解除：</text>
<text x="844" y="1891" font-size="12" fill="#344054">  (1)约定解除：是指当事人以合同条款的形式，在合同生效后未履行或未完全履行之前，</text>
<text x="844" y="1908" font-size="12" fill="#344054">  由一方当事人在约定解除合同的事由发生时所享有的解除权</text>
<text x="844" y="1925" font-size="12" fill="#344054">  (2)一般法定解除（民法典第563条）：</text>
<text x="844" y="1942" font-size="12" fill="#344054">    ①因不可抗力致使不能实现合同目的（根本违约），且免除违约责任事由=双方均可解除合同</text>
<text x="844" y="1959" font-size="12" fill="#344054">    ②预期违约：①预期违约的对方当事人可以援用《民法典》第578条之相关规定，</text>
<text x="844" y="1976" font-size="12" fill="#344054">      ②当事人一方明确表示或者以自己的行为表明不履行主要债务</text>
<text x="844" y="1993" font-size="12" fill="#344054">    ③迟延履行：①合同未约定履行期限或未完全履行之前，当事人在法律规定的事由出现时，</text>
<text x="844" y="2010" font-size="12" fill="#344054">      通过行使解除权或合同通知使合同关系归于消灭；②经催告后在合理期限内仍未履行</text>
<text x="844" y="2027" font-size="12" fill="#344054">    ④当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的</text>
<text x="844" y="2044" font-size="12" fill="#344054">    （法定解除权的解释）：根本违约行为，不符合构成违约责任（过错原则）</text>
<text x="844" y="2061" font-size="12" fill="#344054">  (3)从给付义务（违反）：①特点：</text>
<text x="844" y="2078" font-size="12" fill="#344054">    A. 从给付义务的违反一般均构成违约，可以追究违约责任</text>
<text x="844" y="2095" font-size="12" fill="#344054">    B. 但原则上不可以解除合同，除非根本违约（重大误解）</text>
<text x="844" y="2112" font-size="12" fill="#344054">    C. 从给付义务的违反不构成根本违约，原则上不得解除合同，除构成根本违约</text>
<text x="844" y="2129" font-size="12" fill="#344054">    D. 从给付义务的违反不构成根本重大误解</text>
<text x="844" y="2146" font-size="12" fill="#344054">    E. 从给付义务的违反不得主张惩罚性赔偿</text>
<text x="844" y="2163" font-size="12" fill="#344054">    ②构成要件：①可撤销（或诉讼）②不撤销（自始有效）③法定解除权（解除+违约金责任）</text>
<text x="844" y="2180" font-size="12" fill="#344054">  (4)特别法定解除权（房屋买卖合同/保理单/发票/质量保证书/使用说明书等）【买卖合同解释第4条】</text>
<text x="844" y="2197" font-size="12" fill="#344054">  ①主给付义务 房屋所有权</text>
<text x="844" y="2214" font-size="12" fill="#344054">  ②从给付义务</text>
<text x="844" y="2231" font-size="12" fill="#344054">    A. 配套设施（网球场/游泳池/购物广场/大型超市/轨道交通）</text>
<text x="844" y="2248" font-size="12" fill="#344054">    B. 单证和资料（保险单/保单单/发票/质量保证书/使用说明书等）</text>
<text x="844" y="2265" font-size="12" fill="#344054">    ③附随义务：通知/协助/保密，不得单独诉请其履行</text>
<text x="844" y="2282" font-size="12" fill="#344054">  ④不真正义务：减义务（仅导致自身利益受损而向合同相对方担责）</text>
<text x="844" y="2299" font-size="12" fill="#344054">  ②特别法定解除权：①双方解除权（无期限），②单方解除权=承揽合同的托运人、旅游合同的旅客者</text>
<text x="844" y="2316" font-size="12" fill="#344054">  ①不定期合同的双方均可随时解除（无期限）</text>
<text x="844" y="2333" font-size="12" fill="#344054">  ②单方解除权（法律规定）=承揽合同的托运人、旅游合同的旅客者</text>
</svg>`,

<rect x="40" y="1353.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1375.5" font-size="14.5" font-weight="600" fill="#185FA5">8-18 · 民法 讲50~53</text>
<text x="52" y="1395.5" font-size="12" fill="#344054">合同终止03+违约01-03</text>
<text x="52" y="1412.5" font-size="12" fill="#344054">p059-p063</text>
<rect x="436" y="548.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="570.0" font-size="14.5" font-weight="600" fill="#854F0B">讲50 合同的权利义务终止(03)</text>
<text x="448" y="590.0" font-size="12" fill="#344054">来源 p059-p060</text>
<rect x="832" y="20" width="300" height="187" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">4.解除权的行使(3次)</text>
<text x="844" y="62" font-size="12" fill="#344054">(1)行使期限：①性质=形成权，受除斥期间的限制</text>
<text x="844" y="79" font-size="12" fill="#344054">  ②起算：①法律规定或当事人约定；②法律无规定或当事人无约定=知道或应当知道解除事由之日起1年内；对方催告后合理期限内</text>
<text x="844" y="96" font-size="12" fill="#344054">(2)行使方式：①通知解除：①通知到达对方时解除；②通知载明一定期限，债务人在该期限内未履行债务的，自通知载明期限届满时解除</text>
<text x="844" y="113" font-size="12" fill="#344054">      ③对方对解除合同有异议的，任何一方当事人均可以请求法院或仲裁机构确认解除行为的效力</text>
<text x="844" y="130" font-size="12" fill="#344054">    ②行为解除：当事人一方未通知对方，直接以提起诉讼或申请仲裁的方式主张解除合同，法院或仲裁机构确认该主张的，自起诉状副本或仲裁申请书副本送达对方时解除合同</text>
<text x="844" y="147" font-size="12" fill="#344054">  (3)对内效力：①通知到达对方时解除</text>
<text x="844" y="164" font-size="12" fill="#344054">(2)对外效力（另约定排除）：①不影响向对方承担的责任（违约责任、损害赔偿等）</text>
<text x="844" y="181" font-size="12" fill="#344054">  ②不影响担保责任的效力，不影响担保责任（另有约定除外）</text>
<text x="844" y="198" font-size="12" fill="#344054">  ③不影响结算和清理条款的效力，其效力具有独立性</text>
<rect x="832" y="221" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="243" font-size="14.5" font-weight="600" fill="#854F0B">5.解除权的效力(2次)</text>
<text x="844" y="263" font-size="12" fill="#344054">(1)尚未履行的，终止履行；已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权利请求赔偿损失</text>
<text x="844" y="280" font-size="12" fill="#344054">(2)不影响向对方承担的责任</text>
<text x="844" y="297" font-size="12" fill="#344054">(3)不影响担保责任的效力</text>
<text x="844" y="314" font-size="12" fill="#344054">  （不影响结算和清理条款的效力，其效力具有独立性）</text>
<rect x="832" y="337" width="300" height="187" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="359" font-size="14.5" font-weight="600" fill="#854F0B">抵消（3次）</text>
<text x="844" y="379" font-size="12" fill="#344054">1.含义：互负债务的双方当事人将两项债务相互充抵，以使双方债务在等数额内消灭的行为</text>
<text x="844" y="396" font-size="12" fill="#344054">2.类型：(1)法定抵消：①协议抵消、约定抵消、遵循意思自治原则</text>
<text x="844" y="413" font-size="12" fill="#344054">    ②积极要件：①依法或事实不能抵销的（被撤销的债权称为被动债权）</text>
<text x="844" y="430" font-size="12" fill="#344054">      A. 双务互负债务；B. 双方债务的标的物种类相同；C. 主动债权（提出抵消的债权）已到期</text>
<text x="844" y="447" font-size="12" fill="#344054">    ③消极要件：①侵权之债的侵权人不得主张抵消（A. 人身侵权；B. 故意或重大过失的财产侵权）</text>
<text x="844" y="464" font-size="12" fill="#344054">      ②自然之债（已过诉讼时效）的债权不得作为主动债权主张抵消</text>
<text x="844" y="481" font-size="12" fill="#344054">  (2)约定抵消</text>
<text x="844" y="498" font-size="12" fill="#344054">3.性质和行使：①性质=形成权；②一经通知对方即发生效力；③通知自到达对方时生效；通知不得附条件或期限</text>
<text x="844" y="515" font-size="12" fill="#344054">4.效力：法定抵消权行使后使具有相应的主债务、利息、违约金或损害赔偿金等债务在同等数额内消灭</text>
<rect x="832" y="538" width="300" height="272" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="560" font-size="14.5" font-weight="600" fill="#854F0B">提存(2次)</text>
<text x="844" y="580" font-size="12" fill="#344054">1.含义：由于债权人原因，债务人无法向债权人清偿到期债务，债务人将合同标的交付特定的提存部门，从而完成债务清偿，使债务消灭的制度</text>
<text x="844" y="597" font-size="12" fill="#344054">2.事由：①债权人下落不明；②债权人死亡未确定继承人/遗产管理人或丧失民事行为能力未确定监护人；③法律规定的其他情形</text>
<text x="844" y="614" font-size="12" fill="#344054">3.标的物：(1)原则上为债（合同）的标的物</text>
<text x="844" y="631" font-size="12" fill="#344054">  (2)标的物不适合提存（如鲜活易腐物品、危险物品等）或提存费用过高的，债务人依法可以拍卖或者变卖标的物，提存所得的价款</text>
<text x="844" y="648" font-size="12" fill="#344054">4.法律效力：①提存成立时，视为债务人在其提存范围内已经交付标的物</text>
<text x="844" y="665" font-size="12" fill="#344054">  ②提存物的风险、孳息、提存费归债权人承担</text>
<text x="844" y="682" font-size="12" fill="#344054">  ③标的物的所有权、领取权、风险、孳息、提存费归债权人</text>
<text x="844" y="699" font-size="12" fill="#344054">5.提存部门的义务：①在我国，提存作为一项公证业务而由债务人履行地的公证处管辖</text>
<text x="844" y="716" font-size="12" fill="#344054">  ②保管不善导致灭失的，应向债务人承担赔偿责任</text>
<text x="844" y="733" font-size="12" fill="#344054">6.领取权：(1)债权人可以随时领取提存物</text>
<text x="844" y="750" font-size="12" fill="#344054">  ①债权人对债务人有到期债务的，在债权人未履行债务或提供担保之前，提存部门根据债务人的要求应当拒绝其领取提存物</text>
<text x="844" y="767" font-size="12" fill="#344054">  ②债权人领取提存物的权利，自提存之日起5年内不行使而消灭，提存物扣除提存费用后归国家所有</text>
<text x="844" y="784" font-size="12" fill="#344054">  (2)债务人负担提存费后有权取回提存物：①债权人未履行对债务人的到期债务</text>
<text x="844" y="801" font-size="12" fill="#344054">    ②债权人向提存部门书面表示放弃领取提存物权利</text>
<rect x="832" y="824" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="846" font-size="14.5" font-weight="600" fill="#854F0B">免除(2次)</text>
<text x="844" y="866" font-size="12" fill="#344054">1.含义：债权人以全部或部分消灭债务人为目的而向债务人作出的抛弃债权的意思表示【民法典第575条】</text>
<text x="844" y="883" font-size="12" fill="#344054">2.对象：债务免除的对象可以是部分债务，也可以是全部债务</text>
<text x="844" y="900" font-size="12" fill="#344054">3.特征：①债权人免除债务的意思表示应向债务人或债务人的代理人</text>
<text x="844" y="917" font-size="12" fill="#344054">  ②非要式，可以书面形式，也可以口头形式</text>
<text x="844" y="934" font-size="12" fill="#344054">4.性质：修正的单方行为说：①原则：债务免除的效果不取决于债务人的接受，而可以直接发生法律效果</text>
<text x="844" y="951" font-size="12" fill="#344054">  ②例外：如债务人行使拒绝权，则债务免除自始不发生法律效果</text>
<rect x="832" y="974" width="300" height="153" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="996" font-size="14.5" font-weight="600" fill="#854F0B">混同</text>
<text x="844" y="1016" font-size="12" fill="#344054">1.含义：狭义的混同，是指债权和债务归于一人事实【民法典第576条】</text>
<text x="844" y="1033" font-size="12" fill="#344054">  (2)混同是一事件，即因某些客观事实发生而产生的债权债务归于一人，不必由当事人意思表示【第576条】</text>
<text x="844" y="1050" font-size="12" fill="#344054">2.类型：(1)概括承受：①债权人继承债务人的遗产或债务人继承债权人的遗产而导致债权债务同归一人</text>
<text x="844" y="1067" font-size="12" fill="#344054">  ②第三人同时继承债权人和债务人的遗产</text>
<text x="844" y="1084" font-size="12" fill="#344054">  ③债权人和债务人为企业时的合并</text>
<text x="844" y="1101" font-size="12" fill="#344054">  (2)特定承受：①债务人受让债权人的债权；②债权人承受债务人的债务</text>
<text x="844" y="1118" font-size="12" fill="#344054">3.法律效果：债权和债务同归于一人，债权债务终止，但是损害第三人（债权人与债务人的债权设定权利质权的第三人）利益的除外</text>
<rect x="436" y="1350.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1372.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲51 违约责任（01）·基本原理</text>
<text x="448" y="1392.5" font-size="12" fill="#344054">来源 p061</text>
<rect x="832" y="1141" width="300" height="136" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1163" font-size="14.5" font-weight="600" fill="#B83A4A">1.含义</text>
<text x="844" y="1183" font-size="12" fill="#344054">违约责任是指当事人不履行或不适当履行合同义务而承担的民事责任</text>
<text x="844" y="1200" font-size="12" fill="#344054">(1)合同生效前约定义务与生效后法定义务皆可违约</text>
<text x="844" y="1217" font-size="12" fill="#344054">(2)义务：①双方违约=合同当事人双方都违反了各自的义务，有两个违约行为，并相互造成了损害，双方应各自承担相应的违约责任【民法典第592条】</text>
<text x="844" y="1234" font-size="12" fill="#344054">  ②有过失=当事人一方违约造成对方损失，对方对损失的发生有过失的，可以减少相应的损失赔偿额</text>
<text x="844" y="1251" font-size="12" fill="#344054">  (3)相对性：①当事人一方因第三人的原因造成违约的，应当依法向对方承担违约责任</text>
<text x="844" y="1268" font-size="12" fill="#344054">  ②当事人和第三人之间的纠纷，依照法律规定或者按照约定处理【民法典第593条】</text>
<rect x="832" y="1291" width="300" height="136" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1313" font-size="14.5" font-weight="600" fill="#B83A4A">2.特征</text>
<text x="844" y="1333" font-size="12" fill="#344054">①双方违约 VS 有过失（过错的判断与承担）</text>
<text x="844" y="1350" font-size="12" fill="#344054">②相对性：①违约责任发生在合同当事人之间</text>
<text x="844" y="1367" font-size="12" fill="#344054">  ②涉及第三人原因：①当事人一方因第三人的原因造成违约的，应当依法向对方承担违约责任（违约责任优先说）</text>
<text x="844" y="1384" font-size="12" fill="#344054">    ②当事人和第三人之间的纠纷，依照法律规定或按照约定处理</text>
<text x="844" y="1401" font-size="12" fill="#344054">③归责原则：①无过错责任原则=债务人即使没有过错也要承担违约责任</text>
<text x="844" y="1418" font-size="12" fill="#344054">②例外=过错责任原则：赠与合同、委托合同、保管合同、仓储合同、客运合同承运人对旅客自带物品的毁损</text>
<rect x="832" y="1441" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1463" font-size="14.5" font-weight="600" fill="#B83A4A">3.构成要件</text>
<text x="844" y="1483" font-size="12" fill="#344054">(1)存在合法有效的合同</text>
<text x="844" y="1500" font-size="12" fill="#344054">(2)存在违约行为：①预期违约（届满前）=明示/默示（不履行主要义务/拒绝履行）</text>
<text x="844" y="1517" font-size="12" fill="#344054">  ②实际违约（届满后）=①不履行=拒绝履行（主观）/履行不能（客观）</text>
<text x="844" y="1534" font-size="12" fill="#344054">    ②迟延履行=债务人迟延履行（债权人负有对待给付义务的，债务人从提出同时履行抗辩权时，无须承担迟延履行的违约责任）</text>
<text x="844" y="1551" font-size="12" fill="#344054">(3)不存在法定的免责事由：①因不可抗力不能履行合同的，根据影响程度，部分或全部免除责任，但有规定的除外</text>
<text x="844" y="1568" font-size="12" fill="#344054">  ②应当及时通知对方（附随义务），以减轻可能给对方造成的损失，并应当在合理期限内提供证明</text>
<text x="844" y="1585" font-size="12" fill="#344054">  ③迟延履行后发生不可抗力的，不能免除违约责任</text>
<text x="844" y="1602" font-size="12" fill="#344054">对比表：缔约过失责任 vs 违约责任 vs 侵权责任（项目：法律依据/性质/时间/合同/免责原则/责任形式/构成要件/赔偿范围）</text>
<rect x="436" y="1945.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1967.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲52 违约责任（02）·违约责任的五种形式(1)</text>
<text x="448" y="1987.0" font-size="12" fill="#344054">来源 p062</text>
<rect x="832" y="1625" width="300" height="221" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1647" font-size="14.5" font-weight="600" fill="#6F3A91">1.继续履行（8次）</text>
<text x="844" y="1667" font-size="12" fill="#344054">(1)含义：强制实际履行，当事人一方违约时，守约方有权请求法院或仲裁机构强制违约方按照合同约定的给付内容履行义务，而不得以支付违约金或赔偿损失的方式代替履行【民法典第580条】</text>
<text x="844" y="1684" font-size="12" fill="#344054">(2)金钱债务：金钱债务不灭失，原则上不存在履行不能的问题，必须实际履行</text>
<text x="844" y="1701" font-size="12" fill="#344054">(3)非金钱债务：①法律上或事实上不能履行（特定之债）</text>
<text x="844" y="1718" font-size="12" fill="#344054">  ②债务的标的不适于强制履行（劳务之债）或履行费用过高</text>
<text x="844" y="1735" font-size="12" fill="#344054">  ③债权人在合理期限内未请求履行</text>
<text x="844" y="1752" font-size="12" fill="#344054">  ④当事人一方不履行非金钱债务的，根据债务的性质不得强制履行，对方可以请求其负担由第三人替代履行的费用【民法典第581条】</text>
<text x="844" y="1769" font-size="12" fill="#344054">(4)合同僵局：违约方起诉解除合同（不影响违约责任的承担）【民法典第580条第2款、《民法典合同编通则解释》第59条】</text>
<text x="844" y="1786" font-size="12" fill="#344054">  构成要件：①违约方主观上必须是非恶意的</text>
<text x="844" y="1803" font-size="12" fill="#344054">  ②违约方继续履行合同对其显失公平</text>
<text x="844" y="1820" font-size="12" fill="#344054">  ③守约方拒绝解除合同违反了诚信原则</text>
<text x="844" y="1837" font-size="12" fill="#344054">  ④不存在可替代承担违约责任的方式（违约金责任/损害赔偿金）</text>
<rect x="832" y="1860" width="300" height="68" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1882" font-size="14.5" font-weight="600" fill="#6F3A91">2.采取补救措施(3次)</text>
<text x="844" y="1902" font-size="12" fill="#344054">(1)包括瑕疵给付和加害给付</text>
<text x="844" y="1919" font-size="12" fill="#344054">(2)补救措施包括修理、更换、重作、退货、减价等【民法典第582条】</text>
<rect x="832" y="1942" width="300" height="374" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1964" font-size="14.5" font-weight="600" fill="#6F3A91">3.损害赔偿金(3次)</text>
<text x="844" y="1984" font-size="12" fill="#344054">(1)含义：又称为赔偿损失，是指违约方以支付金钱的方式弥补守约方因违约而遭受损失的责任形式</text>
<text x="844" y="2001" font-size="12" fill="#344054">  ⚠️ 这一部分内容来自《民法典》侵权责任编的补充，笔录应教材上同构句，没说清楚</text>
<text x="844" y="2018" font-size="12" fill="#344054">(1)约定损害赔偿金（等同于违约金，不论）</text>
<text x="844" y="2035" font-size="12" fill="#344054">(2)法定损害赔偿金：①惩罚性法定损害赔偿金【消费者权益保护法第55条第1款，欺诈消费者或服务费用3倍】</text>
<text x="844" y="2052" font-size="12" fill="#344054">  ②补偿性法定损害赔偿金【食品安全法第148条规定，伪劣食品的生产者或者经营者支付价款的10倍赔偿金】</text>
<text x="844" y="2069" font-size="12" fill="#344054">  ③【民法典合同编通则解释】第57条</text>
<text x="844" y="2086" font-size="12" fill="#344054">(2)范围：实际损失+可得利益（生产利润损失、经营利润损失、转售利润损失）</text>
<text x="844" y="2103" font-size="12" fill="#344054">(3)限制规则：①可预见性规则=不超过违反合同一方订立合同时预见到或者应当预见到的因违反合同可能造成的损失</text>
<text x="844" y="2120" font-size="12" fill="#344054">  ②减损规则（诚信原则）=①守约方应当采取适当措施防止损失的扩大；没有采取适当措施致使损失扩大的，不得就扩大的损失请求赔偿</text>
<text x="844" y="2137" font-size="12" fill="#344054">    ②当事人因防止损失扩大而支出的合理费用，由违约方负担</text>
<text x="844" y="2154" font-size="12" fill="#344054">  ③损益相抵规则=守约方因为损失发生的同一原因获得利益时，应当从损失赔偿额中扣除该部分利益（禁止得利原则）</text>
<text x="844" y="2171" font-size="12" fill="#344054">(4)继续履行/采取补救措施和损害赔偿金可以并用</text>
<text x="844" y="2188" font-size="12" fill="#344054">4.违约金（3次）：【民法典第585条、民法典合同编通则解释第64-66条】</text>
<text x="844" y="2205" font-size="12" fill="#344054">  (1)含义：是指依法律的规定或者当事人的约定，一方不履行或不适当履行合同时应向对方支付一定数额金钱的违约金</text>
<text x="844" y="2222" font-size="12" fill="#344054">  ②司法调整：①预先放弃调整违约金的条款无效；②调整方式为当事人抗辩或反诉</text>
<text x="844" y="2239" font-size="12" fill="#344054">    ③法院可以在一审或者二审程序中主动释明，也可以直接调整</text>
<text x="844" y="2256" font-size="12" fill="#344054">  (3)违约金调整规则：①本项作为债务请求权计算扣除或增加但限制</text>
<text x="844" y="2273" font-size="12" fill="#344054">    A. 约定违约金&lt;实际损失=可申请予以增加但不得超过实际损失</text>
<text x="844" y="2290" font-size="12" fill="#344054">    B. 约定违约金≥实际损失=①约定违约金≤130%实际损失，直接适用；②约定违约金&gt;130%实际损失，适当下调至实际损失100%~130%</text>
<text x="844" y="2307" font-size="12" fill="#344054">  (4)迟延履行违约金和继续履行可以并用</text>
<rect x="436" y="2517.0" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="2539.0" font-size="14.5" font-weight="600" fill="#0F7E80">讲53 违约责任（03）·定金</text>
<text x="448" y="2559.0" font-size="12" fill="#344054">来源 p063</text>
<rect x="832" y="2330" width="300" height="425" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2352" font-size="14.5" font-weight="600" fill="#0F7E80">5.定金【民法典第586-588条、民法典合同编通则解释第67、68条】</text>
<text x="844" y="2372" font-size="12" fill="#344054">(1)学理分类：①立约定金=预合同中的定金罚则，过错责任原则</text>
<text x="844" y="2389" font-size="12" fill="#344054">  ②成约定金=以交付定金为主合同成立的要件，自交付定金时主合同成立</text>
<text x="844" y="2406" font-size="12" fill="#344054">  ③证约定金=定金仅以证明主合同成立为目的</text>
<text x="844" y="2423" font-size="12" fill="#344054">  ④违约定金=①给付定金一方不履行债务的，不予返还；②收受定金一方不履行债务的，双倍返还</text>
<text x="844" y="2440" font-size="12" fill="#344054">  ⑤解约定金=以定金合同解除主合同的，双方按合同法解除权一方方约定金，收受定金一方方解约定金双倍返还定金</text>
<text x="844" y="2457" font-size="12" fill="#344054">(2)定金合同的限制：①定金数额不得超过主合同标的额的20%（超过部分不发生定金的效力）</text>
<text x="844" y="2474" font-size="12" fill="#344054">  ②实际交付的定金数额多于或者少于约定的数额，视为变更约定的定金数额</text>
<text x="844" y="2491" font-size="12" fill="#344054">  ③履行治愈规则：①当事人约定以交付定金作为合同成立或生效要件，但是合同主要义务已经履行完毕并为对方接受的，</text>
<text x="844" y="2508" font-size="12" fill="#344054">    法院应当认定合同成立或生效（民法典490条）</text>
<text x="844" y="2525" font-size="12" fill="#344054">    ②主合同已经履行或者已经履行主要部分的，不影响合同成立或生效</text>
<text x="844" y="2542" font-size="12" fill="#344054">(3)定金罚则：①债务人履行债务的，定金应当抵作价款或者收回</text>
<text x="844" y="2559" font-size="12" fill="#344054">  ②根本违约：①支付定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，无权请求返还定金</text>
<text x="844" y="2576" font-size="12" fill="#344054">    ②收受定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当双倍返还定金</text>
<text x="844" y="2593" font-size="12" fill="#344054">  ③当事人对继续履行和定金罚则同时提出主张，法院应当告知其择一选择</text>
<text x="844" y="2610" font-size="12" fill="#344054">(4)违约金和定金的关系：违约金和定金不得并用，只能择一【民法典第588条】</text>
<text x="844" y="2627" font-size="12" fill="#344054">  ①相同：都是合同预先约定的、在一方违约的情形下向对方支付的形式</text>
<text x="844" y="2644" font-size="12" fill="#344054">  ②不同：①定金是由一方预先给付对方一定的金钱，担保性质；②违约金是在违约行为发生后，</text>
<text x="844" y="2661" font-size="12" fill="#344054">    违约方给付守约方的赔偿金，本质上属于补偿性金钱给付</text>
<text x="844" y="2678" font-size="12" fill="#344054">(5)定金和补偿性损害赔偿金的关系：定金不足以弥补一方违约造成的损失的，对方可以请求赔偿超过定金数额的损失</text>
<text x="844" y="2695" font-size="12" fill="#344054">  ①定金是惩罚性的，损害赔偿金是补偿性的，可以并用</text>
<text x="844" y="2712" font-size="12" fill="#344054">  ②定金和损失赔偿的数额总和不应高于因违约造成的损失</text>
<text x="844" y="2729" font-size="12" fill="#344054">  例：甲乙之间订立合同，甲支付给乙定金5万元，后乙违约导致甲的损失为8万元，那么本案中如果索要违约金？</text>
<text x="844" y="2746" font-size="12" fill="#344054">  甲可以要求乙赔偿的损失数额：5×2=10&gt;8=甲可以要求乙赔偿损失8万元</text>
