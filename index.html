<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的数字桌面</title>
  <style>
    :root {
      --primary: #00aaff;
      --primary-rgb: 0, 170, 255;
      --primary-soft: rgba(0, 170, 255, 0.15);
      --bg: #0b0f14;
      --surface: #111824;
      --surface-hover: #16202e;
      --text: #e6eef7;
      --text-secondary: #8ca0b3;
      --border: rgba(148, 178, 204, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      --transition: 0.25s ease;
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-hover: #f6f9fc;
      --text: #1a2330;
      --text-secondary: #5d6e82;
      --border: rgba(30, 41, 59, 0.10);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background var(--transition), color var(--transition);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* 顶部通栏 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 18px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: background var(--transition);
    }

    .greeting h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .greeting span {
      color: var(--primary);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .clock {
      text-align: right;
    }

    .clock .time {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
    }

    .clock .date {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .theme-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-hover);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform var(--transition), border-color var(--transition);
    }

    .theme-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    /* 数据导出/导入（跨设备同步） */
    .sync-group { display: flex; gap: 8px; align-items: center; }
    .sync-btn {
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-hover);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition), color var(--transition);
    }
    .sync-btn:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 主体三栏 */
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      display: flex;
      flex-direction: column;
      min-height: 320px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.42);
    }

    [data-theme="light"] .card:hover {
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.14);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      color: var(--primary);
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* 今日状态 */
    .status-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .status-chip {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .goal-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition);
    }

    .goal-input:focus {
      border-color: var(--primary);
    }

    .goal-input::placeholder {
      color: var(--text-secondary);
    }

    /* 待办 */
    .todo-input-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .todo-input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    .todo-input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .todo-list {
      list-style: none;
      overflow-y: auto;
      max-height: 260px;
      flex: 1;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 12px;
      transition: background var(--transition);
    }

    .todo-item:hover {
      background: var(--surface-hover);
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-item span {
      flex: 1;
      word-break: break-word;
      transition: color var(--transition);
    }

    .todo-item.done span {
      text-decoration: line-through;
      color: var(--text-secondary);
    }

    .del-btn {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0.45;
      transition: opacity var(--transition), background var(--transition), color var(--transition);
    }

    .del-btn:hover {
      opacity: 1;
      background: rgba(255, 70, 70, 0.12);
      color: #ff5a5a;
    }

    .todo-item:hover .del-btn {
      opacity: 0.75;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #4dc3ff);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* 便签 */
    .insp-input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 14px;
    }

    .insp-input {
      flex: 1;
      width: 100%;
      min-height: 64px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    .insp-input:focus {
      border-color: var(--primary);
    }

    .insp-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .insp-card {
      position: relative;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 12px 10px;
      transition: all var(--transition);
    }

    .insp-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .insp-card.starred {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .insp-text {
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      padding-right: 58px;
    }

    .insp-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .insp-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0.45;
      transition: opacity var(--transition);
    }

    .insp-card:hover .insp-actions {
      opacity: 1;
    }

    .insp-actions button {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .insp-actions button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .insp-star.on {
      color: var(--primary);
      border-color: var(--primary);
    }

    /* 番茄钟 */
    .pomodoro {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .timer-ring {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 16px;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-ring circle {
      fill: none;
      stroke-width: 8;
    }

    .timer-bg {
      stroke: var(--bg);
    }

    .timer-progress {
      stroke: var(--primary);
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s linear;
      filter: drop-shadow(0 0 6px rgba(var(--primary-rgb), 0.55));
    }

    .timer-display {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .timer-controls button {
      padding: 8px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-weight: 500;
      transition: all var(--transition);
    }

    .timer-controls button:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .timer-controls button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .timer-controls button.primary:hover {
      opacity: 0.9;
    }

    /* 快捷入口 */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 14px;
      flex: 1;
    }

    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px 8px;
      border-radius: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: transform var(--transition), border-color var(--transition), background var(--transition);
    }

    .link-item:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      background: var(--surface-hover);
    }

    .link-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .link-name {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      word-break: break-all;
      line-height: 1.3;
    }

    .link-delete {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 70, 70, 0.85);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.35;
      display: grid;
      place-items: center;
      line-height: 1;
      transition: opacity var(--transition);
    }

    .link-item:hover .link-delete {
      opacity: 1;
    }

    .add-link {
      border-style: dashed;
      color: var(--text-secondary);
    }

    .add-link .link-icon {
      background: transparent;
      color: var(--text-secondary);
      font-size: 1.4rem;
    }

    .link-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .link-form.open {
      display: flex;
    }

    .link-form input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .link-form input:focus {
      border-color: var(--primary);
    }

    .link-form-actions {
      display: flex;
      gap: 10px;
    }

    .link-form-actions button {
      flex: 1;
      padding: 8px 0;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }

    /* 法考模块 */
    .fakao-section {
      grid-column: 1 / -1;
    }

    .fakao-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .fakao-meta {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .fakao-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .fakao-nav button {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .fakao-nav button.active,
    .fakao-nav button:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .mindmap-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .mindmap-card.today {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-soft);
    }

    .mindmap-card .phase {
      font-size: 0.72rem;
      color: var(--text-secondary);
      margin-top: auto;
      padding-top: 2px;
    }

    .mindmap-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mindmap-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      background: var(--surface-hover);
    }

    .mindmap-card .tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      align-self: flex-start;
    }

    .mindmap-card .title {
      font-weight: 600;
    }

    .mindmap-card .desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .empty-state {
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 20px 0;
    }

    /* 法考：每日/导图 视图切换 */
    .fakao-view {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .fakao-view button,
    .fakao-subnav button {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .fakao-view button.active,
    .fakao-view button:hover,
    .fakao-subnav button.active,
    .fakao-subnav button:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }

    .fakao-subnav {
      margin-bottom: 14px;
    }

    .mindmap-svg-wrap {
      max-height: 560px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      padding: 12px;
      color: var(--text);
    }

    .mindmap-svg-wrap svg {
      display: block;
    }

    .mm-legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .mm-legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .mm-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    /* 模态框 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h3 {
      font-size: 1.1rem;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-size: 1.2rem;
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: rgba(255, 70, 70, 0.12);
      color: #ff5a5a;
    }

    .modal-body {
      padding: 22px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body img,
    .modal-body svg {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* 思维导图拖拽缩放容器 */
    .mm-panzoom {
      position: relative;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background: #f8f9fa;
      border-radius: 12px;
    }
    .mm-panzoom:active { cursor: grabbing; }
    .mm-panzoom-inner {
      transform-origin: 0 0;
      transition: transform 0.1s ease-out;
    }
    .mm-panzoom-inner.dragging { transition: none; }
    .mm-panzoom-hint {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 0.72rem;
      color: rgba(0,0,0,0.4);
      background: rgba(255,255,255,0.85);
      padding: 2px 8px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 2;
    }
    .mm-panzoom-reset {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 0.72rem;
      color: #00aaff;
      background: rgba(255,255,255,0.92);
      border: 1px solid #cceeff;
      padding: 3px 10px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 2;
    }
    .mm-panzoom-reset:hover { background: #e6f7ff; }

    .modal-placeholder {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    @media (max-width: 640px) {
      .container {
        padding: 14px;
      }

      header {
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }

      .top-right {
        width: 100%;
        justify-content: center;
      }

      .clock {
        text-align: center;
      }

      .card {
        min-height: auto;
      }

      .del-btn,
      .link-delete {
        opacity: 0.7;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="greeting">
        <h1 id="greeting">你好，<span>朋友</span></h1>
      </div>
      <div class="top-right">
        <div class="clock">
          <div class="time" id="clock-time">00:00:00</div>
          <div class="date" id="clock-date">----年--月--日 第--周</div>
        </div>
        <button class="theme-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
        </button>
        <div class="sync-group">
          <button class="sync-btn" id="export-btn" title="导出全部数据为备份文件（用于换设备恢复）">导出</button>

    <main class="dashboard">

      <section class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
          待办清单

        <div class="card-body">
          <div class="todo-input-wrap">

            <button class="btn" id="todo-add">添加</button>
          </div>
          <ul class="todo-list" id="todo-list"></ul>
          <div class="progress-wrap">
            <div class="progress-info">
              <span>完成进度</span>

            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 中间：便签 + 番茄钟 -->
      <section class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          灵感便签
        </div>
        <div class="card-body">
          <div class="insp-input-wrap">
            <textarea class="insp-input" id="insp-input" placeholder="写一条灵感，点“添加灵感”保存（Ctrl/⌘+Enter 也可）…"></textarea>
            <button class="btn primary" id="insp-add">添加灵感</button>
          </div>
          <ul class="insp-list" id="insp-list"></ul>

          <div class="pomodoro">
            <div class="card-title" style="justify-content:center;margin-bottom:10px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>

            <div class="link-form-actions">

      <!-- 法考任务 -->
      <section class="card fakao-section">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"></path><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"></path></svg>

  <!-- 思维导图预览模态框 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">思维导图</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="modal-placeholder">点击卡片查看详情</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const LS = {
        get(k, def) {
          try {
            const v = localStorage.getItem(k);
            return v === null ? def : JSON.parse(v);
          } catch (e) {
            return def;
          }
        },
        set(k, v) {
          try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
        }
      };

      // ========== 主题 ==========
      const themeKey = 'desktop-theme';
      const themeToggle = document.getElementById('theme-toggle');
      const root = document.documentElement;

      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        LS.set(themeKey, theme);
      }

      themeToggle.addEventListener('click', () => {
        const current = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(current);
      });

      const savedTheme = LS.get(themeKey, 'dark');
      applyTheme(savedTheme);

      // ========== 问候语与时间 ==========
      const greetingEl = document.getElementById('greeting');
      const timeEl = document.getElementById('clock-time');
      const dateEl = document.getElementById('clock-date');
      const nicknameKey = 'desktop-nickname';

      function getWeekNumber(d) {
        const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const dayNum = tmp.getUTCDay() || 7;
        tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
        return Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
      }

      function updateClock() {
        const now = new Date();
        const hour = now.getHours();
        const greet = hour < 6 ? '夜深了' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
        const nickname = LS.get(nicknameKey, '朋友');
        greetingEl.innerHTML = `${greet}，<span>${escapeHtml(nickname)}</span>`;

        timeEl.textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
        const week = getWeekNumber(now);
        dateEl.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 第${week}周`;
      }

      setInterval(updateClock, 1000);
      updateClock();

      // 双击昵称可修改
      greetingEl.addEventListener('dblclick', () => {
        const next = prompt('设置你的昵称：', LS.get(nicknameKey, '朋友'));
        if (next !== null && next.trim() !== '') {
          LS.set(nicknameKey, next.trim());
          updateClock();
        }
      });

      // ========== 今日目标 ==========
      const dailyGoalInput = document.getElementById('daily-goal');
      const goalKey = 'daily-goal';
      dailyGoalInput.value = LS.get(goalKey, '');
      dailyGoalInput.addEventListener('input', () => LS.set(goalKey, dailyGoalInput.value));

      // ========== 待办 ==========
      const todoInput = document.getElementById('todo-input');
      const todoAdd = document.getElementById('todo-add');
      const todoList = document.getElementById('todo-list');
      const progressText = document.getElementById('progress-text');
      const progressFill = document.getElementById('progress-fill');
      const todosKey = 'todos';

      let todos = LS.get(todosKey, []);

      function renderTodos() {
        todoList.innerHTML = '';
        let done = 0;
        todos.forEach((t, i) => {
          if (t.done) done++;
          const li = document.createElement('li');
          li.className = 'todo-item' + (t.done ? ' done' : '');
          li.innerHTML = `
            <input type="checkbox" ${t.done ? 'checked' : ''} data-index="${i}" aria-label="完成任务" />
            <span>${escapeHtml(t.text)}</span>
            <button class="del-btn" data-index="${i}" aria-label="删除任务">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>
            </button>
          `;
          todoList.appendChild(li);
        });

        const total = todos.length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        progressText.textContent = `${done}/${total}`;
        progressFill.style.width = `${pct}%`;
        LS.set(todosKey, todos);
      }

      function addTodo() {
        const text = todoInput.value.trim();
        if (!text) return;
        todos.unshift({ text, done: false });
        todoInput.value = '';
        renderTodos();
      }

      todoAdd.addEventListener('click', addTodo);
      todoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });

      todoList.addEventListener('change', (e) => {
        if (e.target.tagName === 'INPUT') {
          const idx = +e.target.dataset.index;
          todos[idx].done = e.target.checked;
          renderTodos();
        }
      });

      todoList.addEventListener('click', (e) => {
        const btn = e.target.closest('.del-btn');
        if (btn) {
          const idx = +btn.dataset.index;
          todos.splice(idx, 1);
          renderTodos();
        }
      });

      renderTodos();

      // ========== 灵感便签（多条卡片，可增删 / 标星） ==========
      const inspKey = 'inspiration-list';
      const inspInput = document.getElementById('insp-input');
      const inspAdd = document.getElementById('insp-add');
      const inspList = document.getElementById('insp-list');

      let insps = LS.get(inspKey, []);

      function fmtInspTime(ts) {
        const d = new Date(ts);
        const p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      }

      function renderInsps() {
        inspList.innerHTML = '';
        if (!insps.length) {
          inspList.innerHTML = '<li class="empty-state">还没有灵感，写一条吧 ✦</li>';
          return;
        }
        insps.forEach(item => {
          const li = document.createElement('li');
          li.className = 'insp-card' + (item.starred ? ' starred' : '');
          li.innerHTML = `
            <div class="insp-text">${escapeHtml(item.text)}</div>
            <div class="insp-meta">
              <span>${fmtInspTime(item.time)}</span>
              ${item.starred ? '<span>★ 已标星</span>' : ''}
            </div>
            <div class="insp-actions">
              <button class="insp-star ${item.starred ? 'on' : ''}" title="标星 / 取消">${item.starred ? '★' : '☆'}</button>
              <button class="insp-del" title="删除">✕</button>
            </div>`;
          li.querySelector('.insp-del').addEventListener('click', () => {
            insps = insps.filter(x => x.id !== item.id);
            LS.set(inspKey, insps);
            renderInsps();
          });
          li.querySelector('.insp-star').addEventListener('click', () => {
            item.starred = !item.starred;
            LS.set(inspKey, insps);
            renderInsps();
          });
          inspList.appendChild(li);
        });
      }

      function addInsp() {
        const text = inspInput.value.trim();
        if (!text) { inspInput.focus(); return; }
        insps.unshift({
          id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
          text,
          time: Date.now(),
          starred: false
        });
        LS.set(inspKey, insps);
        inspInput.value = '';
        inspInput.focus();
        renderInsps();
      }

      inspAdd.addEventListener('click', addInsp);
      inspInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') addInsp();
      });

      renderInsps();

      // ========== 番茄钟 ==========
      const DEFAULT_MINUTES = 25;
      const timerDisplay = document.getElementById('timer-display');
      const timerProgress = document.getElementById('timer-progress');
      const btnStart = document.getElementById('timer-start');
      const btnPause = document.getElementById('timer-pause');
      const btnReset = document.getElementById('timer-reset');
      const CIRCUMFERENCE = 2 * Math.PI * 72; // ~452.39

      let totalSeconds = DEFAULT_MINUTES * 60;
      let remaining = totalSeconds;
      let timerId = null;
      let audioCtx = null;

      function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function updateTimerUI() {
        timerDisplay.textContent = formatTime(remaining);
        const offset = CIRCUMFERENCE * (1 - remaining / totalSeconds);
        timerProgress.style.strokeDashoffset = offset;
        document.title = remaining < totalSeconds ? `(${formatTime(remaining)}) 我的数字桌面` : '我的数字桌面';
      }

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playBeep() {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.5);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.5);

        // 再响一声
        setTimeout(() => {
          const now2 = audioCtx.currentTime;
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now2);
          osc2.frequency.exponentialRampToValueAtTime(440, now2 + 0.5);
          gain2.gain.setValueAtTime(0.15, now2);
          gain2.gain.exponentialRampToValueAtTime(0.001, now2 + 0.5);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start(now2);
          osc2.stop(now2 + 0.5);
        }, 600);
      }

      function startTimer() {
        initAudio();
        if (timerId) return;
        if (remaining <= 0) remaining = totalSeconds;
        btnStart.textContent = '进行中';
        btnStart.classList.add('primary');
        timerId = setInterval(() => {
          remaining--;
          updateTimerUI();
          if (remaining <= 0) {
            clearInterval(timerId);
            timerId = null;
            remaining = 0;
            btnStart.textContent = '开始';
            playBeep();
            if ('Notification' in window && Notification.permission === 'granted') {
              new Notification('番茄钟结束', { body: '专注时间到，休息一下吧。' });
            } else {
              alert('专注时间到，休息一下吧。');
            }
          }
        }, 1000);
      }

      function pauseTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
          btnStart.textContent = '继续';
        }
      }

      function resetTimer() {
        pauseTimer();
        remaining = totalSeconds;
        btnStart.textContent = '开始';
        updateTimerUI();
        document.title = '我的数字桌面';
      }

      btnStart.addEventListener('click', startTimer);
      btnPause.addEventListener('click', pauseTimer);
      btnReset.addEventListener('click', resetTimer);

      // 页面可见性变化时保持计时准确（简单处理：依赖 setInterval）
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }

      updateTimerUI();

      // ========== 快捷入口 ==========
      const linksGrid = document.getElementById('links-grid');
      const addLinkBtn = document.getElementById('add-link-btn');
      const linkForm = document.getElementById('link-form');
      const linkNameInput = document.getElementById('link-name-input');
      const linkUrlInput = document.getElementById('link-url-input');
      const linkSave = document.getElementById('link-save');
      const linkCancel = document.getElementById('link-cancel');
      const linksKey = 'quick-links';

      const defaultLinks = [
        { name: '众合在线', url: 'https://www.zhongheedu.com/' },
        { name: '北大法宝', url: 'https://www.pkulaw.com/' },
        { name: '法信', url: 'http://www.faxin.cn/' },
        { name: 'B站', url: 'https://www.bilibili.com/' },
        { name: 'GitHub', url: 'https://github.com/' }
      ];

      let links = LS.get(linksKey, null);
      if (!links || !links.length) {
        links = defaultLinks;
        LS.set(linksKey, links);
      }

      function getFavicon(url) {
        try {
          const u = new URL(url);
          return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;
        } catch (e) {
          return '';
        }
      }

      function renderLinks() {
        // 保留添加按钮
        linksGrid.innerHTML = '';
        links.forEach((link, i) => {
          const div = document.createElement('div');
          div.className = 'link-item';
          div.title = link.name;
          div.innerHTML = `
            <button class="link-delete" data-index="${i}" aria-label="删除">&times;</button>
            <div class="link-icon" style="font-size:0.75rem;background-size:cover;background-position:center;${getFavicon(link.url) ? `background-image:url('${getFavicon(link.url)}');color:transparent;` : ''}">${link.name.slice(0, 2)}</div>
            <div class="link-name">${escapeHtml(link.name)}</div>
          `;
          div.addEventListener('click', (e) => {
            if (e.target.closest('.link-delete')) return;
            window.open(link.url, '_blank', 'noopener,noreferrer');
          });
          linksGrid.appendChild(div);
        });
        linksGrid.appendChild(addLinkBtn);
      }

      addLinkBtn.addEventListener('click', () => {
        linkForm.classList.add('open');
        linkNameInput.focus();
      });

      linkCancel.addEventListener('click', () => {
        linkForm.classList.remove('open');
        linkNameInput.value = '';
        linkUrlInput.value = '';
      });

      linkSave.addEventListener('click', () => {
        const name = linkNameInput.value.trim();
        let url = linkUrlInput.value.trim();
        if (!name || !url) return;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        links.push({ name, url });
        LS.set(linksKey, links);
        renderLinks();
        linkForm.classList.remove('open');
        linkNameInput.value = '';
        linkUrlInput.value = '';
      });

      linksGrid.addEventListener('click', (e) => {
        const del = e.target.closest('.link-delete');
        if (del) {
          const idx = +del.dataset.index;
          links.splice(idx, 1);
          LS.set(linksKey, links);
          renderLinks();
        }
      });

      renderLinks();

  const mindmapImages = {

<text x="52" y="618.0" font-size="12" fill="#344054">p003 / p009-p011</text>
<rect x="436" y="168.5" width="300" height="68" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="448" y="190.5" font-size="14.5" font-weight="600" fill="#5B6B7C">讲1 序言·备考方法</text>
<text x="448" y="210.5" font-size="12" fill="#344054">来源 p003 编者碎碎念</text>
<text x="448" y="227.5" font-size="12" fill="#344054">（编者备考建议·非考点）</text>
<rect x="832" y="20" width="300" height="68" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#5B6B7C">备考周期</text>
<text x="844" y="62" font-size="12" fill="#344054">由学习能力倒推：3-12个月</text>
<text x="844" y="79" font-size="12" fill="#344054">根据高考/期末考评估能力</text>
<rect x="832" y="102" width="300" height="85" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="124" font-size="14.5" font-weight="600" fill="#5B6B7C">抓基础</text>
<text x="844" y="144" font-size="12" fill="#344054">基础不牢·地动山摇</text>
<text x="844" y="161" font-size="12" fill="#344054">真题2-3遍·疑难不过分纠结</text>
<text x="844" y="178" font-size="12" fill="#344054">越临近越回归基础</text>
<rect x="832" y="201" width="300" height="85" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="223" font-size="14.5" font-weight="600" fill="#5B6B7C">完成度大于一切</text>
<text x="844" y="243" font-size="12" fill="#344054">八科不放弃任一科</text>
<text x="844" y="260" font-size="12" fill="#344054">合理分配复习节奏·不要一科</text>
<text x="844" y="277" font-size="12" fill="#344054">严格按照分值比例分配时间</text>
<rect x="832" y="300" width="300" height="85" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="322" font-size="14.5" font-weight="600" fill="#5B6B7C">追求60分而非满分</text>
<text x="844" y="342" font-size="12" fill="#344054">法考是过关性考试</text>
<text x="844" y="359" font-size="12" fill="#344054">不要执着做题正确率</text>
<text x="844" y="376" font-size="12" fill="#344054">没人能短期吃透所有知识点</text>
<rect x="436" y="557.5" width="300" height="51" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="448" y="579.5" font-size="14.5" font-weight="600" fill="#185FA5">讲2 民事法律关系的基本原理</text>
<text x="448" y="599.5" font-size="12" fill="#344054">来源 p009-p010</text>
<rect x="832" y="399" width="300" height="85" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="844" y="421" font-size="14.5" font-weight="600" fill="#185FA5">含义</text>
<text x="844" y="441" font-size="12" fill="#344054">平等主体之间的社会关系</text>
<text x="844" y="458" font-size="12" fill="#344054">以民事权利和民事义务为内容</text>
<text x="844" y="475" font-size="12" fill="#344054">【民法典第2条】</text>
<rect x="832" y="498" width="300" height="153" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="844" y="520" font-size="14.5" font-weight="600" fill="#185FA5">与非民事法律关系的区别（4种）</text>
<text x="844" y="540" font-size="12" fill="#344054">(1)行政法律关系：原则不平等→非民事</text>
<text x="844" y="557" font-size="12" fill="#344054">  例外：机关法人从事民事活动</text>
<text x="844" y="574" font-size="12" fill="#344054">(2)人自己的活动：分公司业务指导等</text>
<text x="844" y="591" font-size="12" fill="#344054">(3)不能产生私法效果的人身关系</text>
<text x="844" y="608" font-size="12" fill="#344054">  恋爱/同居/朋友/网友【勘误已修】</text>
<text x="844" y="625" font-size="12" fill="#344054">(4)不能产生私法效果的财产关系</text>
<text x="844" y="642" font-size="12" fill="#344054">  好意施惠/戏虐行为【勘误已修】</text>
<rect x="832" y="665" width="300" height="102" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="844" y="687" font-size="14.5" font-weight="600" fill="#185FA5">民事法律关系要素</text>
<text x="844" y="707" font-size="12" fill="#344054">①主体三元论：自然/法/非法人组织</text>
<text x="844" y="724" font-size="12" fill="#344054">②内容：民事权利+民事义务</text>
<text x="844" y="741" font-size="12" fill="#344054">  民事责任优先原则（财产不足时）</text>
<text x="844" y="758" font-size="12" fill="#344054">③客体：物权/债权/人身权/知识/继承权</text>
<rect x="436" y="948.0" width="300" height="51" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="448" y="970.0" font-size="14.5" font-weight="600" fill="#2A8D4F">讲3 自然人01·民权能力+行为能力</text>
<text x="448" y="990.0" font-size="12" fill="#344054">来源 p011</text>
<rect x="832" y="781" width="300" height="136" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="803" font-size="14.5" font-weight="600" fill="#2A8D4F">民事权利能力</text>
<text x="844" y="823" font-size="12" fill="#344054">胎儿：原则无权利能力</text>
<text x="844" y="840" font-size="12" fill="#344054">  例外：继承/赠与/侵权</text>
<text x="844" y="857" font-size="12" fill="#344054">死者人格利益保护：</text>
<text x="844" y="874" font-size="12" fill="#344054">  七项人格利益侵权客体</text>
<text x="844" y="891" font-size="12" fill="#344054">  近亲属起诉【民诉典第1045条】</text>
<text x="844" y="908" font-size="12" fill="#344054">  赔偿金≠死者遗产</text>
<rect x="832" y="931" width="300" height="119" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="953" font-size="14.5" font-weight="600" fill="#2A8D4F">民事行为能力</text>
<text x="844" y="973" font-size="12" fill="#344054">完全：≥18周岁或16+劳动收入</text>
<text x="844" y="990" font-size="12" fill="#344054">  【民法典第18条第2款】</text>
<text x="844" y="1007" font-size="12" fill="#344054">限制：8≤X&lt;18 / 不能完全辨认</text>
<text x="844" y="1024" font-size="12" fill="#344054">  纯获利益有效·其他效力待定</text>
<text x="844" y="1041" font-size="12" fill="#344054">无：&lt;8周岁·一律无效</text>
<rect x="832" y="1064" width="300" height="102" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1086" font-size="14.5" font-weight="600" fill="#2A8D4F">监护确定(1)法定监护</text>
<text x="844" y="1106" font-size="12" fill="#344054">未成年人顺位：父母&gt;(外)祖父母</text>
<text x="844" y="1123" font-size="12" fill="#344054">  &gt;兄姐&gt;其他个人&gt;其他组织&gt;单位/民政</text>
<text x="844" y="1140" font-size="12" fill="#344054">成年人顺位：配偶&gt;父母/子女</text>
<text x="844" y="1157" font-size="12" fill="#344054">  &gt;其他近亲属&gt;其他个人&gt;单位/民政</text>
</svg>`,

<text x="52" y="1001.5" font-size="12" fill="#344054">p011-p016</text>
<rect x="436" y="194.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="216.0" font-size="14.5" font-weight="600" fill="#854F0B">讲4 自然人02·监护确定(2)(3)</text>
<text x="448" y="236.0" font-size="12" fill="#344054">来源 p011-p012</text>
<rect x="832" y="20" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">遗嘱指定监护</text>
<text x="844" y="62" font-size="12" fill="#344054">主体：父母且正在担任监护人</text>
<text x="844" y="79" font-size="12" fill="#344054">方式：只能是遗嘱</text>
<text x="844" y="96" font-size="12" fill="#344054">被指定者具优先地位</text>
<rect x="832" y="119" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="141" font-size="14.5" font-weight="600" fill="#854F0B">协议监护</text>
<text x="844" y="161" font-size="12" fill="#344054">父母可与他人约定</text>
<text x="844" y="178" font-size="12" fill="#344054">家庭会议选定监护人</text>
<text x="844" y="195" font-size="12" fill="#344054">不受法定顺序人数限制</text>
<text x="844" y="212" font-size="12" fill="#344054">【民法典第30条+总则编解释第8条】</text>
<rect x="832" y="235" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="257" font-size="14.5" font-weight="600" fill="#854F0B">成年人意定监护</text>
<text x="844" y="277" font-size="12" fill="#344054">全部/部分丧失前委托</text>
<text x="844" y="294" font-size="12" fill="#344054">书面形式（广义）</text>
<text x="844" y="311" font-size="12" fill="#344054">优先于法定监护</text>
<rect x="832" y="334" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="356" font-size="14.5" font-weight="600" fill="#854F0B">临时委托监护</text>
<text x="844" y="376" font-size="12" fill="#344054">通过委托合同临时照顾</text>
<text x="844" y="393" font-size="12" fill="#344054">不导致监护职责丧失</text>
<text x="844" y="410" font-size="12" fill="#344054">委托人仍是监护人</text>
<rect x="436" y="591.5" width="300" height="51" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="448" y="613.5" font-size="14.5" font-weight="600" fill="#185FA5">讲5 自然人03·监护确定(4-6)+职责</text>

<text x="844" y="455" font-size="14.5" font-weight="600" fill="#185FA5">指定监护</text>
<text x="844" y="475" font-size="12" fill="#344054">前提：父母双亡或丧失能力</text>
<text x="844" y="492" font-size="12" fill="#344054">或对监护人确定有争议</text>
<text x="844" y="509" font-size="12" fill="#344054">主体：住所地居/村/民政/法院</text>
<text x="844" y="526" font-size="12" fill="#344054">30日内可向法院起诉</text>
<text x="844" y="543" font-size="12" fill="#344054">择优指定+临时监护人</text>

<text x="844" y="588" font-size="14.5" font-weight="600" fill="#185FA5">协议vs临时委托对比</text>
<text x="844" y="608" font-size="12" fill="#344054">协议：协议主体须有监护资格</text>
<text x="844" y="625" font-size="12" fill="#344054">  父母除外·导致监护职责丧失</text>
<text x="844" y="642" font-size="12" fill="#344054">临时委托：受托人不受资格限制</text>
<text x="844" y="659" font-size="12" fill="#344054">  不导致监护职责丧失</text>

<text x="844" y="704" font-size="14.5" font-weight="600" fill="#185FA5">监护人职责</text>
<text x="844" y="724" font-size="12" fill="#344054">财产：原则不得处分被监护人财产</text>
<text x="844" y="741" font-size="12" fill="#344054">  例外：为维护被监护人利益</text>
<text x="844" y="758" font-size="12" fill="#344054">人身：不得随意捐赠人体器官</text>
<text x="844" y="775" font-size="12" fill="#344054">  死亡后需父母双方共同+书面</text>
<text x="844" y="792" font-size="12" fill="#344054">突发事件临时照料【民法典第34条】</text>

<text x="448" y="957.5" font-size="12" fill="#344054">来源 p013-p014</text>

<text x="844" y="837" font-size="14.5" font-weight="600" fill="#6F3A91">撤销情形（极少数严重）</text>
<text x="844" y="857" font-size="12" fill="#344054">积极侵权：性侵/出卖/虐待/遗弃/</text>
<text x="844" y="874" font-size="12" fill="#344054">  暴力伤害等</text>
<text x="844" y="891" font-size="12" fill="#344054">消极侵权：怠于履责+拒绝委托+</text>
<text x="844" y="908" font-size="12" fill="#344054">  导致危险状态（吸毒/赌博/酗酒）</text>
<text x="844" y="925" font-size="12" fill="#344054">兜底：诱骗乞讨/教唆违法/利用</text>
<text x="844" y="942" font-size="12" fill="#344054">  被监护人财产严重侵权</text>
<rect x="832" y="965" width="300" height="102" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="987" font-size="14.5" font-weight="600" fill="#6F3A91">申请与法律后果</text>
<text x="844" y="1007" font-size="12" fill="#344054">申请：个人/组织/民政部门</text>
<text x="844" y="1024" font-size="12" fill="#344054">撤销机关：法院（特别程序）</text>
<text x="844" y="1041" font-size="12" fill="#344054">后果：临时监护+新指定</text>
<text x="844" y="1058" font-size="12" fill="#344054">  扶养义务不免除（基于血缘）</text>

<text x="448" y="1298.5" font-size="12" fill="#344054">来源 p014-p015</text>
<rect x="832" y="1081" width="300" height="119" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1103" font-size="14.5" font-weight="600" fill="#0F7E80">监护资格恢复</text>
<text x="844" y="1123" font-size="12" fill="#344054">确有悔改表现</text>
<text x="844" y="1140" font-size="12" fill="#344054">尊重被监护人真实意愿</text>
<text x="844" y="1157" font-size="12" fill="#344054">申请主体：仅父母或子女</text>
<text x="844" y="1174" font-size="12" fill="#344054">法院恢复</text>
<text x="844" y="1191" font-size="12" fill="#344054">故意犯罪永久丧失不得恢复</text>
<rect x="832" y="1214" width="300" height="119" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1236" font-size="14.5" font-weight="600" fill="#0F7E80">监护关系终止【39/175】</text>
<text x="844" y="1256" font-size="12" fill="#344054">绝对终止：恢复完全行为能力/死亡</text>

<text x="844" y="1290" font-size="12" fill="#344054">  被撤销/辞去/法院许可变更</text>
<text x="844" y="1307" font-size="12" fill="#344054">父母离婚改姓名≠终止</text>
<text x="844" y="1324" font-size="12" fill="#344054">仍需监护→另行确定</text>

<text x="844" y="1369" font-size="14.5" font-weight="600" fill="#0F7E80">宣告失踪【40-45】</text>
<text x="844" y="1389" font-size="12" fill="#344054">下落不明满2年</text>
<text x="844" y="1406" font-size="12" fill="#344054">基层法院受理·公告3个月</text>
<text x="844" y="1423" font-size="12" fill="#344054">保护失踪人财产利益</text>
<text x="844" y="1440" font-size="12" fill="#344054">财产代管人：配偶/父母/成年子女等</text>
<text x="844" y="1457" font-size="12" fill="#344054">  重大过失造成损失→赔偿</text>
<text x="844" y="1474" font-size="12" fill="#344054">撤销：失踪人重新出现</text>

<text x="448" y="1711.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲8 自然人06·宣告死亡</text>
<text x="448" y="1731.5" font-size="12" fill="#344054">来源 p015-p016</text>
<rect x="832" y="1497" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1519" font-size="14.5" font-weight="600" fill="#B83A4A">情形与程序【46-53】</text>
<text x="844" y="1539" font-size="12" fill="#344054">一般情形：下落不明满4年</text>
<text x="844" y="1556" font-size="12" fill="#344054">意外事件：满2年</text>
<text x="844" y="1573" font-size="12" fill="#344054">意外事件+证明：随时</text>
<text x="844" y="1590" font-size="12" fill="#344054">公告：1年（一般/意外）</text>
<text x="844" y="1607" font-size="12" fill="#344054">  或3个月（意外+证明）</text>
<rect x="832" y="1630" width="300" height="187" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1652" font-size="14.5" font-weight="600" fill="#B83A4A">法律效力：妻离子散家破人亡</text>
<text x="844" y="1672" font-size="12" fill="#344054">妻离：婚姻关系自动消除</text>
<text x="844" y="1689" font-size="12" fill="#344054">  撤销：原则上自动恢复</text>
<text x="844" y="1706" font-size="12" fill="#344054">  但再婚/书面不愿恢复→不恢复</text>
<text x="844" y="1723" font-size="12" fill="#344054">子女：单方送养有效</text>
<text x="844" y="1740" font-size="12" fill="#344054">  撤销后：8岁以下可要回</text>
<text x="844" y="1757" font-size="12" fill="#344054">家破：按遗产继承</text>
<text x="844" y="1774" font-size="12" fill="#344054">  撤销：不能返还但可适当补偿</text>
<text x="844" y="1791" font-size="12" fill="#344054">人亡：死亡日期判决日/意外日</text>
<text x="844" y="1808" font-size="12" fill="#344054">  被宣告期间行为仍有效【49】</text>

<text x="844" y="79" font-size="12" fill="#344054">设立→存续→消灭</text>

<text x="844" y="1205" font-size="14.5" font-weight="600" fill="#6F3A91">三主体对比</text>
<text x="844" y="1225" font-size="12" fill="#344054">自然人：独立·无限责任</text>
<text x="844" y="1242" font-size="12" fill="#344054">法人：独立·认缴为限</text>
<text x="844" y="1259" font-size="12" fill="#344054">非法人组织：相对独立</text>
<text x="844" y="1276" font-size="12" fill="#344054">  补充无限（连带）</text>
<rect x="436" y="1490.0" width="300" height="51" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="448" y="1512.0" font-size="14.5" font-weight="600" fill="#2A8D4F">专题03-01 法律行为基本原理</text>
<text x="448" y="1532.0" font-size="12" fill="#344054">讲12 · p019</text>
<rect x="832" y="1299" width="300" height="102" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1321" font-size="14.5" font-weight="600" fill="#2A8D4F">民事法律事实体系</text>
<text x="844" y="1341" font-size="12" fill="#344054">行为：法律行为(单方/多方/</text>
<text x="844" y="1358" font-size="12" fill="#344054">  决议)+事实行为(侵权/创作)</text>
<text x="844" y="1375" font-size="12" fill="#344054">事件：自然(出生/死亡/时效)</text>
<text x="844" y="1392" font-size="12" fill="#344054">  +社会(战争/罢工/动乱)</text>
<rect x="832" y="1415" width="300" height="102" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1437" font-size="14.5" font-weight="600" fill="#2A8D4F">法律行为 vs 事实行为</text>
<text x="844" y="1457" font-size="12" fill="#344054">意思表示：必须 / 无须</text>
<text x="844" y="1474" font-size="12" fill="#344054">效果：意思自治 / 法律规定</text>
<text x="844" y="1491" font-size="12" fill="#344054">行为能力：需要 / 无须</text>
<text x="844" y="1508" font-size="12" fill="#344054">效力：有效力 / 无效力问题</text>
<rect x="832" y="1531" width="300" height="102" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1553" font-size="14.5" font-weight="600" fill="#2A8D4F">法定分类</text>
<text x="844" y="1573" font-size="12" fill="#344054">单方：抛弃/遗嘱/遗赠</text>
<text x="844" y="1590" font-size="12" fill="#344054">多方·双方：赠与/遗赠扶养</text>
<text x="844" y="1607" font-size="12" fill="#344054">多方·共同：发起人协议/章程</text>
<text x="844" y="1624" font-size="12" fill="#344054">决议：股东会/董事会决议</text>
<rect x="832" y="1647" width="300" height="85" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1669" font-size="14.5" font-weight="600" fill="#2A8D4F">学理分类</text>
<text x="844" y="1689" font-size="12" fill="#344054">效果意思：财产行为/身份行为</text>
<text x="844" y="1706" font-size="12" fill="#344054">效力：负担行为(债权合同)</text>
<text x="844" y="1723" font-size="12" fill="#344054">  +处分行为(物权变动)</text>
<rect x="436" y="2070.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="2092.0" font-size="14.5" font-weight="600" fill="#B83A4A">专题03-02 法律行为效力</text>
<text x="448" y="2112.0" font-size="12" fill="#344054">讲13 效力01 · p020</text>
<rect x="832" y="1746" width="300" height="102" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1768" font-size="14.5" font-weight="600" fill="#B83A4A">四阶段逻辑体系</text>
<text x="844" y="1788" font-size="12" fill="#344054">①成立（事实判断·2种）</text>
<text x="844" y="1805" font-size="12" fill="#344054">②效力（价值判断·4种）</text>
<text x="844" y="1822" font-size="12" fill="#344054">③生效（履行与否·2种）</text>
<text x="844" y="1839" font-size="12" fill="#344054">④失效（终止6种）</text>
<rect x="832" y="1862" width="300" height="102" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1884" font-size="14.5" font-weight="600" fill="#B83A4A">效力体系</text>
<text x="844" y="1904" font-size="12" fill="#344054">双方（合同）：有效/无效/</text>
<text x="844" y="1921" font-size="12" fill="#344054">  待定/可撤销</text>
<text x="844" y="1938" font-size="12" fill="#344054">婚姻：有效/无效/可撤销</text>
<text x="844" y="1955" font-size="12" fill="#344054">单方：有效/无效</text>
<rect x="832" y="1978" width="300" height="102" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="2000" font-size="14.5" font-weight="600" fill="#B83A4A">有效要件（强公主意）</text>
<text x="844" y="2020" font-size="12" fill="#344054">不违反强制性规定</text>
<text x="844" y="2037" font-size="12" fill="#344054">不违背公序良俗</text>
<text x="844" y="2054" font-size="12" fill="#344054">有相应民事行为能力</text>
<text x="844" y="2071" font-size="12" fill="#344054">意思表示真实</text>
<rect x="832" y="2094" width="300" height="153" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="2116" font-size="14.5" font-weight="600" fill="#B83A4A">无效五种情形（强公主意）</text>
<text x="844" y="2136" font-size="12" fill="#344054">①违反强制性规定</text>
<text x="844" y="2153" font-size="12" fill="#344054">②违背公序良俗：结婚保证金/</text>
<text x="844" y="2170" font-size="12" fill="#344054">  不得生育/买卖器官/姓名权/</text>
<text x="844" y="2187" font-size="12" fill="#344054">  代孕/危房出租酒店</text>
<text x="844" y="2204" font-size="12" fill="#344054">③无民事行为能力人实施</text>
<text x="844" y="2221" font-size="12" fill="#344054">④虚假意思表示</text>
<text x="844" y="2238" font-size="12" fill="#344054">⑤恶意串通损害他人利益</text>
<rect x="832" y="2261" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="2283" font-size="14.5" font-weight="600" fill="#B83A4A">部分无效【156条】</text>
<text x="844" y="2303" font-size="12" fill="#344054">部分无效不影响其他部分</text>
<rect x="832" y="2326" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="2348" font-size="14.5" font-weight="600" fill="#B83A4A">法律效果【157条】</text>
<text x="844" y="2368" font-size="12" fill="#344054">主张无效不受时效限制</text>
<text x="844" y="2385" font-size="12" fill="#344054">返还财产（恢复原状）</text>
<text x="844" y="2402" font-size="12" fill="#344054">不能返还→折价补偿</text>
<text x="844" y="2419" font-size="12" fill="#344054">有过错→缔约过失责任</text>
<text x="844" y="2436" font-size="12" fill="#344054">双方过错→过错相抵</text>

<text x="52" y="967.5" font-size="14.5" font-weight="600" fill="#185FA5">8-06 · 民法 讲14~18</text>
<text x="52" y="987.5" font-size="12" fill="#344054">效力02-05 + 特殊的民事法律行为</text>
<text x="52" y="1004.5" font-size="12" fill="#344054">p021-p023</text>
<rect x="436" y="154.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="176.5" font-size="14.5" font-weight="600" fill="#854F0B">讲14 民事法律行为的效力(02)</text>
<text x="448" y="196.5" font-size="12" fill="#344054">来源 p021</text>
<rect x="832" y="20" width="300" height="187" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">效力待定的民事法律行为</text>
<text x="844" y="62" font-size="12" fill="#344054">含义：成立未生效</text>
<text x="844" y="79" font-size="12" fill="#344054">  由特享形成权的第三人</text>
<text x="844" y="96" font-size="12" fill="#344054">  追认/拒绝确定效力</text>
<text x="844" y="113" font-size="12" fill="#344054">五种情形：①限制民事行为能力人</text>
<text x="844" y="130" font-size="12" fill="#344054">  独立实施不相适应的双方行为</text>
<text x="844" y="147" font-size="12" fill="#344054">②无权代理</text>
<text x="844" y="164" font-size="12" fill="#344054">③职务代理人超越权限+相对人未尽审查</text>
<text x="844" y="181" font-size="12" fill="#344054">④法定代表人越权代表+相对人未尽审查</text>
<text x="844" y="198" font-size="12" fill="#344054">⑤法代/负责人/代理人与相对人恶意串通</text>
<rect x="832" y="221" width="300" height="119" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="243" font-size="14.5" font-weight="600" fill="#854F0B">可撤销的民事法律行为（20次）</text>
<text x="844" y="263" font-size="12" fill="#344054">含义：因瑕疵可因撤销权消灭</text>
<text x="844" y="280" font-size="12" fill="#344054">②重大误解：含义/4类（当事人/</text>
<text x="844" y="297" font-size="12" fill="#344054">  标的物/行为性质/第三人）</text>
<text x="844" y="314" font-size="12" fill="#344054">  核心=仅限主给付义务</text>
<text x="844" y="331" font-size="12" fill="#344054">  【民法典总则编解释第19条第1款】</text>
<rect x="436" y="654.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="676.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲15 民事法律行为的效力(03)</text>
<text x="448" y="696.0" font-size="12" fill="#344054">来源 p021后-p022</text>
<rect x="832" y="354" width="300" height="85" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="376" font-size="14.5" font-weight="600" fill="#B83A4A">欺诈（四种情形）</text>
<text x="844" y="396" font-size="12" fill="#344054">构成要件/主观故意</text>
<text x="844" y="413" font-size="12" fill="#344054">第三人实施欺诈【149条】</text>
<text x="844" y="430" font-size="12" fill="#344054">  受欺诈方有权请求法院/仲裁撤销</text>
<rect x="832" y="453" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="475" font-size="14.5" font-weight="600" fill="#B83A4A">胁迫（5种）</text>
<text x="844" y="495" font-size="12" fill="#344054">A.手段不法/目的不法/均不法</text>
<text x="844" y="512" font-size="12" fill="#344054">B.受胁迫人恐惧状态判定</text>
<text x="844" y="529" font-size="12" fill="#344054">  特定受害人一般人标准</text>
<text x="844" y="546" font-size="12" fill="#344054">⑤第三人胁迫：可撤销</text>
<text x="844" y="563" font-size="12" fill="#344054">  不要求相对人知道</text>
<rect x="832" y="586" width="300" height="153" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="608" font-size="14.5" font-weight="600" fill="#B83A4A">显示公平</text>
<text x="844" y="628" font-size="12" fill="#344054">含义：危困状态/缺乏判断力</text>
<text x="844" y="645" font-size="12" fill="#344054">主观要件：乘人之危/缺乏判断</text>
<text x="844" y="662" font-size="12" fill="#344054">  &quot;假一罚十&quot;=单方允诺之债</text>
<text x="844" y="679" font-size="12" fill="#344054">客观要件：利益显著失衡</text>
<text x="844" y="696" font-size="12" fill="#344054">核心=暴利行为与非常损失规则</text>
<text x="844" y="713" font-size="12" fill="#344054">  灌醉→显失公平</text>
<text x="844" y="730" font-size="12" fill="#344054">  自醉→重大误解</text>
<rect x="832" y="753" width="300" height="102" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="775" font-size="14.5" font-weight="600" fill="#B83A4A">撤销权的行使（除斥期间）</text>
<text x="844" y="795" font-size="12" fill="#344054">重大误解：90日/5年</text>
<text x="844" y="812" font-size="12" fill="#344054">欺诈/胁迫/显失公平：1年/5年</text>
<text x="844" y="829" font-size="12" fill="#344054">起算：知道或应当知道之日</text>
<text x="844" y="846" font-size="12" fill="#344054">  /民事法律行为发生之日</text>
<rect x="832" y="869" width="300" height="136" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="891" font-size="14.5" font-weight="600" fill="#B83A4A">撤销权行使后的法律后果</text>
<text x="844" y="911" font-size="12" fill="#344054">自始有效：①除斥期间经过</text>
<text x="844" y="928" font-size="12" fill="#344054">  ②放弃撤销权</text>
<text x="844" y="945" font-size="12" fill="#344054">  ③追究违约责任</text>
<text x="844" y="962" font-size="12" fill="#344054">自始无效：撤销（仲裁/诉讼）</text>
<text x="844" y="979" font-size="12" fill="#344054">  追究缔约过失责任</text>
<text x="844" y="996" font-size="12" fill="#344054">  （订约费用+订约机会损失）</text>
<rect x="436" y="1094.0" width="300" height="68" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1116.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲16 民事法律行为的效力(04)</text>
<text x="448" y="1136.0" font-size="12" fill="#344054">效力体系深入：效力待定的</text>
<text x="448" y="1153.0" font-size="12" fill="#344054">追认/拒绝转化的法律后果</text>
<rect x="832" y="1019" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1041" font-size="14.5" font-weight="600" fill="#6F3A91">效力待定的追认</text>
<text x="844" y="1061" font-size="12" fill="#344054">善意相对人撤销权【171条2款】</text>
<text x="844" y="1078" font-size="12" fill="#344054">被代理人未作表示视为拒绝追认</text>
<text x="844" y="1095" font-size="12" fill="#344054">善意相对人有请求权【171条3款】</text>
<text x="844" y="1112" font-size="12" fill="#344054">  +【总则编解释第27条】</text>
<text x="844" y="1129" font-size="12" fill="#344054">相对人知道或应知道行人为无权代理</text>
<text x="844" y="1146" font-size="12" fill="#344054">  和行为人按各自过错承担责任【171条】</text>
<rect x="832" y="1169" width="300" height="68" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1191" font-size="14.5" font-weight="600" fill="#6F3A91">效力体系补全</text>
<text x="844" y="1211" font-size="12" fill="#344054">效力待定→有效/无效转化路径</text>
<text x="844" y="1228" font-size="12" fill="#344054">与撤销权行使的关系</text>
<rect x="436" y="1310.5" width="300" height="51" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="448" y="1332.5" font-size="14.5" font-weight="600" fill="#185FA5">讲17 民事法律行为的效力(05)</text>
<text x="448" y="1352.5" font-size="12" fill="#344054">来源 p023前部 · 四类行为总结</text>
<rect x="832" y="1251" width="300" height="170" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="844" y="1273" font-size="14.5" font-weight="600" fill="#185FA5">四类行为大总结</text>
<text x="844" y="1293" font-size="12" fill="#344054">成立时→最终命运</text>
<text x="844" y="1310" font-size="12" fill="#344054">有效：成立即有效→有效能</text>
<text x="844" y="1327" font-size="12" fill="#344054">无效：成立即无效→不能发生效果</text>
<text x="844" y="1344" font-size="12" fill="#344054">  但发生法定效果</text>
<text x="844" y="1361" font-size="12" fill="#344054">效力待定：追认→有效</text>
<text x="844" y="1378" font-size="12" fill="#344054">  拒绝追认→自始无效</text>
<text x="844" y="1395" font-size="12" fill="#344054">可撤销：撤销→自始无效</text>
<text x="844" y="1412" font-size="12" fill="#344054">  不撤销→自始有效</text>
<rect x="436" y="1661.5" width="300" height="51" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="448" y="1683.5" font-size="14.5" font-weight="600" fill="#2A8D4F">讲18 特殊的民事法律行为</text>
<text x="448" y="1703.5" font-size="12" fill="#344054">来源 p023后部</text>
<rect x="832" y="1435" width="300" height="238" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1457" font-size="14.5" font-weight="600" fill="#2A8D4F">附条件的民事法律行为（6次）</text>
<text x="844" y="1477" font-size="12" fill="#344054">含义：条件成就决定生效或失效</text>
<text x="844" y="1494" font-size="12" fill="#344054">特征：①意思表示选定（任意条款）</text>
<text x="844" y="1511" font-size="12" fill="#344054">②将来客观事实</text>
<text x="844" y="1528" font-size="12" fill="#344054">③发生与否不确定</text>
<text x="844" y="1545" font-size="12" fill="#344054">④合法事实</text>
<text x="844" y="1562" font-size="12" fill="#344054">种类：①生效条件 vs 解除条件</text>
<text x="844" y="1579" font-size="12" fill="#344054">②积极条件 vs 消极条件</text>
<text x="844" y="1596" font-size="12" fill="#344054">效力【民法典第159条】：</text>
<text x="844" y="1613" font-size="12" fill="#344054">  ①不正当地阻止条件成就→视为已成就</text>
<text x="844" y="1630" font-size="12" fill="#344054">  ②不正当地促成条件成就→视为不成就</text>
<text x="844" y="1647" font-size="12" fill="#344054">  （&quot;拟制效力&quot;）</text>
<text x="844" y="1664" font-size="12" fill="#344054">  第三人行为→不适用拟制效力</text>
<rect x="832" y="1687" width="300" height="136" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1709" font-size="14.5" font-weight="600" fill="#2A8D4F">附期限的民事法律行为（1次）</text>
<text x="844" y="1729" font-size="12" fill="#344054">含义：期限届至决定效力发生或终止</text>
<text x="844" y="1746" font-size="12" fill="#344054">特征：①意思表示选定（非法律规定）</text>
<text x="844" y="1763" font-size="12" fill="#344054">②将来客观事实</text>
<text x="844" y="1780" font-size="12" fill="#344054">③必然发生的事实</text>
<text x="844" y="1797" font-size="12" fill="#344054">种类：①始期（效力发生）</text>
<text x="844" y="1814" font-size="12" fill="#344054">②终期（效力终止）</text>
<rect x="832" y="1837" width="300" height="102" rx="10" fill="#E5F4EA" stroke="#2A8D4F" stroke-width="1.4"/>
<text x="844" y="1859" font-size="14.5" font-weight="600" fill="#2A8D4F">条件 vs 期限 总结</text>
<text x="844" y="1879" font-size="12" fill="#344054">条件：成立不影响/效力不影响</text>
<text x="844" y="1896" font-size="12" fill="#344054">  生效影响（附生效）/失效影响（附解除）</text>
<text x="844" y="1913" font-size="12" fill="#344054">期限：同上但为必然事实</text>
<text x="844" y="1930" font-size="12" fill="#344054">  生效始期/终期终止</text>
</svg>`,
