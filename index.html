<rect x="40" y="1200.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1222.5" font-size="14.5" font-weight="600" fill="#185FA5">8-07 · 民法 讲19~21</text>
<text x="52" y="1242.5" font-size="12" fill="#344054">代理01-02 + 诉讼时效01</text>
<text x="52" y="1259.5" font-size="12" fill="#344054">p024-p027</text>
<rect x="436" y="396.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="418.5" font-size="14.5" font-weight="600" fill="#854F0B">讲19 代理（01）</text>
<text x="448" y="438.5" font-size="12" fill="#344054">来源 p024</text>
<rect x="832" y="20" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">民事法律事实适用范围</text>
<text x="844" y="62" font-size="12" fill="#344054">合同行为✓ / 婚姻行为(结婚×离婚✓)</text>
<text x="844" y="79" font-size="12" fill="#344054">收养×/遗嘱/遗赠×/事实侵权行为×</text>
<text x="844" y="96" font-size="12" fill="#344054">演出/授课/订立遗嘱/登记/收养/</text>
<text x="844" y="113" font-size="12" fill="#344054">求职面试等身份关系行为→不适用代理</text>
<rect x="832" y="136" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="158" font-size="14.5" font-weight="600" fill="#854F0B">委托和代理（独立行为）</text>
<text x="844" y="178" font-size="12" fill="#344054">1.委托=内部关系两方(委托人和受托人)</text>
<text x="844" y="195" font-size="12" fill="#344054">2.代理=外部关系三方(代理人/被代理人/相对人)</text>
<text x="844" y="212" font-size="12" fill="#344054">3.有委托不一定有代理（委托监护）</text>
<text x="844" y="229" font-size="12" fill="#344054">  有代理不一定有委托（法定监护）</text>
<rect x="832" y="252" width="300" height="170" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="274" font-size="14.5" font-weight="600" fill="#854F0B">代理权的理解（对比表）</text>
<text x="844" y="294" font-size="12" fill="#344054">基础法律关系：双方民事法律行为</text>
<text x="844" y="311" font-size="12" fill="#344054">  （委托合同/劳动合同）</text>
<text x="844" y="328" font-size="12" fill="#344054">  后果=委托人受托人</text>
<text x="844" y="345" font-size="12" fill="#344054">代理权授予：单方民事法律行为</text>
<text x="844" y="362" font-size="12" fill="#344054">  后果=代理人行为由被代理人承担</text>
<text x="844" y="379" font-size="12" fill="#344054">二者关系：代理权授予不必然成立</text>
<text x="844" y="396" font-size="12" fill="#344054">  基础法律关系无效/被撤销</text>
<text x="844" y="413" font-size="12" fill="#344054">  亦不影响代理权授予行为法律效果</text>
<rect x="832" y="436" width="300" height="187" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="458" font-size="14.5" font-weight="600" fill="#854F0B">代理权滥用（4次）</text>
<text x="844" y="478" font-size="12" fill="#344054">1.自己代理：含义/法律后果=相对无效理论</text>
<text x="844" y="495" font-size="12" fill="#344054">  被代理人同意/追认→有效</text>
<text x="844" y="512" font-size="12" fill="#344054">2.双方代理：被代理的双方同意/追认→有效</text>
<text x="844" y="529" font-size="12" fill="#344054">3.恶意代理：①公司追认→对公司生效力</text>
<text x="844" y="546" font-size="12" fill="#344054">  ②不追认→对公司不发生效力</text>
<text x="844" y="563" font-size="12" fill="#344054">  ③恶意代理给公司造成损失的</text>
<text x="844" y="580" font-size="12" fill="#344054">  代理人和相对人承担连带责任</text>
<text x="844" y="597" font-size="12" fill="#344054">  【民法典第164条】</text>
<text x="844" y="614" font-size="12" fill="#344054">  【总则编解释第23条】</text>
<rect x="832" y="637" width="300" height="187" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="659" font-size="14.5" font-weight="600" fill="#854F0B">复代理（2次）</text>
<text x="844" y="679" font-size="12" fill="#344054">含义：转委托【169条】</text>
<text x="844" y="696" font-size="12" fill="#344054">特征：①代理人以自己名义选任复代理人B/C</text>
<text x="844" y="713" font-size="12" fill="#344054">②C是A的代理人非B的代理人</text>
<text x="844" y="730" font-size="12" fill="#344054">③C的代理权限以B的权限为限</text>
<text x="844" y="747" font-size="12" fill="#344054">④C代理行为的法律效果由A承担</text>
<text x="844" y="764" font-size="12" fill="#344054">产生：①事前本人授权/同意</text>
<text x="844" y="781" font-size="12" fill="#344054">②事后本人追认</text>
<text x="844" y="798" font-size="12" fill="#344054">③紧急情况下为被代理人利益</text>
<text x="844" y="815" font-size="12" fill="#344054">  【总则编解释第26条】</text>
<rect x="436" y="1282.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1304.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲20 代理（02）</text>
<text x="448" y="1324.5" font-size="12" fill="#344054">来源 p025-p026</text>
<rect x="832" y="838" width="300" height="187" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="860" font-size="14.5" font-weight="600" fill="#B83A4A">职务代理（1次）</text>
<text x="844" y="880" font-size="12" fill="#344054">含义：依代理人所任职务产生</text>
<text x="844" y="897" font-size="12" fill="#344054">特征：①被代理人是法人/非法人组织（概括授权）</text>
<text x="844" y="914" font-size="12" fill="#344054">②代理人是执行法人工作的人员</text>
<text x="844" y="931" font-size="12" fill="#344054">③代理事项是职权范围内的事项</text>
<text x="844" y="948" font-size="12" fill="#344054">责任：内部限制不对外</text>
<text x="844" y="965" font-size="12" fill="#344054">  法人/非法人组织对执行工作任务</text>
<text x="844" y="982" font-size="12" fill="#344054">  的人员职权范围限制</text>
<text x="844" y="999" font-size="12" fill="#344054">  不得对抗善意相对人</text>
<text x="844" y="1016" font-size="12" fill="#344054">  【民法典第170条+合同编通则解释第21条】</text>
<rect x="832" y="1039" width="300" height="187" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1061" font-size="14.5" font-weight="600" fill="#B83A4A">狭义无权代理（10次）</text>
<text x="844" y="1081" font-size="12" fill="#344054">含义：无代理权/超越/代理权终止后仍实施</text>
<text x="844" y="1098" font-size="12" fill="#344054">效力：①未经追认对被代理人不生效力</text>
<text x="844" y="1115" font-size="12" fill="#344054">②相对人可催告30日</text>
<text x="844" y="1132" font-size="12" fill="#344054">③未作表示视为拒绝追认</text>
<text x="844" y="1149" font-size="12" fill="#344054">  善意相对人有撤销权【171条2款】</text>
<text x="844" y="1166" font-size="12" fill="#344054">④善意相对人有请求权</text>
<text x="844" y="1183" font-size="12" fill="#344054">  【171条3款+总则编解释第27条】</text>
<text x="844" y="1200" font-size="12" fill="#344054">⑤相对人知道或应当知道的</text>
<text x="844" y="1217" font-size="12" fill="#344054">  行为人和相对人按各自过错担责【171条】</text>
<rect x="832" y="1240" width="300" height="153" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1262" font-size="14.5" font-weight="600" fill="#B83A4A">表见代理（3次）</text>
<text x="844" y="1282" font-size="12" fill="#344054">含义：行为人无代理权但相对人有理由相信其有代理权</text>
<text x="844" y="1299" font-size="12" fill="#344054">主要要件：①相对人善意+无过失</text>
<text x="844" y="1316" font-size="12" fill="#344054">  （尽到必要审查义务）</text>
<text x="844" y="1333" font-size="12" fill="#344054">②客观要件：存在权利外观</text>
<text x="844" y="1350" font-size="12" fill="#344054">  ①授权委托书②业务介绍信</text>
<text x="844" y="1367" font-size="12" fill="#344054">  ③交易习惯④签约地在被代理人营业地</text>
<text x="844" y="1384" font-size="12" fill="#344054">  （形式审查义务非实质审查义务）</text>
<rect x="832" y="1407" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1429" font-size="14.5" font-weight="600" fill="#B83A4A">表见代理 vs 表见代表（对比）</text>
<text x="844" y="1449" font-size="12" fill="#344054">表见代理【172条】：执行公司事务的董事/经理以外的</text>
<text x="844" y="1466" font-size="12" fill="#344054">  相对人有理由相信行为人有代理权</text>
<text x="844" y="1483" font-size="12" fill="#344054">  →合同有效</text>
<text x="844" y="1500" font-size="12" fill="#344054">  内部追偿：用人单位故意/重大过失</text>
<text x="844" y="1517" font-size="12" fill="#344054">表见代表【504条】：法定代表人</text>
<text x="844" y="1534" font-size="12" fill="#344054">  相对人有理由相信行为人有代表权</text>
<text x="844" y="1551" font-size="12" fill="#344054">  →合同有效</text>
<text x="844" y="1568" font-size="12" fill="#344054">  内部追偿：股东代表诉讼（有过错）</text>
<rect x="832" y="1591" width="300" height="187" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1613" font-size="14.5" font-weight="600" fill="#B83A4A">异常人章关系</text>
<text x="844" y="1633" font-size="12" fill="#344054">1.真人假章：法代越权担保/借款</text>
<text x="844" y="1650" font-size="12" fill="#344054">  仅合同加盖印章/不发生效力</text>
<text x="844" y="1667" font-size="12" fill="#344054">  【合同编通则解释第22条第1款】</text>
<text x="844" y="1684" font-size="12" fill="#344054">2.有人无章：仅有签名未加盖印章</text>
<text x="844" y="1701" font-size="12" fill="#344054">  相对人能证明超越权限→生效</text>
<text x="844" y="1718" font-size="12" fill="#344054">  【合同编通则解释第22条第2款】</text>
<text x="844" y="1735" font-size="12" fill="#344054">3.有章无人：仅加盖印章无人签名</text>
<text x="844" y="1752" font-size="12" fill="#344054">  相对人能证明职权范围内→生效</text>
<text x="844" y="1769" font-size="12" fill="#344054">  【合同编通则解释第22条第3款】</text>
<rect x="436" y="2095.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="2117.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲21 诉讼时效（01）</text>
<text x="448" y="2137.0" font-size="12" fill="#344054">来源 p026-p027</text>
<rect x="832" y="1792" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1814" font-size="14.5" font-weight="600" fill="#6F3A91">含义与性质</text>
<text x="844" y="1834" font-size="12" fill="#344054">含义：权利人不行使权利，经过法定期间</text>
<text x="844" y="1851" font-size="12" fill="#344054">  债务人取得拒绝履行抗辩权利法律效果</text>
<text x="844" y="1868" font-size="12" fill="#344054">性质：强制性规定【民法典第197条】</text>
<text x="844" y="1885" font-size="12" fill="#344054">  一律由法律规定</text>
<text x="844" y="1902" font-size="12" fill="#344054">  当事人约定无效</text>
<text x="844" y="1919" font-size="12" fill="#344054">  预先放弃无效</text>
<rect x="832" y="1942" width="300" height="272" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1964" font-size="14.5" font-weight="600" fill="#6F3A91">适用范围（6次）</text>
<text x="844" y="1984" font-size="12" fill="#344054">①债权请求权：原则适用</text>
<text x="844" y="2001" font-size="12" fill="#344054">  例外：①存款本息请求权</text>
<text x="844" y="2018" font-size="12" fill="#344054">  ②国债/金融债券请求权</text>
<text x="844" y="2035" font-size="12" fill="#344054">  ③投资关系产生的缴付出资请求权</text>
<text x="844" y="2052" font-size="12" fill="#344054">  ④国家财产受侵犯/救济金请求权</text>
<text x="844" y="2069" font-size="12" fill="#344054">②物权请求权：原则不适用</text>
<text x="844" y="2086" font-size="12" fill="#344054">  例外：①未登记动产物权返还请求权</text>
<text x="844" y="2103" font-size="12" fill="#344054">  ②抵押权人在主债权诉讼期间</text>
<text x="844" y="2120" font-size="12" fill="#344054">    行使抵押权，未行使的不予保护【419条】</text>
<text x="844" y="2137" font-size="12" fill="#344054">③人格权请求权：不适用</text>
<text x="844" y="2154" font-size="12" fill="#344054">  ①停止侵害②排除妨碍③消除危险</text>
<text x="844" y="2171" font-size="12" fill="#344054">  ④消除影响⑤恢复名誉⑥赔礼道歉</text>
<text x="844" y="2188" font-size="12" fill="#344054">④离婚后财产分割请求权：适用</text>
<text x="844" y="2205" font-size="12" fill="#344054">  从发现之日起3年【婚姻家庭编解释（一）第84条】</text>
<rect x="832" y="2228" width="300" height="221" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2250" font-size="14.5" font-weight="600" fill="#6F3A91">经过的法律效力（2次）</text>
<text x="844" y="2270" font-size="12" fill="#344054">法考观点：抗辩权发生说</text>
<text x="844" y="2287" font-size="12" fill="#344054">①起诉：债权人不丧失起诉权</text>
<text x="844" y="2304" font-size="12" fill="#344054">  法院应当受理，不得裁定不予受理</text>
<text x="844" y="2321" font-size="12" fill="#344054">②审理：法院既不能主动调明</text>
<text x="844" y="2338" font-size="12" fill="#344054">  也不能主动适用</text>
<text x="844" y="2355" font-size="12" fill="#344054">③债务人/法代/委托代理人/法定代表人</text>
<text x="844" y="2372" font-size="12" fill="#344054">  在审理中提出诉讼时效抗辩</text>
<text x="844" y="2389" font-size="12" fill="#344054">  →判决驳回原告诉讼请求</text>
<text x="844" y="2406" font-size="12" fill="#344054">④未提出→法院应当判决原告胜诉</text>
<text x="844" y="2423" font-size="12" fill="#344054">⑤行使时间阶段：①一审期间</text>
<text x="844" y="2440" font-size="12" fill="#344054">  ②二审原则上不支持（新证据除外）</text>
</svg>`,

<rect x="40" y="801.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="823.5" font-size="14.5" font-weight="600" fill="#185FA5">8-08 · 民法 讲22~24</text>
<text x="52" y="843.5" font-size="12" fill="#344054">时效02 + 物权原理 + 物权变动01</text>
<text x="52" y="860.5" font-size="12" fill="#344054">p027-p030</text>
<rect x="436" y="197.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="219.0" font-size="14.5" font-weight="600" fill="#854F0B">讲22 诉讼时效(02)</text>
<text x="448" y="239.0" font-size="12" fill="#344054">来源 p027-p028</text>
<rect x="832" y="20" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">诉讼时效中止（1次）</text>
<text x="844" y="62" font-size="12" fill="#344054">含义：最后6个月内出现客观障碍</text>
<text x="844" y="79" font-size="12" fill="#344054">暂停计算，待障碍消除之日起继续计算剩余6个月</text>
<text x="844" y="96" font-size="12" fill="#344054">适用情形：①不可抗力（海啸/洪水/新冠）</text>
<text x="844" y="113" font-size="12" fill="#344054">②无/限制行为能力人无代理人/代理人死亡</text>
<text x="844" y="130" font-size="12" fill="#344054">③继承开始后未确定继承人或遗产管理人</text>
<text x="844" y="147" font-size="12" fill="#344054">④权利人被义务人或他人控制</text>
<rect x="832" y="170" width="300" height="255" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="192" font-size="14.5" font-weight="600" fill="#854F0B">诉讼时效中断（3次）</text>
<text x="844" y="212" font-size="12" fill="#344054">【民法典第195条、诉讼时效规定第10条、总则编解释第38条】</text>
<text x="844" y="229" font-size="12" fill="#344054">①权利人向义务人提出履行请求</text>
<text x="844" y="246" font-size="12" fill="#344054">  义务人包括：代理人/财产代管人/遗产管理人/法定代表人</text>
<text x="844" y="263" font-size="12" fill="#344054">  方式：书面/口头/直接/间接</text>
<text x="844" y="280" font-size="12" fill="#344054">  ①送主张权利文书（能证明到达）②信件/数据电文</text>
<text x="844" y="297" font-size="12" fill="#344054">  ③金融机构扣收欠款本息④义务人下落不明的国家级或省级媒体公告</text>
<text x="844" y="314" font-size="12" fill="#344054">②义务人同意履行义务</text>
<text x="844" y="331" font-size="12" fill="#344054">  （分期/部分履行/提供担保/请求延期/制定清偿计划）</text>
<text x="844" y="348" font-size="12" fill="#344054">③权利人提起诉讼或申请仲裁的</text>
<text x="844" y="365" font-size="12" fill="#344054">  从提交起诉状或口头起诉之日起中断</text>
<text x="844" y="382" font-size="12" fill="#344054">④与提起诉讼或仲裁具有同等效力的其他情形</text>
<text x="844" y="399" font-size="12" fill="#344054">法律后果：①已经过的期间归于无效，诉讼时效重新计算</text>
<text x="844" y="416" font-size="12" fill="#344054">  ②可以多次中断，但不能超过20年最长诉讼时效期间【总则编解释第38条第1款】</text>
<rect x="436" y="641.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="663.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲23 物权的基本原理</text>
<text x="448" y="683.5" font-size="12" fill="#344054">来源 p028</text>
<rect x="832" y="439" width="300" height="272" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="461" font-size="14.5" font-weight="600" fill="#B83A4A">物的分类</text>
<text x="844" y="481" font-size="12" fill="#344054">1.动产和不动产：不动产（土地/海域/房屋/建筑物/构筑物/林木/桥梁/堤坝/纪念碑）</text>
<text x="844" y="498" font-size="12" fill="#344054">  动产（机动车/自行车/船舶/机器设备/欧米伽手表）</text>
<text x="844" y="515" font-size="12" fill="#344054">2.原物和孳息：原物=能产生收益的物</text>
<text x="844" y="532" font-size="12" fill="#344054">  孳息：①天然（果实/出产物/鸡鸭蛋/羊毛/熟透掉落的果实/收割庄稼）</text>
<text x="844" y="549" font-size="12" fill="#344054">    有约从约/无约归所有权人/有用益物权人归用益物权人</text>
<text x="844" y="566" font-size="12" fill="#344054">    ②法定（利息/租金/射幸孳息（彩票/抽奖/保险金））</text>
<text x="844" y="583" font-size="12" fill="#344054">    有约从约/无约或约定不明，依交易习惯</text>
<text x="844" y="600" font-size="12" fill="#344054">3.主物和从物：①非主物构成部分（汽车/备胎不属从物）</text>
<text x="844" y="617" font-size="12" fill="#344054">  ②须辅助主物使用（车位不属房屋从物）</text>
<text x="844" y="634" font-size="12" fill="#344054">  ③主从物同属一人（孟某手表/马某表带非主从关系）</text>
<text x="844" y="651" font-size="12" fill="#344054">  【民法典第320条】主物转让的，从物随主物一并转让（另有约定除外）</text>
<text x="844" y="668" font-size="12" fill="#344054">4.货币：特殊种类物，所有和占有合而为一，占有即所有</text>
<text x="844" y="685" font-size="12" fill="#344054">5.数据和网络虚拟财产：互联网账号/网络游戏装备/Q币/手机流量</text>
<text x="844" y="702" font-size="12" fill="#344054">  特征：①可支配性和排他性②具有经济价值③网络空间&quot;有形&quot;存在</text>
<rect x="832" y="725" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="747" font-size="14.5" font-weight="600" fill="#B83A4A">物权的效力</text>
<text x="844" y="767" font-size="12" fill="#344054">1.追及效力：不论标的物辗转至何人之手，权利人均可追及</text>
<text x="844" y="784" font-size="12" fill="#344054">  只要在最占有人处发现自己的物，即可取回</text>
<text x="844" y="801" font-size="12" fill="#344054">2.排他效力：同一物上不得同时存在两个所有权或两个内容冲突的他物权</text>
<text x="844" y="818" font-size="12" fill="#344054">3.优先效力：</text>
<text x="844" y="835" font-size="12" fill="#344054">  对外效力：原则=同一物上的物权优先于债权实现</text>
<text x="844" y="852" font-size="12" fill="#344054">    例外=预告登记/租赁权成立在先的买卖不破租赁/建设工程合同法定优先权</text>
<text x="844" y="869" font-size="12" fill="#344054">  对内效力：原则=先成立的物权优先于后成立的物权（先来后到）</text>
<text x="844" y="886" font-size="12" fill="#344054">    例外=担保物权之间的优先性排序</text>
<rect x="436" y="1254.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1276.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲24 物权变动(01)</text>
<text x="448" y="1296.5" font-size="12" fill="#344054">来源 p029-p030</text>
<rect x="832" y="909" width="300" height="238" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="931" font-size="14.5" font-weight="600" fill="#6F3A91">物权的保护（5次）</text>
<text x="844" y="951" font-size="12" fill="#344054">1.确认物权请求权（确认之诉）</text>
<text x="844" y="968" font-size="12" fill="#344054">2.物上请求权（前提：物权受侵害）：</text>
<text x="844" y="985" font-size="12" fill="#344054">  (1)物权请求权：①返还原物请求权【民法典第235条】</text>
<text x="844" y="1002" font-size="12" fill="#344054">    ②排除妨害请求权（不受诉讼时效限制）</text>
<text x="844" y="1019" font-size="12" fill="#344054">    ③消除危险请求权（不受诉讼时效限制）</text>
<text x="844" y="1036" font-size="12" fill="#344054">    ⚠️ 行使：①不必依诉讼方式，也可依意思表示方式</text>
<text x="844" y="1053" font-size="12" fill="#344054">    ②可单独适用，可根据权利被侵害情形合并适用</text>
<text x="844" y="1070" font-size="12" fill="#344054">  (2)占有保护请求权：占有返还/排除妨害/消除危险</text>
<text x="844" y="1087" font-size="12" fill="#344054">  (3)恢复原状请求权（修理/更换/重作）</text>
<text x="844" y="1104" font-size="12" fill="#344054">3.债权请求权：侵权损害赔偿</text>
<text x="844" y="1121" font-size="12" fill="#344054">对比表：物权请求权 vs 债权请求权</text>
<text x="844" y="1138" font-size="12" fill="#344054">  前提/目的/是否需要过错/表现形式/期间限制</text>
<rect x="832" y="1161" width="300" height="102" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1183" font-size="14.5" font-weight="600" fill="#6F3A91">物权变动的公式</text>
<text x="844" y="1203" font-size="12" fill="#344054">基于法律行为的物权变动：</text>
<text x="844" y="1220" font-size="12" fill="#344054">  不动产=有效合同+登记（合同成立生效，未办理物权登记的，不影响合同效力【215条】）</text>
<text x="844" y="1237" font-size="12" fill="#344054">  动产=有效合同+交付（欧米伽手表，无须登记可对抗善意第三人）</text>
<text x="844" y="1254" font-size="12" fill="#344054">  特殊动产=有效合同+交付+登记=动产物权变动（汽车/飞机，未登记不能对抗善意第三人）</text>
<rect x="832" y="1277" width="300" height="374" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1299" font-size="14.5" font-weight="600" fill="#6F3A91">物权变动的公示方法</text>
<text x="844" y="1319" font-size="12" fill="#344054">1.登记：</text>
<text x="844" y="1336" font-size="12" fill="#344054">  ①更正登记：①事由=不动产登记簿记载错误，权利人或利害关系人提出更正申请</text>
<text x="844" y="1353" font-size="12" fill="#344054">    ②处理=权利人书面同意更正或有证据证明登记错误</text>
<text x="844" y="1370" font-size="12" fill="#344054">  ②异议登记：①事由=权利人不同意更正</text>
<text x="844" y="1387" font-size="12" fill="#344054">    ②效力=申请人自异议登记之日起15日内未起诉，异议登记失效</text>
<text x="844" y="1404" font-size="12" fill="#344054">  ③预告登记【民法典第221条】：</text>
<text x="844" y="1421" font-size="12" fill="#344054">    ①情形=解决房屋买卖合同的一房多卖</text>
<text x="844" y="1438" font-size="12" fill="#344054">    ②对象=基于房屋买卖合同而产生的债权</text>
<text x="844" y="1455" font-size="12" fill="#344054">    ③效力：</text>
<text x="844" y="1472" font-size="12" fill="#344054">      A. 双方当事人约定共同向登记机构申请</text>
<text x="844" y="1489" font-size="12" fill="#344054">      B. 预告登记是债权效力，出卖人仍有处分不动产（合同有效）</text>
<text x="844" y="1506" font-size="12" fill="#344054">        但未经预告登记的买受人同意，不发生物权效力</text>
<text x="844" y="1523" font-size="12" fill="#344054">      C. 失效：自能够进行不动产登记之日起90日内未申请登记</text>
<text x="844" y="1540" font-size="12" fill="#344054">        或预告登记保障的债权已经消灭</text>
<text x="844" y="1557" font-size="12" fill="#344054">  对比表：异议登记 vs 预告登记</text>
<text x="844" y="1574" font-size="12" fill="#344054">  2.动产交付（4次）：</text>
<text x="844" y="1591" font-size="12" fill="#344054">    ①简易交付：先占有（租/借）而后购买，动产一直在买受人手里</text>
<text x="844" y="1608" font-size="12" fill="#344054">    ②指示交付：①自己所有他人占有，出卖人转让返还原物请求权【226条】</text>
<text x="844" y="1625" font-size="12" fill="#344054">      ②买卖合同生效时，视为已经交付，发生物权变动</text>
<text x="844" y="1642" font-size="12" fill="#344054">    ③占有改定：出卖人占有改定（租/借用合同）生效时，视为已经交付【227条】</text>
</svg>`,

<rect x="40" y="1621.0" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1643.0" font-size="14.5" font-weight="600" fill="#185FA5">8-10 · 民法 讲25~28</text>
<text x="52" y="1663.0" font-size="12" fill="#344054">物权变动02 + 业主区分所有 + 共有 + 用益物权</text>
<text x="52" y="1680.0" font-size="12" fill="#344054">p030-p034</text>
<rect x="436" y="514.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="536.0" font-size="14.5" font-weight="600" fill="#854F0B">讲25 物权变动(02)</text>
<text x="448" y="556.0" font-size="12" fill="#344054">来源 p030-p031</text>
<rect x="832" y="20" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">非基于民事法律行为的物权变动（4种）</text>
<text x="844" y="62" font-size="12" fill="#344054">①政府征收：征收决定生效时发生效力</text>
<text x="844" y="79" font-size="12" fill="#344054">②法律文书：法律文书（形成判决）生效时生效</text>
<text x="844" y="96" font-size="12" fill="#344054">  ⚠️ 明确判决或裁决标的物所有权直接归某人所有</text>
<text x="844" y="113" font-size="12" fill="#344054">③继承：遗嘱/法定继承开始时（被继承人自然死亡/生理死亡/宣告死亡）发生效力</text>
<text x="844" y="130" font-size="12" fill="#344054">④事实行为：合法建造/拆除房屋等设立或消灭物权的</text>
<text x="844" y="147" font-size="12" fill="#344054">  自事实行为成就时发生效力【民法典第231条】</text>
<rect x="832" y="170" width="300" height="442" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="192" font-size="14.5" font-weight="600" fill="#854F0B">善意取得（核心公式）</text>
<text x="844" y="212" font-size="12" fill="#344054">公式：无权处分+有效合同+登记/交付=原始取得</text>
<text x="844" y="229" font-size="12" fill="#344054">1.构成要件：</text>
<text x="844" y="246" font-size="12" fill="#344054">  ①他人财产行为人为无权处分（非负担行为，如出租）</text>
<text x="844" y="263" font-size="12" fill="#344054">  ②相对人主观上善意且无重大过失：</text>
<text x="844" y="280" font-size="12" fill="#344054">    ①在不动产物权转移登记或动产交付时，不知情/不了解决/不知悉</text>
<text x="844" y="297" font-size="12" fill="#344054">    ②重大过失（5种情形）：</text>
<text x="844" y="314" font-size="12" fill="#344054">      A. 登记簿上存在有效的异议登记</text>
<text x="844" y="331" font-size="12" fill="#344054">      B. 预告登记有效期内未经预告登记的权利人同意</text>
<text x="844" y="348" font-size="12" fill="#344054">      C. 登记簿上已记载司法机关或行政机关查封等限制事项</text>
<text x="844" y="365" font-size="12" fill="#344054">      D. 受让人知道登记簿上记载的权利主体错误</text>
<text x="844" y="382" font-size="12" fill="#344054">      E. 受让人知道他人已经依法享有不动产物权</text>
<text x="844" y="399" font-size="12" fill="#344054">  ③相对人客观上支付合理对价：</text>
<text x="844" y="416" font-size="12" fill="#344054">    ①仅需约定价款合理即可，是否真正支付在所不问</text>
<text x="844" y="433" font-size="12" fill="#344054">    ②合理的价格=参考转让时当地市场价格及交易习惯</text>
<text x="844" y="450" font-size="12" fill="#344054">    ③必须有钱，赠与/遗赠等无偿情形取得不构成善意取得</text>
<text x="844" y="467" font-size="12" fill="#344054">  ④已经完成公示：动产完成交付（不得采用占有改定）/不动产完成登记</text>
<text x="844" y="484" font-size="12" fill="#344054">2.适用范围：</text>
<text x="844" y="501" font-size="12" fill="#344054">  ①不动产：①夫妻共有房屋；②记名产权人和实际产权人不一致</text>
<text x="844" y="518" font-size="12" fill="#344054">  ②动产占有委托物：租赁/借用/委托/保管/承揽/运输合同</text>
<text x="844" y="535" font-size="12" fill="#344054">    （盗赃物/遗失物/埋藏物/隐藏物（可善意取得留置权））</text>
<text x="844" y="552" font-size="12" fill="#344054">  ③权利【民法典第311条第3款】：①股权；②担保物权</text>
<text x="844" y="569" font-size="12" fill="#344054">3.法律效果：</text>
<text x="844" y="586" font-size="12" fill="#344054">  物权效果=善意第三人取得所有权或他物权，原所有权消灭（原物取回）</text>
<text x="844" y="603" font-size="12" fill="#344054">  债权效果=所有人可对无权处分人主张侵权责任/违约责任/不当得利</text>
<rect x="832" y="626" width="300" height="119" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="648" font-size="14.5" font-weight="600" fill="#854F0B">动产遗失物的拾得（3次）</text>
<text x="844" y="668" font-size="12" fill="#344054">1.拾得人义务：①返还遗失物；②保管义务（故意/重大过失致遗失物灭失承担损害赔偿责任）；③通知义务</text>
<text x="844" y="685" font-size="12" fill="#344054">2.拾得人权利：①必要费用请求权；②悬赏报酬请求权</text>
<text x="844" y="702" font-size="12" fill="#344054">  ⚠️ 侵占遗失物的，丧失上述2项权利</text>
<text x="844" y="719" font-size="12" fill="#344054">3.遗失物归属：自发布招领公告之日起1年内无人认领的，归国家所有</text>
<text x="844" y="736" font-size="12" fill="#344054">  （漂流物/埋藏物/隐藏物参照适用）</text>
<rect x="832" y="759" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="781" font-size="14.5" font-weight="600" fill="#854F0B">先占（3次）</text>
<text x="844" y="801" font-size="12" fill="#344054">1.含义：基于所有的意思，先于他人占有无主财产，从而取得其所有权</text>
<text x="844" y="818" font-size="12" fill="#344054">  属于非基于民事法律行为的取得方式</text>
<text x="844" y="835" font-size="12" fill="#344054">2.构成要件：①客体为无主财产；②须以所有的意思占有；③不得违反法律、行政法规的禁止性规定</text>
<rect x="832" y="858" width="300" height="119" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="880" font-size="14.5" font-weight="600" fill="#854F0B">添附（3次）</text>
<text x="844" y="900" font-size="12" fill="#344054">1.附合：</text>
<text x="844" y="917" font-size="12" fill="#344054">  ①动产+动产=动产所有人取得附合物所有权，当给予原动产所有人赔偿或补偿</text>
<text x="844" y="934" font-size="12" fill="#344054">  ②动产+不动产：①原则=原动产所有人取得附合物所有权；②例外=可区别主物/从物或一方动产价值显然高于他方的动产，由主物或价值较高物原所有人取得所有权，并给予对方赔偿或补偿</text>
<text x="844" y="951" font-size="12" fill="#344054">2.混合：动产+动产=准用附合的规定</text>
<text x="844" y="968" font-size="12" fill="#344054">3.加工：动产+劳动：①原则=加工物所有权归原物所有人，并给加工人赔偿或补偿；②例外=加工价值大于材料价值时，加工物可归加工人所有，但应给原物所有人赔偿或补偿</text>
<rect x="832" y="991" width="300" height="68" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="1013" font-size="14.5" font-weight="600" fill="#854F0B">学理分类</text>
<text x="844" y="1033" font-size="12" fill="#344054">(1)原始取得：①先占/孳息/劳动生产（从无到有）；②善意取得/拾得/发现/添附/征收（从有到有）</text>
<text x="844" y="1050" font-size="12" fill="#344054">(2)继受取得：①合同（买卖合同和赠与合同）；②继承或受赠与</text>
<rect x="436" y="1526.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1548.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲26 业主的建筑物区分所有权</text>
<text x="448" y="1568.0" font-size="12" fill="#344054">来源 p032</text>
<rect x="832" y="1073" width="300" height="68" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1095" font-size="14.5" font-weight="600" fill="#B83A4A">业主定义</text>
<text x="844" y="1115" font-size="12" fill="#344054">⚠️ 业主=包括尚未依法办理所有权登记的人</text>
<text x="844" y="1132" font-size="12" fill="#344054">【建筑物区分所有权解释第1条】</text>
<rect x="832" y="1155" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1177" font-size="14.5" font-weight="600" fill="#B83A4A">1.专有权（1次）</text>
<text x="844" y="1197" font-size="12" fill="#344054">(1)对住宅、经营性用房等专有部分享有所有权</text>
<text x="844" y="1214" font-size="12" fill="#344054">(2)业主行使权利不得危及建筑物的安全</text>
<text x="844" y="1231" font-size="12" fill="#344054">  不得损害其他业主的合法权益</text>
<text x="844" y="1248" font-size="12" fill="#344054">(3)建筑物机器附属设施的费用分摊、收益分配等事项约定不明的</text>
<text x="844" y="1265" font-size="12" fill="#344054">  按业主专有部分面积所占比例确定</text>
<text x="844" y="1282" font-size="12" fill="#344054">业主对专有部分以外的共有部分享有共有和共同管理的权利</text>
<text x="844" y="1299" font-size="12" fill="#344054">专有部分转让的，共有权一并转让</text>
<text x="844" y="1316" font-size="12" fill="#344054">各区分所有权人之间不存在优先购买权</text>
<rect x="832" y="1339" width="300" height="255" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1361" font-size="14.5" font-weight="600" fill="#B83A4A">2.共有权（1次）</text>
<text x="844" y="1381" font-size="12" fill="#344054">(1)小区共有：</text>
<text x="844" y="1398" font-size="12" fill="#344054">  ①道路/绿地/公共场所/共用设施/物业服务用房/维修资金</text>
<text x="844" y="1415" font-size="12" fill="#344054">  ②车位车库：</text>
<text x="844" y="1432" font-size="12" fill="#344054">    ①规划用于停放汽车的车位、车库归属=当事人约定（出售/出租/附赠）</text>
<text x="844" y="1449" font-size="12" fill="#344054">    应当首先满足业主的需要</text>
<text x="844" y="1466" font-size="12" fill="#344054">    ②占用业主共有的道路或其他场地用于停放汽车的新增车位=业主共有</text>
<text x="844" y="1483" font-size="12" fill="#344054">(2)全楼共有：</text>
<text x="844" y="1500" font-size="12" fill="#344054">  ①基础/承重结构/外墙/屋顶</text>
<text x="844" y="1517" font-size="12" fill="#344054">  ②通道/楼梯/大堂</text>
<text x="844" y="1534" font-size="12" fill="#344054">  ③消防/公共照明等附属设施</text>
<text x="844" y="1551" font-size="12" fill="#344054">  ④避难层/设备层或设备间</text>
<text x="844" y="1568" font-size="12" fill="#344054">  ⚠️ 建设单位、物业服务企业利用业主共有部分产生的收入</text>
<text x="844" y="1585" font-size="12" fill="#344054">  扣除合理成本之后属于业主共有</text>
<rect x="832" y="1608" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1630" font-size="14.5" font-weight="600" fill="#B83A4A">3.成员权</text>
<text x="844" y="1650" font-size="12" fill="#344054">(1)表决权或管理权：专有面积占2/3以上+人数占2/3以上的业主参与表决</text>
<text x="844" y="1667" font-size="12" fill="#344054">  ①一般事项：①事项=定改规则和规约/选举或更换物业/业委会/使用资金变三一</text>
<text x="844" y="1684" font-size="12" fill="#344054">    ②行权=专有面积1/2以上+人数1/2以上的参与表决的业主同意</text>
<text x="844" y="1701" font-size="12" fill="#344054">  ②特殊事项：①事项=筹集资金/建设设施/改变用途/搞经营</text>
<text x="844" y="1718" font-size="12" fill="#344054">    ②行权=专有面积3/4以上+人数3/4以上的参与表决的业主同意</text>
<rect x="832" y="1741" width="300" height="289" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1763" font-size="14.5" font-weight="600" fill="#B83A4A">4.权利和义务</text>
<text x="844" y="1783" font-size="12" fill="#344054">(1)权利：①自治权=设立业主大会/选举业委会（街道办/居委会给予指导）</text>
<text x="844" y="1800" font-size="12" fill="#344054">  ②决定撤销权：①客体=业主大会或业委会作出的侵害业主合法权益的决定</text>
<text x="844" y="1817" font-size="12" fill="#344054">    ②除斥期间=自知道或应当知道该决定作出之日起1年</text>
<text x="844" y="1834" font-size="12" fill="#344054">  ③物业管理权：①管理权和招聘权②监督权和知情权③新冠肺炎</text>
<text x="844" y="1851" font-size="12" fill="#344054">  ④救济权=侵权行为可请求其承担民事责任</text>
<text x="844" y="1868" font-size="12" fill="#344054">(2)义务：</text>
<text x="844" y="1885" font-size="12" fill="#344054">  ①禁止商改住【民法典第279条、建筑物区分所有权解释第10、11条】：</text>
<text x="844" y="1902" font-size="12" fill="#344054">    ①应当经有利害关系的业主一致同意（一票否决权）</text>
<text x="844" y="1919" font-size="12" fill="#344054">    ②未办理建筑内的业主自动视为利害关系人</text>
<text x="844" y="1936" font-size="12" fill="#344054">    ③未办理建筑物之外的业主应证明其房屋价值/生活质量可能受到不利影响</text>
<text x="844" y="1953" font-size="12" fill="#344054">  ②禁止权利滥用【民法典第286条】：</text>
<text x="844" y="1970" font-size="12" fill="#344054">    ①侵权行为：任意弃置垃圾/排放污染物或噪声/违反规定饲养动物/违章搭建/侵占通道/拒付物业费等</text>
<text x="844" y="1987" font-size="12" fill="#344054">    ②侵权救济：</text>
<text x="844" y="2004" font-size="12" fill="#344054">      A. 业主大会或业主委员会可要求排除妨害/停止侵害/消除危险/恢复原状/赔偿损失</text>
<text x="844" y="2021" font-size="12" fill="#344054">      B. 向行政主管部门投诉或报告</text>
<rect x="436" y="2365.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="2387.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲27 共有</text>
<text x="448" y="2407.5" font-size="12" fill="#344054">来源 p033</text>
<rect x="832" y="2044" width="300" height="561" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2066" font-size="14.5" font-weight="600" fill="#6F3A91">1.按份共有</text>
<text x="844" y="2086" font-size="12" fill="#344054">(1)内部关系（4次）：</text>
<text x="844" y="2103" font-size="12" fill="#344054">  ①管理：①保存的，从约；②重大事项（改良行为/变更性质或用途）</text>
<text x="844" y="2120" font-size="12" fill="#344054">    有约从约，无约应当经2/3以上份额共有人同意</text>
<text x="844" y="2137" font-size="12" fill="#344054">  ②收益分配：①有约从约②无约或约定不明，看出资额</text>
<text x="844" y="2154" font-size="12" fill="#344054">    ③出资额不明的，推定为等额</text>
<text x="844" y="2171" font-size="12" fill="#344054">  ③费用负担：①有约从约②无约或约定不明，按份额负担</text>
<text x="844" y="2188" font-size="12" fill="#344054">  ④分割（条件/方式/瑕疵担保责任）：</text>
<text x="844" y="2205" font-size="12" fill="#344054">    A. 条件：①有约从约，有重大理由需要分割的，可请求分割</text>
<text x="844" y="2222" font-size="12" fill="#344054">      ②无约或约定不明，随时分割，不受诉讼时效期间限制</text>
<text x="844" y="2239" font-size="12" fill="#344054">      ③因分割造成其他共有人损害的，应当给予赔偿</text>
<text x="844" y="2256" font-size="12" fill="#344054">      ④协商确定</text>
<text x="844" y="2273" font-size="12" fill="#344054">    B. 方式：①可分割不减损价值的，对实物予以分割</text>
<text x="844" y="2290" font-size="12" fill="#344054">      ②难以分割或因分割会减损价值的，对折价/拍卖/变卖取得的价款予以分割</text>
<text x="844" y="2307" font-size="12" fill="#344054">    C. 瑕疵担保责任：分割物有瑕疵的，其他共有人应当分担损失</text>
<text x="844" y="2324" font-size="12" fill="#344054">(2)处分（5次）：</text>
<text x="844" y="2341" font-size="12" fill="#344054">  ①共有物：①应当经2/3以上份额共有人同意（出租行为无须遵守）</text>
<text x="844" y="2358" font-size="12" fill="#344054">    ②无权处分的，买卖合同同法有效，第三人可适用善意取得</text>
<text x="844" y="2375" font-size="12" fill="#344054">  ②优先购买权：</text>
<text x="844" y="2392" font-size="12" fill="#344054">    A. 份额转让自由，无须经过其他按份共有人的同意</text>
<text x="844" y="2409" font-size="12" fill="#344054">    B. 继承/遗赠/对内转让不属于转让（另有约定除外）</text>
<text x="844" y="2426" font-size="12" fill="#344054">    C. 同等条件=综合共有份额的转让价格/价款履行方式及期限等因素</text>
<text x="844" y="2443" font-size="12" fill="#344054">    D. 行使期间：</text>
<text x="844" y="2460" font-size="12" fill="#344054">      a. 约定优先：有约定从约定</text>
<text x="844" y="2477" font-size="12" fill="#344054">      b. 无约定：受让人通知（载明期间/短于15日为15日）</text>
<text x="844" y="2494" font-size="12" fill="#344054">        转让人通知（知道或应当知道最终确定同等条件之日起15日）</text>
<text x="844" y="2511" font-size="12" fill="#344054">        无法确定知道或应当知道的，自权属转移之日起6个月</text>
<text x="844" y="2528" font-size="12" fill="#344054">    E. 不予支持情形：①未在法定期限内主张②主张但提出减少转让价款/增加转让负担</text>
<text x="844" y="2545" font-size="12" fill="#344054">      ③仅请求撤销共有份额转让合同或认定该合同无效</text>
<text x="844" y="2562" font-size="12" fill="#344054">    F. 两人以上主张：协商确定各自购买比例；协商不成按各自共有份额比例</text>
<text x="844" y="2579" font-size="12" fill="#344054">(2)外部关系：①第三人侵害共有物：任何侵权人均可主张权利，享有连带请求权</text>
<text x="844" y="2596" font-size="12" fill="#344054">  ②共有物侵害第三人：各按份共有人对外承担连带责任，对内按份（另有约定除外）</text>
<rect x="832" y="2619" width="300" height="119" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2641" font-size="14.5" font-weight="600" fill="#6F3A91">2.共同共有</text>
<text x="844" y="2661" font-size="12" fill="#344054">特定关系：夫妻/同居/家庭/遗产继承/合伙，其余推定为按份共有</text>
<text x="844" y="2678" font-size="12" fill="#344054">处分收益：重大修缮/处分须经全体共有人一致同意</text>
<text x="844" y="2695" font-size="12" fill="#344054">  费用负担无约定时共同承担；收益分配时直接共同享有</text>
<text x="844" y="2712" font-size="12" fill="#344054">分割问题：要分割共有物必须满足基础丧失（离婚或重大理由的条件）</text>
<text x="844" y="2729" font-size="12" fill="#344054">共有物侵害第三人：不存在内部追偿问题</text>
<rect x="436" y="2995.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="3017.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲28 用益物权（1）</text>
<text x="448" y="3037.5" font-size="12" fill="#344054">来源 p034</text>
<rect x="832" y="2752" width="300" height="170" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2774" font-size="14.5" font-weight="600" fill="#0F7E80">1.土地承包经营权（4次）</text>
<text x="844" y="2794" font-size="12" fill="#344054">含义：①家庭承包（无偿方式）以农户家庭为单位，承包对象=耕地/草地/林地</text>
<text x="844" y="2811" font-size="12" fill="#344054">  ②承包对象=&quot;四荒&quot;土地（荒山/荒丘/荒沟/荒滩）</text>
<text x="844" y="2828" font-size="12" fill="#344054">招标协商（有偿方式）：①承包方式=招标/拍卖/公开协商</text>
<text x="844" y="2845" font-size="12" fill="#344054">  ②优先承包权=①同等条件下本集体经济组织成员优先承包</text>
<text x="844" y="2862" font-size="12" fill="#344054">    ②集体经济组织以外的单位或个人承包：应当事先经村名会议2/3以上成员或2/3以上村民代表的同意，并报乡镇人民政府批准</text>
<text x="844" y="2879" font-size="12" fill="#344054">2.设立：(1)土地承包经营权自合同生效时设立</text>
<text x="844" y="2896" font-size="12" fill="#344054">  (2)登记机构发放土地承包经营权证/林权证/草原使用权证（法律凭证），并登记造册</text>
<text x="844" y="2913" font-size="12" fill="#344054">3.流转和限制：流转时未经登记不得对抗善意第三人</text>
<rect x="832" y="2936" width="300" height="170" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2958" font-size="14.5" font-weight="600" fill="#0F7E80">2.居住权（5次）</text>
<text x="844" y="2978" font-size="12" fill="#344054">含义：①主体=只能是自然人，居住权人的家庭成员或保姆等享有居住利益</text>
<text x="844" y="2995" font-size="12" fill="#344054">  ②客体=住宅及附属设施 ③权利=占有权及使用权</text>
<text x="844" y="3012" font-size="12" fill="#344054">设立：(1)订立书面有效的合同（原则上无偿）或合法有效的遗嘱</text>
<text x="844" y="3029" font-size="12" fill="#344054">  (2)办理居住权登记，居住权自登记时设立</text>
<text x="844" y="3046" font-size="12" fill="#344054">限制：①绝对禁止=不得转让/继承/不得设定抵押担保/不得遗赠</text>
<text x="844" y="3063" font-size="12" fill="#344054">  ②相对禁止=有约定可出租，无约定禁止出租</text>
<text x="844" y="3080" font-size="12" fill="#344054">消灭：居住权是有期限物权，居住权期间届满或居住权人死亡的，居住权消灭</text>
<text x="844" y="3097" font-size="12" fill="#344054">对比表：居住权 vs 租赁权（立法目的/权利性质/要式合同/期限/登记效力/有偿性/权利限制/消灭）</text>
<rect x="832" y="3120" width="300" height="170" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="3142" font-size="14.5" font-weight="600" fill="#0F7E80">3.地役权（首次出现于民法典）</text>
<text x="844" y="3162" font-size="12" fill="#344054">含义：为了自己不动产使用的便利和效益，按合同约定而使用他人不动产的权利</text>
<text x="844" y="3179" font-size="12" fill="#344054">  如通行权/取水权/采光权/眺望权</text>
<text x="844" y="3196" font-size="12" fill="#344054">对比表：地役权 vs 相邻关系（调节程度/产生原因/是否有偿/是否有期限/是否形式）</text>
<text x="844" y="3213" font-size="12" fill="#344054">设立：地役权自地役权合同生效时设立，不需要登记，但未经登记不得对抗善意第三人</text>
<text x="844" y="3230" font-size="12" fill="#344054">转让：(1)地役权具有从属性，需役地转让后，地役权一并转让（有偿约定的除外）</text>
<text x="844" y="3247" font-size="12" fill="#344054">  需役地受让人可追究需役地转让方的违约责任和供役地方法律责任</text>
<text x="844" y="3264" font-size="12" fill="#344054">  (2)地役权未登记的，供役地转让时，需役地方法律不能让善意第三人侵权责任</text>
<text x="844" y="3281" font-size="12" fill="#344054">    只能追究供役地方法律让人的违约责任</text>
</svg>`,

<rect x="40" y="934.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="956.5" font-size="14.5" font-weight="600" fill="#185FA5">8-11 · 民法 讲29~31</text>
<text x="52" y="976.5" font-size="12" fill="#344054">担保原理 + 抵押01-02</text>
<text x="52" y="993.5" font-size="12" fill="#344054">p035-p037</text>
<rect x="436" y="357.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="379.0" font-size="14.5" font-weight="600" fill="#854F0B">讲29 担保物权·担保原理(1)</text>
<text x="448" y="399.0" font-size="12" fill="#344054">来源 p035</text>
<rect x="832" y="20" width="300" height="221" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">1.担保物权体系</text>
<text x="844" y="62" font-size="12" fill="#344054">(1)概念：债务人/第三人在不动产/动产/财产权利上设定</text>
<text x="844" y="79" font-size="12" fill="#344054">  当债务人不履行到期债务或发生约定情形时</text>
<text x="844" y="96" font-size="12" fill="#344054">  债权人/受偿受领（有限序）的财产权利（定限物权）</text>
<text x="844" y="113" font-size="12" fill="#344054">  单纯支配和利用他人财产或财产权利的&quot;交换价值&quot;</text>
<text x="844" y="130" font-size="12" fill="#344054">(2)分类：①意定=抵押权（书面抵押合同）+质权（书面质押合同）</text>
<text x="844" y="147" font-size="12" fill="#344054">  ②法定=留置权（法律直接规定）</text>
<text x="844" y="164" font-size="12" fill="#344054">(3)本质：①用他人之物或财产权担保自己债权实现的限制物权</text>
<text x="844" y="181" font-size="12" fill="#344054">  ②系从权利，主权利系债权</text>
<text x="844" y="198" font-size="12" fill="#344054">  ③因债权人害怕债务人到期不能还款而存在</text>
<text x="844" y="215" font-size="12" fill="#344054">  ④本质是优先受偿权（有顺序）</text>
<text x="844" y="232" font-size="12" fill="#344054">  ⑤债权人看重的是标的物的交换价值</text>
<rect x="832" y="255" width="300" height="340" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="277" font-size="14.5" font-weight="600" fill="#854F0B">2.担保合同无法律后果（2次）</text>
<text x="844" y="297" font-size="12" fill="#344054">(1)无效的广义解释：①无效的民事法律行为（强/公/主/意/恶）</text>
<text x="844" y="314" font-size="12" fill="#344054">  ②可撤销的（重大误解/欺诈/胁迫/显失公平）</text>
<text x="844" y="331" font-size="12" fill="#344054">  ③效力待定的（限制民事行为能力人/无权代理）</text>
<text x="844" y="348" font-size="12" fill="#344054">(2)主合同有效而第三人提供的担保合同无效：</text>
<text x="844" y="365" font-size="12" fill="#344054">  ①债权人和担保人对于担保合同的均有过错：</text>
<text x="844" y="382" font-size="12" fill="#344054">    ①赔偿责任上限是债务人不能清偿部分的1/2</text>
<text x="844" y="399" font-size="12" fill="#344054">    ②补充责任，先债务人承担，再担保人承担</text>
<text x="844" y="416" font-size="12" fill="#344054">    ③担保人承担责任后无条件下债务人追偿</text>
<text x="844" y="433" font-size="12" fill="#344054">  ②担保人的责任承担：缔约过失责任</text>
<text x="844" y="450" font-size="12" fill="#344054">(3)主合同无效导致担保合同无效：</text>
<text x="844" y="467" font-size="12" fill="#344054">  ①担保人过错：①明知主合同无效仍为之提供担保</text>
<text x="844" y="484" font-size="12" fill="#344054">    ②明知主合同无效仍促使主合同成立或为主合同的签订作中介</text>
<text x="844" y="501" font-size="12" fill="#344054">  ②担保人的责任承担：缔约过失责任</text>
<text x="844" y="518" font-size="12" fill="#344054">    ①赔偿责任上限是债务人不能清偿部分的1/3</text>
<text x="844" y="535" font-size="12" fill="#344054">    ②补充责任，先债务人承担，再担保人承担</text>
<text x="844" y="552" font-size="12" fill="#344054">    ③担保人承担责任后无条件下债务人追偿</text>
<text x="844" y="569" font-size="12" fill="#344054">  法律后果总结表：主合同有效/无效 × 第三人提供 × 担保人/债权人过错</text>
<text x="844" y="586" font-size="12" fill="#344054">  责任承担差异</text>
<rect x="832" y="609" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="631" font-size="14.5" font-weight="600" fill="#854F0B">3.担保的从属性（4次）</text>
<text x="844" y="651" font-size="12" fill="#344054">(1)效力的从属性：①主合同无效，担保合同无效，法律另有规定的除外</text>
<text x="844" y="668" font-size="12" fill="#344054">  ②独立担保条款属于过度担保，条款无效</text>
<text x="844" y="685" font-size="12" fill="#344054">    但不影响其他条款的效力【民法典担保制度解释第2条】</text>
<text x="844" y="702" font-size="12" fill="#344054">(2)范围的从属性：①法定担保范围=主债权及其利息/违约金/损害赔偿金/实现担保物权的费用【389条】</text>
<text x="844" y="719" font-size="12" fill="#344054">  ②人的担保范围=主债权及其利息/违约金/损害赔偿金/实现担保物权的费用【691条】</text>
<text x="844" y="736" font-size="12" fill="#344054">  ③约定担保责任：①约定的数额高于主债务，担保责任约定的履行期限先于主债务履行期届满，属于过度担保，条款无效</text>
<rect x="436" y="1002.5" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1024.5" font-size="14.5" font-weight="600" fill="#B83A4A">讲30 担保物权·担保原理(2)</text>
<text x="448" y="1044.5" font-size="12" fill="#344054">来源 p036</text>
<rect x="832" y="759" width="300" height="204" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="781" font-size="14.5" font-weight="600" fill="#B83A4A">4.流押/流质条款</text>
<text x="844" y="801" font-size="12" fill="#344054">(1)含义：流押/流质=当事人在合同中约定，一旦债务人到期不履行债务，抵押财产（质押财产）直接归债权人所有的条款</text>
<text x="844" y="818" font-size="12" fill="#344054">⚠️ 立法目的=防止损害抵押人（质押人）的利益，防止权利滥用</text>
<text x="844" y="835" font-size="12" fill="#344054">(2)内容：①流押条款【401条】：抵押权人在债务履行期限届满前，</text>
<text x="844" y="852" font-size="12" fill="#344054">  与抵押人约定债务人不履行到期债务时抵押财产归债权人所有的，</text>
<text x="844" y="869" font-size="12" fill="#344054">  只能依法就抵押财产优先受偿</text>
<text x="844" y="886" font-size="12" fill="#344054">  ②流质条款【428条】：质权人在债务履行期限届满前，</text>
<text x="844" y="903" font-size="12" fill="#344054">  与出质人约定债务人不履行到期债务时质押财产归债权人所有的，</text>
<text x="844" y="920" font-size="12" fill="#344054">  只能依法就质押财产优先受偿</text>
<text x="844" y="937" font-size="12" fill="#344054">(3)效力：无效（因为剥夺了标的物的市场定价权，不能取得所有权）</text>
<text x="844" y="954" font-size="12" fill="#344054">  但仍有权就优先受偿权</text>
<rect x="832" y="977" width="300" height="170" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="999" font-size="14.5" font-weight="600" fill="#B83A4A">5.担保物权的不分性</text>
<text x="844" y="1019" font-size="12" fill="#344054">(1)含义：担保物的分割还是债权的分割，均不影响担保物权的效力</text>
<text x="844" y="1036" font-size="12" fill="#344054">  【民法典担保制度解释第38、39条】</text>
<text x="844" y="1053" font-size="12" fill="#344054">  ⚠️ 主债权未清偿完毕，担保权一个都不能少</text>
<text x="844" y="1070" font-size="12" fill="#344054">  ⚠️ 非强制性规定，当事人可约定排除</text>
<text x="844" y="1087" font-size="12" fill="#344054">(2)类型：①主债权部分受偿→仍以全部担保物担保剩余债权</text>
<text x="844" y="1104" font-size="12" fill="#344054">  ②主债权被分割/部分转让→担保物仍为被分割或部分转让的全部债权提供担保</text>
<text x="844" y="1121" font-size="12" fill="#344054">  ③担保物被分割→担保物权的效力及于分割后的各部分</text>
<text x="844" y="1138" font-size="12" fill="#344054">  担保物权人可以就分割后的担保物行使担保物权</text>
<rect x="832" y="1161" width="300" height="136" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1183" font-size="14.5" font-weight="600" fill="#B83A4A">6.担保物权的代位性（2次）</text>
<text x="844" y="1203" font-size="12" fill="#344054">(1)含义：担保物权的效力及于担保物本身，及于担保物的变价物/保险金/赔偿金/补偿金等代位物</text>
<text x="844" y="1220" font-size="12" fill="#344054">  【民法典第390条、担保制度解释第42条】</text>
<text x="844" y="1237" font-size="12" fill="#344054">  ⚠️ &quot;生是我的担保物，被动死是我的代位物（三金）&quot;</text>
<text x="844" y="1254" font-size="12" fill="#344054">(2)内容：①担保财产因不可抗力毁损/灭失的，担保物权人可以就获得的保险金/赔偿金/补偿金主张优先受偿</text>
<text x="844" y="1271" font-size="12" fill="#344054">  ②被担保债权的履行期限未届满的，也可以提存</text>
<text x="844" y="1288" font-size="12" fill="#344054">  ③无代位物的，主债权仍然存在，债务人应继续履行</text>
<rect x="436" y="1588.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1610.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲31 抵押权（01）</text>
<text x="448" y="1630.5" font-size="12" fill="#344054">来源 p036-p037</text>
<rect x="832" y="1311" width="300" height="221" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1333" font-size="14.5" font-weight="600" fill="#6F3A91">1.抵押财产（2次）</text>
<text x="844" y="1353" font-size="12" fill="#344054">(1)可抵押：①不动产=建筑物/正在建造的建筑物（在建工程）/其他附着物（土地尚未分离的林木等）</text>
<text x="844" y="1370" font-size="12" fill="#344054">  ②动产=交通工具（船舶/航空器）/生产设备/原材料/半成品/产品等浮动抵押财产</text>
<text x="844" y="1387" font-size="12" fill="#344054">  ③用益物权=土地承包经营权/建设用地使用权/海域使用权/准物权（矿业权/取水权/养殖权和捕捞权）</text>
<text x="844" y="1404" font-size="12" fill="#344054">(2)不可抵押：①土地所有权（不具有流通性，抵押合同无效，抵押权不成立）</text>
<text x="844" y="1421" font-size="12" fill="#344054">  ②依法被查封/扣押/监管的财产（先抵押后查封=抵押权不受影响；先查封后抵押=抵押合同无效，实现抵押权后，查封措施尚未解除的，不予支持）</text>
<text x="844" y="1438" font-size="12" fill="#344054">  ③所有权/使用权不明或有争议的财产</text>
<text x="844" y="1455" font-size="12" fill="#344054">  ④学校/幼儿园/医疗卫生机构等为公益目的成立的非营利法人的教育设施/医疗卫生设施和其他公益设施</text>
<text x="844" y="1472" font-size="12" fill="#344054">  （非公益设施除外，如应收账款质押担保）</text>
<text x="844" y="1489" font-size="12" fill="#344054">  ⑤宅基地/自留地/自留山等集体所有土地的使用权（法律规定可以抵押的除外）</text>
<text x="844" y="1506" font-size="12" fill="#344054">  例外：①通过招标/拍卖/公开协商等方式承包农村土地，经依法登记取得权属证书的</text>
<text x="844" y="1523" font-size="12" fill="#344054">    ②乡镇/村企业的建设用地使用权不得单独抵押，厂房等建筑物抵押的，其占用范围内的建设用地使用权一并抵押</text>
<rect x="832" y="1546" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1568" font-size="14.5" font-weight="600" fill="#6F3A91">2.抵押权的设立（4次）</text>
<text x="844" y="1588" font-size="12" fill="#344054">(1)不动产（登记生效主义=书面有效合同+登记=不动产物权变动【357条+担保制度解释第51条】）：</text>
<text x="844" y="1605" font-size="12" fill="#344054">  ①房地一并抵押=房屋+土地（建设用地使用权）、房屋+土地</text>
<text x="844" y="1622" font-size="12" fill="#344054">  ②新增建筑物不属于抵押财产，抵押权实现时一并处分，但新增建筑物所得价款，抵押权人无权优先受偿【417条+担保制度解释第51条】</text>
<text x="844" y="1639" font-size="12" fill="#344054">(2)动产（登记对抗主义=书面有效合同=动产抵押权+登记&gt;善意第三人【403条】）：</text>
<text x="844" y="1656" font-size="12" fill="#344054">  ①5类典型：动产抵押权/动产浮动抵押权/超级动产抵押权/动产质权/动产留置权</text>
<text x="844" y="1673" font-size="12" fill="#344054">  ②2类非典型：动产所有权保留买卖合同/动产融资租赁合同</text>
<rect x="832" y="1696" width="300" height="221" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1718" font-size="14.5" font-weight="600" fill="#6F3A91">3.动产浮动抵押权（8次）</text>
<text x="844" y="1738" font-size="12" fill="#344054">(1)主体特殊：商事主体，即企业/个体工商户/农村生产经营者</text>
<text x="844" y="1755" font-size="12" fill="#344054">(2)抵押物特殊：现有及将有的生产设备/原材料/半成品/产品作为一个整体一并抵押（概括性描述，抵押物不固定）</text>
<text x="844" y="1772" font-size="12" fill="#344054">  【396条+担保制度解释第53条】</text>
<text x="844" y="1789" font-size="12" fill="#344054">(3)登记机构特殊：中国人民银行征信中心</text>
<text x="844" y="1806" font-size="12" fill="#344054">(4)效力特殊（4次）：①不得对抗正常经营买受人（即便是登记）【404条+担保制度解释第56条】</text>
<text x="844" y="1823" font-size="12" fill="#344054">  ②营业抵押明确记载的范围；③持续销售同类商品也适用</text>
<text x="844" y="1840" font-size="12" fill="#344054">  ④已经支付合理价款+已经取得抵押财产的所有权=普通动产抵押权也适用</text>
<text x="844" y="1857" font-size="12" fill="#344054">(5)抵押财产确定的情形：①债务履行期限届满，债权未实现</text>
<text x="844" y="1874" font-size="12" fill="#344054">  ②抵押人被宣告破产或解散清算</text>
<text x="844" y="1891" font-size="12" fill="#344054">  ③当事人约定的实现抵押权的情形</text>
<text x="844" y="1908" font-size="12" fill="#344054">  ④严重影响债权实现的其他情形</text>
</svg>`,

<path d="M736.0 2153.0 C784.0 2153.0,784.0 2321.5,832.0 2321.5" fill="none" stroke="#0F7E80" stroke-width="1.4" opacity="0.55"/>
<rect x="40" y="1192.0" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1214.0" font-size="14.5" font-weight="600" fill="#185FA5">8-12 · 民法 讲32~35</text>
<text x="52" y="1234.0" font-size="12" fill="#344054">抵押02-03 + 质权 + 留置权 · 占有待PDF p041补</text>
<text x="52" y="1251.0" font-size="12" fill="#344054">p037-p040</text>
<rect x="436" y="279.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="301.0" font-size="14.5" font-weight="600" fill="#854F0B">讲32 抵押权（02）</text>
<text x="448" y="321.0" font-size="12" fill="#344054">来源 p037-p038</text>
<rect x="832" y="20" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">4.抵押权和租赁权的冲突解决（2次）</text>
<text x="844" y="62" font-size="12" fill="#344054">(1)先租后抵：①抵押（买卖）不破租赁，租赁合同对标的物的抵押权和受让人继续有效【405条】</text>
<text x="844" y="79" font-size="12" fill="#344054">  ②抵押权实现时，只要租赁合同还在有效期内，租赁合同对抵押物受让人继续有效</text>
<text x="844" y="96" font-size="12" fill="#344054">  受让人取得的是有租赁权负担的抵押物【725条】</text>
<text x="844" y="113" font-size="12" fill="#344054">(2)先抵后租：租赁合同不能对抗已经登记的抵押权，抵押（买卖）破租赁</text>
<rect x="832" y="136" width="300" height="187" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="158" font-size="14.5" font-weight="600" fill="#854F0B">5.抵押财产转让（3次）</text>
<text x="844" y="178" font-size="12" fill="#344054">(1)抵押合同无约定：①无须经过抵押权人的同意，但应及时通知抵押权人</text>
<text x="844" y="195" font-size="12" fill="#344054">  ②系有权处分，转让（买卖）合同合法有效</text>
<text x="844" y="212" font-size="12" fill="#344054">  ③抵押权具有追及效力，抵押权人能够证明抵押财产转让可能损害抵押权的，</text>
<text x="844" y="229" font-size="12" fill="#344054">  可请求抵押人将所得价款提前清偿（加速到期）或提存</text>
<text x="844" y="246" font-size="12" fill="#344054">(2)抵押合同有约定：</text>
<text x="844" y="263" font-size="12" fill="#344054">  ①禁止或限制未登记：①转让合同有效；②抵押人承担违约责任</text>
<text x="844" y="280" font-size="12" fill="#344054">    ③抵押财产已经交付或登记，发生物权效力（抵押权人有证据证明受让人知道的除外）</text>
<text x="844" y="297" font-size="12" fill="#344054">  ②禁止或限制已登记：①转让合同有效；②抵押人承担违约责任</text>
<text x="844" y="314" font-size="12" fill="#344054">    ③不发生物权效力（受让人代抵押人实际清偿全部债务导致抵押权消灭的除外）</text>
<rect x="832" y="337" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="359" font-size="14.5" font-weight="600" fill="#854F0B">6.抵押权的处分（2次）</text>
<text x="844" y="379" font-size="12" fill="#344054">(1)转让：债权转让的，抵押权一并转让，法律另有规定或当事人另有约定的除外【407条】</text>
<text x="844" y="396" font-size="12" fill="#344054">(2)放弃：债务人以自己的财产设定抵押，抵押权人放弃该抵押权的，</text>
<text x="844" y="413" font-size="12" fill="#344054">  其他担保人在抵押权人丧失优先受偿权益的范围内免除担保责任，</text>
<text x="844" y="430" font-size="12" fill="#344054">  但是其他担保人承诺仍然提供担保的除外【409条】</text>
<rect x="832" y="453" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="475" font-size="14.5" font-weight="600" fill="#854F0B">7.抵押权的顺位（3次）</text>
<text x="844" y="495" font-size="12" fill="#344054">(1)清偿顺位【414条】：①先登记&gt;后登记 ②登记&gt;未登记 ③均未登记，同一顺位按比例清偿</text>
<text x="844" y="512" font-size="12" fill="#344054">(2)交换顺位：①抵押权人可以放弃抵押权或抵押权的顺位</text>
<text x="844" y="529" font-size="12" fill="#344054">  抵押权人与抵押人可以协议变更抵押权顺位以及被担保的债权数额等内容</text>
<text x="844" y="546" font-size="12" fill="#344054">  ②未经其他抵押权人书面同意，不得对其产生不利影响</text>
<text x="844" y="563" font-size="12" fill="#344054">(3)顺位升进：①原则=顺位在前的抵押权因行使抵押权以外的原因而消灭时，顺位在后的抵押权顺位升进</text>
<text x="844" y="580" font-size="12" fill="#344054">  ②例外=顺位在先的抵押权人与抵押财产所有人为同一人时（购买抵押财产），顺位在后的抵押权顺位保留</text>
<rect x="436" y="821.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="843.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲33 抵押权（03）</text>
<text x="448" y="863.0" font-size="12" fill="#344054">来源 p038</text>
<rect x="832" y="603" width="300" height="119" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="625" font-size="14.5" font-weight="600" fill="#B83A4A">8.超级动产抵押权（1次）</text>
<text x="844" y="645" font-size="12" fill="#344054">(1)含义：交易两合同（先买后抵），法律禁止原则上取得的担保物购买该动产所产生的价金给付义务的担保权【416条】</text>
<text x="844" y="662" font-size="12" fill="#344054">(2)特征：①主债权是标的物的购买价金</text>
<text x="844" y="679" font-size="12" fill="#344054">  ②交付后10日内进行抵押权登记，使获得超优先受偿权（优先于标的物登记在前的担保物权，留置权除外）</text>
<text x="844" y="696" font-size="12" fill="#344054">(3)优先顺位：超级动产抵押权&gt;动产浮动抵押权</text>
<text x="844" y="713" font-size="12" fill="#344054">  抵押权顺序：徐工集团&gt;工商银行&gt;农业银行</text>
<rect x="832" y="736" width="300" height="85" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="758" font-size="14.5" font-weight="600" fill="#B83A4A">9.抵押权的实现（2次）</text>
<text x="844" y="778" font-size="12" fill="#344054">(1)抵押权的设立无须转移抵押物的占有</text>
<text x="844" y="795" font-size="12" fill="#344054">(2)时效抗辩权发生说：抵押权人应当在主债权诉讼时效期间（可变期间）行使抵押权</text>
<text x="844" y="812" font-size="12" fill="#344054">  未行使的，法院不予保护【419条+担保制度解释第44条】</text>
<rect x="832" y="835" width="300" height="255" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="857" font-size="14.5" font-weight="600" fill="#B83A4A">10.最高额抵押权（5次）</text>
<text x="844" y="877" font-size="12" fill="#344054">(1)含义：①为担保债务的履行，债务人或第三人对一定期间内将要连续发生的债权提供担保财产</text>
<text x="844" y="894" font-size="12" fill="#344054">  债务人不履行到期债务或者发生当事人约定的实现抵押权的情形</text>
<text x="844" y="911" font-size="12" fill="#344054">  抵押权人有权在最高债权额限度内就该担保财产优先受偿</text>
<text x="844" y="928" font-size="12" fill="#344054">  ②最高额抵押=证明适用最高债权额的有关约定</text>
<text x="844" y="945" font-size="12" fill="#344054">  ③本质：一次授信-定额额度（最高额），N年（债权确定期间/决算期）有效</text>
<text x="844" y="962" font-size="12" fill="#344054">  随借随还、随时转入、随时转出【420-424条】</text>
<text x="844" y="979" font-size="12" fill="#344054">(2)特征：抵押合同成立在前，主债权合同成立在后；主债权的发生及数额具有不确定性</text>
<text x="844" y="996" font-size="12" fill="#344054">(3)效力：①最高额抵押权设立前已经存在的债权，经当事人同意，可以转入最高额抵押担保的债权范围</text>
<text x="844" y="1013" font-size="12" fill="#344054">  ②债权确定后，部分债权转让的，最高额抵押权不随之转让</text>
<text x="844" y="1030" font-size="12" fill="#344054">  ③实际发生的债权&gt;最高限额，以最高限额优先受偿</text>
<text x="844" y="1047" font-size="12" fill="#344054">  实际发生的债权&lt;最高限额，以实际发生的债权为限优先受偿</text>
<text x="844" y="1064" font-size="12" fill="#344054">(4)变更：债权确定前，可以通过协议变更债权确定的期间、债权范围以及最高债权额</text>
<text x="844" y="1081" font-size="12" fill="#344054">  但变更的内容不对其他抵押权人产生不利影响【388条】</text>
<rect x="436" y="1456.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1478.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲34 质权</text>
<text x="448" y="1498.5" font-size="12" fill="#344054">来源 p039-p040</text>
<rect x="832" y="1104" width="300" height="221" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1126" font-size="14.5" font-weight="600" fill="#6F3A91">1.静态动产质权（3次）</text>
<text x="844" y="1146" font-size="12" fill="#344054">(1)设立：交付生效主义=书面有效质押合同+交付（转移占有）=动产质权</text>
<text x="844" y="1163" font-size="12" fill="#344054">(2)交付：①当事人不得约定不交付标的物，约定无效</text>
<text x="844" y="1180" font-size="12" fill="#344054">  ②约定的出质财产与实际移交的财产不一致的，以实际交付占有的财产为准</text>
<text x="844" y="1197" font-size="12" fill="#344054">  ③不能是占有改定交付方式，约定由出质人或其代理人代为占有质押财产的，质权不生效</text>
<text x="844" y="1214" font-size="12" fill="#344054">  ④质权人将质物返还于出质人后，不得以其质权对抗第三人</text>
<text x="844" y="1231" font-size="12" fill="#344054">(3)质权人的权利和义务：①权利：①孳息收取权（抵充收取孳息费用→主债权利息→主债权）【430条】</text>
<text x="844" y="1248" font-size="12" fill="#344054">    ②处分权：债务人以自己的财产出质，质权人放弃该质权的，其他担保人在质权人丧失优先受偿权益的范围内免除担保责任，但是其他担保人承诺仍然提供担保的除外</text>
<text x="844" y="1265" font-size="12" fill="#344054">  ②义务：①妥善保管义务：质权人有损害质押财产致使毁损/灭失的，承担赔偿责任</text>
<text x="844" y="1282" font-size="12" fill="#344054">    B. 出质人可以请求质权人将质押财产提存，或者请求提前清偿债务并返还质押财产</text>
<text x="844" y="1299" font-size="12" fill="#344054">    ②及时行权义务：债务履行期限届满后，质权人不行权的，出质人可以请求法院拍卖、变卖质押财产</text>
<text x="844" y="1316" font-size="12" fill="#344054">    ③质物或余款返还</text>
<rect x="832" y="1339" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1361" font-size="14.5" font-weight="600" fill="#6F3A91">2.动态动产产质权</text>
<text x="844" y="1381" font-size="12" fill="#344054">(1)设立：(动产浮动抵押权)债权人/出质人与监管人订立三方协议，</text>
<text x="844" y="1398" font-size="12" fill="#344054">  出质人以通过一定数量/品种等概括描述的货物为债务的履行提供担保，</text>
<text x="844" y="1415" font-size="12" fill="#344054">  当事人另有约定的除外，出质人有权在监管人实际控制货物之日起设立</text>
<text x="844" y="1432" font-size="12" fill="#344054">  【民法典担保制度解释第55条】</text>
<text x="844" y="1449" font-size="12" fill="#344054">(2)监管人责任：监管人违反约定向出质人或者其他人放货、</text>
<text x="844" y="1466" font-size="12" fill="#344054">  因保管不善导致货物毁损灭失，债权人请求监管人承担违约责任的，人民法院予以支持</text>
<rect x="832" y="1489" width="300" height="255" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1511" font-size="14.5" font-weight="600" fill="#6F3A91">3.权利质权（3次）</text>
<text x="844" y="1531" font-size="12" fill="#344054">(1)有价证券：①标的物=汇票/本票/支票/债券/存款单/仓单/提单等</text>
<text x="844" y="1548" font-size="12" fill="#344054">  ②交付生效：①存在纸质权利凭证的，质权自权利凭证交付质权人时设立</text>
<text x="844" y="1565" font-size="12" fill="#344054">    ②以汇票出质，当事人以背书记载&quot;质押&quot;字样并在汇票上签章，汇票已经交付质权人的，质权自汇票交付质权人时设立</text>
<text x="844" y="1582" font-size="12" fill="#344054">  ③登记生效：没有权利凭证的，质权自办理出质登记时设立</text>
<text x="844" y="1599" font-size="12" fill="#344054">(2)可以转让的基金份额、股权：①登记生效：质权自办理出质登记时设立</text>
<text x="844" y="1616" font-size="12" fill="#344054">  ②不得转让出质人他用：原则上不得转让或许可他人使用，但经出质人与质权人协商同意的除外</text>
<text x="844" y="1633" font-size="12" fill="#344054">    转让所得价款，应当向质权人提前清偿债务或者提存</text>
<text x="844" y="1650" font-size="12" fill="#344054">(3)可以转让的知识产权中的财产权：原则同上</text>
<text x="844" y="1667" font-size="12" fill="#344054">(4)现有的以及将有的应收账款：①登记生效</text>
<text x="844" y="1684" font-size="12" fill="#344054">(5)保证金账户质押权：①债务人或第三人为担保债务的履行，</text>
<text x="844" y="1701" font-size="12" fill="#344054">  设立专门的保证金账户并由债权人实际控制，或者将资金存入债权人设立的保证金账户</text>
<text x="844" y="1718" font-size="12" fill="#344054">  债权人主张就该账户内的款项享有优先受偿权的，人民法院予以支持【民法典担保制度解释第70条】</text>
<text x="844" y="1735" font-size="12" fill="#344054">  ②当事人以保证金账户内的款项浮动为主，主张实际控制该账户的债权人对账户内的款项享有优先受偿权的，法院不予支持</text>
<rect x="832" y="1758" width="300" height="102" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1780" font-size="14.5" font-weight="600" fill="#6F3A91">4.质权转质（1次）</text>
<text x="844" y="1800" font-size="12" fill="#344054">(1)含义：是质权人为给自己的债务作担保，将质物移交于自己的债权人而设定新质权的行为</text>
<text x="844" y="1817" font-size="12" fill="#344054">  因转质而取得质权的人，称之为转质权人【434条】</text>
<text x="844" y="1834" font-size="12" fill="#344054">  ⚠️ 转质不限于动产质权，权利质权亦有转质的适用</text>
<text x="844" y="1851" font-size="12" fill="#344054">(2)责任承担：承诺转质(同意转质) vs 责任转质(未经出质人同意)</text>
<rect x="436" y="2127.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="2149.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲35 留置权 + 占有（占有待PDF p041补）</text>
<text x="448" y="2169.5" font-size="12" fill="#344054">来源 p040</text>
<rect x="832" y="1874" width="300" height="323" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1896" font-size="14.5" font-weight="600" fill="#0F7E80">留置权</text>
<text x="844" y="1916" font-size="12" fill="#344054">1.含义：债务人不履行到期债务，债权人可以留置已经合法占有的债务人的动产，并有权就该动产优先受偿</text>
<text x="844" y="1933" font-size="12" fill="#344054">2.成立要件（6次）：</text>
<text x="844" y="1950" font-size="12" fill="#344054">  (1)债权已到期</text>
<text x="844" y="1967" font-size="12" fill="#344054">  (2)合法占有债务人的动产：①动产（客体只能是动产；留置财产价值应当相当于债务的金额）</text>
<text x="844" y="1984" font-size="12" fill="#344054">    ②合法占有：①平等地位的占有（承揽合同/运输合同/保管合同）</text>
<text x="844" y="2001" font-size="12" fill="#344054">      ②雇员对雇主动产的占有并非直接占有，只是单纯的占有辅助</text>
<text x="844" y="2018" font-size="12" fill="#344054">    ③占有：基于合同关系而占有债务人的动产</text>
<text x="844" y="2035" font-size="12" fill="#344054">      遗失物的拾得人不属于合法占有，因侵权行为而占有不属于合法占有</text>
<text x="844" y="2052" font-size="12" fill="#344054">    ④商事留置权不要求留置财产与债权属于同一法律关系</text>
<text x="844" y="2069" font-size="12" fill="#344054">    ⑤留置财产为分物的，留置财产价值应当相当于债务的金额</text>
<text x="844" y="2086" font-size="12" fill="#344054">    ⑥不违反法律规定/不违反当事人约定/不违背公序良俗</text>
<text x="844" y="2103" font-size="12" fill="#344054">3.留置权的实现：宽限期制度（有约从约定，没有约定或约定不明的，60日以上履行期限，</text>
<text x="844" y="2120" font-size="12" fill="#344054">  但鲜活易腐等不易保管的动产除外）</text>
<text x="844" y="2137" font-size="12" fill="#344054">4.优先效力：留置权&gt;超级动产抵押权&gt;登记动产抵押权/动产质权(公示在先原则)&gt;未登记动产抵押权</text>
<text x="844" y="2154" font-size="12" fill="#344054">5.留置权的消灭：①共性原因（权利消灭：留置物灭失/混同；担保物权消灭：主债权消灭/担保物权实现）</text>
<text x="844" y="2171" font-size="12" fill="#344054">  ②特殊原因（留置权人对留置财产丧失占有（自愿丧失占有）/留置权人接受债务人另行提供担保）</text>
<text x="844" y="2188" font-size="12" fill="#344054">6.对比表：抵押权/质权/留置权（种类/发生原因/移转占有/担保人/担保财产/法定担保物范围/孳息收取权/放弃/受善意取得/行权）</text>
<rect x="832" y="2211" width="300" height="221" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2233" font-size="14.5" font-weight="600" fill="#0F7E80">占有【民法典第458-462条】</text>
<text x="844" y="2253" font-size="12" fill="#344054">1.分类（4次）：(1)是否本权：①有权占有（物权/用益物权/担保物权/债权（合同/监护/夫妻共有/无因管理/财产代管人））②无权占有（①善意占有②恶意占有）</text>
<text x="844" y="2270" font-size="12" fill="#344054">  (2)是否以自己的意思占有：①自主占有（盗赃对盗物的占有/错拿他人行李）②他主占有（质权人/承租人）</text>
<text x="844" y="2287" font-size="12" fill="#344054">  (3)是否直接管领其物：①直接占有（质权人/承租人/次承租人）②间接占有（出质人/出租人/转租人）</text>
<text x="844" y="2304" font-size="12" fill="#344054">2.善意占有 vs 恶意占有（1次）：①返还/赔偿义务：均承担</text>
<text x="844" y="2321" font-size="12" fill="#344054">  ②必要费用：善意可请求/恶意不可；③有益费用：均不可</text>
<text x="844" y="2338" font-size="12" fill="#344054">  ④损坏赔偿：善意不承担（责任=现存利益【461条】）；恶意承担损害赔偿责任【461条】</text>
<text x="844" y="2355" font-size="12" fill="#344054">3.占有保护请求权：①占有返还请求权（侵占或夺占【462条】，除斥期间1年）</text>
<text x="844" y="2372" font-size="12" fill="#344054">  ②排除妨害请求权（费用由妨害人负担，可依无因管理请求偿还）</text>
<text x="844" y="2389" font-size="12" fill="#344054">  ③消除危险请求权（建造高危建筑/接近邻地开挖地窖等）</text>
<text x="844" y="2406" font-size="12" fill="#344054">4.占有损害赔偿请求权：车位被侵占额外支付的停车费/房屋被侵占额外支付的租金</text>
<text x="844" y="2423" font-size="12" fill="#344054">5.推定效力：①占有即所有的推定，占有人免除举证责任；②推定具有消极性，相对人提出反证时占有人仍须举证</text>
</svg>`,
