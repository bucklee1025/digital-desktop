<rect x="40" y="1067.5" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1089.5" font-size="14.5" font-weight="600" fill="#185FA5">8-19 · 民法 讲54~58</text>
<text x="52" y="1109.5" font-size="12" fill="#344054">买卖01-02 + 供用电水热气 + 赠与 + 借款</text>
<text x="52" y="1126.5" font-size="12" fill="#344054">p064-p067</text>
<rect x="436" y="197.0" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="219.0" font-size="14.5" font-weight="600" fill="#854F0B">讲54 买卖合同（01）·基本原理+风险负担</text>
<text x="448" y="239.0" font-size="12" fill="#344054">来源 p064</text>
<rect x="832" y="20" width="300" height="85" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">基本原理</text>
<text x="844" y="62" font-size="12" fill="#344054">1.含义：买卖合同系双务、有偿、有名、诺成、不要式合同</text>
<text x="844" y="79" font-size="12" fill="#344054">2.无权处分的买卖合同：①合同效力=物债两分原则，仅产生债权效力，不能直接发生物权效力变动（民法典合同编通则解释第19条）</text>
<text x="844" y="96" font-size="12" fill="#344054">  ②救济途径=买受人可以解除合同并请求出卖人承担违约责任【民法典第597条】</text>
<rect x="832" y="119" width="300" height="306" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="141" font-size="14.5" font-weight="600" fill="#854F0B">风险负担（4次）</text>
<text x="844" y="161" font-size="12" fill="#344054">【民法典第604-611条】</text>
<text x="844" y="178" font-size="12" fill="#344054">1.含义：在合同订立后，标的物因不可归责于任何一方的事由（主观要件）而发生的意外毁损、灭失（客观要件）的损失由何方负担</text>
<text x="844" y="195" font-size="12" fill="#344054">2.原则：有约定从约定（任意性、补充性规定）</text>
<text x="844" y="212" font-size="12" fill="#344054">3.例：</text>
<text x="844" y="229" font-size="12" fill="#344054">  (1)交付主义：①占有者承担风险=①交付前出卖人承担风险；②交付后买受人承担风险</text>
<text x="844" y="246" font-size="12" fill="#344054">  (2)违约在先：违约者承担</text>
<text x="844" y="263" font-size="12" fill="#344054">  (3)在途货物：①含义=货物已在运输途中，出卖人寻找买受人，出卖在途货物的买卖，本质上是单据买卖【民法典第606条】</text>
<text x="844" y="280" font-size="12" fill="#344054">    ②特征：①在途货物的交易是凭单据的交易，且能单据判断风险；②合同订立时，标的物已经脱离出卖人的实际控制；③出卖人将标的物交付运输时，通常会投保</text>
<text x="844" y="297" font-size="12" fill="#344054">    ③处理：①原则：合同成立，风险转移买受人（当事人另有约定的除外）</text>
<text x="844" y="314" font-size="12" fill="#344054">      ②例外：出卖人在合同成立时知道或应当知道标的物已经毁损、灭失却未告知买受人，由出卖人承担风险</text>
<text x="844" y="331" font-size="12" fill="#344054">  (4)代办托运：①含义：是指买卖合同成立后，出卖人将标的物交付第一承运人，由承运人将标的物运送到买受人处或买受人指定地点的交付方式【民法典第607条】</text>
<text x="844" y="348" font-size="12" fill="#344054">    ②处理：①约定明确的交付地点，交付时风险转移买受人（买卖合同解释第9条）</text>
<text x="844" y="365" font-size="12" fill="#344054">      ②交付地点未约定或约定不明确，货交第一承运人后风险转移买受人</text>
<text x="844" y="382" font-size="12" fill="#344054">      4.从交付义务：出卖人未按照约定有关标的物的单位证和资料的，不影响物的毁损、灭失风险的转移【民法典第609条】</text>
<text x="844" y="399" font-size="12" fill="#344054">    5.违约责任：标的物毁损、灭失的风险由买受人承担的，不影响因出卖人履行债务不符约定，买受人要求其承担违约责任的权利【民法典第611条】</text>
<text x="844" y="416" font-size="12" fill="#344054">6.孳息归属：①有约定从约定；②无约定，交付之前归出卖人所有，交付之后归买受人所有</text>
<rect x="436" y="776.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="798.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲55 买卖合同（02）·试用+所有权保留+分期付款</text>
<text x="448" y="818.0" font-size="12" fill="#344054">来源 p065-p066</text>
<rect x="832" y="439" width="300" height="187" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="461" font-size="14.5" font-weight="600" fill="#B83A4A">试用买卖合同（4次）</text>
<text x="844" y="481" font-size="12" fill="#344054">1.含义：是指当事人约定，由出卖人将标的物交付给买受人试验或检验，并以买受人试验或检验结果（条件）来决定合同是否生效的合同【民法典第637-640条】</text>
<text x="844" y="498" font-size="12" fill="#344054">2.附生效条件（买受人认可与否的自由/不附条件）的买卖合同</text>
<text x="844" y="515" font-size="12" fill="#344054">3.试用期间：①有约定从约定；②协议补充；③出卖人确定</text>
<text x="844" y="532" font-size="12" fill="#344054">4.选择权：①明示同意购买；②视为同意购买</text>
<text x="844" y="549" font-size="12" fill="#344054">  ①积极行为=付款行为</text>
<text x="844" y="566" font-size="12" fill="#344054">  ②消极行为=出卖、出租、设立担保物权行为</text>
<text x="844" y="583" font-size="12" fill="#344054">  ③试用期满，试用期满未作表示的，视为同意购买</text>
<text x="844" y="600" font-size="12" fill="#344054">5.使用费：当事人对标的物的使用费没有约定或约定不明确的，出卖人无权请求买受人支付，即使买受人免费试用【民法典第639条】</text>
<text x="844" y="617" font-size="12" fill="#344054">6.风险负担：试用期内标的物毁损、灭失的风险由出卖人承担</text>
<rect x="832" y="640" width="300" height="306" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="662" font-size="14.5" font-weight="600" fill="#B83A4A">动产所有权保留买卖合同（3次）</text>
<text x="844" y="682" font-size="12" fill="#344054">【民法典第641-643条、买卖合同解释第25、26条、民法典担保制度解释第64条】</text>
<text x="844" y="699" font-size="12" fill="#344054">1.含义：①当事人可以在买卖合同中约定买受人未履行支付价款或其他义务的，标的物的所有权属于出卖人，出卖人对标的物保留的所有权，</text>
<text x="844" y="716" font-size="12" fill="#344054">未经登记，不得对抗善意第三人</text>
<text x="844" y="733" font-size="12" fill="#344054">②动产买卖适用所有权保留</text>
<text x="844" y="750" font-size="12" fill="#344054">2.取回权：①主体=出卖人；②行使：①买受人未按照约定支付价款，经催告后在合理期限内仍未支付，且买受人已经支付价款数额不足总价款75%的，</text>
<text x="844" y="767" font-size="12" fill="#344054">    出卖人可以取回标的物</text>
<text x="844" y="784" font-size="12" fill="#344054">  ②未按照约定完成特定条件</text>
<text x="844" y="801" font-size="12" fill="#344054">  ③将标的物出卖、出租或作出其他不当处分的</text>
<text x="844" y="818" font-size="12" fill="#344054">  ③第三人已经善意取得标的物所有权或其他物权，出卖人无权取回标的物</text>
<text x="844" y="835" font-size="12" fill="#344054">3.行使方式：①买受人不及时履行付款义务，出卖人可以向买受人主张违约责任（损害赔偿金）</text>
<text x="844" y="852" font-size="12" fill="#344054">  (1)买受人在合理期限内回赎标的物的，出卖人可以向买受人主张违约责任（损害赔偿金）</text>
<text x="844" y="869" font-size="12" fill="#344054">  (2)买受人在合理期限内没有回赎标的物的，出卖人可以以合理价格出售标的物</text>
<text x="844" y="886" font-size="12" fill="#344054">  ③出卖人所得价款扣除原买受人欠付的价款及必要费用后仍有剩余的，应当返还买受人；不足部分由原买受人清偿</text>
<text x="844" y="903" font-size="12" fill="#344054">4.赎回权（VS超级动产抵押权）：①赎回权=取回权（总价款的75%）</text>
<text x="844" y="920" font-size="12" fill="#344054">  ②赎回权：取回权VS超级动产抵押权（买卖合同解释第25、26条）</text>
<text x="844" y="937" font-size="12" fill="#344054">  对比表：动产所有权保留买卖合同 VS 超级动产抵押权（法律依据/相同点/相同点2/相同点3/相同点4/性质/交付后结果/登记/担保功能/买受人力/对出卖人保护力）</text>
<rect x="832" y="960" width="300" height="204" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="982" font-size="14.5" font-weight="600" fill="#B83A4A">分期付款买卖合同（3次）</text>
<text x="844" y="1002" font-size="12" fill="#344054">【民法典第634条、买卖合同解释第27、28条】</text>
<text x="844" y="1019" font-size="12" fill="#344054">1.含义：买受人将应付的总价款在一定期限内至少分3次向出卖人支付的合同，常见于消费领域</text>
<text x="844" y="1036" font-size="12" fill="#344054">2.出卖人权利：</text>
<text x="844" y="1053" font-size="12" fill="#344054">  (1)变更权：全部剩余价款（包括到期和未到期）一次性加速到期</text>
<text x="844" y="1070" font-size="12" fill="#344054">  (2)解除权：分期付款的买受人未支付到期价款的数额达到全部价款的1/5（即20%），经催告后在合理期限内仍未支付到期价款的，出卖人可以请求买受人支付全部价款或解除合同，即择一选择</text>
<text x="844" y="1087" font-size="12" fill="#344054">  ①合同约定出卖人在解除合同时可以扣留已受领价款，扣除金额数额相当于标的物使用费，应当返还买受人</text>
<text x="844" y="1104" font-size="12" fill="#344054">    使用费没有约定的，参照当地同类标的物的租金标准确定</text>
<text x="844" y="1121" font-size="12" fill="#344054">  ②买受人则有权请求出卖人返还已支付的扣除标的物使用费及标的物折旧后的价款，扣留的标的物使用费不足以弥补出卖人损失的，可以向买受人主张赔偿损失</text>
<text x="844" y="1138" font-size="12" fill="#344054">  ③买受人已经支付价款按照合同约定出卖人扣除使用费后的剩余款项返还买受人（出卖人扣除使用费后返还）</text>
<text x="844" y="1155" font-size="12" fill="#344054">  (3)分期付款→动产所有权保留买受人合同出卖的行权：①机器设备买卖合同，60万元/78万元/95万元/3权择一选择→变更权/解除权/取回权（特种买卖合同中的黄线三区法律关系示意图）</text>
<rect x="436" y="1336.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1358.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲56 供用电、水、气、热力合同</text>
<text x="448" y="1378.5" font-size="12" fill="#344054">来源 p066</text>
<rect x="832" y="1178" width="300" height="68" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1200" font-size="14.5" font-weight="600" fill="#6F3A91">不动产物权变动（2次）</text>
<text x="844" y="1220" font-size="12" fill="#344054">【买卖合同解释第6、7条】</text>
<text x="844" y="1237" font-size="12" fill="#344054">1.不动产：一房数卖，买卖合同均有效，合同效力没有排序</text>
<rect x="832" y="1260" width="300" height="102" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1282" font-size="14.5" font-weight="600" fill="#6F3A91">动产（3次）</text>
<text x="844" y="1302" font-size="12" fill="#344054">(1)普通动产：①机械设备、手表、自行车</text>
<text x="844" y="1319" font-size="12" fill="#344054">  ②先行受领交付→先行支付价款&gt;合同成立在先</text>
<text x="844" y="1336" font-size="12" fill="#344054">  (2)特殊动产：①机动车、船舶、航空器</text>
<text x="844" y="1353" font-size="12" fill="#344054">  ②先行受领交付→先行办理所有权转移登记手续&gt;合同成立在先</text>
<rect x="832" y="1376" width="300" height="170" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1398" font-size="14.5" font-weight="600" fill="#6F3A91">供用电、水、气、热力合同【民法典第648-656条】</text>
<text x="844" y="1418" font-size="12" fill="#344054">1.含义：供用水、电、气、热力合同（转移特殊商品所有权的合同），双务、有名、有偿、诺成合同</text>
<text x="844" y="1435" font-size="12" fill="#344054">2.特征：合同一方当事人为公用性、垄断性企业、其他付款人有义务。不得拒绝用电人合理的订约要求；不可解除合同；利用者对方使用条件无评价之余地</text>
<text x="844" y="1452" font-size="12" fill="#344054">3.履行地点：有约定从约定，无约定或约定不明确的，供电设施的产权界处为履行地点</text>
<text x="844" y="1469" font-size="12" fill="#344054">4.供方义务：①中断供电时，应当按照国家有关规定事先通知用电人，否则由此造成的损失，应当承担赔偿责任</text>
<text x="844" y="1486" font-size="12" fill="#344054">  ②未按照国家规定的供电质量标准和约定安全供电，造成用电人损失的，应当承担赔偿责任</text>
<text x="844" y="1503" font-size="12" fill="#344054">  ③经催告用电人在合理期限内仍不支付电费和违约金的，供电人可按照国家规定的程序中止供电【民法典第659条】</text>
<text x="844" y="1520" font-size="12" fill="#344054">5.用方义务：①及时交付电费。逾期不支付电费的，应当按照约定支付违约金</text>
<text x="844" y="1537" font-size="12" fill="#344054">  ②未按照国家有关规定和当事人的约定安全用电，造成供电人损失的，应当承担赔偿责任</text>
<rect x="436" y="1754.0" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="1776.0" font-size="14.5" font-weight="600" fill="#0F7E80">讲57 赠与合同</text>
<text x="448" y="1796.0" font-size="12" fill="#344054">来源 p067</text>
<rect x="832" y="1560" width="300" height="119" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1582" font-size="14.5" font-weight="600" fill="#0F7E80">基本原理（2次）</text>
<text x="844" y="1602" font-size="12" fill="#344054">【民法典第657-666条】</text>
<text x="844" y="1619" font-size="12" fill="#344054">1.含义：赠与人将自己的财产无偿给予受赠人，受赠人表示接受赠与的合同。单务合同、无偿合同</text>
<text x="844" y="1636" font-size="12" fill="#344054">2.瑕疵担保责任：①原则：赠与人不承担责任</text>
<text x="844" y="1653" font-size="12" fill="#344054">  ②例外：①附义务的赠与（关键句：专款专用/专用/只能用于），赠与人在附义务的财产价值范围内承担与出卖人相同的责任</text>
<text x="844" y="1670" font-size="12" fill="#344054">    ②赠与人故意不告知瑕疵或者保证无瑕疵，造成受赠人损失的，应当承担赔偿责任</text>
<rect x="832" y="1693" width="300" height="306" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1715" font-size="14.5" font-weight="600" fill="#0F7E80">撤销权（5次）</text>
<text x="844" y="1735" font-size="12" fill="#344054">1.任意撤销权：①条件=在赠与财产的权利转移之前（动产交付前/不动产过户登记前）</text>
<text x="844" y="1752" font-size="12" fill="#344054">  ②例外：①经过公证的赠与合同；②救灾、扶贫、助残等社会公益性质的赠与合同（还包括科学、教育、文化、卫生、体育和新闻等事业）</text>
<text x="844" y="1769" font-size="12" fill="#344054">    ③道德义务性质的赠与合同（直至血亲之间的赠与、养子女对生父母的赠与、为报答别人救命之恩的赠与等）</text>
<text x="844" y="1786" font-size="12" fill="#344054">2.法定撤销权（2次）：①法定情形：①严重侵害赠与人或赠与人近亲属的合法权益</text>
<text x="844" y="1803" font-size="12" fill="#344054">  ②对赠与人有抚养义务而不履行</text>
<text x="844" y="1820" font-size="12" fill="#344054">  ③不履行赠与合同约定的义务</text>
<text x="844" y="1837" font-size="12" fill="#344054">  ②行权：①第一顺序：赠与人本人，自知道或应当知道撤销事由之日起1年内</text>
<text x="844" y="1854" font-size="12" fill="#344054">    ②第二顺序：A. 因受赠人的违法行为致使赠与人死亡或丧失民事行为能力</text>
<text x="844" y="1871" font-size="12" fill="#344054">      B. 赠与人的继承人或法定代理人，自知道或应当知道撤销事由之日起6个月内</text>
<text x="844" y="1888" font-size="12" fill="#344054">  ③法律后果：受赠人应当返还赠与财产于赠与人</text>
<text x="844" y="1905" font-size="12" fill="#344054">3.穷困抗辩权：①含义：赠与人的经济状况显著恶化，严重影响其生产经营或家庭生活的，可以不再履行赠与义务</text>
<text x="844" y="1922" font-size="12" fill="#344054">  (2)理论基础：①赠与合同的无偿性；②情势变更</text>
<text x="844" y="1939" font-size="12" fill="#344054">  (3)构成要件：①赠与合同已经成立并生效</text>
<text x="844" y="1956" font-size="12" fill="#344054">  ②合同尚未履行完毕</text>
<text x="844" y="1973" font-size="12" fill="#344054">  ③赠与人的经济状况显著恶化，严重影响其生产经营或家庭生活</text>
<text x="844" y="1990" font-size="12" fill="#344054">  ④受赠人请求赠与人继续履行合同</text>
<rect x="436" y="2072.5" width="300" height="51" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="448" y="2094.5" font-size="14.5" font-weight="600" fill="#5B6B7C">讲58 借款合同</text>
<text x="448" y="2114.5" font-size="12" fill="#344054">来源 p067</text>
<rect x="832" y="2013" width="300" height="170" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="844" y="2035" font-size="14.5" font-weight="600" fill="#5B6B7C">基本原理（5次）</text>
<text x="844" y="2055" font-size="12" fill="#344054">【民法典第667-680条】</text>
<text x="844" y="2072" font-size="12" fill="#344054">1.含义：借款人向贷款人借款，到期返还借款并支付利息的合同</text>
<text x="844" y="2089" font-size="12" fill="#344054">2.贷款人的权利和义务：①权利：①借款人未按约定的借款用途使用借款的，贷款人停止发放借款、提前收回借款或解除合同</text>
<text x="844" y="2106" font-size="12" fill="#344054">  ②义务：①借款的利息不得预先在本金中扣除；利息预先在本金中扣除的，应当按照实际借款数额返还借款并计算利息</text>
<text x="844" y="2123" font-size="12" fill="#344054">3.自然人之间的借款合同：单务、实践性、不要式合同</text>
<text x="844" y="2140" font-size="12" fill="#344054">  ①自贷款人提供借款时成立</text>
<text x="844" y="2157" font-size="12" fill="#344054">  ②对支付利息没有约定或约定不明的，视为没有利息</text>
<text x="844" y="2174" font-size="12" fill="#344054">  ③借期内利率不得超过合同成立时一年期LPR的四倍</text>
</svg>`,

<rect x="40" y="1120.0" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1142.0" font-size="14.5" font-weight="600" fill="#185FA5">8-20 · 民法 讲59~62</text>
<text x="52" y="1162.0" font-size="12" fill="#344054">保证合同01-04</text>
<text x="52" y="1179.0" font-size="12" fill="#344054">p068-p070</text>
<rect x="436" y="239.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="261.5" font-size="14.5" font-weight="600" fill="#854F0B">讲59 保证合同（01）·基本原理+一般保证</text>
<text x="448" y="281.5" font-size="12" fill="#344054">来源 p069</text>
<rect x="832" y="20" width="300" height="170" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">基本原理（2次）</text>
<text x="844" y="62" font-size="12" fill="#344054">1.含义：是指保证人和债权人约定，当债务人不履行到期债务或发生当事人约定的情形时，</text>
<text x="844" y="79" font-size="12" fill="#344054">  保证人履行债务或承担责任的合同</text>
<text x="844" y="96" font-size="12" fill="#344054">2.保证人的限制（2次）：①机关法人不得为保证人</text>
<text x="844" y="113" font-size="12" fill="#344054">  ②以公益为目的的非营利法人、非法人组织（幼儿园、学校、医院、养老院）【民法典第683条第2款、民法典担保制度解释第6条】</text>
<text x="844" y="130" font-size="12" fill="#344054">3.保证合同的订立方式：①单独的书面保证合同</text>
<text x="844" y="147" font-size="12" fill="#344054">  ②在主债权债务合同（如借款合同）中有保证条款，第三人签字</text>
<text x="844" y="164" font-size="12" fill="#344054">  ③在主债权债务合同（如借款合同）中没有保证条款，但第三人身份签字</text>
<text x="844" y="181" font-size="12" fill="#344054">  ④第三人单方以书面形式向债权人作出保证，债权人接收且未提出异议</text>
<rect x="832" y="204" width="300" height="306" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="226" font-size="14.5" font-weight="600" fill="#854F0B">保证方式（6次）</text>
<text x="844" y="246" font-size="12" fill="#344054">1.一般保证：</text>
<text x="844" y="263" font-size="12" fill="#344054">  (1)识别：①本质：一般保证的本质是债务人对债权人承担补充责任有顺序先后的限制，即先债务人后保证人</text>
<text x="844" y="280" font-size="12" fill="#344054">    ②明示：当事人在保证合同中约定，债务人不能履行债务或无力偿还债务时，承担保证责任的，</text>
<text x="844" y="297" font-size="12" fill="#344054">      为一般保证【民法典保证制度解释第25条第1款】</text>
<text x="844" y="314" font-size="12" fill="#344054">    ③推定：当事人在保证合同中对保证方式没有约定或约定不明确的，按照一般保证承担保证责任【民法典第686条第2款】</text>
<text x="844" y="331" font-size="12" fill="#344054">  (2)先诉抗辩权（一般保证）：①含义：①程序上，债权人不得单独起诉或申请仲裁一般保证人；实体上，债权人不得单独执行一般保证人的财产</text>
<text x="844" y="348" font-size="12" fill="#344054">    ②丧失：①债务人下落不明，且无财产可供执行</text>
<text x="844" y="365" font-size="12" fill="#344054">      ②法院已经受理债务人破产案件</text>
<text x="844" y="382" font-size="12" fill="#344054">      ③债权人有证据证明债务人的财产不足以履行全部债务或丧失履行债务能力</text>
<text x="844" y="399" font-size="12" fill="#344054">      ④保证人书面表示放弃先诉抗辩权</text>
<text x="844" y="416" font-size="12" fill="#344054">2.连带责任保证：①本质：连带责任保证的本质是债务人和保证人对债权人承担补充责任没有顺序先后的限制，即债权人可以选择债务人和保证人承担责任</text>
<text x="844" y="433" font-size="12" fill="#344054">  (1)识别：①明示：当事人在保证合同中约定保证人在债务人不履行债务或未承担违约责任时承担连带责任的，为连带责任保证【民法典保证制度解释第25条第2款】</text>
<text x="844" y="450" font-size="12" fill="#344054">    ②推定：当事人在保证合同中对保证方式没有约定或约定不明的，推定为连带责任保证（民法典担保制度解释第25条第2款）</text>
<text x="844" y="467" font-size="12" fill="#344054">  (2)诉讼：在连带责任保证的情况下，债权人可以单独起诉债务人，也可以单独起诉保证人和与保证人和作为共同被告</text>
<text x="844" y="484" font-size="12" fill="#344054">3.对比表：第三人代为履行（清偿） vs 债务加入（并存的债务承担） vs 连带责任保证</text>
<text x="844" y="501" font-size="12" fill="#344054">  （法律依据/本质/当事人/追偿权）</text>
<rect x="436" y="667.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="689.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲60 保证合同（02）·保证范围+从属性+转让</text>
<text x="448" y="709.0" font-size="12" fill="#344054">来源 p070</text>
<rect x="832" y="524" width="300" height="85" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="546" font-size="14.5" font-weight="600" fill="#B83A4A">保证范围（2次）</text>
<text x="844" y="566" font-size="12" fill="#344054">1.原则：①有约定从约定</text>
<text x="844" y="583" font-size="12" fill="#344054">  ②没有约定，全部（主债权及其利息、违约金、损害赔偿金、实现债权的费用）【民法典第691条】</text>
<text x="844" y="600" font-size="12" fill="#344054">2.对比：担保物权对保证的范围得出保留担保财产的费用【民法典第289条】</text>
<rect x="832" y="623" width="300" height="238" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="645" font-size="14.5" font-weight="600" fill="#B83A4A">保证的从属性（5次）</text>
<text x="844" y="665" font-size="12" fill="#344054">1.变更数额的从属性：①增加：须经保证人书面同意；未经保证人书面同意的，保证人对增加的部分不承担保证责任</text>
<text x="844" y="682" font-size="12" fill="#344054">  ②减少：无须保证书面同意，保证人对变更后的债务承担保证责任</text>
<text x="844" y="699" font-size="12" fill="#344054">2.履行期限的从属性：①延长：①须经保证人书面同意；未经保证人书面同意的，保证人对延长的部分不承担保证责任</text>
<text x="844" y="716" font-size="12" fill="#344054">  ②但对原定期限内的债务仍承担保证责任，若延长期限覆盖全部保证期间的，保证人无须承担保证责任</text>
<text x="844" y="733" font-size="12" fill="#344054">  ②缩短：无须保证书面同意，保证人对变更后的债务承担保证责任</text>
<text x="844" y="750" font-size="12" fill="#344054">3.债权的转让从属性：①原则：仅需要通知债务人和保证人即可，保证人在原保证范围内继续承担保证责任（双重通知）</text>
<text x="844" y="767" font-size="12" fill="#344054">  ②例外：债权人为债权人约定禁止（仅特定债权）转让债权的，债权人未经保证人书面同意转让债权的，保证人对受让人不再承担保证责任</text>
<text x="844" y="784" font-size="12" fill="#344054">4.债务的转让从属性：①原则：未经保证人的书面同意，对于转移部分的债务，保证人不承担保证责任</text>
<text x="844" y="801" font-size="12" fill="#344054">  ②例外：①保证人继续承担保证责任的&quot;双重同意且有顺序&quot;，即先债权人（主债权）同意后保证人（从权利）同意</text>
<text x="844" y="818" font-size="12" fill="#344054">    ②债权人同意书面、口头、行为均可，保证人需书面同意</text>
<text x="844" y="835" font-size="12" fill="#344054">    ③第三人提供物的担保，未经其书面同意，债权人允许债务人转移全部或部分债务的，担保人不再承担相应的担保责任</text>
<text x="844" y="852" font-size="12" fill="#344054">    ④债务加入：对保证人保证责任承担没有影响</text>
<rect x="436" y="1059.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1081.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲61 保证合同（03）·保证期间</text>
<text x="448" y="1101.0" font-size="12" fill="#344054">来源 p070</text>
<rect x="832" y="875" width="300" height="119" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="897" font-size="14.5" font-weight="600" fill="#6F3A91">保证期间（2次）</text>
<text x="844" y="917" font-size="12" fill="#344054">1.含义：确定保证人承担保证责任的期间（保护保证人的利益，督促债权人及时行权）</text>
<text x="844" y="934" font-size="12" fill="#344054">2.性质：除斥期间，不发生中止、中断和延长</text>
<text x="844" y="951" font-size="12" fill="#344054">3.类型：①约定：有约定从约定（视为约定不明/无约定）</text>
<text x="844" y="968" font-size="12" fill="#344054">  ②法定：①没有约定或约定不明的，保证期间为主债务履行期限届满之日起6个月</text>
<text x="844" y="985" font-size="12" fill="#344054">    ②约定保证人承担保证责任直至主债务履行期限届满之日为止或类似内容的，视为约定不明</text>
<rect x="832" y="1008" width="300" height="85" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1030" font-size="14.5" font-weight="600" fill="#6F3A91">4.起算（2次）</text>
<text x="844" y="1050" font-size="12" fill="#344054">(1)自主债务履行期限届满之日起算</text>
<text x="844" y="1067" font-size="12" fill="#344054">  (2)债权人与债务人对主债务履行期限没有约定或约定不明的，</text>
<text x="844" y="1084" font-size="12" fill="#344054">  自债权人请求债务人履行债务的宽限期届满之日起算</text>
<rect x="832" y="1107" width="300" height="187" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1129" font-size="14.5" font-weight="600" fill="#6F3A91">5.保证期间届满的法律后果</text>
<text x="844" y="1149" font-size="12" fill="#344054">(1)一般保证：①债权人行权方式=或诉或裁</text>
<text x="844" y="1166" font-size="12" fill="#344054">    ②债权人未行权：①保证人不再承担保证责任</text>
<text x="844" y="1183" font-size="12" fill="#344054">      ②一般保证的债权人在保证期间内提起诉讼或仲裁后又撤诉或裁申请，在保证期间届满前未重新起诉或裁申请的，保证人不再承担保证责任</text>
<text x="844" y="1200" font-size="12" fill="#344054">    【民法典担保制度解释第31条第1款】</text>
<text x="844" y="1217" font-size="12" fill="#344054">    ③债权人行权：从拒绝消灭之日（即一般保证人丧失先诉抗辩权之日）开始起算保证债务3年诉讼时效期间</text>
<text x="844" y="1234" font-size="12" fill="#344054">  (2)连带责任保证：①债权人行权方式=或诉或裁</text>
<text x="844" y="1251" font-size="12" fill="#344054">    ②债权人未行权：①保证人不再承担保证责任</text>
<text x="844" y="1268" font-size="12" fill="#344054">      ②连带保证的债权人在保证期间内提起诉讼或申请仲裁，在保证期间届满前未获终局裁决或确认的，保证人不再承担保证责任</text>
<text x="844" y="1285" font-size="12" fill="#344054">    【民法典担保制度解释第31条第2款】</text>
<rect x="436" y="1772.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="1794.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲62 保证合同（04）·让与担保+共同保证+反担保</text>
<text x="448" y="1814.5" font-size="12" fill="#344054">来源 p068 + p071-p073</text>
<rect x="832" y="1308" width="300" height="340" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1330" font-size="14.5" font-weight="600" fill="#0F7E80">让与担保合同（6次）</text>
<text x="844" y="1350" font-size="12" fill="#344054">【民间借贷合同解释第23条、民法典担保制度解释第68、69条】</text>
<text x="844" y="1367" font-size="12" fill="#344054">1.含义：①债务人或者第三人为担保债务的履行，将标的物的所有权形式上转移给债权人，债务清偿后，债权人应当将标的物的所有权返还给债权人或第三人；债务不履行时，债权人无权就该标的物受偿（未完成公示）的一种非典型担保</text>
<text x="844" y="1384" font-size="12" fill="#344054">  ②将标的物转移给债权人或第三人形式上是让与人，实际上是担保人/债权人</text>
<text x="844" y="1401" font-size="12" fill="#344054">  ③受领标的物的所有权的他人形式上是受让人，实际上是担保权人/债权人</text>
<text x="844" y="1418" font-size="12" fill="#344054">2.基本原理：①第一层=民间借贷合同（主合同），合法有效</text>
<text x="844" y="1435" font-size="12" fill="#344054">  ②第二层：①名实分离（买卖合同），双方通谋的虚假意思表示，无效，不发生所有权移转</text>
<text x="844" y="1452" font-size="12" fill="#344054">    ②实际担保（担保合同），双方隐藏的真实意思表示，有效</text>
<text x="844" y="1469" font-size="12" fill="#344054">    ③流押/流质条款（标的物直接归受偿人/债权人/担保权人所有）无效</text>
<text x="844" y="1486" font-size="12" fill="#344054">  ③第三层：①完成公示（登记/交付）：先止与担保，担保物权效力，有优先受偿权</text>
<text x="844" y="1503" font-size="12" fill="#344054">    ②未完成公示（未登记/交付）：后让与担保，普遍债权效力，无优先受偿权</text>
<text x="844" y="1520" font-size="12" fill="#344054">  ⚠️ 另一种形式：约定先卖/订一定期限赎购的，也属于让与担保</text>
<text x="844" y="1537" font-size="12" fill="#344054">3.处理：①房屋/建设用地使用权=类推适用不动产抵押（登记）</text>
<text x="844" y="1554" font-size="12" fill="#344054">  ②汽车、机器设备=类推适用动产抵押/质押（登记/交付）</text>
<text x="844" y="1571" font-size="12" fill="#344054">  ③票据=类推适用权利质押（交付/登记）</text>
<text x="844" y="1588" font-size="12" fill="#344054">  ④股权、应收账款/债权=类推适用权利质押（登记）</text>
<text x="844" y="1605" font-size="12" fill="#344054">  ⑤没有指明任何特定财产=保证（承诺/承诺函/借函）【民法典担保制度解释第25、36条】</text>
<text x="844" y="1622" font-size="12" fill="#344054">对比表：让与担保 vs 质押（流质条款）vs 履行期届满前的清算型以物抵债协议</text>
<text x="844" y="1639" font-size="12" fill="#344054">  （项目/相同点/不同点/效力/法律依据）</text>
<rect x="832" y="1662" width="300" height="255" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1684" font-size="14.5" font-weight="600" fill="#0F7E80">共同保证（16次）</text>
<text x="844" y="1704" font-size="12" fill="#344054">1.共同保证：①含义=两个或两个以上的保证人为同一债务向同一债权人提供保证</text>
<text x="844" y="1721" font-size="12" fill="#344054">  ②特征：①保证人人数两个以上；②两个以上的保证人必须为同一债权人的同一债权提供保证</text>
<text x="844" y="1738" font-size="12" fill="#344054">  ③责任形式：①按份共同保证=当事人约定保证责任的份额的，按份共同保证</text>
<text x="844" y="1755" font-size="12" fill="#344054">      否则推定为连带共同保证</text>
<text x="844" y="1772" font-size="12" fill="#344054">    ②连带共同保证=①保证人与债权人在合同中约定了各保证人所承担的保证份额，债权人只能在约定的份额限度内请求各保证人承担保证责任【民法典第699条】</text>
<text x="844" y="1789" font-size="12" fill="#344054">      C. 对外责任既可以是一般保证，也可以是连带责任保证</text>
<text x="844" y="1806" font-size="12" fill="#344054">    ③按份共同保证的对比表（步骤/关系/类型1/2/3/4）</text>
<text x="844" y="1823" font-size="12" fill="#344054">2.共同物保（共同债务人物保）=两个以上他担保人为同一债权担保同一债务保证，债权人以共同物保的债务人或第三人担保的物的全部或部分担保同一债务人的债务的责任形式保证</text>
<text x="844" y="1840" font-size="12" fill="#344054">    ①连带：①起诉=债务人和第三人为共同被告</text>
<text x="844" y="1857" font-size="12" fill="#344054">      ②执行=①老孟观点：有顺序说，应当先执行债务人的物保，不足部分由其他担保人承担（类推适用《民法典》第392条）</text>
<text x="844" y="1874" font-size="12" fill="#344054">        ②抵销权/质权人放弃对债务人物权/质权的，其他担保人在其放弃权利范围内免除担保责任</text>
<text x="844" y="1891" font-size="12" fill="#344054">          但其他担保人仍然承诺提供担保的除外【民法典第409条第2款、第435条】</text>
<text x="844" y="1908" font-size="12" fill="#344054">        ③免责【民法典第409条第2款、第435条】</text>
<rect x="832" y="1931" width="300" height="357" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="1953" font-size="14.5" font-weight="600" fill="#0F7E80">混合担保与相互追偿权（16次）</text>
<text x="844" y="1973" font-size="12" fill="#344054">1.共同担保与混合担保：①共同物保+人保的混合担保（同一债权）</text>
<text x="844" y="1990" font-size="12" fill="#344054">  ②连带（债务人物保+第三人保）：①有约定从约定</text>
<text x="844" y="2007" font-size="12" fill="#344054">    ②无约定的，先实现债务人的物保，不足部分再实现保证人的保证</text>
<text x="844" y="2024" font-size="12" fill="#344054">  ③连带（第三人人物保+第三人人物保）：任意选择实现第三人人物保或第三人保证</text>
<text x="844" y="2041" font-size="12" fill="#344054">2.相互追偿权：①含义：两个以上保证人/保证人为同一债务承担保证责任后，相互之间的追偿权（必然可以向债务人追偿）</text>
<text x="844" y="2058" font-size="12" fill="#344054">  (2)规则：①两个以上第三人相互不知道对方存在的=无追偿权【民法典保证制度解释第13条】</text>
<text x="844" y="2075" font-size="12" fill="#344054">    ②相互知道对方存在的：①按份共同担保=无追偿权</text>
<text x="844" y="2092" font-size="12" fill="#344054">      ②连带共同担保：①约定相互追偿及分担份额，有追偿权且无顺序限制</text>
<text x="844" y="2109" font-size="12" fill="#344054">        ②未约定相互追偿但约定保证份额=债务人不能追偿部分再向其他担保人请求按比例分担</text>
<text x="844" y="2126" font-size="12" fill="#344054">        ③既未约定相互追偿又未约定保证份额=同一债务有两个以上第三人提供担保，担保人之间未相互约定追偿或分担份额，</text>
<text x="844" y="2143" font-size="12" fill="#344054">          但是各担保人在同一合同书上签字、盖章或按指印，</text>
<text x="844" y="2160" font-size="12" fill="#344054">          承担担保责任的担保人请求其他担保人按照公平原则分担份额的，人民法院不予支持</text>
<text x="844" y="2177" font-size="12" fill="#344054">      ③同一债务有两个以上第三人提供担保，担保人受让债权人请求其他担保人承担责任的，其他担保人应当相应在担保范围内承担比例分担责任</text>
<text x="844" y="2194" font-size="12" fill="#344054">        民法典不予支持；该担保人请求其他担保人分担相应份额的，依照《民法典共同担保解释》第13条的规定处理</text>
<text x="844" y="2211" font-size="12" fill="#344054">3.反担保：①含义=指债务人或者第三人为担保人向债权人作出保证设定担保或设定物的担保，在担保人因履行债务或者承担责任而受损失时，由债务人或第三人向担保人承担反担保的责任的反担保</text>
<text x="844" y="2228" font-size="12" fill="#344054">    (2)反担保对象：①担保人承担民事责任后对债务人享有的追偿权</text>
<text x="844" y="2245" font-size="12" fill="#344054">      ②反担保人（非债务人）向担保人承担担保责任后，向债务人追偿</text>
<text x="844" y="2262" font-size="12" fill="#344054">2.类型：①求偿抵押/质押=债务人或第三人（反担保人）均可以设定留置和定金作为反担保</text>
<text x="844" y="2279" font-size="12" fill="#344054">  ②求偿保证=只能是第三人可以设定，债务人不能（保证的反担保仅适用于第三人保证）</text>

<rect x="40" y="1161.0" width="300" height="68" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<text x="52" y="1183.0" font-size="14.5" font-weight="600" fill="#185FA5">8-21 · 民法 讲63~66</text>
<text x="52" y="1203.0" font-size="12" fill="#344054">租赁合同01-02+融资租赁+保理</text>
<text x="52" y="1220.0" font-size="12" fill="#344054">p074-p078</text>
<rect x="436" y="314.5" width="300" height="51" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="448" y="336.5" font-size="14.5" font-weight="600" fill="#854F0B">讲63 租赁合同（01）</text>
<text x="448" y="356.5" font-size="12" fill="#344054">来源 p074</text>
<rect x="832" y="20" width="300" height="136" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">基本原理</text>
<text x="844" y="62" font-size="12" fill="#344054">1.期限：①最长租赁期限不得超过20年，超过20年的，超过部分无效</text>
<text x="844" y="79" font-size="12" fill="#344054">  ②续订亦不得超过20年【民法典第705条】</text>
<text x="844" y="96" font-size="12" fill="#344054">2.备案登记：备案登记属于管理性强制规定，未办理备案登记，不影响合同效力【民法典第706条】</text>
<text x="844" y="113" font-size="12" fill="#344054">3.形式：①租赁期限不满6个月的，可书面可口头</text>
<text x="844" y="130" font-size="12" fill="#344054">  ②超过6个月的，应当采用书面形式。未采用书面形式，无法确定租赁期限的，视为不定期租赁合同，双方均有权随时解除合同【民法典第707条】</text>
<text x="844" y="147" font-size="12" fill="#344054">4.风险负担：因不可归责于承租人的事由，致使租赁物部分或全部毁损、灭失的，承租人可以请求减少租金或者不支付租金；因租赁物部分或全部毁损、灭失，致使不能实现合同目的（根本违约）的，承租人可以解除合同【民法典第729条】</text>
<rect x="832" y="170" width="300" height="374" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="192" font-size="14.5" font-weight="600" fill="#854F0B">出租人和承租人的义务（2次）</text>
<text x="844" y="212" font-size="12" fill="#344054">1.出租人的义务：</text>
<text x="844" y="229" font-size="12" fill="#344054">  (1)交付租赁物和租赁物的取藏担保义务</text>
<text x="844" y="246" font-size="12" fill="#344054">  (2)维修义务：①有约定从约定；②没有约定，出租人维修</text>
<text x="844" y="263" font-size="12" fill="#344054">    因第三人主张权利，导致承租人不能对租赁物使用、收益的，承租人可以请求减少租金或者不支付租金</text>
<text x="844" y="280" font-size="12" fill="#344054">    【民法典第712、713条】</text>
<text x="844" y="297" font-size="12" fill="#344054">    ③承租人过错致害的，出租人不承担维修义务【民法典第713条第2款】</text>
<text x="844" y="314" font-size="12" fill="#344054">  (3)权利瑕疵担保义务：①因第三人主张权利，导致承租人不能对租赁物使用、收益的，承租人可以请求减少租金或者不支付租金</text>
<text x="844" y="331" font-size="12" fill="#344054">    ②第三人主张权利的，承租人应当及时通知出租人</text>
<text x="844" y="348" font-size="12" fill="#344054">2.承租人的义务：</text>
<text x="844" y="365" font-size="12" fill="#344054">  (1)正当使用义务</text>
<text x="844" y="382" font-size="12" fill="#344054">  (2)妥善保管义务</text>
<text x="844" y="399" font-size="12" fill="#344054">  (3)不作为义务（禁止转租）：①禁止添附：承租人未经出租人同意，对租赁物进行改善或增设他物的，出租人可以要求承租人恢复原状或者赔偿损失</text>
<text x="844" y="416" font-size="12" fill="#344054">    ②禁止转租：①经出租人同意，承租人可以将租赁物转租给第三人，原租赁合同继续有效（第三人造成租赁物损失的，承租人应当赔偿损失）</text>
<text x="844" y="433" font-size="12" fill="#344054">      ②转租期限超过承租人剩余租赁期限的，超过部分的约定对出租人不具有法律约束力，但是出租人与承租人另有约定的除外</text>
<text x="844" y="450" font-size="12" fill="#344054">      ③未经出租人同意擅自转租的，出租人可以解除合同</text>
<text x="844" y="467" font-size="12" fill="#344054">  (4)支付租金义务：①有约定从约定</text>
<text x="844" y="484" font-size="12" fill="#344054">    ②没有约定或约定不明确：①租赁期限不满1年的，应当在租赁期限届满时支付</text>
<text x="844" y="501" font-size="12" fill="#344054">      ②租赁期限1年以上的，应当在每届满1年时支付，剩余期限不满1年的，应当在租赁期限届满时支付</text>
<text x="844" y="518" font-size="12" fill="#344054">    ③欠付租金的处理：出租人请求承租人在合理期限内支付租金；承租人逾期不支付，出租人可以解除合同</text>
<text x="844" y="535" font-size="12" fill="#344054">  (5)返还租赁物义务：租赁期限届满，承租人应当返还租赁物</text>
<rect x="832" y="558" width="300" height="102" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="580" font-size="14.5" font-weight="600" fill="#854F0B">承租人的权利（1）</text>
<text x="844" y="600" font-size="12" fill="#344054">【民法典第724、729、731条】</text>
<text x="844" y="617" font-size="12" fill="#344054">1.法定解除权：①租赁物被依法查封、扣押的，租赁物权属有争议的，租赁物具有违反法律、行政法规关于使用条件的强制性规定的，致使租赁物无法使用</text>
<text x="844" y="634" font-size="12" fill="#344054">  ②不可归责于承租人的事由，致使租赁物部分或全部毁损、灭失的，不能实现合同目的</text>
<text x="844" y="651" font-size="12" fill="#344054">  ③租赁物危及承租人的安全或健康的（即便订立合同时承租人知情）</text>
<rect x="436" y="1069.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1091.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲64 租赁合同（02）·优先购买权+转租</text>
<text x="448" y="1111.0" font-size="12" fill="#344054">来源 p075</text>
<rect x="832" y="674" width="300" height="306" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="696" font-size="14.5" font-weight="600" fill="#B83A4A">承租人的权利（2）·优先购买权+续租权</text>
<text x="844" y="716" font-size="12" fill="#344054">2.买卖不破租赁：①原则=租赁物在承租人依据租赁合同占有期间发生所有权变动的，不影响租赁合同的效力（成立在先原则）</text>
<text x="844" y="733" font-size="12" fill="#344054">  ②例外=&quot;买卖&quot;作为扩张解释，包括赠与、继承、互换、出资、先押后租（抵押需办理登记）、先封后租</text>
<text x="844" y="750" font-size="12" fill="#344054">3.优先购买权（2次）</text>
<text x="844" y="767" font-size="12" fill="#344054">  (1)对象：仅限于房屋</text>
<text x="844" y="784" font-size="12" fill="#344054">  (2)例外：①房屋共有人行使优先购买权=优先顺序：按份共有人&gt;次承租人&gt;承租人</text>
<text x="844" y="801" font-size="12" fill="#344054">    ②出租人将房屋卖给近亲属（8类）</text>
<text x="844" y="818" font-size="12" fill="#344054">    ③出租人履行通知义务后，承租人在15日内未明确表示购买的，视为放弃优先购买权</text>
<text x="844" y="835" font-size="12" fill="#344054">    ④第三人善意取得房屋并已经办理登记手续</text>
<text x="844" y="852" font-size="12" fill="#344054">  (3)放弃：①出租人委托拍卖人拍卖租赁房屋的，应当在拍卖5日前通知承租人；承租人未参加拍卖的，视为放弃优先购买权</text>
<text x="844" y="869" font-size="12" fill="#344054">  (4)救济：承租人可以请求出租人承担赔偿责任（侵权责任）；出租人与第三人订立的房屋买卖合同不因承租人异议而影响</text>
<text x="844" y="886" font-size="12" fill="#344054">4.房屋租赁中与承租人共同居住人和共同经营人的续租权</text>
<text x="844" y="903" font-size="12" fill="#344054">  (1)范围：在承租人生前与共同生活、居住于租赁房屋的人，且其共同生活、居住状态应持续至承租人死亡时（包括但不限于继承关系的亲属及未婚同居者）</text>
<text x="844" y="920" font-size="12" fill="#344054">  (2)行权：必须是本人，必须按照原租赁合同的同等条件继续履行</text>
<text x="844" y="937" font-size="12" fill="#344054">5.房屋承租人的优先承租权【民法典第734条第2款，1次】</text>
<text x="844" y="954" font-size="12" fill="#344054">  (1)含义：租赁期限届满，承租人享有以同等条件优先承租的权利</text>
<text x="844" y="971" font-size="12" fill="#344054">  (2)条件：①存在合法有效的租赁关系；②出租人继续出租房屋；③满足同等条件；④在合理期限内主张</text>
<rect x="832" y="994" width="300" height="153" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1016" font-size="14.5" font-weight="600" fill="#B83A4A">转租（4次）</text>
<text x="844" y="1036" font-size="12" fill="#344054">1.合法转租：①原租赁合同继续有效，第三人造成租赁物损失的，承租人应当赔偿损失</text>
<text x="844" y="1053" font-size="12" fill="#344054">  ②承租人不按期交租金，次承租人可以代为清偿租金和违约金，可以抵销次承租人应当向承租人支付的租金，超出其应付租金数额的，可以向承租人追偿【民法典第719条】</text>
<text x="844" y="1070" font-size="12" fill="#344054">  ③超期转租：转租期限超过承租人剩余租赁期限的，超过部分的约定对出租人不具有法律约束力，但是出租人与承租人另有约定的除外</text>
<text x="844" y="1087" font-size="12" fill="#344054">2.非法转租：①出租人有法定解除权，承租人需要承担违约责任</text>
<text x="844" y="1104" font-size="12" fill="#344054">  ①民法知道或应当知道转租事由之日起6个月内未提出异议，视为同意【民法典第718条】</text>
<text x="844" y="1121" font-size="12" fill="#344054">  ②原租赁合同解除，不影响次承租人与承租人之间的租赁合同效力（次承租人可请求承租人承担违约责任）</text>
<text x="844" y="1138" font-size="12" fill="#344054">  ③原租赁合同解除，次承租人继续占有租赁物（要求主张占有使用费用或承担侵权责任）</text>
<rect x="832" y="1161" width="300" height="102" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1183" font-size="14.5" font-weight="600" fill="#B83A4A">无效租赁合同（2次）</text>
<text x="844" y="1203" font-size="12" fill="#344054">1.情形：①租赁期限6个月以上，当事人未采用书面形式，无法确定租赁期限的</text>
<text x="844" y="1220" font-size="12" fill="#344054">  ②当事人对租赁期限没有约定或约定不明确的</text>
<text x="844" y="1237" font-size="12" fill="#344054">  ③租赁期限届满，承租人继续使用租赁物，出租人没有提出异议，原租赁合同继续有效，但租赁期限为不定期</text>
<text x="844" y="1254" font-size="12" fill="#344054">2.行权：当事人可以随时解除合同，但是应当在合理期限之前通知对方</text>
<rect x="832" y="1277" width="300" height="238" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1299" font-size="14.5" font-weight="600" fill="#B83A4A">装饰装修+扩建（1次）</text>
<text x="844" y="1319" font-size="12" fill="#344054">1.装饰装修（2次）</text>
<text x="844" y="1336" font-size="12" fill="#344054">  (1)效力：①租赁合同均合法有效；②承租人擅自&gt;登记备案者&gt;合同成立在先者</text>
<text x="844" y="1353" font-size="12" fill="#344054">  (2)救济：对于其他没有履行的有效租赁合同的承租人，可以解除合同，同时请求出租人承担违约责任，赔偿损失</text>
<text x="844" y="1370" font-size="12" fill="#344054">2.装饰装修+扩建</text>
<text x="844" y="1387" font-size="12" fill="#344054">  (1)装修（装饰装修）：①经出租人同意：①费用处理，有约定从约定；②无约定，承租人可以取回，恢复原状，无费用补偿，另有约定除外</text>
<text x="844" y="1404" font-size="12" fill="#344054">    ②未经出租人同意：出租人可以请求承租人恢复原状或赔偿损失</text>
<text x="844" y="1421" font-size="12" fill="#344054">  (2)扩建：①经出租人同意：①费用处理，有约定从约定；②没有约定的①办理合法建设手续的，扩建费用由出租人承担；②未办理合法建设手续的，费用由双方按过错分担</text>
<text x="844" y="1438" font-size="12" fill="#344054">    ②未经出租人同意：费用由承租人承担，承租人恢复原状或赔偿损失</text>
<text x="844" y="1455" font-size="12" fill="#344054">3.不定期租赁：①租赁期限6个月以上，当事人未采用书面形式，无法确定租赁期限的</text>
<text x="844" y="1472" font-size="12" fill="#344054">  ②当事人对租赁期限没有约定或约定不明确的</text>
<text x="844" y="1489" font-size="12" fill="#344054">  ③租赁期限届满，承租人继续使用租赁物，出租人没有提出异议，原租赁合同继续有效，但租赁期限为不定期</text>
<text x="844" y="1506" font-size="12" fill="#344054">4.行权：当事人可以随时解除合同，但是应当在合理期限之前通知对方</text>
<rect x="436" y="1755.5" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="1777.5" font-size="14.5" font-weight="600" fill="#6F3A91">讲65 融资租赁合同</text>
<text x="448" y="1797.5" font-size="12" fill="#344054">来源 p076-p077</text>
<rect x="832" y="1529" width="300" height="136" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1551" font-size="14.5" font-weight="600" fill="#6F3A91">基本原理【民法典第735-760条】</text>
<text x="844" y="1571" font-size="12" fill="#344054">1.含义：是指出租人根据承租人对出卖人、标的物的选择，向出卖人购买租赁物，提供给承租人使用，承租人支付租金的合同</text>
<text x="844" y="1588" font-size="12" fill="#344054">  双务、有名、有偿、诺成、要式合同（书面形式）</text>
<text x="844" y="1605" font-size="12" fill="#344054">2.效力：①出租人享有租赁物的所有权</text>
<text x="844" y="1622" font-size="12" fill="#344054">  ②承租人将其享有出卖出租人，再通过融资租赁合同将租赁物买回的，出租人和出卖人之间一人不影响合同的成立（售后回租型）</text>
<text x="844" y="1639" font-size="12" fill="#344054">  ③当事人在融资租赁合同中约定租赁期满租赁物归承租人所有等不影响融资租赁合同的效力【民法典第737条】</text>
<text x="844" y="1656" font-size="12" fill="#344054">  ④出租人未取得行政许可不影响融资租赁合同的效力【民法典第38条】</text>
<rect x="832" y="1679" width="300" height="170" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1701" font-size="14.5" font-weight="600" fill="#6F3A91">特征（3次）</text>
<text x="844" y="1721" font-size="12" fill="#344054">1.不同于买卖：①出卖人根据承租人的选择订立买卖合同，出卖人应当向承租人直接交付标的物，承租人享有买受人的权利</text>
<text x="844" y="1738" font-size="12" fill="#344054">  ②三方可以约定，出卖人不履行买卖合同义务的，由承租人行使索赔的权利</text>
<text x="844" y="1755" font-size="12" fill="#344054">  ③承租人应当履行占有租赁物期间的维修义务</text>
<text x="844" y="1772" font-size="12" fill="#344054">  ④出卖人交付的标的物不能利用，承租人可以请求出卖人予以修理，或者更换</text>
<text x="844" y="1789" font-size="12" fill="#344054">  ⑤出租人享有租赁物的所有权，但是未经登记，不得对抗善意第三人【民法典第745条】</text>
<text x="844" y="1806" font-size="12" fill="#344054">2.不同于租赁：①租赁物不符合约定或不符合使用目的的，出租人不承担责任，但是，承租人依赖出租人的技能确定租赁物或出租人干预选择租赁物的除外</text>
<text x="844" y="1823" font-size="12" fill="#344054">  ②承租人有租赁物期间，租赁物毁损、灭失的，出租人有权请求承租人继续支付租金，但是法律另有规定或当事人另有约定的除外</text>
<text x="844" y="1840" font-size="12" fill="#344054">  ③承租人应当按照约定支付租金；承租人经催告后在合理期限内仍不支付租金的，出租人可以请求支付全部租金，也可以解除合同，收回租赁物【民法典第752条】</text>
<rect x="832" y="1863" width="300" height="170" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="1885" font-size="14.5" font-weight="600" fill="#6F3A91">归属</text>
<text x="844" y="1905" font-size="12" fill="#344054">1.当事人约定租赁期限届满租赁物的归属：没有约定或者约定不明确，依据法律规定或者租赁物性质不能确定的，归出租人所有</text>
<text x="844" y="1922" font-size="12" fill="#344054">2.当事人约定租赁期限届满，承租人仅需向出租人支付象征性价款的租赁物的归属：①当事人就该形式上租赁物的归属：①当事人就该形式上租赁物的归属有约定的，按照其约定</text>
<text x="844" y="1939" font-size="12" fill="#344054">  ②没有约定或者约定不明确的，租赁物应当还归出租人，但因承租人原因致使合同无效，出租人不请求承租人赔偿租赁物的折旧损失的除外</text>
<text x="844" y="1956" font-size="12" fill="#344054">  ③合同无效，致使合同无效的租赁物的所有权归出租人，但因承租人原因致使合同无效，出租人不请求承租人赔偿租赁物的折旧损失的除外【民法典第760条】</text>
<text x="844" y="1973" font-size="12" fill="#344054">3.合同无效：①当事人就该形式上租赁物的归属有约定的，按照其约定</text>
<text x="844" y="1990" font-size="12" fill="#344054">  ②没有约定或者约定不明确的，租赁物应当还归出租人，但因承租人原因致使合同无效，出租人不请求承租人赔偿租赁物的折旧损失的除外</text>
<text x="844" y="2007" font-size="12" fill="#344054">  ③合同无效，租赁物的所有权归出租人，但因承租人原因致使合同无效，出租人不请求承租人赔偿租赁物的折旧损失的除外【民法典第760条】</text>
<text x="844" y="2024" font-size="12" fill="#344054">对比表：动产抵押权/动产质押权/超级动产抵押权/动产留置权/融资租赁合同（动产所有/租赁物权属保留买卖合同）</text>
<rect x="436" y="2183.0" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="2205.0" font-size="14.5" font-weight="600" fill="#0F7E80">讲66 保理合同</text>
<text x="448" y="2225.0" font-size="12" fill="#344054">来源 p078</text>
<rect x="832" y="2047" width="300" height="323" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2069" font-size="14.5" font-weight="600" fill="#0F7E80">基本原理【民法典第761-769条】</text>
<text x="844" y="2089" font-size="12" fill="#344054">1.含义：应收账款债权人将现有的或者有的应收账款转让给保理人，保理人提供资金融通、应收账款管理或催收、应收账款债务人付款担保等服务的合同（书面形式）</text>
<text x="844" y="2106" font-size="12" fill="#344054">2.虚构应收账款的：①保理人一般会对应收账款债务人进行尽职调查</text>
<text x="844" y="2123" font-size="12" fill="#344054">  ②应收账款债权人与债务人虚构应收账款的，与保理人订立转让标的的是不真实的，</text>
<text x="844" y="2140" font-size="12" fill="#344054">  应应收账款不存在为由对保理人不履行付款义务的，但是保理人明知虚构的除外</text>
<text x="844" y="2157" font-size="12" fill="#344054">3.通知规则：保理人应当向应收账款债务人发出应收账款转让通知的，应当以明示的方式作出承认</text>
<text x="844" y="2174" font-size="12" fill="#344054">4.基础交易变更或终止对保理人的效力：①基础交易变更或终止对保理人不发生影响</text>
<text x="844" y="2191" font-size="12" fill="#344054">  ②但是经协商同意影响保理人的，从其约定</text>
<text x="844" y="2208" font-size="12" fill="#344054">5.种类：①有追索权：①回购型保理=在应收账款到期无法从债务人处收回时，保理人可以应收账款转让方反向转让应收账款，或转让应收账款或回购</text>
<text x="844" y="2225" font-size="12" fill="#344054">  ②有追索权=保理人向应收账款债权人主张返还融资款，或者向应收账款债务人主张应收账款，或同时主张二者的权利</text>
<text x="844" y="2242" font-size="12" fill="#344054">  ③无追索权=应收账款债权人在应收账款到期无法收回风险的情况下，由保理人独自承担风险承担</text>
<text x="844" y="2259" font-size="12" fill="#344054">  2.无追索权（明涵+规则）=①买断型保理=指应收账款在无商业纠纷的情况下无法得到清偿的，由保理人独自承担风险</text>
<text x="844" y="2276" font-size="12" fill="#344054">  ②无追索权的本质是真正的债权转让</text>
<text x="844" y="2293" font-size="12" fill="#344054">  ③规则：①当事人约定无追索权，保理人应当向应收账款债权人主张返还融资款或主张其他权利，</text>
<text x="844" y="2310" font-size="12" fill="#344054">    保理人向应收账款债务人主张应收账款债务人返还剩余的部分，无需向应收账款债权人返还</text>
<text x="844" y="2327" font-size="12" fill="#344054">6.应收账款多重让与：①已登记的先于未登记的受偿；均已登记，按照登记的先后顺序受偿</text>
<text x="844" y="2344" font-size="12" fill="#344054">  ②均未登记的，由最先到达应收账款债务人的转让通知中载明的保理人受偿</text>
<text x="844" y="2361" font-size="12" fill="#344054">  ③既未登记也未通知的，按照应收账款比例清偿</text>

<text x="52" y="1817.5" font-size="14.5" font-weight="600" fill="#185FA5">8-22 · 民法 讲67~70</text>
<text x="52" y="1837.5" font-size="12" fill="#344054">承揽+建工+运输+技术+保管+仓储+委托+物业+行纪+中介+合伙+旅游</text>

<text x="448" y="270.0" font-size="14.5" font-weight="600" fill="#854F0B">讲67 承揽合同+建设工程合同（2讲合一）</text>
<text x="448" y="290.0" font-size="12" fill="#344054">来源 p078后-p080</text>
<rect x="832" y="20" width="300" height="153" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="42" font-size="14.5" font-weight="600" fill="#854F0B">承揽合同（基本原理+任意解除+留置权）</text>
<text x="844" y="62" font-size="12" fill="#344054">【民法典第770-778条】</text>
<text x="844" y="79" font-size="12" fill="#344054">1.基本原理（3次）：①种类：①材料：①承揽人提供材料；②定作人提供材料，应当及时检验，发现不符合约定的，及时通知定作人更换、补齐或者采取其他补救措施</text>
<text x="844" y="96" font-size="12" fill="#344054">  ②共同承揽=共同承揽人对定作人承担连带责任，但是当事人另有约定的除外</text>
<text x="844" y="113" font-size="12" fill="#344054">  ③不得更换承揽人=共同承揽人对定作人承担连带责任，但是当事人另有约定的除外</text>
<text x="844" y="130" font-size="12" fill="#344054">2.定作人的任意解除权：①定作人在承揽人完成工作前可以随时解除合同，造成承揽人损失的，应当赔偿损失</text>
<text x="844" y="147" font-size="12" fill="#344054">  ②定作人中途变更承揽工作的要求，造成承揽人损失的，应当赔偿损失</text>
<text x="844" y="164" font-size="12" fill="#344054">3.承揽人的留置权：承揽人未向定作人支付报酬或者材料费等价款的，承揽人对完成的工作成果享有留置权，但是当事人另有约定的除外【民法典第783、784条】</text>
<rect x="832" y="187" width="300" height="340" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.4"/>
<text x="844" y="209" font-size="14.5" font-weight="600" fill="#854F0B">建设工程合同（4次）</text>
<text x="844" y="229" font-size="12" fill="#344054">【民法典第788-808条】</text>
<text x="844" y="246" font-size="12" fill="#344054">1.基本原理（2次）：①情形：①禁止发包人支解发包；②禁止承包人全部转包和支解后全部分包</text>
<text x="844" y="263" font-size="12" fill="#344054">  ②法律后果：资质管理和招投标的规定都认定为强制性规定，一旦违反，合同无效</text>
<text x="844" y="280" font-size="12" fill="#344054">2.合同无效的情形和处理（2次）：</text>
<text x="844" y="297" font-size="12" fill="#344054">  (1)情形：①承包人未取得建筑业企业资质或超越资质等级的，合同无效</text>
<text x="844" y="314" font-size="12" fill="#344054">  ②没有资质的实际施工人借用有资质的建筑施工企业名义的（俗称&quot;挂靠&quot;）</text>
<text x="844" y="331" font-size="12" fill="#344054">  ③建设工程必须进行招标而未招标或中标无效的</text>
<text x="844" y="348" font-size="12" fill="#344054">  ④另行签订的建设工程施工合同（黑白合同）背离中标合同实质性内容的</text>
<text x="844" y="365" font-size="12" fill="#344054">  ⑤发包人在起诉前未取得建设工程规划许可证等规划审批手续等建设的，</text>
<text x="844" y="382" font-size="12" fill="#344054">    但起诉前取得的除外（仅起诉前善意取得建设工程规划许可证等规划审批手续的除外）</text>
<text x="844" y="399" font-size="12" fill="#344054">  ⑥发包人能够办理建筑手续而未办理，并且未办理建筑审批手续，</text>
<text x="844" y="416" font-size="12" fill="#344054">    而以未办理建筑审批手续主张合同无效，法院不予支持</text>
<text x="844" y="433" font-size="12" fill="#344054">  (2)处理：①合同无效的处理：可以参照合同约定的价款折价补偿承包人</text>
<text x="844" y="450" font-size="12" fill="#344054">    ①竣工验收合格：①承包人可以请求承包人承担修复费用</text>
<text x="844" y="467" font-size="12" fill="#344054">      ②修复后的建设工程经验收合格的，承包人可以请求承包人承担修复费用</text>
<text x="844" y="484" font-size="12" fill="#344054">      ③修复后的建设工程经验收不合格的，承包人有权请求赔偿损失</text>
<text x="844" y="501" font-size="12" fill="#344054">      ④未经竣工验收，承包人擅自使用的，由承包人承担质量责任</text>
<text x="844" y="518" font-size="12" fill="#344054">3.发包人行权：因建设工程质量发生争议的，发包人可以将总承包人、分包人和实际施工人为共同被告起诉</text>
<rect x="436" y="1232.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="448" y="1254.0" font-size="14.5" font-weight="600" fill="#B83A4A">讲68 建设工程+运输+技术+保管+仓储合同（4讲合一）</text>
<text x="448" y="1274.0" font-size="12" fill="#344054">来源 p079后-p083</text>
<rect x="832" y="541" width="300" height="238" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="563" font-size="14.5" font-weight="600" fill="#B83A4A">建设工程价款优先受偿权（4次）</text>
<text x="844" y="583" font-size="12" fill="#344054">【民法典第807条、建设工程合同解释（一）第35-44条】</text>
<text x="844" y="600" font-size="12" fill="#344054">1.性质：①法定优先权，属于物权优先效力的例外，优于抵押权和其他债权</text>
<text x="844" y="617" font-size="12" fill="#344054">  ②效力顺序：已交付全部或大部分购房款的买受人&gt;承包人</text>
<text x="844" y="634" font-size="12" fill="#344054">2.主体：①与发包人直接订立建设工程施工合同的承包人</text>
<text x="844" y="651" font-size="12" fill="#344054">  ②与发包人直接订立装饰装修工程施工合同的承包人（前提是具备相应资质或达到条件）</text>
<text x="844" y="668" font-size="12" fill="#344054">3.前提：工程质量合格（即便建设工程合同无效，工程未完工，亦不影响优先权）</text>
<text x="844" y="685" font-size="12" fill="#344054">4.范围：①优先受偿的范围依照国务院有关部门关于建设工程价款的规定</text>
<text x="844" y="702" font-size="12" fill="#344054">  ②不包括逾期支付建设工程价款的利息、违约金、损害赔偿金等</text>
<text x="844" y="719" font-size="12" fill="#344054">5.行权方式：①与发包人协议将该工程折价；②申请法院将该工程依法拍卖</text>
<text x="844" y="736" font-size="12" fill="#344054">6.行权期间：①自发包人应当给付建设工程价款之日起18个月内</text>
<text x="844" y="753" font-size="12" fill="#344054">  ②发包人未按约定付款或限制建设工程价款优先受偿权，损害建筑工人利益，</text>
<text x="844" y="770" font-size="12" fill="#344054">    发包人根据约定主张承包人不享有建设工程价款优先受偿权的，法院不予支持</text>
<rect x="832" y="793" width="300" height="272" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="815" font-size="14.5" font-weight="600" fill="#B83A4A">运输合同</text>
<text x="844" y="835" font-size="12" fill="#344054">【民法典第809-842条】</text>
<text x="844" y="852" font-size="12" fill="#344054">1.基本原理（1）：①承运人将旅客或货物从起运地点运输到约定地点的</text>
<text x="844" y="869" font-size="12" fill="#344054">  旅客、托运人或收货人支付票款或运输费用的合同</text>
<text x="844" y="886" font-size="12" fill="#344054">  ②从事公共运输的承运人不得拒绝旅客、托运人通常、合理的要求（即&quot;强制缔约&quot;）</text>
<text x="844" y="903" font-size="12" fill="#344054">  ③客运合同自承运人向旅客出具客票时成立，但是当事人另有约定或交易习惯的除外【民法典第814条】</text>
<text x="844" y="920" font-size="12" fill="#344054">2.客运合同（3次）：</text>
<text x="844" y="937" font-size="12" fill="#344054">  (1)承运人的救助义务：承运人在运输过程中，应当尽力救助患有急病、分娩、遇险的旅客</text>
<text x="844" y="954" font-size="12" fill="#344054">  (2)承运人的责任和免责事由：①人身关系：①原则=无过错责任原则</text>
<text x="844" y="971" font-size="12" fill="#344054">      ②免责：①A. 旅客自身健康原因造成</text>
<text x="844" y="988" font-size="12" fill="#344054">        B. 承运人证明是旅客故意或重大过失造成的</text>
<text x="844" y="1005" font-size="12" fill="#344054">    ②财产关系：①旅客随身携带物品：过错责任原则</text>
<text x="844" y="1022" font-size="12" fill="#344054">      ②托运物品：无过错责任原则</text>
<text x="844" y="1039" font-size="12" fill="#344054">  (3)任意解除权：在承运人将货物交付收货人之前，托运人可以要求承运人中止运输、返还货物、变更到达地点或收货人，</text>
<text x="844" y="1056" font-size="12" fill="#344054">    但是应当赔偿承运人因此受到的损失</text>
<rect x="832" y="1079" width="300" height="374" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1101" font-size="14.5" font-weight="600" fill="#B83A4A">技术合同（技术开发+转让+许可+咨询+服务）</text>
<text x="844" y="1121" font-size="12" fill="#344054">【民法典第844-902条】</text>
<text x="844" y="1138" font-size="12" fill="#344054">1.技术开发合同（3次）：①委托开发：①研究开发人享有申请专利的权利，</text>
<text x="844" y="1155" font-size="12" fill="#344054">    ②委托开发的研究开发人未经委托人同意，不得将发明创造转让给第三人，</text>
<text x="844" y="1172" font-size="12" fill="#344054">    但有约定的除外；委托人有权优先受让，约定不明除外</text>
<text x="844" y="1189" font-size="12" fill="#344054">    ②合作开发：①共同申请专利；②共有专利申请权</text>
<text x="844" y="1206" font-size="12" fill="#344054">2.技术转让合同+技术许可合同（2次）：①含义：合法拥有技术的权利人，将现有的特定专利、专利申请、技术秘密的相关权利许可他人订立或实施的合同</text>
<text x="844" y="1223" font-size="12" fill="#344054">  ②种类：包括专利权转让、专利申请权转让、技术秘密转让等合同</text>
<text x="844" y="1240" font-size="12" fill="#344054">  ③限制：技术许可合同可以约定实施专利或使用技术秘密的范围，但是不得限制技术竞争和技术发展</text>
<text x="844" y="1257" font-size="12" fill="#344054">  ④义务：①让与人应当保证自己是所提供技术的合法拥有者，并保证所提供的技术完整、无误、有效，能够达到约定的目标</text>
<text x="844" y="1274" font-size="12" fill="#344054">    ②受让人应当按照约定的范围和期限，对让与人提供的技术中尚未公开的秘密部分，承担保密义务</text>
<text x="844" y="1291" font-size="12" fill="#344054">  ⑤技术秘密转让合同：①让与人应当按照约定提供技术资料，进行技术指导，保证技术的实用性、可靠性，承担保密义务</text>
<text x="844" y="1308" font-size="12" fill="#344054">    ②受让人应当按照约定使用技术，支付使用费，承担保密义务</text>
<text x="844" y="1325" font-size="12" fill="#344054">3.技术咨询合同+技术服务合同（1次）：①技术咨询合同：当事人一方以技术知识为对方就特定技术项目提供可行性论证、技术预测、专题技术调查、分析评价报告所订立的合同</text>
<text x="844" y="1342" font-size="12" fill="#344054">  ②技术合同包括技术开发合同、技术转让合同、技术服务合同和技术咨询合同，但不包含建设工程合同和承揽合同</text>
<text x="844" y="1359" font-size="12" fill="#344054">  ③技术咨询合同的委托人和技术服务合同的委托人按照约定实施技术指导及技术决策所产生的风险责任，由委托人承担（不含不公正委托）</text>
<text x="844" y="1376" font-size="12" fill="#344054">  ④技术开发合同的种类：①委托开发合同（代理）=除法律另有规定或当事人另有约定外，申请专利的权利属于研究开发人</text>
<text x="844" y="1393" font-size="12" fill="#344054">    ②合作开发合同（共有）=①当事人一方转让其共有专利申请权的，其他各方享有以同等条件优先受让的权利</text>
<text x="844" y="1410" font-size="12" fill="#344054">      ②合作开发的发明创造，除当事人另有约定外，申请专利的权利属于合作开发的当事人共有</text>
<text x="844" y="1427" font-size="12" fill="#344054">      ③合作开发的当事人一方声明放弃其共有的专利申请权的，可以单独申请或者由其他方共同申请</text>
<text x="844" y="1444" font-size="12" fill="#344054">      ④其他各方就单独申请或共同申请取得专利权的，放弃的一方享有免费实施该专利的权利</text>
<rect x="832" y="1695.0" width="300" height="51" rx="10" fill="#FCE5E8" stroke="#B83A4A" stroke-width="1.4"/>
<text x="844" y="1717.0" font-size="14.5" font-weight="600" fill="#B83A4A">保管合同+仓储合同（4讲合一的另2讲）</text>
<text x="844" y="1737.0" font-size="12" fill="#344054">来源 p083</text>
<rect x="1228" y="1467" width="300" height="306" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="1240" y="1489" font-size="14.5" font-weight="600" fill="#5B6B7C">保管合同</text>
<text x="1240" y="1509" font-size="12" fill="#344054">【民法典第888-903条】</text>
<text x="1240" y="1526" font-size="12" fill="#344054">1.基本原理：①寄存人到保管人处从事购物、就餐、住宿等活动中，将物品存放在指定场所的，视为保管，但是当事人另有约定或交易习惯的除外【民法典第888条】</text>
<text x="1240" y="1543" font-size="12" fill="#344054">  ②保管合同属于可有偿可有偿合同。实践性合同，自保管物交付时成立，但是当事人另有约定的除外【民法典第890条】</text>
<text x="1240" y="1560" font-size="12" fill="#344054">2.寄存人的权利和义务（1次）：①任意解除权：①寄存人可以随时领取保管物</text>
<text x="1240" y="1577" font-size="12" fill="#344054">  ②当事人对保管期间没有约定或约定不明确的，保管人可以随时请求寄存人领取保管物</text>
<text x="1240" y="1594" font-size="12" fill="#344054">  ③支付费用：①寄存人应当按照约定向保管人支付保管费</text>
<text x="1240" y="1611" font-size="12" fill="#344054">    ②当事人对保管费没有约定或约定不明的，视为无偿保管</text>
<text x="1240" y="1628" font-size="12" fill="#344054">    ③有约保管合同，寄存人应当按照约定的期限向保管人支付保管费</text>
<text x="1240" y="1645" font-size="12" fill="#344054">    当事人对支付期限没有约定或约定不明确的，应当在领取保管物的同时支付</text>
<text x="1240" y="1662" font-size="12" fill="#344054">3.保管人的权利和义务（3次）：①留置权：寄存人未按照约定支付保管费或其他费用的，保管人对保管物享有留置权，但是当事人另有约定的除外</text>
<text x="1240" y="1679" font-size="12" fill="#344054">  ②妥善保管义务：①保管期间，因保管人未履行妥善保管义务，造成寄存人损失，包括人身损害和财产损害的，保管人应当承担赔偿责任，但是保管人证明自己已经尽到妥善保管义务的除外</text>
<text x="1240" y="1696" font-size="12" fill="#344054">    ②亲自保管义务：保管人不得将保管物转交第三人保管，但是当事人另有约定的除外</text>
<text x="1240" y="1713" font-size="12" fill="#344054">    ③受领保管物的权利：①当事人约定保管场所或方法，除紧急情况或为维护寄存人利益的以外，不得擅自改变保管场所或方法</text>
<text x="1240" y="1730" font-size="12" fill="#344054">  ③紧急处置权：①保管人发现入库仓储物有变质或其他损坏的，应当及时通知寄存人或仓单持有人</text>
<text x="1240" y="1747" font-size="12" fill="#344054">    ②情况紧急的，保管人作出必要的处置，但事后应当将该情况及时通知寄存人或仓单持有人【民法典第896条】</text>
<text x="1240" y="1764" font-size="12" fill="#344054">4.孳息归属：保管期间届满或寄存人提前领取保管物的，保管人应当将原物及其孳息归还寄存人</text>
<rect x="1228" y="1787" width="300" height="187" rx="10" fill="#EDF1F4" stroke="#5B6B7C" stroke-width="1.4"/>
<text x="1240" y="1809" font-size="14.5" font-weight="600" fill="#5B6B7C">仓储合同【民法典第904-918条】</text>
<text x="1240" y="1829" font-size="12" fill="#344054">对比表：保管合同 vs 仓储合同（合同性质/是否有偿/是否要物/归责原则/任意解除权）</text>
<text x="1240" y="1846" font-size="12" fill="#344054">  保管合同：民事合同/可有偿可无偿；若有偿重过失或重大过失承担赔偿责任/过失时承担赔偿责任；实践性合同/过错原则；寄存人：无保管期间的双方</text>
<text x="1240" y="1863" font-size="12" fill="#344054">  仓储合同：商事合同/有偿/诺成性合同/过错责任/无保管期间的双方</text>
<text x="1240" y="1880" font-size="12" fill="#344054">保管人义务（5次）：①存货的验收义务：保管人验收后，发生仓储物品种、数量、质量不符合约定的，保管人应当承担损害赔偿责任</text>
<text x="1240" y="1897" font-size="12" fill="#344054">  ②给付仓单的义务：仓单是提取仓储物的凭证。存货人或仓单持有人在仓单上背书并经保管人签字或盖章的，可以转让提取仓储物的权利</text>
<text x="1240" y="1914" font-size="12" fill="#344054">  ③接受检查的义务：存货人或仓单持有人有权要求保管人检查仓储物或提取样品</text>
<text x="1240" y="1931" font-size="12" fill="#344054">  ④通知义务：保管人发现入库仓储物有变质或其他损坏的，应当及时通知存货人或仓单持有人</text>
<text x="1240" y="1948" font-size="12" fill="#344054">  ⑤紧急处置权：①保管人发现入库仓储物有变质或其他损坏的危险，及其他仓储物的安全和正常保管的，应当催告存货人或仓单持有人作出必要的处置</text>
<text x="1240" y="1965" font-size="12" fill="#344054">    ②情况紧急的，保管人可以作出必要的处置，但事后应当将该情况及时通知存货人或仓单持有人【民法典第896条】</text>
<rect x="436" y="2369.0" width="300" height="51" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="448" y="2391.0" font-size="14.5" font-weight="600" fill="#6F3A91">讲69 委托合同+物业服务合同</text>
<text x="448" y="2411.0" font-size="12" fill="#344054">来源 p084-p085</text>
<rect x="832" y="1988" width="300" height="357" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2010" font-size="14.5" font-weight="600" fill="#6F3A91">委托合同【民法典第919-936条】</text>
<text x="844" y="2030" font-size="12" fill="#344054">1.基本原理：①含义=可有偿可无偿的合同；②委托人可特别委托受托人处理一项或数项事务，</text>
<text x="844" y="2047" font-size="12" fill="#344054">  也可以概括委托处理一切事务；③费用=受托人为处理委托事务垫付的必要费用，委托人应当偿还费用并支付利息；</text>
<text x="844" y="2064" font-size="12" fill="#344054">  ④共同委托=两个以上受托人共同处理委托事务的，对委托人承担连带责任；</text>
<text x="844" y="2081" font-size="12" fill="#344054">  ⑤合同终止：①委托人/受托人死亡、丧失民事行为能力或终止的，委托合同终止；</text>
<text x="844" y="2098" font-size="12" fill="#344054">    ②当事人另有约定或委托事务的性质不宜终止的除外</text>
<text x="844" y="2115" font-size="12" fill="#344054">2.委托人的权利（2次）：①任意解除权【民法典第933条】：①双方任意解除；</text>
<text x="844" y="2132" font-size="12" fill="#344054">  ②无需委托基于强的人身信赖关系而成立；</text>
<text x="844" y="2149" font-size="12" fill="#344054">  ③无偿委托合同的解除方应当赔偿因解除时间不当造成的直接损失；</text>
<text x="844" y="2166" font-size="12" fill="#344054">  ④有偿委托合同的解除方应当赔偿对方的直接损失和可得利益</text>
<text x="844" y="2183" font-size="12" fill="#344054">  ②损失赔偿请求权：①有偿合同：受托人过错或重大过失+超越权限；</text>
<text x="844" y="2200" font-size="12" fill="#344054">    ②无偿合同：受托人故意或重大过失+超越权限</text>
<text x="844" y="2217" font-size="12" fill="#344054">  ③支付报酬的义务：因不可归责于受托人的事由，委托合同解除或委托事务不能完成的，委托人应当向受托人支付相应的报酬，当事人另有约定的除外</text>
<text x="844" y="2234" font-size="12" fill="#344054">3.间接代理（2次）：①含义=受托人以自己的名义，在委托人的授权范围内与第三人订立的合同</text>
<text x="844" y="2251" font-size="12" fill="#344054">  ②显名：①第三人在订立合同时知道受托人与委托人之间的代理关系；</text>
<text x="844" y="2268" font-size="12" fill="#344054">    ②该合同直接约束委托人和第三人；但是，有证据证明该合同只约束受托人和第三人的除外</text>
<text x="844" y="2285" font-size="12" fill="#344054">  ③隐名：①第三人在订立合同时不知道受托人与委托人之间的代理关系；</text>
<text x="844" y="2302" font-size="12" fill="#344054">    ②该合同直接约束受托人和第三人；</text>
<text x="844" y="2319" font-size="12" fill="#344054">    ③受托人因第三人的原因对委托人不履行义务的，受托人应当向委托人披露第三人；</text>
<text x="844" y="2336" font-size="12" fill="#344054">    委托人因此可以行使受托人对第三人的权利，但是，第三人与受托人订立合同时如果知道该委托人就不会订立合同的除外</text>
<rect x="832" y="2359" width="300" height="442" rx="10" fill="#F2E8F7" stroke="#6F3A91" stroke-width="1.4"/>
<text x="844" y="2381" font-size="14.5" font-weight="600" fill="#6F3A91">物业服务合同【民法典第937-950条】</text>
<text x="844" y="2401" font-size="12" fill="#344054">1.基本原理：①内容=物业服务人公开作出的有利于业主的服务承诺，为物业服务合同的组成部分；</text>
<text x="844" y="2418" font-size="12" fill="#344054">  ②订立：①建设单位依法与物业服务人订立的前期物业服务合同；</text>
<text x="844" y="2435" font-size="12" fill="#344054">    ②业主委员会与业主大会依法选聘的物业服务人订立的物业服务合同；</text>
<text x="844" y="2452" font-size="12" fill="#344054">  ③终止：前期物业服务合同的约定期限届满前，业主委员会或业主与新物业服务人订立的物业服务合同生效的，前期物业服务合同终止</text>
<text x="844" y="2469" font-size="12" fill="#344054">2.物业服务人的义务：①亲自履行：物业服务人不得将应当提供的全部物业服务或全部物业服务一并转让给第三人；</text>
<text x="844" y="2486" font-size="12" fill="#344054">  ②妥善合理履行：①维修资金使用情况；②服务事项/负责人员/质量要求/收费标准/履行情况</text>
<text x="844" y="2503" font-size="12" fill="#344054">    以合理方式向业主公开，并向业主大会、业主委员会报告；</text>
<text x="844" y="2520" font-size="12" fill="#344054">    ③公开报告义务：①维修资金使用情况；②业主共有部分的经营与收益情况</text>
<text x="844" y="2537" font-size="12" fill="#344054">  ③后合同义务：①物业服务合同终止后，原物业服务人应当在约定期限或者合理期限内退出物业管理区域，</text>
<text x="844" y="2554" font-size="12" fill="#344054">    并向业主委员会、决定自行管理的业主或者其指定的人移交物业管理所必需的相关资料及物业管理用房，</text>
<text x="844" y="2571" font-size="12" fill="#344054">    原物业服务人违反上述规定的，不得请求业主支付物业管理服务合同终止后的物业费，</text>
<text x="844" y="2588" font-size="12" fill="#344054">    造成业主损失的，应当赔偿损失【民法典第949条第2款】</text>
<text x="844" y="2605" font-size="12" fill="#344054">    ②业主大会或业主大会选聘的新物业服务人决定自行管理的，原物业服务人应当办理交接手续</text>
<text x="844" y="2622" font-size="12" fill="#344054">3.业主的义务：①①给付物业费的义务：①业主不得以未接受或无需接受相关物业服务为由拒绝支付物业费</text>
<text x="844" y="2639" font-size="12" fill="#344054">    ②物业服务人已经按照约定和相关规定提供服务的，业主不得以未接受或无需接受相关物业服务为由拒绝支付物业费</text>
<text x="844" y="2656" font-size="12" fill="#344054">    ③物业服务人不得采取停止供电、供水、供热、供燃气等方式催交物业费</text>
<text x="844" y="2673" font-size="12" fill="#344054">    ④告知义务：①装修装饰房屋；②转让、出租本物业专有部分、设立居住权或依法改变共有部分用途</text>
<text x="844" y="2690" font-size="12" fill="#344054">4.合同的解除（2次）：①业主依照法定程序共同决定解聘物业服务人的，可以解除物业服务合同（一般表决事项）</text>
<text x="844" y="2707" font-size="12" fill="#344054">  ②决定解聘的，应当提前60日书面通知物业服务人，但是合同对通知期限另有约定的除外；</text>
<text x="844" y="2724" font-size="12" fill="#344054">    ③解除合同造成物业服务人损失的，除不可归责于业主的事由外，业主应当赔偿损失</text>
<text x="844" y="2741" font-size="12" fill="#344054">5.合同的续订（2次）：①物业服务期限届满前，业主依法共同决定续聘的，应当与原物业服务人在合同期限届满前续订物业服务合同；</text>
<text x="844" y="2758" font-size="12" fill="#344054">  ②物业服务期限届满前，物业服务人不愿续聘的，应当提前90日书面通知业主或业主委员会，但是合同对通知期限另有约定的除外</text>
<text x="844" y="2775" font-size="12" fill="#344054">6.不定期合同：①物业服务期限届满后，业主没有依法作出续聘或另聘物业服务人的决定，物业服务人继续提供物业服务的，原物业服务合同继续有效，但是物业服务合同继续有效，但是物业服务期限为不定期</text>
<text x="844" y="2792" font-size="12" fill="#344054">  ②双方当事人可以随时解除不定期物业服务合同，但是应当提前60日书面通知对方</text>
<rect x="436" y="3201.5" width="300" height="51" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="448" y="3223.5" font-size="14.5" font-weight="600" fill="#0F7E80">讲70 行纪+中介+合伙+旅游合同</text>
<text x="448" y="3243.5" font-size="12" fill="#344054">来源 p085后-p086+</text>
<rect x="832" y="2815" width="300" height="238" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="2837" font-size="14.5" font-weight="600" fill="#0F7E80">行纪合同（4次）【民法典第951-960条】</text>
<text x="844" y="2857" font-size="12" fill="#344054">1.基本原理（3次）：①含义=行纪人以自己的名义为委托人从事贸易活动，委托人支付报酬的合同【民法典第951条】</text>
<text x="844" y="2874" font-size="12" fill="#344054">  ②特征：①行纪人以自己的名义为委托人办理业务（间接代理不需要）</text>
<text x="844" y="2891" font-size="12" fill="#344054">    ②行纪人处理委托事务的费用，由行纪人负担，当事人另有约定除外</text>
<text x="844" y="2908" font-size="12" fill="#344054">    ③除当事人另有约定外，行纪人与第三人订立合同的，第三人不履行义务致使委托人受到损害的，行纪人应当承担赔偿责任</text>
<text x="844" y="2925" font-size="12" fill="#344054">  ③行纪人的留置权：委托人逾期不支付报酬的，行纪人对委托物享有留置权，但是当事人另有约定的除外</text>
<text x="844" y="2942" font-size="12" fill="#344054">2.行纪事务的处理（4次）：①低卖或高卖：应当经委托人同意；未经委托人同意的，行纪人补其差额</text>
<text x="844" y="2959" font-size="12" fill="#344054">  ②高卖或低卖：可以按照约定增加报酬；没有约定或约定不明的，该利益归属于委托人</text>
<text x="844" y="2976" font-size="12" fill="#344054">  ③委托物的处理：行纪人按照约定买入委托物，委托人应当及时受领；委托人无正当理由拒绝受领的，行纪人依法可以提存委托物</text>
<text x="844" y="2993" font-size="12" fill="#344054">  ④委托人对价格有特别指示的，行纪人不得违背该指示卖出或买入</text>
<text x="844" y="3010" font-size="12" fill="#344054">对比表：委托合同 vs 行纪合同（项目/相同点1/相同点2/相同点3/合同性质/是否属于合同当事人/费用承担/自卖卖委/有偿否/VS注意义务/任意解除权）</text>
<text x="844" y="3027" font-size="12" fill="#344054">  委托合同：以处理委托事务为基础/以处理一切事务为目的/民事合同/委托人间接受托人/委托人有偿但有约或事务/有约从约/有约从约/双重通知或下，受托人故意或重大过失，超越权限/有约则担违约责任和合同解除后可获得利益/双方</text>
<text x="844" y="3044" font-size="12" fill="#344054">  行纪合同：提供劳务为基础/以处理一定事务为目的/商事合同/行纪人间接受托人/行纪人有偿/有约的/有约从约/无约则双倍赔偿/只要求主要享受报酬将损失/当事人可以补差利益自交行纪人或委托人/有义务违约责任则取得留置权/双方</text>
<rect x="832" y="3067" width="300" height="238" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="3089" font-size="14.5" font-weight="600" fill="#0F7E80">中介合同（1次）【民法典第961-966条】</text>
<text x="844" y="3109" font-size="12" fill="#344054">1.基本原理（1次）：①含义：中介人向委托人报告订立合同的机会或提供订立合同的媒介服务（主要目的是信息服务，委托人支付报酬的合同【民法典第961条】</text>
<text x="844" y="3126" font-size="12" fill="#344054">  ②特征：①以促成委托人和第三人订立合同为目的，合同标的是中介人进行中介活动的成果（看结果不看行为）</text>
<text x="844" y="3143" font-size="12" fill="#344054">    ②中介人在合同中介人的居间地位。不能以自己的名义作为当事人或代理人的意思表示，不参与委托人和第三人之间的合同</text>
<text x="844" y="3160" font-size="12" fill="#344054">    ③自然人可以进行中介服务</text>
<text x="844" y="3177" font-size="12" fill="#344054">  ③种类：①报告中介=接受委托后将收集的信息报告给委托人</text>
<text x="844" y="3194" font-size="12" fill="#344054">    ②媒介中介=不仅报告订约机会，还要居中斡旋，代为传达委托人与第三人之间的意思，努力促成合同成立（例如二手房中介）</text>
<text x="844" y="3211" font-size="12" fill="#344054">  ④中介人的报告义务：①中介人故意隐瞒与订立合同有关的重要事实或者提供虚假情况，损害委托人利益的，不得请求支付报酬，并应当承担赔偿责任【民法典第962条】</text>
<text x="844" y="3228" font-size="12" fill="#344054">2.中介事务的处理（2次）：①促成合同成立：①委托人应当按照约定支付报酬；对中介人的报酬没有约定或约定不明的，根据中介人的劳务合理确定；</text>
<text x="844" y="3245" font-size="12" fill="#344054">    ②中介活动的费用，由中介人负担</text>
<text x="844" y="3262" font-size="12" fill="#344054">    ③因中介人提供订立合同的媒介服务而促成合同成立的，由该合同的当事人平均负担中介人的报酬</text>
<text x="844" y="3279" font-size="12" fill="#344054">  ②未促成合同成立：不得请求支付报酬；但是，可以按照约定请求委托人支付从事中介活动支出的必要费用【民法典第964条】</text>
<text x="844" y="3296" font-size="12" fill="#344054">3.跳单（1次）：①含义：①委托人在接受中介人的服务后，利用中介人提供的服务，而避开中介人私自与相对人订立合同，或另行委托其他中介人与相对人订立合同的现象【民法典第965条】</text>
<rect x="832" y="3319" width="300" height="238" rx="10" fill="#E0F3F4" stroke="#0F7E80" stroke-width="1.4"/>
<text x="844" y="3341" font-size="14.5" font-weight="600" fill="#0F7E80">合伙合同+旅游合同（p087）</text>
<text x="844" y="3361" font-size="12" fill="#344054">1.合伙合同：①含义=两个以上合伙人为了共同的事业目的，订立的共享利益、共担风险的协议【民法典第967条】</text>
<text x="844" y="3378" font-size="12" fill="#344054">  ②特征=①以共同事业为目的（合伙企业是一种典型民事合伙）②共享利益、共担风险③合伙人共同出资、共同经营</text>
<text x="844" y="3395" font-size="12" fill="#344054">  ③合伙人权利：①经营管理权②分配利润权③退伙权（合伙协议约定合伙期限的，合伙人可以随时解除合伙合同，但应在合理期限之前通知其他合伙人【民法典第976条】）</text>
<text x="844" y="3412" font-size="12" fill="#344054">  ④合伙人义务：①出资义务②分担亏损义务（合伙人对合伙债务承担无限连带责任，但是法律另有规定的除外【民法典第973条】）</text>
<text x="844" y="3429" font-size="12" fill="#344054">  ⑤入伙退伙：①入伙=经全体合伙人一致同意（另有约定除外），新合伙人对入伙前债务承担连带责任</text>
<text x="844" y="3446" font-size="12" fill="#344054">    ②退伙=约定退伙/随时退伙/法定退伙，退伙人对退伙前债务承担连带责任</text>
<text x="844" y="3463" font-size="12" fill="#344054">2.旅游合同：①含义=旅游经营者与旅游者之间订立的，由旅游经营者提供旅游服务、旅游者支付旅游费用的合同</text>
<text x="844" y="3480" font-size="12" fill="#344054">  ②双方权利：①旅游者享有自主选择权、知情权、安全保障权</text>
<text x="844" y="3497" font-size="12" fill="#344054">    ②旅游经营者负有安全保障义务、如实告知义务</text>
<text x="844" y="3514" font-size="12" fill="#344054">  ③组团社与地接社：①组团社委托地接社接待的，组团社对旅游者承担全部责任，地接社承担相应责任</text>
<text x="844" y="3531" font-size="12" fill="#344054">    ②旅游者直接与地接社订立合同的，地接社承担责任</text>
<text x="844" y="3548" font-size="12" fill="#344054">  ④责任承担：①旅游经营者擅自转团的，旅游者可以解除合同；②旅游经营者未尽安全保障义务造成损害，承担赔偿责任；③旅行社提供旅游服务违反旅游合同约定的，承担违约责任</text>
